function hbTutoPaint1(){
  const d=HBT.dirs, n=['z','q','s','d'].filter(k=>d[k]).length;
  hbmHint('🕹️ Déplace-toi avec <b>Z</b> (haut), <b>Q</b> (gauche), <b>S</b> (bas) et <b>D</b> (droite). Essaie les quatre&nbsp;! <b>'+n+' / 4</b>');
}
function hbTutoDir(pad){
  if(HBT.step!==1 || HBT.dirs[pad]) return;
  HBT.dirs[pad]=true; hbmPadMark(pad,'done'); beep('key');
  hbTutoPaint1();
  if(['z','q','s','d'].every(k=>HBT.dirs[k])){
    HBT.step=2; beep('good');
    hbmAddKeys([[8,1],[11,3],[4,5]]); hbmCounter();
    hbmHint('🔑 Parfait&nbsp;! Maintenant récupère les <b>3 clés</b> qui clignotent : passe simplement dessus.');
  }
}
function hbTutoKey(got,total){
  if(HBT.step===2){ hbmCounter(); hbmHint('🔑 Bien joué&nbsp;! Clés récupérées : <b>'+got+' / '+total+'</b>'); return; }
  if(HBT.step===3 && !HBT.blueGot){
    HBT.blueGot=true;
    HBT.until=HBM.time+4;   // on prolonge la démo : le temps de bien voir/sentir le ralentissement
  }
}
/* étape 3 : K0RT3X entre en scène — il poursuit, mais ici rien n'est perdu.
   Une clé BLEUE y apparaît aussi : c'est la seule à ralentir ses copies quelques
   secondes à la récupération (cf. hbmCollect) — les clés normales n'en sont plus
   capables. On force le joueur à passer dessus pour qu'il VOIE l'effet, comme pour
   chaque autre geste de ce tuto. */
function hbTutoStep3(){
  HBT.step=3; HBT.blueGot=false; HBT.until=HBM.time+9;
  HBM.keys.length=0; HBM.total=0; HBM.got=0; hbmCounter();
  hbmAddFoe(11,5, 3.0, 0.30);
  // total volontairement énorme : le compteur générique de fin de plongée ne doit
  // jamais se déclencher ici, on gère la fin de cette démo nous-mêmes (hbTutoTick)
  HBM.keys.push({c:8, r:1, got:false, blue:true}); HBM.total=999;
  HBM.freeze=0.6; HBM.onDone=null;
  playHackWarning();
  hbmNote('K0RT3X entre dans la simulation !','warn');
  hbmResumeLoop();
}
function hbTutoTick(){
  if(HBT.step!==3) return;
  const left=Math.max(0, HBT.until-HBM.time);
  hbmHint(HBT.blueGot
    ? '🔵 Vu&nbsp;? Il ralentit et vire au bleu quelques secondes ! Profites-en pour <b>t\'échapper</b> avec Z Q S D. <b>'+Math.ceil(left)+' s</b>'
    : '🧠 Le voilà&nbsp;! Fonce sur la <b>clé bleue</b> 🔵 : elle ralentit ses copies quelques secondes. <b>'+Math.ceil(left)+' s</b>');
  if(left<=0){ hbmStopLoop(); hbMazeTutoDone(); }
}
function hbTutoCaught(){
  if(HBT.step!==3) return;
  beep('bad');
  hbmNote('Rattrapé ! En vrai, ça coûte une connexion 📡','warn');
}
function hbMazeTutoDone(){
  beep('win');
  const card=hbTutoCard(
    '<div class="tc-emoji">🔑</div>'
    + '<div class="tc-title">Prêt pour sa mémoire&nbsp;!</div>'
    + '<div class="tc-text">Tu sais te déplacer avec <b>Z Q S D</b> et récupérer les clés. Les clés <b>bleues</b> 🔵 ralentissent ses copies quelques secondes : garde ça en tête si tu es coincé ! Cette fois, c\'est pour de vrai : s\'il te <b>rattrape</b>, tu perds une <b>connexion</b> 📡 et tu réapparais à l\'autre bout du labyrinthe. Prends <b>toutes</b> ses clés&nbsp;! 🔑</div>'
    + '<div class="tc-actions"><button class="tc-btn" id="hbMazeGo">Entrer dans sa mémoire 🧠</button></div>');
  card.querySelector('#hbMazeGo').onclick=()=>{ audioCtx(); beep('key'); hbStartMaze(); };
}

/* ---------- 3. la vraie phase ---------- */
/* Sous-ensemble régulier des clés de la carte (les clés y sont énumérées ligne par ligne,
   donc un pas régulier les répartit sur les 4 rangées). null = toutes. */
function hbMazeKeysFor(n){
  const all=hbmParse(HB_MAZE_MAP).keys;
  if(!n || n>=all.length) return null;
  const step=all.length/n, out=[];
  for(let i=0;i<n;i++){ const k=all[Math.floor(i*step)]; out.push([k.c, k.r]); }
  return out;
}
function hbStartMaze(){
  const wave=HB.mazeIdx, copies=Math.min(wave+1, HB_MAZE_HOMES.length);
  HB.state='maze'; HB.ready=false; hbStopBar();
  const row=hbEl('hbTraceRow'); if(row) row.style.visibility='hidden';
  const al=hbEl('hbAlert');
  if(al){ al.className='hb-alert';
    al.innerHTML='<span class="hba-ic">🧠</span><span class="hba-txt">TU ES DANS SA MÉMOIRE !</span>'; }
  hbEl('hbCmdLab').innerHTML='Récupère toutes ses <b>clés de chiffrement</b> 🔑';
  hbEl('hbRows').innerHTML='';
  hbSetPhase(copies>1 ? '🔑 Vole ses clés ! (×'+copies+')' : '🔑 Vole ses clés !');
  hbMazeShell({title:'🧠 MÉMOIRE DE K0RT3X — '+(copies>1?copies+' COPIES ACTIVES':'SECTEUR VERROUILLÉ'),
               hint:false, pad:false});
  // les copies accélèrent d'une plongée à l'autre, mais jamais au point de rattraper le
  // joueur en ligne droite (plafond à 80 % de sa vitesse) ; chaque copie suivante est
  // nettement plus lente que la précédente, sinon la meute devient inévitable — le budget
  // de connexions doit rester tenable puisque les fautes de frappe en coûtent aussi
  const base=Math.min(HBM_HERO_SPEED*0.80, HB.tune.foeSpeed + 0.10*wave);
  const foes=HB_MAZE_HOMES.slice(0, copies).map((at,i)=>({
    at:at, brain:i, corner:i, speed:base*(1-0.12*i)
  }));
  hbmStart({
    map:HB_MAZE_MAP, board:document.getElementById('hbmBoard'),
    heroAt:[1,7], foes:foes, spawns:HB_MAZE_SPAWNS,
    keys:hbMazeKeysFor(HB_MAZE_KEYCOUNT[Math.min(wave, HB_MAZE_KEYCOUNT.length-1)]),
    heroSpeed:HBM_HERO_SPEED,
    wander:Math.max(0.04, HB.tune.foeWander - 0.04*wave),
    freeze:1.2+0.3*wave,                       // plus de copies = plus de temps pour souffler
    onKey:()=>{ hbmCounter(); updateHbHud(); },
    onCatch:hbMazeCaught, onDone:hbMazeCleared,
    onBlueKey:()=>hbmNote('🔵 Clé bleue ! Ses copies ralentissent…','ok')
  });
  hbmAddBlueKeys(HB_MAZE_BLUEKEYS, HB_MAZE_BLUEKEYS_MINDIST);
  hbmCounter(); updateHbHud();
  hbmNote('Z Q S D pour te déplacer');
  hbFlash('🧠 SA MÉMOIRE ! 🧠', copies>1
    ? copies+' K0RT3X te traquent — vole ses clés 🔑 !'
    : 'Vole ses clés 🔑 — et ne te fais pas rattraper !');
}
function hbMazeCaught(){
  hbSay(hbPick(HB_TAUNTS.maze));
  if(hbLoseLink()){
    hbmStopLoop(); hbmNote('✖ Plus aucune connexion…','warn');
    hbWait(900, hbFail); return;
  }
  hbmNote('✖ Rattrapé ! Connexion perdue — tu réapparais ailleurs.','warn');
}
function hbMazeCleared(){
  playHackBeep();
  hbmNote('✔ Toutes les clés sont à toi — chiffrement brisé !','ok');
  hbmDraw(performance.now());
  hbWait(1300, hbMazeWon);
}
function hbMazeWon(){
  hbMazeClose();
  HB.state='between';   // on rend la main au terminal (débloque hbNextAlert)
  HB.mazeIdx++;
  HB.hp=Math.max(1, HB.hp-1); updateHbHud();
  const boss=hbEl('hbBoss'); if(boss) boss.className='hb-boss';
  const al=hbEl('hbAlert');
  if(al){ al.className='hb-alert ok';
    al.innerHTML='<span class="hba-ic">🔓</span><span class="hba-txt">CHIFFREMENT BRISÉ !</span>'; }
  hbEl('hbCmdLab').textContent='';
  const c=hbEyeCenter();
  if(c){ blueBurstAt(c.x,c.y,HB.field); hbFloat(c.x,c.y,'-1'); }
  hbEyeFlash('hurt'); beep('win');
  hbSay('MES CLÉS ! Rends-moi mes clés !!');
  hbStatus('✔ Verrou cassé ! K0RT3X : '+HB.hp+' PV','ok');
  hbFlash('🔓 CHIFFREMENT BRISÉ ! 🔓','Retour au terminal — finis-le !');
  hbSetPhase('🧠 Il repasse à l\'attaque…');
  hbWait(2000, hbNextAlert);
}

/* =========================================================
   6. DÉROULÉ (flow)
   ========================================================= */
function reviewing(){ return playIdx<progressIdx; }
function startStep(idx){
  playIdx=idx; currentStep=STEPS[idx];
  kbFailStreak=0;   // les 2 échecs qui déclenchent l'aide doivent être D'AFFILÉE sur la MÊME mission
  stopGame(); renderIdle();
  updateProgress(); updateBanner();
  openRoundPopup();
}
function renderIdle(){
  stage.innerHTML='<div class="type-area" style="text-align:center;color:var(--muted);font-weight:800;padding:48px 20px;">'
    + '<div style="font-size:2.4rem;margin-bottom:8px;">'+currentStep.emoji+'</div>'
    + 'Prépare tes doigts… puis clique sur <b>C\'est parti&nbsp;!</b>'
    + '</div>';
}
function updateProgress(){
  const track=document.getElementById('track'); track.innerHTML='';
  STEPS.forEach((st,i)=>{
    const d=document.createElement('div');
    const mile=st.kind==='jalon';
    d.className='seg'+(mile?' milestone':'');
    if(i<progressIdx) d.classList.add('done');
    if(i===playIdx) d.classList.add('current');
    if(mile) d.textContent = '🏆';
    if(i<=progressIdx){
      d.classList.add('clickable');
      d.title = (i===playIdx?'Mission en cours : ':'Revenir à ')+st.label+' · '+st.title;
      d.onclick=()=>{ if(i<=progressIdx) startStep(i); };
    }
    track.appendChild(d);
  });
  const shown=Math.min(playIdx+1, STEPS.length);
  document.getElementById('stepCount').textContent='🗺️ Niveau '+currentLevel+' · '+STEPS[playIdx].label+' ('+shown+'/'+STEPS.length+')';
}
function updateBanner(){
  const b=document.getElementById('banner');
  b.className='banner'+(currentStep.kind==='jalon'?' test':'')+(reviewing()?' review':'');
  document.getElementById('bEmoji').textContent=currentStep.emoji;
  document.getElementById('bTitle').textContent=(reviewing()?'Révision · ':'')+currentStep.label+' : '+currentStep.title;
  document.getElementById('bSub').innerHTML='<span class="b-goal-label">Objectif :</span> '+stripTags(currentStep.bannerGoal||currentStep.desc);
  // le bouton « Difficulté » n'a de sens que pour un boss à modes
  const db=document.getElementById('diffBtn'); if(db) db.style.display=(currentStep.mode==='boss'&&currentStep.diff)?'':'none';
}
function stripTags(s){ return s.replace(/<[^>]+>/g,''); }

function openBossBriefing(s){
  // Combat déjà en cours : « Revoir la consigne » ne fait que mettre en pause (pas de redémarrage)
  const resuming = !!activeGame;
  const th=s.theme||{}, emoji=th.emoji||'🐉', enh=s.enh||{};
  const goalTxt=s.hackBoss
    ? (hbTotalHp('easy')+' à '+hbTotalHp('extreme')+' dégâts pour l\'éteindre, selon la difficulté')
    : s.diff
    ? (KB_BOSS_MODES.easy.hits+' à '+KB_BOSS_MODES.extreme.hits+' coups pour gagner, selon la difficulté')
    : ((s.bossHits||15)+' coups pour gagner');
  const bullets = s.hackBoss
    ? '<li><span class="ni-glyph">🚨</span> Lis l\'alerte : K0RT3X attaque !</li>'
      + '<li><span class="ni-glyph">⌨️</span> Tape la contre-commande avant la fin du traçage</li>'
      + '<li><span class="ni-glyph">💥</span> K0RT3X ouvert ? Tape la commande de purge</li>'
      + '<li><span class="ni-glyph">⚠️</span> Deux commandes ? L\'une est un piège !</li>'
      + '<li class="wide"><span class="ni-glyph">🔑</span> Dans sa mémoire (<b>Z Q S D</b>) : vole ses clés — il s\'y dédouble !</li>'
    : s.swarm
    ? '<li><span class="ni-glyph">🕹️</span> '+kbd('F')+' / '+kbd('J')+' : déplace ton vaisseau</li>'
      + '<li><span class="ni-glyph">🎯</span> Aligne-toi sous un alien, tape sa lettre</li>'
      + '<li><span class="ni-glyph">💥</span> Vulnérable : tape symboles et chiffres</li>'
      + (enh.shield?'<li><span class="ni-glyph">🛡️</span> Son bouclier se recharge à chaque essaim</li>':'')
    : '<li><span class="ni-glyph">🛡️</span> Défense : tape la touche affichée</li>'
      + '<li><span class="ni-glyph">💥</span> Attaque : frappe les symboles</li>'
      + (enh.shield?'<li><span class="ni-glyph">🛡️</span> Brise son bouclier avant de le pirater</li>':'');
  modal.className='modal test-modal';
  modal.innerHTML=
    '<span class="m-emoji">'+emoji+'</span>'
    + '<div class="kicker" style="color:var(--red-d)">'+(reviewing()?'Entraînement':'Combat de Boss')+'</div>'
    + '<h2>'+s.title+'</h2>'
    + '<div class="howto test"><p class="h-head">⚔️ Le combat :</p><p>'+s.desc+'</p></div>'
    + '<ul class="newtools">'
    +   bullets
    +   (s.hackBoss?'<li><span class="ni-glyph">📡</span> Des connexions à protéger</li>':'<li><span class="ni-glyph">❤️</span> Des vies à protéger</li>')
    +   (s.penalizeWrong?'<li><span class="ni-glyph">⚠️</span> Une mauvaise touche te coûte une vie !</li>':'')
    +   '<li><span class="ni-glyph">'+emoji+'</span> '+goalTxt+'</li>'
    + '</ul>'
    + ((s.diff && !resuming)?('<p style="font-weight:800;color:var(--red-d);margin:6px 0 0">Choisis ta difficulté :</p>'+bossModeChooserHTML()):'')
    + ((s.diff && !resuming)?'':'<div class="m-actions"><button class="m-btn primary test" id="goBtn">'+(resuming?'⚔️ Reprendre le combat ▶':'⚔️ Au combat ! 🚀')+'</button></div>');
  modal.dataset.ttsText = s.title + '. ' + s.desc;   // 🔊 lit la consigne du boss
  openOverlay(); fitModalWidth();
  if(s.diff && !resuming){ bindBossModeChoice(); return; }
  document.getElementById('goBtn').onclick=resuming
    ? (()=>{ closeOverlay(); resumeActive(); })
    : (()=>{ closeOverlay(); audioCtx(); launchGame(); });
}
// Boutons de choix de la difficulté du boss (partagés briefing / bouton ⚙️ Difficulté)
function bossModeChooserHTML(){
  return '<div class="boss-modes">'
    + ['easy','medium','hard','extreme'].map(k=>{ const m=KB_BOSS_MODES[k];
        return '<button class="boss-mode-btn is-'+k+(k===kbBossMode?' sel':'')+'" data-mode="'+k+'">'
          + '<span class="bm-ic">'+m.emoji+'</span>'
          + '<span class="bm-txt"><span class="bm-name">'+m.label+'</span><span class="bm-sub">'+m.sub+'</span></span>'
          + '<span class="bm-tag">'+m.tag+'</span></button>'; }).join('')
    + '</div>';
}
function bindBossModeChoice(){
  modal.querySelectorAll('.boss-mode-btn').forEach(b=>{
    b.onclick=()=>{ kbBossMode=b.getAttribute('data-mode'); store.set('kb_bossmode',kbBossMode);
      closeOverlay(); audioCtx(); launchGame(); };
  });
}
// Relance le boss en re-choisissant la difficulté (bouton « ⚙️ Difficulté »)
function openBossDifficulty(){
  const s=currentStep, th=(s&&s.theme)||{};
  modal.className='modal test-modal';
  modal.innerHTML=
    '<span class="m-emoji">'+(th.emoji||'🐉')+'</span>'
    + '<div class="kicker" style="color:var(--red-d)">Combat de Boss</div>'
    + '<h2>Choisis ta difficulté</h2>'
    + '<p>Relance le combat contre <b>'+(th.name||'le boss')+'</b> en choisissant un nouveau mode :</p>'
    + bossModeChooserHTML();
  openOverlay(); fitModalWidth();
  bindBossModeChoice();
}
function openRoundPopup(){
  const s=currentStep, jalon=s.kind==='jalon';
  if(s.mode==='boss') return openBossBriefing(s);
  const lvl=LEVELS[currentLevel-1];
  // Briefing image-first : pour les missions à astuces, on montre les touches sur le clavier
  let kbimg='';
  if((lvl.game==='parachute' || lvl.game==='invaders' || lvl.game==='hackterm') && (s.showTips || lvl.n<=4) && s.pool){
    const c=comboHint(s.pool);
    kbimg=buildKeyboard({keys:c.keys, maj:c.maj, altgr:c.altgr});
  }
  // Niveaux 1 à 4 : on martèle le repère F/J à chaque début de mission
  const fjBox=(lvl.n<=4)?('<div class="howto" style="margin-top:10px"><p class="h-head">✋ Position des mains</p><p>'+fjReminderHTML()+'</p></div>'):'';
  modal.className='modal'+(jalon?' test-modal':'');
  modal.innerHTML=
    '<span class="m-emoji">'+s.emoji+'</span>'
    + '<div class="kicker">'+(reviewing()?'Entraînement':s.label)+'</div>'
    + '<h2>'+s.title+'</h2>'
    + '<div class="howto'+(jalon?' test':'')+'"><p class="h-head">'+(jalon?'🏆 Le défi :':'👉 Ta mission :')+'</p><p>'+s.desc+'</p></div>'
    + kbimg
    + fjBox
    + '<div class="m-actions"><button class="m-btn primary'+(jalon?' test':'')+'" id="goBtn">C\'est parti ! 🚀</button></div>';
  modal.dataset.ttsText = s.title + '. ' + s.desc;   // 🔊 lit le titre + la consigne de la mission
  openOverlay(); fitModalWidth();
  document.getElementById('goBtn').onclick=()=>{ closeOverlay(); audioCtx(); launchGame(); };
}
function launchGame(){
  if(currentStep.mode==='boss') return currentStep.hackBoss ? startHackBoss(currentStep) : startBoss(currentStep);
  if(LEVELS[currentLevel-1].game==='hackterm') return startHackterm(currentStep);
  if(LEVELS[currentLevel-1].game==='invaders') return startInvaders(currentStep);
  if(LEVELS[currentLevel-1].game==='parachute') startParachute(currentStep);
  else startDactylo(currentStep);
}
/* sc (optionnel) : carte de score renvoyée par buildScore(), affichée à la place du texte de félicitation. */
function onWin(sc){
  const head=(emoji,title,text)=>
    sc ? '<span class="m-emoji">'+sc.emoji+'</span><h2>'+sc.msg+'</h2>'+scoreCardHTML(sc)
       : '<span class="m-emoji">'+emoji+'</span><h2>'+title+'</h2><p>'+text+'</p>';
  const reveal=()=>{ if(sc) animateScore(sc); };

  if(reviewing()){
    modal.className='modal good';
    modal.innerHTML=head('💪','Bien joué !','Tu as refait cette mission. On revient à <b>ta mission en cours</b>, ta progression est gardée.')
      +'<div class="m-actions"><button class="m-btn primary green" id="bk">Revenir à ma mission</button></div>';
    modal.dataset.ttsText = (window.TTS_STATIC||{}).win_review || '';
    openOverlay(); reveal();
    document.getElementById('bk').onclick=()=>{ closeOverlay(); startStep(progressIdx); };
    return;
  }
  const last = playIdx===STEPS.length-1;
  if(last){
    progressIdx=STEPS.length; saveProgress();
    if(!sc) return levelComplete();
    // Dernière mission avec score : on montre les étoiles avant l'écran de déblocage du niveau.
    modal.className='modal good';
    modal.innerHTML=head('','','')
      +'<div class="m-actions"><button class="m-btn primary green" id="next">Continuer →</button></div>';
    openOverlay(); reveal();
    document.getElementById('next').onclick=()=>{ closeOverlay(); levelComplete(); };
    return;
  }
  progressIdx=Math.max(progressIdx, playIdx+1); saveProgress();
  const jalon=currentStep.kind==='jalon';
  modal.className='modal good';
  modal.innerHTML=head(jalon?'🏆':'✅',
      jalon?'Défi réussi !':'Mission réussie !',
      jalon?'Bravo, tu maîtrises ! Passe à la suite.':'Super, tu progresses bien. En route pour la mission suivante !')
    +'<div class="m-actions"><button class="m-btn primary green" id="next">Continuer →</button></div>';
  modal.dataset.ttsText = (window.TTS_STATIC||{})[jalon?'win_jalon':'win_mission'] || '';
  openOverlay(); if(jalon && !sc) confetti();
  reveal();
  document.getElementById('next').onclick=()=>{ closeOverlay(); startStep(playIdx+1); };
}
function onFail(reason, tip){
  kbFailStreak++;
  // 2 échecs d'affilée : on propose de ralentir la menace pour la suite du niveau
  // L'offre ne s'épuise jamais : un élève qui bloque doit toujours pouvoir demander plus facile.
  const offerEase = kbFailStreak>=2 && kbCanEase() && kbEaseSteps<KB_EASE_MAX;
  modal.className='modal bad';
  modal.innerHTML='<span class="m-emoji">🙈</span><h2>'+reason+'</h2>'
    +'<div class="howto test" style="margin-top:4px"><p class="h-head">💡 Astuce</p><p>'+tip+'</p></div>'
    +'<div class="m-actions"><button class="m-btn primary" id="retry">↺ Je réessaie</button>'
    +(offerEase?'<button class="m-btn ghost" id="easeBtn">🐢 Plus facile</button>':'')
    +'</div>';
  openOverlay();
  document.getElementById('retry').onclick=()=>{ closeOverlay(); audioCtx(); launchGame(); };
  if(offerEase) document.getElementById('easeBtn').onclick=()=>{ audioCtx(); beep('good'); applyEase(); };
}
/* Applique un cran d'aide et confirme à l'élève, en nommant la menace du niveau. */
function applyEase(){
  kbEaseSteps=Math.min(KB_EASE_MAX, kbEaseSteps+1); kbFailStreak=0; saveEase();
  // Quatre menaces possibles, on nomme celle que l'élève a sous les yeux : la vague du N7,
  // la barre de traçage du N5, les lettres du parachute (N1-N2) ou les aliens (N3-N4).
  const st=currentStep||{}, lvl=LEVELS[currentLevel-1]||{};
  const kind = st.pursuit    ? 'pursuit'
             : st.energies   ? 'trace'
             : lvl.game==='invaders' ? 'invaders' : 'fall';
  const what = kind==='pursuit'  ? 'La <b>vague violette</b> avancera <b>moins vite</b>, et elle te laissera <b>plus d\'avance</b> au départ'
             : kind==='trace'    ? 'La <b>barre de traçage</b> se remplira <b>moins vite</b>, et tu auras une <b>connexion de plus</b>'
             : kind==='invaders' ? 'Les <b>aliens</b> avanceront <b>moins vite</b>, ils arriveront <b>moins souvent</b>, et tu auras un <b>cœur de plus</b>'
                                 : 'Les <b>lettres</b> tomberont <b>moins vite</b>, elles arriveront <b>moins souvent</b>, et tu auras un <b>cœur de plus</b>';
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">🐢</span>'

function loadLevel(n, stepIdx, showIntro){
  n=Math.max(1,Math.min(LEVELS.length,n));
  currentLevel=n; const lvl=LEVELS[n-1];
  STEPS=lvl.rounds;
  kbEaseSteps=loadEase(n); kbFailStreak=0;   // l'aide « Plus facile » est propre à chaque niveau
  progressIdx = (typeof stepIdx==='number') ? stepIdx : getSavedStep(n);
  if(isNaN(progressIdx)||progressIdx<0) progressIdx=0;
  if(progressIdx>STEPS.length) progressIdx=STEPS.length;
  document.getElementById('lvlTitle').innerHTML='Le clavier <span class="dot">·</span> '+lvl.subtitle;
  store.set('kb_curlevel', String(n));
  refreshLevelBtn();
  const startIdx=Math.min(progressIdx, STEPS.length-1);
  if(showIntro) openLevelIntro(n, ()=>startStep(startIdx));
  else startStep(startIdx);
}
function openLevelIntro(n, cont){
  const lvl=LEVELS[n-1], it=lvl.intro;
  let extra='';
  if(it.kb) extra+=buildKeyboard(it.kb);

    extra+='<ul class="legend">'+it.legend.map(c=>'<li><span class="lg-ch">'+c+'</span><span>'+tipFor(c)+'</span></li>').join('')+'</ul>';
  }
  const tools=(it.tools||[]).map(t=>'<li><span class="ni-glyph">'+t.g+'</span> '+t.n+'</li>').join('');
  modal.className='modal';
  modal.innerHTML=
    '<span class="m-emoji">'+it.emoji+'</span>'
    + '<div class="kicker">Niveau '+n+'</div>'
    + '<h2>'+lvl.title+'</h2>'
    + '<p>'+it.lead+'</p>'
    + (it.teach?('<div class="howto"><p class="h-head">👉 Comment faire :</p><p>'+it.teach+'</p>'+extra+'</div>'):'')
    + (tools?'<ul class="newtools">'+tools+'</ul>':'')
    + '<div class="m-actions"><button class="m-btn primary green" id="lvlGo">C\'est parti ! 🚀</button></div>';
  modal.dataset.ttsText = lvl.title + '. ' + (it.lead||'') + (it.teach ? ' ' + it.teach : '');   // 🔊 lit l'intro du niveau
  openOverlay(); fitModalWidth();

}

function levelComplete(){
  stopGame();
  const nextN=currentLevel+1, last=currentLevel>=LEVELS.length;
  // Premier trophée de toute la partie ? Sa grande popup va s'ouvrir : on lui confie
  // notre bouton « suite » plutôt que d'empiler « Niveau débloqué » par-dessus.
  const handover = (!last && window.Badges && Badges.isFirstEver())
    ? {label:'Aller au Niveau '+nextN+' →', run:()=>loadLevel(nextN,0,true)} : null;
  bdg('meta.first', handover?{then:handover}:null);
  if(KB_LEVEL_BADGES[currentLevel]) bdg(KB_LEVEL_BADGES[currentLevel]);
  // N5 et N7 se terminent par un boss, mais leurs missions précédentes, elles,
  // peuvent demander de l'aide : le niveau reste donc jugeable comme les autres.
  if(kbLevelClean(currentLevel)) bdg('kb.perf1');
  if(last) return courseFinish();
  store.set('kb_unlocked', String(Math.max(getUnlocked(), nextN)));
  store.set('kb_step_l'+nextN, '0');
  if(handover) store.set('kb_curlevel', String(nextN));
  refreshLevelBtn();
  playUnlock(nextN, handover?null:()=>openLevelUnlockedModal(nextN));
}

/* ---- animation cadenas (Web Animations API : déterministe, sans conflit CSS) ---- */
function playUnlock(nextN, done){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const st=document.createElement('div'); st.className='lock-stage';
  st.innerHTML='<div class="lock-box">'
    +'<div class="lock-glow"></div><div class="lock-burst"></div><div class="lock-burst lb2"></div>'
    +'<div class="lock-emoji">🔒</div><div class="lock-cap">Niveau '+nextN+' débloqué !</div></div>';
  document.body.appendChild(st);
  const box=st.querySelector('.lock-box'), emoji=st.querySelector('.lock-emoji');
  const bursts=st.querySelectorAll('.lock-burst'), glow=st.querySelector('.lock-glow');
  const cols=['#ffd76a','#ff9a30','#ff6b6b','#a78bfa','#34d399','#60a5fa','#f472b6','#fff'];

  function explode(){
    emoji.textContent='🔓';
    bursts.forEach((b,i)=>setTimeout(()=>b.classList.add('go'),i*150));
    glow.classList.add('go');
    for(let i=0;i<18;i++){
      const s=document.createElement('div'); s.className='lock-star';
      s.style.setProperty('--angle',(i/18*360)+'deg');
      s.style.setProperty('--delay',(i*18)+'ms');
      s.style.setProperty('--dur',(.5+Math.random()*.5)+'s');
      s.style.background=cols[i%cols.length];
      s.style.borderRadius=(i%3===0?'2px':'50%');
      const sz=(7+Math.random()*6)+'px'; s.style.width=sz; s.style.height=sz;
      box.appendChild(s);
    }
    confetti(); beep('win');
  }
  function finish(){ setTimeout(()=>st.classList.add('fade'),900); setTimeout(()=>{ st.remove(); done&&done(); },1300); }

  // Repli si la Web Animations API n'est pas disponible (ou mouvement réduit)
  if(reduce || typeof box.animate!=='function'){
    setTimeout(()=>{ explode(); }, 450);
    finish();
    return;
  }

  const back='cubic-bezier(.18,.9,.32,1.3)';
  // Phase 1 : le cadenas FERMÉ apparaît
  box.animate(
    [{transform:'scale(.3)',opacity:0},{transform:'scale(1)',opacity:1}],
    {duration:380,easing:back,fill:'both'}
  ).finished.then(()=>
    // Phase 2 : il tremble (3 secousses)
    box.animate([
      {transform:'rotate(0deg) translateX(0)'},
      {transform:'rotate(-12deg) translateX(-8px)'},
      {transform:'rotate(10deg) translateX(8px)'},
      {transform:'rotate(-8deg) translateX(-5px)'},
      {transform:'rotate(7deg) translateX(5px)'},
      {transform:'rotate(0deg) translateX(0)'}
    ],{duration:1100,easing:'ease-in-out'}).finished
  ).then(()=>{
    // Phase 3 : il s'OUVRE avec l'explosion
    explode();
    return box.animate([
      {transform:'scale(1)'},
      {transform:'scale(1.45) rotate(-8deg)',offset:.4},
      {transform:'scale(1.12) rotate(0deg)'}
    ],{duration:700,easing:back,fill:'forwards'}).finished;
  }).then(finish).catch(finish);
}

function openOverlay(){ modal.style.maxWidth=''; pauseActive(); overlay.classList.add('open'); if(window.ttsDecorateModal) ttsDecorateModal(modal); }   // tout panneau gèle l'exercice + 🔊 lecture
/* Popups longues : élargir plutôt que faire scroller.
   Sur un écran court, une popup de niveau, de mission ou de briefing de boss peut déborder
   et obliger l'élève à scroller pour trouver le bouton « C'est parti » (ou le choix de
   difficulté). Plutôt que ça, on l'élargit par paliers (jusqu'à 1,6× sa largeur normale,
   sans dépasser l'écran) : le texte tient sur moins de lignes et la popup rentre en hauteur.
   On n'y touche que si elle déborde vraiment, et on annule si l'élargissement n'a rien
   arrangé — c'est ce qui protège les briefings qui contiennent un clavier illustré, dont
   l'élargissement augmenterait la hauteur. À n'appeler que juste après openOverlay(). Les
   mini-tutos joués DANS le terrain (tuto-card…) ne sont pas concernés : ce sont des overlays
   séparés, pas #modal. */
function fitModalWidth(){
  modal.style.maxWidth='';
  const ov=modal.parentElement; if(!ov) return;
  const base=modal.offsetWidth;                        // offsetWidth : insensible à l'animation (scale)
  if(!base || modal.scrollHeight<=modal.clientHeight+1) return;   // ça tient déjà : rien à faire
  const cs=getComputedStyle(ov);
  const avail=ov.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0);
  const cap=Math.min(base*1.6, avail);
  if(cap<base+40) return;                              // écran trop étroit : on garde le scroll
  const h0=modal.scrollHeight;
  let w=base;
  while(w<cap-1 && modal.scrollHeight>modal.clientHeight+1){
    w=Math.min(w+60,cap); modal.style.maxWidth=w+'px';
  }
  if(modal.scrollHeight>=h0) modal.style.maxWidth='';  // élargir n'a pas aidé : on revient à la normale
}
function closeOverlay(){ overlay.classList.remove('open'); if(window.ttsStopCurrent) ttsStopCurrent(); }   // coupe l'audio en cours si la popup se ferme
let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),8000); }
function confetti(){
  const wrap=document.createElement('div'); wrap.className='confetti';
  const cols=['#2563eb','#f59e0b','#16a34a','#e11d48','#7c3aed'];
  for(let i=0;i<70;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%'; p.style.background=cols[i%cols.length];
    p.style.animationDuration=(2.4+Math.random()*1.6)+'s';
    p.style.animationDelay=(Math.random()*.5)+'s';
    p.style.transform='rotate('+Math.random()*360+'deg)';
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap); setTimeout(()=>wrap.remove(),4200);
}

  document.body.appendChild(root);

  function devJump(L,S){
    L=Math.max(1,Math.min(LEVELS.length,L));
    const maxS=steps(LEVELS[L-1]).length-1; S=Math.max(0,Math.min(maxS, S||0));
    store.set(UNLOCK, String(Math.max(getUnlocked(), L)));
    store.set(CUR, String(L));
    store.set(STEP+L, String(S));
    if(typeof closeOverlay==='function') closeOverlay();
    loadLevel(L, S, false);
  }

  // Petit verrou enseignant : rien de sensible, juste éviter qu'un élève ouvre le
  // panneau par curiosité. Le mot de passe est retenu pour la session de l'onglet.
  function dkAuth(){
    try{ if(sessionStorage.getItem('dk_auth')==='1') return true; }catch(e){}
    const a=prompt('Espace enseignant — mot de passe :');
    if(a==='dev35'){ try{ sessionStorage.setItem('dk_auth','1'); }catch(e){} return true; }
    if(a!==null) alert('Mot de passe incorrect.');
    return false;
  }
  document.getElementById('dkToggle').onclick=()=>{
    if(!root.classList.contains('open') && !dkAuth()) return;
    root.classList.toggle('open');
  };
  root.querySelectorAll('.dk-step').forEach(b=>{
    b.onclick=()=>{ root.classList.remove('open'); devJump(+b.getAttribute('data-l'), +b.getAttribute('data-s')); };
  });
  document.getElementById('dkUnlockAll').onclick=()=>{ store.set(UNLOCK, String(LEVELS.length)); refreshLevelBtn(); };
  document.getElementById('dkReset').onclick=()=>{
    // Balayage par PRÉFIXE plutôt qu'une liste de clés : une liste finit toujours par
    // oublier une clé ajoutée plus tard (aide « Plus facile », mode de boss, drapeaux…),
    // et le reset paraît alors « incomplet ». Ici, tout ce qui commence par kb_ disparaît.
    wipe('kb_');
    // « Reset complet » remet aussi les trophées à zéro, pour rejouer la popup du premier
    if(window.Badges) Badges.reset();
    location.href=HOME;
  };
  // (Le saut par URL ?go=L.S est traité dans init, pour éviter un double chargement.)
})();
</script>
<script>
/* Bouton bascule OpenDyslexic — préférence partagée entre toutes les pages */
(function(){
  var KEY='a11y_dys', root=document.documentElement;
  var btn=document.createElement('button');
  btn.type='button'; btn.className='dys-toggle';
  btn.innerHTML='<span class="dys-ic" aria-hidden="true">🔤</span><span class="dys-label">Mode Dys</span><span class="dys-switch"><span class="dys-knob"></span></span>';
  function apply(on){
    root.classList.toggle('dys',on);
    btn.setAttribute('aria-pressed',on?'true':'false');
    btn.title=on?'Mode Dyslexique activé — clique pour revenir à la police normale':'Activer le Mode Dyslexique (police OpenDyslexic)';
  }
  btn.addEventListener('click',function(){
    var want=!root.classList.contains('dys');
    if(typeof window.__dysConfirm==='function'){ window.__dysConfirm(want); return; }
    Store.set(KEY,want?'1':'0');
    apply(want);
  });
  document.body.appendChild(btn);
  var on=Store.get(KEY)==='1';
  apply(on);
})();
</script>
