}

/* ---- Dactylo (avec poursuite optionnelle) ---- */
const D={};
function startDactylo(step){
  stopGame(); gamePaused=false;
  const pursuit=!!step.pursuit;
  stage.innerHTML=
    '<div class="type-area">'
    + '<div class="type-text" id="typeText"></div>'
    + (pursuit? '<div class="lava-row"><div class="fire" id="lavaFire"></div><div class="me" id="lavaMe"></div></div>' : '')
    + '<div class="type-stats"><span id="stProg">0 %</span>'+(pursuit?'<span id="stChase">🟣 reste devant l\'effacement !</span>':'<span id="stErr">0 erreur</span>')+'</div>'
    + '</div>';
  Object.assign(D,{
    step, text:step.text, i:0, errors:0, hits:0, running:true,
    // « Plus facile » : la vague part de plus loin derrière (un caractère d'avance de plus
    // par cran) et attend plus longtemps avant de démarrer. Sa vitesse est ralentie dans loopD.
    pursuit, chaser:-((step.lead||4)+kbEaseBonus()), startTs:0, lastTs:0, started:false,
    grace:kbEaseLonger(step.grace||0), raf:0,
    typeMs:0, typeTs:0   // chrono de frappe : démarre à la 1re lettre, se met en pause si le jeu est mis en pause
  });
  renderType();
  activeGame={ onKey:onKeyD, stop:stopD,
    pause(){ if(D.running){ D.running=false; dClockPause(); cancelAnimationFrame(D.raf); } },
    resume(){ if(!D.running){ D.running=true; D.lastTs=0; if(D.hits>0) dClockStart(); if(D.pursuit) D.raf=requestAnimationFrame(loopD); } } };
  if(pursuit) D.raf=requestAnimationFrame(loopD);
}
/* Chrono de frappe : cumulé, en pause pendant les popups d'astuce. */
function dClockStart(){ if(!D.typeTs) D.typeTs=performance.now(); }
function dClockPause(){ if(D.typeTs){ D.typeMs+=performance.now()-D.typeTs; D.typeTs=0; } }
function dElapsedMs(){ return D.typeMs + (D.typeTs?performance.now()-D.typeTs:0); }
function renderType(){
  const c=document.getElementById('typeText'); let html='';
  const lavaIdx=D.pursuit?Math.max(0,Math.floor(D.chaser)):-1;
  let inWord=false;
  for(let k=0;k<D.text.length;k++){
    const ch=D.text[k]; const sp=ch===' ';
    let cls='tc'+(sp?' sp':'');
    if(k<D.i) cls+=' done';
    else if(k===D.i) cls+=' cur';
    if(D.pursuit && k<lavaIdx && k>=D.i) cls+=' scorch';
    if(D.pursuit && k===lavaIdx && k>=D.i) cls+=' lavahead';
    const span='<span class="'+cls+'" data-k="'+k+'">'+(sp?' ':escapeHtml(ch))+'</span>';
    if(sp){
      if(inWord){ html+='</span>'; inWord=false; }   // ferme le mot courant
      html+=span;                                     // l'espace = point de coupure entre mots
    } else {
      if(!inWord){ html+='<span class="word">'; inWord=true; }
      html+=span;
    }
  }
  if(inWord) html+='</span>';
  c.innerHTML=html;
  const pct=Math.round(D.i/D.text.length*100);
  const pe=document.getElementById('stProg'); if(pe) pe.textContent=pct+' %';
  const ee=document.getElementById('stErr'); if(ee) ee.textContent=D.errors+(D.errors>1?' erreurs':' erreur');
  if(D.pursuit){
    const me=document.getElementById('lavaMe'); if(me) me.style.left=(D.i/D.text.length*100)+'%';
    const fire=document.getElementById('lavaFire'); if(fire) fire.style.width=(Math.max(0,D.chaser)/D.text.length*100)+'%';
  }
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function onKeyD(e){
  const ignore=['Shift','Control','Alt','AltGraph','Meta','CapsLock','Dead','Tab','Escape','Enter','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'];
  if(ignore.includes(e.key)) return;
  if(e.key==='Backspace'){ e.preventDefault(); if(D.i>0){ D.i--; D.hits=Math.max(0,D.hits-1); renderType(); } return; }
  if(e.key.length!==1) return;
  e.preventDefault();
  const expected=D.text[D.i];
  if(e.key===expected){
    if(D.pursuit && !D.started){ D.started=true; D.startTs=performance.now(); }
    dClockStart();
    D.i++; D.hits++; beep('key'); renderType();
    if(D.i>=D.text.length) winD();
  } else {
    D.errors++; beep('bad');
    const cur=document.querySelector('#typeText .tc.cur');
    if(cur){ cur.classList.add('bad'); setTimeout(()=>cur.classList.remove('bad'),300); }
    renderType();
  }
}
function loopD(ts){
  if(!D.running) return;
  if(!D.lastTs) D.lastTs=ts;
  const dt=(ts-D.lastTs)/1000; D.lastTs=ts;
  if(!D.started){ D.raf=requestAnimationFrame(loopD); return; }   // l'effacement attend que tu commences
  if(D.grace>0){ D.grace-=dt*1000; D.raf=requestAnimationFrame(loopD); renderType(); return; }
  D.chaser+=D.step.pursuit*kbEaseFactor()*dt;   // « Plus facile » : la vague avance moins vite
  renderType();
  if(D.chaser>=D.i && D.i<D.text.length){ caughtD(); return; }
  D.raf=requestAnimationFrame(loopD);
}
function stopD(){ D.running=false; dClockPause(); cancelAnimationFrame(D.raf); }
function winD(){
  stopD(); beep('win');
  onWin(buildScore());
}

/* ---- Score de fin de mission (Niveaux 6 & 7, hors boss) ----
   Trois mesures : temps de frappe, précision, mots par minute (norme : 1 mot = 5 caractères).
   Elles se résument en une note sur 5 étoiles : la précision pèse 3 étoiles, la vitesse 2. */
function buildScore(){
  const ms=Math.max(400, dElapsedMs());
  const secs=ms/1000;
  const chars=D.text.length;
  const acc=Math.round(D.hits/Math.max(1,D.hits+D.errors)*100);
  const wpm=Math.round((chars/5)/(secs/60));

  const accPts = acc>=98?3 : acc>=94?2.5 : acc>=88?2 : acc>=80?1.5 : acc>=70?1 : .5;
  const spdPts = wpm>=25?2 : wpm>=20?1.5 : wpm>=15?1 : wpm>=10?.5 : 0;
  const stars=Math.max(1, Math.min(5, Math.round(accPts+spdPts)));

  const PRAISE=[null,
    {emoji:'🙂', msg:'Tu y es arrivé !',        sub:'Bravo, le texte est fini. Vise la précision : chaque lettre bien tapée compte double.'},
    {emoji:'👍', msg:'Bien joué !',             sub:'Tu progresses ! Regarde l\'écran plutôt que tes doigts pour faire moins d\'erreurs.'},
    {emoji:'🌟', msg:'Très bien joué !',        sub:'Belle frappe ! Encore un peu de régularité et tu décroches les 5 étoiles.'},
    {emoji:'🎉', msg:'Excellent !',             sub:'Tes doigts trouvent les touches tout seuls. Tu es presque un pro !'},
    {emoji:'🏆', msg:'Parfait, champion du clavier !', sub:'Rapide ET précis : c\'est la frappe d\'un vrai expert. Chapeau !'}
  ][stars];

  return {stars, acc, wpm, secs, emoji:PRAISE.emoji, msg:PRAISE.msg, sub:PRAISE.sub};
}
function fmtSecs(s){
  const t=Math.round(s);
  return t<60 ? t+' s' : Math.floor(t/60)+' min '+String(t%60).padStart(2,'0')+' s';
}
function scoreCardHTML(sc){
  let stars='';
  for(let i=0;i<5;i++) stars+='<span class="sc-star" data-i="'+i+'"><i class="s-bg">★</i><i class="s-fg">★</i></span>';
  return '<div class="scorecard">'
    + '<div class="sc-stars" id="scStars">'+stars+'</div>'
    + '<p style="margin:0 0 12px">'+sc.sub+'</p>'
    + '<div class="sc-stats">'
    +   '<div class="sc-tile" data-d="0"><div class="sc-ic">⏱️</div><div class="sc-val">'+fmtSecs(sc.secs)+'</div><div class="sc-lab">Temps</div></div>'
    +   '<div class="sc-tile" data-d="1"><div class="sc-ic">🎯</div><div class="sc-val">'+sc.acc+' %</div><div class="sc-lab">Précision</div></div>'
    +   '<div class="sc-tile" data-d="2"><div class="sc-ic">⚡</div><div class="sc-val">'+sc.wpm+'</div><div class="sc-lab">Mots / min</div></div>'
    + '</div></div>';
}
/* Les étoiles montent puis se remplissent une à une, avec un « ding » qui monte dans les aigus. */
function animateScore(sc){
  const wrap=document.getElementById('scStars'); if(!wrap) return;
  const stars=[...wrap.querySelectorAll('.sc-star')];
  stars.forEach((el,i)=>{

}

function startBoss(step){
  stopGame(); gamePaused=false;
  const theme=step.theme||{}, enh=step.enh||{};
  const md=step.diff?kbBd():{speedMul:1,spawnMul:1,waveMul:1,concDelta:0,livesBonus:0,hits:0,shieldHits:0,accel:1};
  const name=theme.name||'le Dragon des Touches', bemoji=theme.emoji||'🐉', hero=theme.hero||'🧙';
  const heroCls=(hero==='🚀')?' rocket':'';
  // vies : base + bonus de difficulté (min 3)
  const baseLives=step.lives||6;
  const lives=Math.max(3, baseLives+(md.livesBonus||0));
  // nb de coups pour gagner : selon la difficulté choisie (boss à modes), sinon bossHits
  const hp=(step.diff ? md.hits : step.bossHits)||15;
  const baseSpeed=(step.speed||74)*(md.speedMul||1);
  stage.innerHTML=
    '<div class="boss-fs-wrap" id="bossFsWrap"><div class="boss-scaler" id="bossScaler">'
    + '<div class="hud">'
    + '<span class="lives" id="bossLives"></span>'
    + '<span class="count" id="bossPhase"></span>'
    + '<div class="meter"><i id="bossMeter"></i></div>'
    + '<button class="boss-fs-btn" id="bossFsBtn" title="Plein écran" aria-label="Plein écran">⛶</button>'
    + '</div>'
    + '<div class="field bossfield'+(theme.cyber?' cyber':'')+'" id="bossField">'
    +   (enh.glitch?'<div class="glitch-layer" id="bossGlitch"></div>':'')
    +   '<div class="boss-top">'
    +     '<div class="boss-name">'+bemoji+' '+name+'</div>'
    +     (enh.shield?'<div class="boss-shield" id="bossShield"></div>':'')
    +     '<div class="boss-hpbar"><i id="bossHp"></i></div>'
    +     '<div style="position:relative"><div class="boss-sprite" id="bossSprite">'+bemoji+'</div></div>'
    +   '</div>'
    +   '<div class="hero'+heroCls+'" id="bossHero">'+hero+'</div>'
    + '</div>'
    + '</div></div>';
  const field=document.getElementById('bossField');
  Object.assign(B,{
    step, field, theme, enh,
    sprite:document.getElementById('bossSprite'),
    hero:document.getElementById('bossHero'),
    spells:[], attackTargets:[],
    swarm:!!step.swarm, lane:Math.floor(SWARM_LANES/2),
    atkPool: step.swarm ? BOSS_COMPLEX.concat(BOSS_COMPLEX).concat('0123456789'.split('')) : BOSS_COMPLEX,
    lives, maxLives:lives, penalizeWrong:!!step.penalizeWrong,
    hp, maxHp:hp,
    shield:enh.shield?(md.shieldHits||0):0, maxShield:enh.shield?(md.shieldHits||0):0,
    accel:enh.accel?(md.accel||1):1, waveCount:0,
    phase:'cast', spawned:0, spellsPerWave:Math.max(3, Math.round((step.spellsPerWave||10)*(md.waveMul||1))),
    speed:baseSpeed, baseSpeed, spawnMs:(step.spawnMs||1100)*(md.spawnMul||1),
    maxConcurrent:Math.max(1,(step.maxConcurrent||4)+(md.concDelta||0)),
    attackMs:step.attackMs||ATTACK_MS,
    running:true, last:0, nextSpawn:0, groundY:0, attackEndTs:0, raf:0, immune:false
  });
  B.groundY=field.clientHeight-64;
  if(B.swarm) B.hero.style.left=laneX(B.lane)+'%';
  // tutoriel du boss essaim : montré une seule fois par session (pas sur les reprises/réessais)
  if(B.swarm && !kbSwarmTutoSeen){ B.phase='tuto'; B.immune=true; }
  updateBossHud();
  startBossMusic();
  setupBossFullscreen();
  activeGame={ onKey:onKeyB, stop:stopB,
    pause(){ if(B.running){ B.running=false; cancelAnimationFrame(B.raf); } pauseBossMusic(); },
    resume(){ if(!B.running){ B.running=true; B.last=0; B.raf=requestAnimationFrame(loopB); } resumeBossMusic(); } };
  if(B.phase==='tuto') startSwarmTutorial();
  B.raf=requestAnimationFrame(loopB);
}
/* ---- Plein écran de l'arène du boss (agrandissement visuel, difficulté inchangée) ---- */
function fsElement(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
function setupBossFullscreen(){
  const btn=document.getElementById('bossFsBtn'); if(!btn) return;
  const wrap=document.getElementById('bossFsWrap'); B.fsWrap=wrap;
  B.fsSync=function(){ const on=fsElement()===wrap; btn.textContent=on?'🗗':'⛶';
    btn.title=on?'Quitter le plein écran':'Plein écran';
    if(on) layoutBossFullscreen(); else clearBossFullscreen(); };
  btn.onclick=function(){
    try{
      if(fsElement()){ const ex=document.exitFullscreen||document.webkitExitFullscreen; if(ex){ const p=ex.call(document); if(p&&p.catch) p.catch(function(){}); } }
      else { const f=B.field; B._fsW=f?f.clientWidth:0; B._fsH=f?f.clientHeight:0;
        const rq=wrap&&(wrap.requestFullscreen||wrap.webkitRequestFullscreen); if(rq){ const p=rq.call(wrap); if(p&&p.catch) p.catch(function(){}); } }
    }catch(e){}
  };
  B.fsResize=function(){ if(fsElement()===wrap) layoutBossFullscreen(); };
  document.addEventListener('fullscreenchange',B.fsSync);
  document.addEventListener('webkitfullscreenchange',B.fsSync);
  window.addEventListener('resize',B.fsResize);
  B.fsSync();
}
function layoutBossFullscreen(){
  const f=B.field, sc=document.getElementById('bossScaler'); if(!f||!sc) return;
  if(!B._fsW){ B._fsW=f.clientWidth; B._fsH=f.clientHeight; }
  f.style.width=B._fsW+'px'; f.style.height=B._fsH+'px';        // verrouille la taille logique
  const W=sc.offsetWidth||B._fsW, H=sc.offsetHeight||B._fsH;     // englobe le HUD au-dessus du terrain
  const S=Math.max(0.2, Math.min(window.innerWidth/W, window.innerHeight/H));
  sc.style.setProperty('--bfs-scale', S);                        // agrandissement purement visuel
}
function clearBossFullscreen(){
  const f=B.field, sc=document.getElementById('bossScaler');
  if(f){ f.style.width=''; f.style.height=''; }
  if(sc) sc.style.removeProperty('--bfs-scale');
  B._fsW=0; B._fsH=0;
}
function teardownBossFullscreen(){
  if(B.fsSync){ document.removeEventListener('fullscreenchange',B.fsSync); document.removeEventListener('webkitfullscreenchange',B.fsSync); B.fsSync=null; }
  if(B.fsResize){ window.removeEventListener('resize',B.fsResize); B.fsResize=null; }
  clearBossFullscreen();
  if(fsElement()){ const ex=document.exitFullscreen||document.webkitExitFullscreen; if(ex) try{ const p=ex.call(document); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
}
function updateBossHud(){
  let h=''; for(let i=0;i<B.maxLives;i++) h+=(i<B.lives?'❤️':'<span class="lost">🖤</span>');
  const lv=document.getElementById('bossLives'); if(lv) lv.innerHTML=h;
  const ph=document.getElementById('bossPhase');
  if(ph){
    if(B.swarm) ph.textContent = B.phase==='attack' ? '💥 Mitraille le Vaisseau-Mère !' : '🕹️ Aligne-toi (F/J) et tire !';
    else ph.textContent = B.phase==='attack' ? '⚔️ Frappe le boss !' : '⚡ Esquive les sorts !';
  }
  const mt=document.getElementById('bossMeter'); if(mt){ mt.style.width=Math.max(0,B.lives/B.maxLives*100)+'%'; mt.style.background=(B.lives<=2?'var(--red)':'var(--green)'); }
  const hp=document.getElementById('bossHp'); if(hp) hp.style.width=Math.max(0,B.hp/B.maxHp*100)+'%';
  // bouclier de sécurité restant
  const sh=document.getElementById('bossShield');
  if(sh){
    if(B.shield>0){ let s='🛡️'; for(let i=0;i<B.maxShield;i++) s+= i<B.shield?'▮':'▯'; sh.innerHTML='<span class="sh-on">'+s+'</span>'; }
    else sh.innerHTML='<span class="sh-off">🛡️ percé</span>';
  }
}
function spawnSpell(){
  if(B.spells.length>=B.maxConcurrent) return;
  if(B.swarm){
    // essaim : un alien-lettre descend tout droit dans un couloir
    const lane=Math.floor(Math.random()*SWARM_LANES);
    let ch=SWARM_LETTERS[Math.floor(Math.random()*SWARM_LETTERS.length)];
    if(Math.random()<0.5) ch=ch.toUpperCase();
    const el=document.createElement('div'); el.className='invader';
    el.innerHTML='<span class="ufo">'+(Math.random()<0.5?'👾':'👽')+'</span><span class="cap">'+escapeHtml(ch)+'</span>';
    const x=laneX(lane);
    el.style.left=x+'%'; el.style.transform='translate(-50%,140px)';
    B.field.appendChild(el);
    B.spells.push({el,ch,lane,x,y:140});
    return;
  }
  const ch=BOSS_POOL[Math.floor(Math.random()*BOSS_POOL.length)];
  const el=document.createElement('div'); el.className='spell';
  el.innerHTML='<div class="orb">'+escapeHtml(ch)+'</div>';
  const x=10+Math.random()*80;
  el.style.left=x+'%'; el.style.transform='translate(-50%,96px)';
  B.field.appendChild(el);
  B.spells.push({el,ch,x,y:96});
}
function removeSpell(s){ const i=B.spells.indexOf(s); if(i>=0) B.spells.splice(i,1); }
function loopB(ts){
  if(!B.running) return;
  if(!B.last) B.last=ts;
  const dt=Math.min(.05,(ts-B.last)/1000); B.last=ts;
  if(B.phase==='tuto'){ tutoTick(dt,ts); B.raf=requestAnimationFrame(loopB); return; }
  if(B.phase==='cast'){
    if(B.spawned<B.spellsPerWave){
      if(ts>=B.nextSpawn){ spawnSpell(); B.spawned++; B.nextSpawn=ts+B.spawnMs; }
    } else if(B.spells.length===0){ openAttack(); B.raf=requestAnimationFrame(loopB); return; }
    for(const s of B.spells.slice()){
      s.y+=B.speed*dt;
      s.el.style.transform='translate(-50%,'+s.y+'px)';
      if(s.y>=B.groundY) spellHitsHero(s);
    }
  } else if(B.phase==='attack'){
    if(B.attackEndTs && ts>=B.attackEndTs) closeAttack();
  }
  B.raf=requestAnimationFrame(loopB);
}
function spellHitsHero(s){
  removeSpell(s); const el=s.el; el.classList.add('pop'); setTimeout(()=>el.remove(),250);
  if(B.immune) return;
  B.lives--; beep('bad');
  B.field.classList.add('shake'); setTimeout(()=>B.field.classList.remove('shake'),250);
  B.hero.classList.add('hit'); setTimeout(()=>B.hero.classList.remove('hit'),400);
  updateBossHud();
  if(B.lives<=0) bossFail();
}
function destroySpell(s){
  const xPx=B.field.clientWidth*s.x/100, yPx=s.y+24;
  if(B.swarm) blueBurstAt(xPx,yPx,B.field); else burstAt(xPx,yPx,B.field);
  removeSpell(s); const el=s.el; el.classList.add('pop'); setTimeout(()=>el.remove(),250);
  if(!B.swarm) beep('good');   // en mode essaim, le son de tir laser remplace ce bip
}
function onKeyB(e){
  if(B.phase==='tuto') return onKeyTuto(e);
  if(e.key.length!==1) return; e.preventDefault();
  if(B.phase==='attack'){
    let hit=null;
    for(const t of B.attackTargets){ if(t.ch===e.key){ hit=t; break; } }
    if(hit) damageBoss(hit); else beep('key');
    return;
  }
  if(B.swarm){
    // pilotage : F = gauche, J = droite ; tir : la lettre de l'alien ALIGNÉ avec le vaisseau
    const lk=e.key.toLowerCase();
    if(lk==='f'||lk==='j'){ moveSwarmShip(lk==='f'?-1:1); return; }
    let best=null;
    for(const s of B.spells){ if(s.lane===B.lane && s.ch===e.key){ if(!best||s.y>best.y) best=s; } }
    if(best){ swarmLaser(best); destroySpell(best); }
    else beep('key');   // pas aligné ou mauvaise touche : rien ne se passe
    return;
  }
  let best=null;
  for(const s of B.spells){ if(s.ch===e.key){ if(!best||s.y>best.y) best=s; } }
  if(best) destroySpell(best);
  else if(B.penalizeWrong) bossWrongKey();
  else beep('key');
}
function moveSwarmShip(dir){
  const nl=Math.max(0, Math.min(SWARM_LANES-1, B.lane+dir));
  if(nl===B.lane) return;
  B.lane=nl; B.hero.style.left=laneX(nl)+'%';
  beep('key');
}
function swarmLaser(s){
  const xPx=B.field.clientWidth*s.x/100;
  drawLaser(B.field, xPx, B.field.clientHeight-40, xPx, s.y+30);
  playLaserShot();
}

/* =========================================================
   Tutoriel de pilotage (boss « essaim », Niveau 5)
   Un entraînement guidé AVANT le combat : déplacer le vaisseau (F/J),
   tirer sur 2 aliens, puis découvrir la phase 2 (mitraillage du boss).
   Aucune vie perdue pendant le tuto (B.immune = true).
   ========================================================= */
const TUTO_ALIEN_SPEED=16;   // descente très lente des aliens d'entraînement
function startSwarmTutorial(){
  B.phase='tuto'; B.immune=true;
  B.tuto={ stage:0, fdone:false, jdone:false, shots:0, atkTargets:[], atkDone:0 };
  B.spells.forEach(s=>s.el.remove()); B.spells=[];
  showTutoCard0();
}
function tutoField(){ return B.field; }
function removeTutoUI(){
  const c=document.getElementById('tutoCard'); if(c) c.remove();
  const h=document.getElementById('tutoHint'); if(h) h.remove();
}
function showTutoCard(html){
  removeTutoUI();
  const card=document.createElement('div'); card.className='tuto-card'; card.id='tutoCard';
  card.innerHTML='<div class="tc-inner">'+html+'</div>';
  tutoField().appendChild(card);
  if(window.ttsDecorateCard) ttsDecorateCard(card,'.tc-inner',['.tc-title','.tc-text']);   // 🔊 lit la carte de tuto
  return card;
}
function setTutoHint(txt, prog){
  let h=document.getElementById('tutoHint');
  if(!h){ h=document.createElement('div'); h.className='tuto-hint'; h.id='tutoHint';
    h.innerHTML='<span class="th-txt"></span><span class="th-prog"></span>';
    tutoField().appendChild(h); }
  h.querySelector('.th-txt').innerHTML=txt;
  h.querySelector('.th-prog').innerHTML=prog||'';
}
// ---- Étape 0 : accueil ----
function showTutoCard0(){
  const card=showTutoCard(
    '<div class="tc-emoji">🚀</div>'
    + '<div class="tc-title">Entraînement de pilotage</div>'
    + '<div class="tc-text">Bienvenue, pilote&nbsp;! Avant d\'affronter le <b>Vaisseau-Mère</b>, apprenons à piloter ton vaisseau. Ça prend 30&nbsp;secondes&nbsp;!</div>'
    + '<div class="tc-actions">'
    +   '<button class="tc-btn" id="tutoStart">Commencer l\'entraînement 🕹️</button>'
    +   '<button class="tc-skip" id="tutoSkip">Passer le tutoriel →</button>'
    + '</div>');
  card.querySelector('#tutoStart').onclick=()=>{ audioCtx(); beep('key'); tutoStartMove(); };
  card.querySelector('#tutoSkip').onclick=()=>{ audioCtx(); beginRealCombat(); };
}
// ---- Étape 1 : déplacement F / J ----
function tutoStartMove(){
  B.tuto.stage=1; removeTutoUI();
  paintTutoMoveHint();
}
function paintTutoMoveHint(){
  const t=B.tuto;
  setTutoHint('🕹️ Appuie sur <b>F</b> pour aller à <b>gauche</b> et sur <b>J</b> pour aller à <b>droite</b>.',
    'F '+(t.fdone?'✅':'⬜')+'&nbsp;&nbsp;J '+(t.jdone?'✅':'⬜'));
}
// ---- Étape 2 : tir sur 2 aliens ----
function tutoStartShoot(){
  B.tuto.stage=2; B.tuto.shots=0;
  paintTutoShootHint();
  tutoSpawnAlien();
}
function paintTutoShootHint(){
  setTutoHint('🎯 Place-toi <b>sous l\'alien</b> avec F/J, puis tape <b>sa lettre</b> pour tirer&nbsp;!',
    'Aliens détruits : '+B.tuto.shots+' / 2');
}
function tutoSpawnAlien(){
  // un alien lent, dans un couloir différent de celui du vaisseau pour forcer un déplacement
  let lane=Math.floor(Math.random()*SWARM_LANES);
  if(lane===B.lane) lane=(lane+2)%SWARM_LANES;
  // 1er alien en minuscule, 2e en MAJUSCULE (au lieu d'une casse au hasard) : l'entraînement
  // doit forcément faire rencontrer la majuscule — et sa faute classique, taper la minuscule —
  // avant le vrai combat, où les deux casses se mélangent. Cf. tutoMajLesson().
  let ch=SWARM_LETTERS[Math.floor(Math.random()*SWARM_LETTERS.length)];
  if(B.tuto && B.tuto.shots>=1) ch=ch.toUpperCase();
  const el=document.createElement('div'); el.className='invader';
  el.innerHTML='<span class="ufo">'+(Math.random()<0.5?'👾':'👽')+'</span><span class="cap">'+escapeHtml(ch)+'</span>';
  const x=laneX(lane);
  el.style.left=x+'%'; el.style.transform='translate(-50%,140px)';
  tutoField().appendChild(el);
  B.spells.push({el,ch,lane,x,y:140});
}
/* Leçon « les MAJUSCULES comptent », déclenchée quand l'élève est bien aligné sous l'alien
   majuscule mais tape la minuscule. C'est une carte DANS le terrain (comme les autres cartes
   du tuto) et non une popup #modal : l'arène du boss peut être en plein écran, où un #modal
   — situé hors de l'élément passé en plein écran — serait invisible. */
function tutoMajLesson(ch){
  const t=B.tuto; if(!t || t.majLesson) return;
  t.majLesson=true; beep('bad');
  const {hl}=keyHint(ch);
  hl.caps=true;                     // on montre les DEUX moyens : Maj ⇧ et ⇪ Caps Lock
  const card=showTutoCard(
    '<div class="tc-emoji">🔠</div>'
    + '<div class="tc-title">Les MAJUSCULES comptent&nbsp;!</div>'
    + '<div class="tc-text">Tu étais bien placé, mais cet alien porte un <b>'+escapeHtml(ch)+'</b> en <b>majuscule</b>&nbsp;: '
    +   'taper <b>'+escapeHtml(ch.toLowerCase())+'</b> en minuscule ne tire pas. Deux moyens de faire la majuscule&nbsp;:</div>'
    + '<div class="tc-text" style="margin-bottom:8px">① Garde '+kbd('Maj ⇧')+' enfoncé et appuie sur '+kbd(ch)+'.<br>'
    +   '② Ou appuie une fois sur '+kbd('⇪ Caps Lock')+', tape ta lettre, puis rappuie dessus.</div>'
    + buildKeyboard(hl)
    + '<div class="tc-actions"><button class="tc-btn" id="tutoMajGo">J\'ai compris ! 👍</button></div>');
  card.classList.add('maj');
  card.querySelector('#tutoMajGo').onclick=()=>{
    audioCtx(); beep('key');
    t.majLesson=false; removeTutoUI(); paintTutoShootHint();
  };
}
// ---- Étape 3 : phase 2 (boss vulnérable) ----
function tutoStartPhase2(){
  const t=B.tuto; t.stage=3; t.atkDone=0;
  B.spells.forEach(s=>s.el.remove()); B.spells=[];
  B.lane=Math.floor(SWARM_LANES/2); B.hero.style.left='50%'; B.hero.classList.add('vuln');
  B.sprite.classList.add('exhausted');
  if(B.shield>0){ B.shield=0; updateBossHud(); }
  flashBanner('🛡️ Bouclier baissé !', 'Le Vaisseau-Mère est vulnérable !');
  setTutoHint('💥 Essaim détruit&nbsp;? Le Vaisseau-Mère devient <b>vulnérable</b>&nbsp;! Tape les <b>symboles et chiffres</b> pour le mitrailler.',
    'Tirs réussis : 0 / 2');
  setTimeout(()=>{ if(B.phase==='tuto' && t.stage===3){ tutoSpawnAtk(); tutoSpawnAtk(); } }, 900);
}
function tutoSpawnAtk(){
  const t=B.tuto, pool=B.atkPool||BOSS_COMPLEX;
  let ch, tries=0;
  do{ ch=pool[Math.floor(Math.random()*pool.length)]; tries++; }
  while(tries<8 && t.atkTargets.some(x=>x.ch===ch));
  const el=document.createElement('div'); el.className='atk-target';
  el.innerHTML='<div class="cap">'+escapeHtml(ch)+'</div>';
  const x=22+Math.random()*56, y=34+Math.random()*24;
  el.style.left=x+'%'; el.style.top=y+'%'; el.style.transform='translate(-50%,-50%)';
  tutoField().appendChild(el);
  t.atkTargets.push({el,ch,x,y});
}
// ---- Étape 4 : prêt pour le vrai combat ----
function tutoFinishCard(){
  B.tuto.stage=4;
  B.spells.forEach(s=>s.el.remove()); B.spells=[];
  B.sprite.classList.remove('exhausted');
  removeTutoUI();
  const card=showTutoCard(
    '<div class="tc-emoji">🛸</div>'
    + '<div class="tc-title">Prêt pour le combat&nbsp;!</div>'
    + '<div class="tc-text">Bravo&nbsp;! Tu sais <b>piloter</b> et <b>tirer</b>. Maintenant, le vrai combat contre le <b>Vaisseau-Mère</b> commence. Bonne chance, pilote&nbsp;! 🚀</div>'
    + '<div class="tc-actions"><button class="tc-btn" id="tutoGo">Lancer le combat ! 🛸</button></div>');
  card.querySelector('#tutoGo').onclick=()=>{ audioCtx(); beep('win'); beginRealCombat(); };
}
// ---- Bascule vers le vrai combat ----
function beginRealCombat(){
  kbSwarmTutoSeen=true;
  removeTutoUI();
  B.spells.forEach(s=>s.el.remove()); B.spells=[];
  if(B.tuto){ B.tuto.atkTargets.forEach(t=>t.el.remove()); }
  B.tuto=null;
  B.sprite.classList.remove('exhausted','hurt');
  // recharge le bouclier de sécurité pour le premier essaim, comme en début de combat
  if(B.enh&&B.enh.shield&&B.maxShield){ B.shield=B.maxShield; }
  B.lane=Math.floor(SWARM_LANES/2); B.hero.classList.remove('vuln'); B.hero.style.left=laneX(B.lane)+'%';
  B.phase='cast'; B.spawned=0; B.nextSpawn=performance.now()+700; B.immune=false;
  updateBossHud();
}
// descente lente des aliens d'entraînement (aucun dégât : on les fait juste réapparaître)
function tutoTick(dt){
  if(!B.tuto || B.tuto.stage!==2 || B.tuto.majLesson) return;   // la leçon des majuscules fige la descente
  for(const s of B.spells){
    s.y+=TUTO_ALIEN_SPEED*dt;
    if(s.y>=B.groundY){ s.y=140; }   // pas de pénalité pendant le tuto
    s.el.style.transform='translate(-50%,'+s.y+'px)';
  }
}
// clavier pendant le tutoriel
function onKeyTuto(e){
  if(e.key.length!==1) return; e.preventDefault();
  const t=B.tuto; if(!t) return;
  if(t.majLesson) return;   // la leçon des majuscules attend un clic sur son bouton
  const lk=e.key.toLowerCase();
  if(t.stage===1){
    if(lk==='f'){ moveSwarmShip(-1); t.fdone=true; }
    else if(lk==='j'){ moveSwarmShip(1); t.jdone=true; }
    else { beep('key'); return; }
    paintTutoMoveHint();
    if(t.fdone && t.jdone){ beep('good'); setTimeout(()=>{ if(B.phase==='tuto' && t.stage===1) tutoStartShoot(); }, 550); }
    return;
  }
  if(t.stage===2){
    if(lk==='f'){ moveSwarmShip(-1); return; }
    if(lk==='j'){ moveSwarmShip(1); return; }
    let best=null;
    for(const s of B.spells){ if(s.lane===B.lane && s.ch===e.key){ if(!best||s.y>best.y) best=s; } }
    if(best){
      swarmLaser(best); destroySpell(best); t.shots++;
      paintTutoShootHint();
      if(t.shots>=2){ setTimeout(()=>{ if(B.phase==='tuto' && t.stage===2) tutoStartPhase2(); }, 500); }
      else { setTimeout(()=>{ if(B.phase==='tuto' && t.stage===2) tutoSpawnAlien(); }, 450); }
      return;
    }
    // bien aligné, bonne lettre… mais tapée en minuscule alors que l'alien porte une
    // MAJUSCULE : c'est la faute que l'entraînement doit expliquer, pas un simple raté.
    const miss=B.spells.find(s=>s.lane===B.lane && /^[A-Z]$/.test(s.ch)
                               && s.ch!==e.key && s.ch.toLowerCase()===e.key.toLowerCase());
    if(miss){ tutoMajLesson(miss.ch); return; }
    beep('key');
    return;
  }
  if(t.stage===3){
    let hit=null;
    for(const tg of t.atkTargets){ if(tg.ch===e.key){ hit=tg; break; } }
    if(!hit){ beep('key'); return; }
    const i=t.atkTargets.indexOf(hit); if(i>=0) t.atkTargets.splice(i,1);
    hit.el.classList.add('hit'); setTimeout(()=>hit.el.remove(),250);
    const xPx=B.field.clientWidth*hit.x/100, yPx=B.field.clientHeight*hit.y/100;
    swarmAttackLaser(xPx,yPx); dmgHitFx(xPx,yPx); floatDamage(xPx,yPx);
    B.sprite.classList.remove('exhausted'); void B.sprite.offsetWidth; B.sprite.classList.add('hurt');
    setTimeout(()=>{ if(B.phase==='tuto'){ B.sprite.classList.remove('hurt'); B.sprite.classList.add('exhausted'); } },450);
    t.atkDone++;
    setTutoHint('💥 Essaim détruit&nbsp;? Le Vaisseau-Mère devient <b>vulnérable</b>&nbsp;! Tape les <b>symboles et chiffres</b> pour le mitrailler.',
      'Tirs réussis : '+t.atkDone+' / 2');
    if(t.atkDone>=2){ setTimeout(()=>{ if(B.phase==='tuto' && t.stage===3) tutoFinishCard(); }, 500); }
    return;
  }
  // étapes 0 / 4 : on attend un clic sur le bouton
  beep('key');
}
// Touche pressée qui ne fait éclater aucune boule violette → perte d'une vie
function bossWrongKey(){
  if(B.immune || B.lives<=0) return;
  B.lives--; beep('bad');

function openAttack(){

  B.spells.forEach(s=>s.el.remove()); B.spells=[];

function spawnOneTarget(){
  const pool=B.atkPool||BOSS_COMPLEX;
  let ch, tries=0;
  do{ ch=pool[Math.floor(Math.random()*pool.length)]; tries++; }
  while(tries<8 && B.attackTargets.some(t=>t.ch===ch));
  const el=document.createElement('div'); el.className='atk-target';
  el.innerHTML='<div class="cap">'+escapeHtml(ch)+'</div>';
  const x=16+Math.random()*68, y=32+Math.random()*30;
  el.style.left=x+'%'; el.style.top=y+'%'; el.style.transform='translate(-50%,-50%)';
  B.field.appendChild(el);
  B.attackTargets.push({el,ch,x,y});
}
// impact absorbé par le bouclier d'énergie : anneau qui se disperse, pas de dégât réel
function shieldHitFx(xPx,yPx){
  const ring=document.createElement('div'); ring.className='shield-ring';
  ring.style.left=xPx+'px'; ring.style.top=yPx+'px';
  B.field.appendChild(ring); setTimeout(()=>ring.remove(),480);
  const N=8;
  for(let i=0;i<N;i++){
    const ang=(i/N)*2*Math.PI, dist=24+Math.random()*18;
    const sp=document.createElement('div'); sp.className='shield-spark';
    sp.style.left=xPx+'px'; sp.style.top=yPx+'px';
    sp.style.setProperty('--dx',(Math.cos(ang)*dist)+'px');
    sp.style.setProperty('--dy',(Math.sin(ang)*dist)+'px');
    B.field.appendChild(sp); setTimeout(()=>sp.remove(),420);
  }
}
// dégât réel infligé au boss (bouclier déjà percé) : éclats + flash rouge + secousse
function dmgHitFx(xPx,yPx){
  burstAt(xPx,yPx,B.field);
  const flash=document.createElement('div'); flash.className='dmg-flash';
  B.field.appendChild(flash); setTimeout(()=>flash.remove(),300);
  const N=7;
  for(let i=0;i<N;i++){
    const ang=(i/N)*2*Math.PI, dist=30+Math.random()*22;
    const sp=document.createElement('div'); sp.className='dmg-crack';
    sp.style.left=xPx+'px'; sp.style.top=yPx+'px';
    sp.style.setProperty('--dx',(Math.cos(ang)*dist)+'px');
    sp.style.setProperty('--dy',(Math.sin(ang)*dist)+'px');
    B.field.appendChild(sp); setTimeout(()=>sp.remove(),450);
  }
  B.field.classList.add('shake'); setTimeout(()=>B.field.classList.remove('shake'),250);
}
// laser du vaisseau (recentré et avancé) vers le point touché sur le vaisseau-mère
const HERO_VULN_LIFT=110;   // doit correspondre à .hero.vuln{bottom:110px} en CSS
function swarmAttackLaser(xPx,yPx){
  const heroX=B.field.clientWidth/2, heroY=B.field.clientHeight-40-HERO_VULN_LIFT;
  drawLaser(B.field, heroX, heroY, xPx, yPx);
  playLaserShot();
}
// dégât commun au boss (mode lettres ET mode mots) ; renvoie true si le boss est vaincu
function bossTakeHit(xPx,yPx){
  // bouclier de sécurité : les premiers coups le brisent au lieu d'endommager le boss
  if(B.shield>0){
    B.shield--; if(!B.swarm) beep('key');   // en mode essaim, le son de tir laser remplace ce bip
    shieldHitFx(xPx,yPx);
    floatDamage(xPx,yPx,'🛡️');
    B.sprite.classList.remove('exhausted'); void B.sprite.offsetWidth; B.sprite.classList.add('hurt');
    setTimeout(()=>{ if(B.phase==='attack'){ B.sprite.classList.remove('hurt'); B.sprite.classList.add('exhausted'); } },450);
    updateBossHud();
    if(B.shield===0){ flashBanner('🛡️ Bouclier percé !', 'Maintenant, pirate-le !'); }
    return false;
  }
  dmgHitFx(xPx,yPx);
  floatDamage(xPx,yPx);
  B.hp--; if(B.hp<0) B.hp=0;
  if(!B.swarm) beep('good');   // en mode essaim, le son de tir laser remplace ce bip
  B.sprite.classList.remove('exhausted'); void B.sprite.offsetWidth; B.sprite.classList.add('hurt');
  setTimeout(()=>{ if(B.phase==='attack'){ B.sprite.classList.remove('hurt'); B.sprite.classList.add('exhausted'); } },450);
  updateBossHud();
  if(B.hp<=0){ bossDefeated(); return true; }
  return false;
}
function damageBoss(t){
  const i=B.attackTargets.indexOf(t); if(i>=0) B.attackTargets.splice(i,1);
  const el=t.el; el.classList.add('hit'); setTimeout(()=>el.remove(),250);
  const xPx=B.field.clientWidth*t.x/100, yPx=B.field.clientHeight*t.y/100;
  if(B.swarm) swarmAttackLaser(xPx,yPx);
  if(bossTakeHit(xPx,yPx)) return;
  if(B.attackEndTs && performance.now()<B.attackEndTs) spawnOneTarget();
}
function floatDamage(x,y,txt){
  const d=document.createElement('div'); d.className='dmg-float'; d.textContent=txt||'-1';
  d.style.left=x+'px'; d.style.top=y+'px'; B.field.appendChild(d); setTimeout(()=>d.remove(),800);
}
// petite bannière fugace (ex. « Bouclier percé ! ») réutilisant le style d'annonce du combat
function flashBanner(title, sub){
  const ban=document.createElement('div'); ban.className='attack-banner';
  ban.innerHTML='<div class="attack-title">'+title+'</div>'+(sub?'<div class="attack-sub">'+sub+'</div>':'');
  B.field.appendChild(ban); setTimeout(()=>ban.remove(),1100);
}
function closeAttack(){
  B.phase='cast'; B.attackEndTs=0; B.immune=true;
  B.attackTargets.forEach(t=>t.el.remove()); B.attackTargets=[];
  const sw=document.getElementById('bossSweat'); if(sw) sw.remove();
  B.sprite.classList.remove('exhausted');
  // fin de la vulnérabilité : le vaisseau est replacé sur les couloirs
  if(B.swarm){ B.hero.classList.remove('vuln'); B.hero.style.left=laneX(B.lane)+'%'; }
  // le bouclier de sécurité se recharge à chaque nouvel essaim
  if(B.enh&&B.enh.shield&&B.maxShield){ B.shield=B.maxShield; }
  // l'essaim accélère à chaque nouvelle vague
  B.waveCount++;
  if(B.accel>1){ B.speed=Math.min(B.baseSpeed*2.2, B.speed*B.accel); }
  B.spawned=0; B.nextSpawn=performance.now()+1300;   // petit répit pour lire le message
  updateBossHud();
  // alerte rouge / glitch quand le boss contre-attaque
  if(B.enh&&B.enh.glitch){ B.field.classList.add('alert'); setTimeout(()=>B.field.classList.remove('alert'),1300); }
  const ban=document.createElement('div'); ban.className='attack-banner';
  const cTitle=bt('castTitle','⚡ LE DRAGON CONTRE-ATTAQUE ! ⚡');
  const cSub=bt('castSub','Esquive ses sorts !');
  ban.innerHTML='<div class="attack-title">'+cTitle+'</div><div class="attack-sub">'+cSub+'</div>';
  B.field.appendChild(ban);
  beep('ding');
  setTimeout(()=>{ ban.remove(); B.immune=false; },1300);
}
function bossDefeated(){
  B.running=false; cancelAnimationFrame(B.raf); teardownBossFullscreen();
  B.attackTargets.forEach(t=>t.el.remove()); B.attackTargets=[];
  B.spells.forEach(s=>s.el.remove()); B.spells=[];
  const sw=document.getElementById('bossSweat'); if(sw) sw.remove();
  B.sprite.classList.remove('exhausted','hurt'); B.sprite.classList.add('dead');

function bossFail(){

/* Réglages par difficulté.
   links   : connexions 📡 = les vies. Généreuses, car TOUTE mauvaise touche en coûte une
             (et se faire rattraper dans le labyrinthe aussi).
   traceBase/riposteBase (+ PerChar) : chronos de frappe (ms de base + ms par caractère).
             Resserrés une 1re fois d'environ 15 % le 2026-07-21, puis encore ~12 % le même
             jour (encore jugé trop facile), puis -40 % supplémentaires le même jour (bien

   traps   : fraction de dégâts à partir de laquelle les pièges apparaissent (null = jamais).
   short   : ne proposer que les commandes courtes (mode Facile).
   mazes   : nombre de plongées dans la mémoire de K0RT3X. À chaque plongée il se recopie :
             la Nième plongée compte N poursuivants (cf. HBM_BRAINS).
   foeSpeed/foeWander : poursuite de la 1re plongée (cases/s, part d'aléa) ; les plongées
             suivantes accélèrent et hésitent moins (cf. hbStartMaze). */
const HB_TUNING={
  easy:   {links:10, traceBase:4320, tracePerChar:870, riposteBase:4320, ripostePerChar:780, traps:null, rafale:false, short:true,  mazes:1, foeSpeed:3.0, foeWander:0.30},

  hard:   {links:7,  traceBase:2580, tracePerChar:540, riposteBase:2880, ripostePerChar:520, traps:0.34, rafale:true,  short:false, mazes:3, foeSpeed:3.8, foeWander:0.14},
  extreme:{links:5,  traceBase:2040, tracePerChar:420, riposteBase:2310, ripostePerChar:400, traps:0,    rafale:true,  short:false, mazes:4, foeSpeed:4.0, foeWander:0.10}

/* PV totaux de K0RT3X : les coups de KB_BOSS_MODES + 1 par labyrinthe (chaque labyrinthe
   réussi vaut 1 dégât). Sans ce bonus, les plongées « mangeraient » des tours de frappe. */
function hbTotalHp(mode){
  const m=KB_BOSS_MODES[mode]||KB_BOSS_MODES.medium, t=HB_TUNING[mode]||HB_TUNING.medium;
  return m.hits + (t.mazes||1);
}
/* Paliers de PV où K0RT3X aspire le joueur : répartis régulièrement sur le combat, jamais
   à 1 PV (réservé à la finale) et strictement décroissants (sinon double déclenchement). */
function hbMazeGates(hp, n){
  const out=[];
  for(let i=1;i<=n;i++){
    const v=Math.max(2, Math.min(hp-1, Math.round(hp*(n-i+1)/(n+1))));
    if(!out.length || v<out[out.length-1]) out.push(v);
  }
  return out;
}

function hbWait(ms,cb){ const sid=HB.sid; setTimeout(()=>{ if(HB.sid===sid) cb(); }, ms); }
function hbType(el,text,cb,speed){

  const t=setInterval(()=>{
    if(HB.sid!==sid){ clearInterval(t); if(el.__hbT===t) el.__hbT=0; return; }
    el.textContent+=text[i++]||'';
    if(i>=text.length){ clearInterval(t); if(el.__hbT===t) el.__hbT=0; cb&&cb(); }
  }, speed||14);
  el.__hbT=t;
}

/* pioche d'alertes : on mélange le paquet, on évite deux fois la même de suite */
function hbDrawAlert(){
  if(!HB.deck.length){

    for(let i=HB.deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=HB.deck[i]; HB.deck[i]=HB.deck[j]; HB.deck[j]=t; }
    if(HB.deck.length>1 && HB.deck[HB.deck.length-1]===HB.lastAlert) HB.deck.unshift(HB.deck.pop());
  }
  const a=HB.deck.pop(); HB.lastAlert=a; return a;
}
function hbNextAlert(){

  const a=hbDrawAlert(); HB.alert=a;

/* les commandes apparaissent en glyphes aliens puis se décodent (comme au Niveau 5).
   tuto = true : même rendu, mais sans chrono de traçage (entraînement d'ouverture). */
function hbRenderAlertRows(tuto){
  const wrap=hbEl('hbRows'); wrap.innerHTML='';
  const mk=(text)=>{ const r=document.createElement('div'); r.className='ht-code hb-row';
    r.innerHTML='<span class="hb-prompt">&gt;</span>'+text.split('').map(()=>'<span class="hc alien">'+ALIEN_GLYPHS[Math.floor(Math.random()*ALIEN_GLYPHS.length)]+'</span>').join('');
    return r; };
  HB.cmdBox=mk(HB.cmd); HB.trapBox=HB.trap?mk(HB.trap):null;
  const rows=HB.trapBox&&Math.random()<0.5?[HB.trapBox,HB.cmdBox]:[HB.cmdBox,HB.trapBox];
  rows.forEach(r=>{ if(r) wrap.appendChild(r); });
  HB.cmdCells=[].slice.call(HB.cmdBox.querySelectorAll('.hc'));
  HB.trapCells=HB.trapBox?[].slice.call(HB.trapBox.querySelectorAll('.hc')):[];
  playHackDigital();
  const reveal=(cells,text)=>cells.forEach((c,i)=>hbWait(240+i*70,()=>{ c.classList.remove('alien'); c.textContent=text[i]; }));
  reveal(HB.cmdCells,HB.cmd); if(HB.trapBox) reveal(HB.trapCells,HB.trap);
  const total=240+Math.max(HB.cmd.length,(HB.trap||'').length)*70+200;
  hbWait(total,()=>{
    if(HB.state!==(tuto?'duel-tuto':'alert')) return;
    hbPaintCur(); HB.ready=true;
    if(tuto) return;                                // à l'entraînement, pas de chrono
    const mul=1-0.25*((HB.maxHp-HB.hp)/HB.maxHp);   // le traçage accélère quand K0RT3X s'énerve
    let dur=(HB.tune.traceBase+HB.tune.tracePerChar*HB.cmd.length)*mul;
    if(HB.trap) dur*=1.25;   // temps de lecture en plus quand il y a un piège
    hbStartBar(dur, hbCaught, '⚠ TRAÇAGE', false);
  });
}
function hbPaintCur(){
  HB.cmdCells.forEach((c,i)=>c.classList.toggle('cur', i===HB.pos));
  HB.trapCells.forEach((c,i)=>c.classList.toggle('cur', !!HB.trap && i===HB.trapPos));
}
function hbStartBar(durMs,onTimeout,label,riposte){
  HB.barDur=durMs; HB.barElapsed=0; HB.lastTs=0; HB.barTimeout=onTimeout;
  const row=hbEl('hbTraceRow'); if(row){ row.style.visibility='visible'; row.classList.toggle('riposte',!!riposte); }
  const lab=hbEl('hbTraceLab'); if(lab) lab.textContent=label;
  const f=hbEl('hbTrace'); if(f) f.style.width='0%';
  if(HB.raf) cancelAnimationFrame(HB.raf);
  HB.raf=requestAnimationFrame(hbBarLoop);
}
function hbBarLoop(ts){
  if(!HB.running||!HB.ready){ HB.raf=0; return; }
  if(!HB.lastTs) HB.lastTs=ts;
  HB.barElapsed+=Math.min(50, ts-HB.lastTs); HB.lastTs=ts;
  const fr=Math.min(1, HB.barElapsed/(HB.barDur||1));
  const f=hbEl('hbTrace'); if(f) f.style.width=(fr*100)+'%';
  if(fr>=1){ HB.raf=0; const cb=HB.barTimeout; HB.barDur=0; HB.barTimeout=null; cb&&cb(); return; }
  HB.raf=requestAnimationFrame(hbBarLoop);
}
function hbStopBar(){
  HB.barDur=0; HB.barTimeout=null;
  if(HB.raf){ cancelAnimationFrame(HB.raf); HB.raf=0; }
  const f=hbEl('hbTrace'); if(f) f.style.width='0%';
}
function onKeyHB(e){
  if(HB.state==='maze'||HB.state==='maze-tuto') return hbMazeKey(e);
  if(HB.state==='duel-tuto') return onKeyDuelTuto(e);
  if(e.key.length!==1) return; e.preventDefault();
  if(!HB.ready) return;
  if(HB.state==='alert'){
    const mc=e.key===HB.cmd[HB.pos], mt=!!HB.trap && e.key===HB.trap[HB.trapPos];
    if(!mc && !mt) return hbBadKey();
    playHackTyping();
    if(mc){ const c=HB.cmdCells[HB.pos]; if(c){ c.classList.remove('cur','bad'); c.classList.add('done'); } HB.pos++; }
    if(mt){ const c=HB.trapCells[HB.trapPos]; if(c){ c.classList.remove('cur','bad'); c.classList.add('done'); } HB.trapPos++; }
    if(mc && HB.pos>=HB.cmd.length) return hbBlocked();
    if(mt && HB.trapPos>=HB.trap.length) return hbTrapped();
    hbPaintCur();
    return;
  }
  if(HB.state==='riposte'||HB.state==='finale'){
    if(e.key!==HB.cmd[HB.pos]) return hbBadKey();
    playHackTyping();
    const c=HB.cmdCells[HB.pos]; if(c){ c.classList.remove('cur','bad'); c.classList.add('done'); } HB.pos++;
    if(HB.pos>=HB.cmd.length) return HB.state==='finale'?hbDefeated():hbRiposteHit();
    hbPaintCur();
  }
}

function onKeyDuelTuto(e){
  if(e.key.length!==1) return; e.preventDefault();
  if(!HB.ready) return;
  const mc=e.key===HB.cmd[HB.pos], mt=!!HB.trap && e.key===HB.trap[HB.trapPos];
  if(!mc && !mt) return hbDuelTutoBad();
  playHackTyping();
  if(mc){ const c=HB.cmdCells[HB.pos]; if(c){ c.classList.remove('cur','bad'); c.classList.add('done'); } HB.pos++; }
  if(mt){ const c=HB.trapCells[HB.trapPos]; if(c){ c.classList.remove('cur','bad'); c.classList.add('done'); } HB.trapPos++; }
  if(mc && HB.pos>=HB.cmd.length) return hbDuelTutoOk();

/* ---- Phase « LA MÉMOIRE DE K0RT3X » : labyrinthe futuriste façon Pac-Man ----
   Acculé à mi-combat, K0RT3X aspire le joueur DANS sa mémoire. C'est là qu'il garde
   ses CLÉS DE CHIFFREMENT 🔑 : ce sont elles qui tiennent l'ordinateur verrouillé, et
   elles clignotent parce qu'il les rafraîchit sans arrêt. Les voler toutes casse le
   verrou (= 1 dégât). Pas de fantômes : c'est l'IA elle-même, un œil rouge, qui traque
   le joueur sans relâche (poursuite par plus court chemin dans le labyrinthe).
   Déplacement Z Q S D (flèches tolérées) ; rattrapé = −1 connexion 📡 et réapparition
   à l'autre bout du labyrinthe. Un entraînement guidé précède toujours la phase. */
/* Labyrinthes volontairement larges et bas (17×9, 13×7) : la zone de jeu est bien plus
   large que haute, une grille carrée y perdrait la moitié de la place et donnerait des
   cases minuscules sur écran court. Aucun cul-de-sac : le poursuivant serait injuste. */
const HB_MAZE_MAP=[
  '#################',
  '#...o.o.o.o.o...#',
  '#.##.#.#.#.#.##.#',
  '#o..o...o...o..o#',
  '#.##.##...##.##.#',
  '#o..o...o...o..o#',
  '#.##.#.#.#.#.##.#',
  '#...o.o.o.o.o...#',
  '#################'
];
const HB_MAZE_SPAWNS=[[1,1],[15,1],[1,7],[15,7]];   // les quatre bouts du labyrinthe
/* Nids des copies de K0RT3X, sur la travée centrale et bien écartés : la 1re plongée n'en
   réveille qu'une, la Nième les N premières. Aucun n'est sur une clé ni sur un coin de
   réapparition du joueur. */
const HB_MAZE_HOMES=[[8,4],[12,4],[4,4],[15,4]];
/* Moins de clés à chaque nouvelle plongée : il y a plus de poursuivants, la phase doit
   rester courte et donc jouable. */
const HB_MAZE_KEYCOUNT=[20,14,12,10];
/* Clés BLEUES : 2 par plongée, en plus des clés normales, replacées au hasard à chaque
   fois (cf. hbmAddBlueKeys). Ce sont les SEULES à ralentir les copies de K0RT3X à la
   récupération (cf. hbmCollect) — les clés normales ne sont qu'un objectif. Distance
   minimale entre les deux pour éviter qu'elles se retrouvent collées. */
const HB_MAZE_BLUEKEYS=2, HB_MAZE_BLUEKEYS_MINDIST=6;
const HBM_HERO_SPEED=5.0;                            // cases/s du joueur (référence)
/* Secondes de ralentissement (vitesse ×0.5, cf. hbmLoop) offertes par chaque clé BLEUE
   volée (cf. HB_MAZE_BLUEKEYS). C'est la soupape du mode multi-copies : sans elle, 3 ou
   4 poursuivants en plus court chemin dans un labyrinthe de couloirs à une voie ne
   laissent aucune échappatoire (mesuré : la phase devenait infaisable). Elles gardent
   leur cap, juste plus lentes. */
const HBM_SCATTER=1.8;
/* Après une capture, les copies sont téléportées à leur nid (cf. hbmCheckCatch) puis
   repartent aussitôt en chasse, mais ralenties le temps de HBM_REGROUP : sans ce répit
   elles reconvergent instantanément sur le point de réapparition et enchaînent les
   captures — mesuré, une seule plongée pouvait coûter toutes les connexions d'un coup. */
const HBM_REGROUP=2.4;
const HB_TUTO_MAP=[
  '#############',
  '#...........#',
  '#.##.###.##.#',
  '#...........#',
  '#.##.###.##.#',
  '#...........#',
  '#############'
];
const HB_TUTO_SPAWNS=[[1,1],[11,1],[1,5],[11,5]];
const HB_DIRS={
  z:{x:0,y:-1,pad:'z'}, s:{x:0,y:1,pad:'s'}, q:{x:-1,y:0,pad:'q'}, d:{x:1,y:0,pad:'d'},
  ArrowUp:{x:0,y:-1,pad:'z'}, ArrowDown:{x:0,y:1,pad:'s'},
  ArrowLeft:{x:-1,y:0,pad:'q'}, ArrowRight:{x:1,y:0,pad:'d'}
};
const HBM={};   // labyrinthe en cours (entraînement ou phase réelle)
const HBT={};   // avancement de l'entraînement

/* ---------- moteur : grille, déplacement, poursuite ---------- */
function hbmParse(map){
  const grid=map.map(row=>row.split('').map(c=>c==='#'?1:0));
  const keys=[];
  map.forEach((row,r)=>row.split('').forEach((c,i)=>{ if(c==='o') keys.push({c:i,r:r,got:false}); }));
  return {grid, w:map[0].length, h:map.length, keys};
}
function hbmFree(c,r){ const g=HBM.grid; return !!(g && g[r] && g[r][c]===0); }
function hbmActor(c,r){ return {px:c, py:r, dir:{x:0,y:0}, face:{x:1,y:0}, want:null, trail:[]}; }
/* déplacement continu le long des couloirs : on ne change de couloir qu'au centre d'une
   case (comme Pac-Man), sauf demi-tour qui est accepté n'importe où. */
function hbmMove(a, dist, onCenter){
  let guard=0;
  while(dist>1e-6 && guard++<64){
    if(a.want && (a.dir.x||a.dir.y) && a.want.x===-a.dir.x && a.want.y===-a.dir.y){ a.dir={x:a.want.x, y:a.want.y}; }
    const cx=Math.round(a.px), cy=Math.round(a.py);
    if(Math.abs(a.px-cx)<1e-6 && Math.abs(a.py-cy)<1e-6){
      a.px=cx; a.py=cy;
      if(onCenter) onCenter(cx,cy,a);
      if(a.want && hbmFree(cx+a.want.x, cy+a.want.y)) a.dir={x:a.want.x, y:a.want.y};
      if((a.dir.x||a.dir.y) && !hbmFree(cx+a.dir.x, cy+a.dir.y)) a.dir={x:0,y:0};
      if(!a.dir.x && !a.dir.y) return;
    }
    const tx=a.dir.x ? (a.dir.x>0?Math.floor(a.px)+1:Math.ceil(a.px)-1) : a.px;
    const ty=a.dir.y ? (a.dir.y>0?Math.floor(a.py)+1:Math.ceil(a.py)-1) : a.py;
    const step=Math.abs(tx-a.px)+Math.abs(ty-a.py);
    if(step<=dist){ a.px=tx; a.py=ty; dist-=step; }
    else { a.px+=a.dir.x*dist; a.py+=a.dir.y*dist; dist=0; }
  }
  if(a.dir.x||a.dir.y) a.face={x:a.dir.x, y:a.dir.y};
}
/* carte des distances (en cases) depuis un point : sert à la poursuite ET à choisir
   le point de réapparition le plus éloigné de K0RT3X. */
function hbmDistField(c0,r0){
  const W=HBM.w, H=HBM.h, dist=new Int16Array(W*H).fill(-1);
  if(!hbmFree(c0,r0)) return dist;
  const q=[c0+r0*W]; dist[c0+r0*W]=0;
  for(let i=0;i<q.length;i++){
    const cur=q[i], c=cur%W, r=(cur-c)/W, d=dist[cur]+1;
    for(let k=0;k<4;k++){
      const nc=c+[1,-1,0,0][k], nr=r+[0,0,1,-1][k];
      if(nc<0||nr<0||nc>=W||nr>=H||!hbmFree(nc,nr)) continue;
      const ni=nc+nr*W; if(dist[ni]>=0) continue;
      dist[ni]=d; q.push(ni);
    }
  }
  return dist;
}
/* case libre la plus proche d'un point visé (une cible peut tomber dans un mur) */
function hbmNearestFree(c,r){
  c=Math.max(0, Math.min(HBM.w-1, c)); r=Math.max(0, Math.min(HBM.h-1, r));
  if(hbmFree(c,r)) return [c,r];
  for(let rad=1; rad<Math.max(HBM.w,HBM.h); rad++){
    for(let dc=-rad; dc<=rad; dc++) for(let dr=-rad; dr<=rad; dr++){
      if(Math.abs(dc)!==rad && Math.abs(dr)!==rad) continue;   // seulement le contour du carré
      if(hbmFree(c+dc, r+dr)) return [c+dc, r+dr];
    }
  }
  return [Math.round(HBM.hero.px), Math.round(HBM.hero.py)];
}
/* Chaque copie de K0RT3X vise une case différente : sans ça elles suivraient toutes le même
   plus court chemin et resteraient collées l'une à l'autre — increvables ET inintéressantes.
   L'ordre compte : la copie n° i de la plongée prend le cerveau n° i. */
const HBM_BRAINS=[
  // 0 — LE TRAQUEUR : droit sur le joueur, sans relâche. L'original.
  function(){ return [Math.round(HBM.hero.px), Math.round(HBM.hero.py)]; },
  // 1 — L'INTERCEPTEUR : vise 4 cases DEVANT le joueur pour lui couper la route
  function(){ const h=HBM.hero;
    return hbmNearestFree(Math.round(h.px)+h.face.x*4, Math.round(h.py)+h.face.y*4); },
  // 2 — LE GARDIEN : il patrouille SES clés (les plus proches de lui, pas du joueur).
  //     Viser la clé que le joueur convoite le rendait increvable : il campait en
  //     permanence sur la seule case utile. Là il tient une zone — on peut la contourner,
  //     puis revenir. S'il n'a plus de clé à garder à distance, il chasse.
  function(f){
    if(HBM.total-HBM.got>2){
      let best=null, bd=Infinity;
      for(const k of HBM.keys){ if(k.got) continue;
        const d=Math.abs(k.c-f.px)+Math.abs(k.r-f.py);
        if(d>2 && d<bd){ bd=d; best=k; } }
      if(best) return [best.c, best.r];
    }
    return [Math.round(HBM.hero.px), Math.round(HBM.hero.py)];
  },
  // 3 — LE RÔDEUR : traque de loin, mais file vers un coin dès qu'il colle au joueur.
  //     C'est lui qui rend la 4e copie supportable.
  function(f){
    const h=HBM.hero;
    if(Math.hypot(h.px-f.px, h.py-f.py)>6) return [Math.round(h.px), Math.round(h.py)];
    return HBM.spawns[(f.corner||0)%HBM.spawns.length];
  }
];
/* Une copie choisit sa route à chaque intersection : plus court chemin vers SA cible,
   jamais de demi-tour (sauf cul-de-sac), avec une part d'hésitation selon la difficulté.
   Pendant la débandade (une clé volée, ou une capture) elles gardent leur cible et leur
   cap habituels — seule leur vitesse chute (cf. le mul dans hbmLoop) : les faire refluer
   vers leur nid les amenait à osciller sans but dès qu'elles l'approchaient (le champ de
   distances est ~plat autour de la cible), ce qui les rendait erratiques ET trop faciles
   à semer. Ralentir sans changer de cap garde la pression tout en soufflant le joueur. */
function hbmChaseBrain(cx,cy,f){
  const target=HBM_BRAINS[f.brain%HBM_BRAINS.length](f);
  const dist=hbmDistField(target[0], target[1]);
  const opts=[];
  for(let k=0;k<4;k++){
    const v={x:[1,-1,0,0][k], y:[0,0,1,-1][k]};
    if(!hbmFree(cx+v.x, cy+v.y)) continue;
    const back=(f.dir.x||f.dir.y) && v.x===-f.dir.x && v.y===-f.dir.y;
    opts.push({v:v, back:back, d:dist[(cx+v.x)+(cy+v.y)*HBM.w]});
  }
  if(!opts.length){ f.dir={x:0,y:0}; return; }
  let pool=opts.filter(o=>!o.back); if(!pool.length) pool=opts;
  const pick=(Math.random()<HBM.wander) ? pool[Math.floor(Math.random()*pool.length)]
                                        : pool.sort((a,b)=>a.d-b.d)[0];
  f.dir={x:pick.v.x, y:pick.v.y};
}

/* ---------- boucle ---------- */
function hbmStart(cfg){
  const M=hbmParse(cfg.map);
  Object.assign(HBM,{
    grid:M.grid, w:M.w, h:M.h,
    keys: cfg.keys ? cfg.keys.map(k=>({c:k[0], r:k[1], got:false})) : M.keys,
    got:0,
    hero:hbmActor(cfg.heroAt[0], cfg.heroAt[1]),
    // chaque copie porte sa propre vitesse, son cerveau et son coin de repli
    foes:(cfg.foes||[]).map((o,i)=>{ const f=hbmActor(o.at[0], o.at[1]);
      f.brain=o.brain||0; f.speed=o.speed||3.5; f.corner=(o.corner!=null?o.corner:i); return f; }),
    homes:(cfg.foes||[]).map(o=>o.at.slice()),
    spawns: cfg.spawns||[cfg.heroAt],
    heroSpeed:cfg.heroSpeed||HBM_HERO_SPEED, wander:cfg.wander||0.15,
    onCatch:cfg.onCatch||null, onKey:cfg.onKey||null, onDone:cfg.onDone||null,
    onDir:cfg.onDir||null, onTick:cfg.onTick||null, onBlueKey:cfg.onBlueKey||null,
    freeze:cfg.freeze||0, invuln:0, scatter:0, time:0, last:0, lastDirName:'',
    running:true, paused:false, raf:0,
    board:cfg.board, cv:cfg.board&&cfg.board.querySelector('canvas')
  });
  HBM.total=HBM.keys.length;
  if(!HBM.cv) return;
  HBM.onResize=()=>hbmResize();
  window.addEventListener('resize', HBM.onResize);
  // le terrain se stabilise APRÈS l'insertion (barre d'aide, pavé ZQSD…) : on suit sa
  // taille réelle plutôt que de la mesurer une seule fois trop tôt
  if(window.ResizeObserver){ HBM.ro=new ResizeObserver(HBM.onResize); HBM.ro.observe(cfg.board); }
  hbmResize();
  HBM.raf=requestAnimationFrame(hbmLoop);
}
function hbmStopLoop(){ HBM.running=false; if(HBM.raf){ cancelAnimationFrame(HBM.raf); HBM.raf=0; } }
function hbmResumeLoop(){ if(!HBM.raf && HBM.cv){ HBM.running=true; HBM.last=0; HBM.raf=requestAnimationFrame(hbmLoop); } }
function hbmAddKeys(list){ list.forEach(k=>HBM.keys.push({c:k[0], r:k[1], got:false})); HBM.total=HBM.keys.length; }
/* Place n clés BLEUES sur des cases libres tirées au hasard (jamais sur un mur, une clé
   déjà posée, le nid d'une copie ou le départ du joueur), en gardant au moins minDist
   cases entre elles pour qu'elles ne se retrouvent pas collées. */
function hbmAddBlueKeys(n, minDist){
  const avoid=HBM.keys.map(k=>[k.c,k.r])
    .concat([[Math.round(HBM.hero.px),Math.round(HBM.hero.py)]])
    .concat(HBM.homes||[]);
  const free=[];
  for(let r=0;r<HBM.h;r++) for(let c=0;c<HBM.w;c++){
    if(HBM.grid[r][c]!==0) continue;
    if(avoid.some(([ac,ar])=>ac===c&&ar===r)) continue;
    free.push([c,r]);
  }
  const picks=[];
  let guard=0;
  while(picks.length<n && free.length && guard++<500){
    const idx=Math.floor(Math.random()*free.length), cand=free[idx];
    if(picks.some(p=>Math.hypot(p[0]-cand[0], p[1]-cand[1])<minDist)){ continue; }
    picks.push(cand); free.splice(idx,1);
  }
  picks.forEach(([c,r])=>HBM.keys.push({c,r,got:false,blue:true}));
  HBM.total=HBM.keys.length;
}
function hbmAddFoe(c,r,speed,wander,brain){
  const f=hbmActor(c,r); f.brain=brain||0; f.speed=speed; f.corner=HBM.foes.length;
  HBM.foes.push(f); HBM.homes.push([c,r]); HBM.wander=wander;
}
function hbmLoop(ts){
  if(!HBM.running){ HBM.raf=0; return; }
  if(!HBM.last) HBM.last=ts;
  let dt=(ts-HBM.last)/1000; HBM.last=ts;
  if(dt>0.05) dt=0.05;            // onglet en arrière-plan : pas de saut d'un bout à l'autre
  HBM.time+=dt;
  if(HBM.freeze>0) HBM.freeze-=dt;
  else {
    hbmMove(HBM.hero, HBM.heroSpeed*dt);
    // débandade : chaque clé volée déstabilise K0RT3X — ses copies ralentissent et refluent
    const mul=(HBM.scatter>0)?0.5:1;
    for(const f of HBM.foes) hbmMove(f, f.speed*mul*dt, hbmChaseBrain);
  }
  if(HBM.scatter>0) HBM.scatter-=dt;
  if(HBM.invuln>0) HBM.invuln-=dt;
  const h=HBM.hero;
  if(h.dir.x||h.dir.y){
    const nm=(h.dir.y<0?'z':h.dir.y>0?'s':h.dir.x<0?'q':'d');
    if(nm!==HBM.lastDirName){ HBM.lastDirName=nm; if(HBM.onDir) HBM.onDir(nm); }
  }
  hbmTrail(h); for(const f of HBM.foes) hbmTrail(f);
  hbmCollect();
  if(HBM.running && HBM.foes.length && HBM.invuln<=0 && HBM.freeze<=0) hbmCheckCatch();
  if(HBM.running && HBM.onTick) HBM.onTick(dt);
  hbmDraw(ts);
  if(!HBM.running){ HBM.raf=0; return; }
  HBM.raf=requestAnimationFrame(hbmLoop);
}
function hbmTrail(a){ a.trail.push({x:a.px, y:a.py}); if(a.trail.length>9) a.trail.shift(); }
function hbmCollect(){
  for(const k of HBM.keys){
    if(k.got) continue;
    if(Math.abs(HBM.hero.px-k.c)<0.45 && Math.abs(HBM.hero.py-k.r)<0.45){
      k.got=true; HBM.got++;
      // seules les clés BLEUES ralentissent les copies (cf. hbmAddBlueKeys) : les clés
      // normales ne sont plus qu'un objectif, sans effet sur la poursuite.
      if(k.blue){ beep('good'); HBM.scatter=HBM_SCATTER; if(HBM.onBlueKey) HBM.onBlueKey(); }
      else beep('good');
      if(HBM.onKey) HBM.onKey(HBM.got, HBM.total);
      // hors boucle : la suite peut relancer le moteur (étape 3 du tuto) sans doubler la rAF
      if(HBM.got>=HBM.total){ hbmStopLoop(); const cb=HBM.onDone; if(cb) setTimeout(cb,0); return; }
    }
  }
}
function hbmCheckCatch(){
  let touche=false;
  for(const f of HBM.foes){
    const dx=HBM.hero.px-f.px, dy=HBM.hero.py-f.py;
    if(dx*dx+dy*dy <= 0.62*0.62){ touche=true; break; }
  }
  if(!touche) return;
  HBM.invuln=1.9; HBM.freeze=0.85; HBM.scatter=HBM_REGROUP;
  const fl=document.getElementById('hbmFlash');
  if(fl){ fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on'); }
  playHackWarning();
  // réapparition au coin le plus « sûr » : celui dont la copie LA PLUS PROCHE est la plus loin
  const champs=HBM.foes.map(f=>hbmDistField(Math.round(f.px), Math.round(f.py)));
  let best=HBM.spawns[0], bd=-1;
  for(const s of HBM.spawns){
    const idx=s[0]+s[1]*HBM.w;
    let mn=Infinity; for(const d of champs) mn=Math.min(mn, d[idx]);
    if(mn>bd){ bd=mn; best=s; }
  }
  const hero=HBM.hero;
  hero.px=best[0]; hero.py=best[1]; hero.dir={x:0,y:0}; hero.want=null; hero.trail.length=0;
  HBM.foes.forEach((f,i)=>{ const home=HBM.homes[i]; if(!home) return;
    f.px=home[0]; f.py=home[1]; f.dir={x:0,y:0}; f.trail.length=0; });
  if(HBM.onCatch) HBM.onCatch();
}

/* ---------- rendu ---------- */
function hbmRRect(g,x,y,w,h,r){
  r=Math.min(r, w/2, h/2);
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);     g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function hbmResize(){
  const board=HBM.board, cv=HBM.cv; if(!board||!cv) return;
  const aw=board.clientWidth, ah=board.clientHeight;
  if(aw<20||ah<20) return;
  // 2 px de marge : la mesure du conteneur peut précéder son dernier recalcul de flex
  const cell=Math.max(10, Math.floor(Math.min((aw-2)/HBM.w, (ah-2)/HBM.h)));
  const dpr=Math.min(2, window.devicePixelRatio||1);
  if(HBM.cell===cell && HBM.dpr===dpr) return;   // rien n'a bougé : pas de redessin des murs
  HBM.cell=cell; HBM.cssW=cell*HBM.w; HBM.cssH=cell*HBM.h; HBM.dpr=dpr;
  cv.style.width=HBM.cssW+'px'; cv.style.height=HBM.cssH+'px';
  cv.width=Math.round(HBM.cssW*dpr); cv.height=Math.round(HBM.cssH*dpr);
  HBM.ctx=cv.getContext('2d');
  hbmRenderBg();
  hbmBuildKeySprite();
  hbmBuildFoeSprites();
  if(!HBM.raf) hbmDraw(performance.now());   // labyrinthe figé : on redessine quand même
}
/* Clés et poursuivants ont un halo (shadowBlur) recalculé à chaque frame — sur un PC sans
   carte graphique, ce flou coûte cher, et une plongée peut aligner jusqu'à 20 clés + 4
   poursuivants. On ne dessine ce halo qu'une fois, dans un petit canevas hors écran, puis
   on se contente d'un drawImage (simple copie de pixels) à chaque frame : même rendu, sans
   recalculer le flou 20+ fois par frame. */
/* deux teintes : dorée (clés normales, simple objectif) et bleue (HB_MAZE_BLUEKEYS,
   celles qui ralentissent les copies — cf. hbmCollect) — même forme, seule la couleur
   change, pour que le joueur les reconnaisse d'un coup d'œil. */
function hbmBuildKeySprite(){
  const S=HBM.cell, dpr=HBM.dpr, R=S*0.26, pad=S*0.8;
  const aX=R*0.55+pad, aY=R*1.07+pad, w=aX+R*0.55+pad, h=aY+R*1.2+pad;
  const draw=(spr,glow,stroke)=>{
    spr.width=Math.max(1,Math.round(w*dpr)); spr.height=Math.max(1,Math.round(h*dpr));
    spr.cssW=w; spr.cssH=h; spr.anchorX=aX; spr.anchorY=aY;
    const g=spr.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h); g.translate(aX,aY);
    g.shadowColor=glow; g.shadowBlur=S*0.58;
    g.strokeStyle=stroke; g.lineWidth=Math.max(1.4,S*0.08); g.lineCap='round';
    g.beginPath(); g.arc(0,-R*0.52,R*0.55,0,Math.PI*2); g.stroke();
    g.beginPath(); g.moveTo(0,0); g.lineTo(0,R*1.2); g.stroke();
    g.beginPath(); g.moveTo(0,R*0.6);  g.lineTo(R*0.55,R*0.6);  g.stroke();
    g.beginPath(); g.moveTo(0,R*1.15); g.lineTo(R*0.42,R*1.15); g.stroke();
  };
  draw(HBM.keySprite||(HBM.keySprite=document.createElement('canvas')), 'rgba(250,204,21,.95)', '#fde68a');
  draw(HBM.keySpriteBlue||(HBM.keySpriteBlue=document.createElement('canvas')), 'rgba(59,130,246,.95)', '#93c5fd');
}
/* même principe pour le corps lumineux des poursuivants : un sprite par teinte (+ 1 pour
   la débandade « fear »), le reste (anneaux, iris, pupille) reste dessiné en direct car
   ces traits n'utilisent pas shadowBlur et coûtent très peu. */
function hbmBuildFoeSprites(){
  const S=HBM.cell, dpr=HBM.dpr, pad=S*1.0;
  const variants=HBM_FOE_TINT.map((c,i)=>({key:i,c,R:S*0.40}))
    .concat([{key:'fear',c:HBM_FOE_FEAR,R:S*0.40*0.86}]);
  HBM.foeSprites={};
  variants.forEach(v=>{
    const R=v.R, w=R*2+pad*2, h=w;
    const spr=document.createElement('canvas');
    spr.width=Math.max(1,Math.round(w*dpr)); spr.height=Math.max(1,Math.round(h*dpr));
    spr.cssW=w; spr.cssH=h;
    const g=spr.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0); g.translate(w/2,h/2);
    g.shadowColor=v.c.glow; g.shadowBlur=S*0.7;
    const b=g.createRadialGradient(0,-R*0.2,R*0.08,0,0,R);
    b.addColorStop(0,v.c.body[0]); b.addColorStop(1,v.c.body[1]);
    g.fillStyle=b; g.beginPath(); g.arc(0,0,R,0,Math.PI*2); g.fill();
    HBM.foeSprites[v.key]=spr;
  });
}
/* les murs ne bougent jamais : on les dessine une fois dans un calque hors écran */
function hbmRenderBg(){
  const S=HBM.cell, dpr=HBM.dpr;
  const bg=HBM.bg||(HBM.bg=document.createElement('canvas'));
  bg.width=HBM.cv.width; bg.height=HBM.cv.height;
  const g=bg.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  const grd=g.createLinearGradient(0,0,0,HBM.cssH);
  grd.addColorStop(0,'#070d24'); grd.addColorStop(1,'#03060f');
  g.fillStyle=grd; g.fillRect(0,0,HBM.cssW,HBM.cssH);
  g.strokeStyle='rgba(34,211,238,.06)'; g.lineWidth=1;
  for(let c=0;c<=HBM.w;c++){ g.beginPath(); g.moveTo(c*S,0); g.lineTo(c*S,HBM.cssH); g.stroke(); }
  for(let r=0;r<=HBM.h;r++){ g.beginPath(); g.moveTo(0,r*S); g.lineTo(HBM.cssW,r*S); g.stroke(); }
  const pad=Math.max(1, S*0.10), rad=Math.max(2, S*0.24), lw=Math.max(1, S*0.055);
  for(let r=0;r<HBM.h;r++) for(let c=0;c<HBM.w;c++){
    if(HBM.grid[r][c]!==1) continue;
    const x=c*S+pad, y=r*S+pad, w=S-pad*2, h=S-pad*2;
    const edge=(r===0||c===0||r===HBM.h-1||c===HBM.w-1);
    const f=g.createLinearGradient(x,y,x,y+h);
    if(edge){ f.addColorStop(0,'#2e1361'); f.addColorStop(1,'#150730'); }
    else     { f.addColorStop(0,'#0b3a52'); f.addColorStop(1,'#05202f'); }
    g.fillStyle=f;
    g.shadowColor=edge?'rgba(168,85,247,.55)':'rgba(34,211,238,.5)'; g.shadowBlur=S*0.35;
    hbmRRect(g,x,y,w,h,rad); g.fill();
    g.shadowBlur=0;
    g.strokeStyle=edge?'rgba(192,132,252,.85)':'rgba(103,232,249,.8)'; g.lineWidth=lw;
    hbmRRect(g,x,y,w,h,rad); g.stroke();
  }
}
function hbmDraw(ts){
  const g=HBM.ctx, S=HBM.cell; if(!g||!S) return;
  const t=ts/1000;
  g.setTransform(HBM.dpr,0,0,HBM.dpr,0,0);
  g.clearRect(0,0,HBM.cssW,HBM.cssH);
  if(HBM.bg) g.drawImage(HBM.bg,0,0,HBM.cssW,HBM.cssH);
  HBM.keys.forEach((k,i)=>{ if(!k.got) hbmDrawKey(g,(k.c+.5)*S,(k.r+.5)*S,S,t+i*0.7,k.blue); });
  for(const f of HBM.foes) hbmDrawFoe(g,S,t,f);
  hbmDrawHero(g,S,t);
}
/* clé de chiffrement : elle clignote parce que K0RT3X la rafraîchit en boucle
   (halo pré-rendu dans HBM.keySprite/keySpriteBlue — cf. hbmBuildKeySprite — pour rester léger) */
function hbmDrawKey(g,x,y,S,t,blue){
  const spr=blue?HBM.keySpriteBlue:HBM.keySprite; if(!spr) return;
  const p=0.5+0.5*Math.sin(t*4.4);
  g.save();
  g.globalAlpha=0.35+0.65*p;
  g.drawImage(spr, x-spr.anchorX, y-spr.anchorY, spr.cssW, spr.cssH);
  g.restore();
}
/* le joueur : un petit programme-flèche cyan, avec sa traînée de données */
function hbmDrawHero(g,S,t){
  const h=HBM.hero, x=(h.px+.5)*S, y=(h.py+.5)*S;
  const blink=(HBM.invuln>0 && Math.floor(HBM.invuln*10)%2===0);
  g.save();
  h.trail.forEach((p,i)=>{
    const k=(i+1)/h.trail.length;
    g.globalAlpha=(blink?0.10:0.34)*k; g.fillStyle='#22d3ee';
    g.beginPath(); g.arc((p.x+.5)*S,(p.y+.5)*S, S*0.05+S*0.10*k, 0, Math.PI*2); g.fill();
  });
  g.restore();
  if(blink) return;
  const R=S*0.34;
  g.save(); g.translate(x,y); g.rotate(Math.atan2(h.face.y, h.face.x));
  g.shadowColor='rgba(34,211,238,.95)'; g.shadowBlur=S*0.5;
  const f=g.createLinearGradient(-R,0,R,0); f.addColorStop(0,'#0e7490'); f.addColorStop(1,'#a5f3fc');
  g.fillStyle=f; g.strokeStyle='#ecfeff'; g.lineWidth=Math.max(1, S*0.05);
  g.beginPath(); g.moveTo(R,0); g.lineTo(-R*0.72,R*0.78); g.lineTo(-R*0.32,0); g.lineTo(-R*0.72,-R*0.78);
  g.closePath(); g.fill(); g.stroke();
  g.shadowBlur=0;
  g.fillStyle='#fff'; g.beginPath(); g.arc(R*0.05,0,R*0.19,0,Math.PI*2); g.fill();
  g.restore();
}
/* Une teinte par cerveau : l'élève apprend à lire le comportement de chaque copie
   (rouge = te suit, orange = te coupe la route, magenta = garde les clés, indigo = rôde). */
const HBM_FOE_TINT=[
  {glow:'rgba(239,68,68,.95)',  ring:'rgba(248,113,113,.9)', body:['#7f1d1d','#1c0505'], iris:['#fecaca','#ef4444','#7f1d1d'], trail:'#ef4444'},
  {glow:'rgba(249,115,22,.95)', ring:'rgba(253,186,116,.9)', body:['#7c2d12','#1c0f05'], iris:['#fed7aa','#f97316','#7c2d12'], trail:'#f97316'},
  {glow:'rgba(217,70,239,.95)', ring:'rgba(240,171,252,.9)', body:['#701a75','#1a0520'], iris:['#f5d0fe','#d946ef','#701a75'], trail:'#d946ef'},
  {glow:'rgba(99,102,241,.95)', ring:'rgba(165,180,252,.9)', body:['#312e81','#0b0a24'], iris:['#e0e7ff','#6366f1','#312e81'], trail:'#6366f1'}
];
/* K0RT3X : son œil-machine, pupille toujours tournée vers le joueur */
/* pendant la débandade, toutes les copies virent au bleu pâle et « ferment l'œil » :
   le joueur doit voir d'un coup d'œil qu'il a le champ libre */
const HBM_FOE_FEAR={glow:'rgba(96,165,250,.9)', ring:'rgba(191,219,254,.85)',
  body:['#1e3a8a','#070f26'], iris:['#dbeafe','#60a5fa','#1e3a8a'], trail:'#60a5fa'};
function hbmDrawFoe(g,S,t,f){
  const fear=HBM.scatter>0;
  const c=fear?HBM_FOE_FEAR:HBM_FOE_TINT[(f.brain||0)%HBM_FOE_TINT.length];
  const x=(f.px+.5)*S, y=(f.py+.5)*S, R=S*0.40*(fear?0.86:1);
  g.save();
  f.trail.forEach((p,i)=>{
    const k=(i+1)/f.trail.length;
    g.globalAlpha=0.3*k; g.fillStyle=c.trail;
    g.beginPath(); g.arc((p.x+.5)*S,(p.y+.5)*S, R*0.55*k, 0, Math.PI*2); g.fill();
  });
  g.restore();
  g.save(); g.translate(x,y);
  const bspr=HBM.foeSprites && HBM.foeSprites[fear?'fear':(f.brain||0)];
  if(bspr) g.drawImage(bspr, -bspr.cssW/2, -bspr.cssH/2, bspr.cssW, bspr.cssH);
  g.strokeStyle=c.ring; g.lineWidth=Math.max(1, S*0.05);
  g.beginPath(); g.arc(0,0,R*0.94, t*2.4, t*2.4+Math.PI*0.85); g.stroke();
  g.beginPath(); g.arc(0,0,R*0.94, t*2.4+Math.PI, t*2.4+Math.PI*1.85); g.stroke();
  const pulse=0.9+0.1*Math.sin(t*6), ir=R*0.52*pulse;
  const gr=g.createRadialGradient(0,0,R*0.04,0,0,ir);
  gr.addColorStop(0,c.iris[0]); gr.addColorStop(.42,c.iris[1]); gr.addColorStop(1,c.iris[2]);
  g.fillStyle=gr; g.beginPath(); g.arc(0,0,ir,0,Math.PI*2); g.fill();
  // en fuite la pupille se détourne du joueur au lieu de le fixer
  const dx=HBM.hero.px-f.px, dy=HBM.hero.py-f.py, len=Math.hypot(dx,dy)||1, s=fear?-1:1;
  g.translate(s*dx/len*R*0.15, s*dy/len*R*0.15); g.scale(0.5,1);
  g.fillStyle=fear?'#0b1733':'#120202'; g.beginPath(); g.arc(0,0,R*0.30,0,Math.PI*2); g.fill();
  g.restore();
}
