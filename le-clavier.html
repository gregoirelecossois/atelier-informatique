<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le clavier — Atelier informatique</title>
<!-- Polices de texte servies EN LOCAL (cf. assets/fonts/README.md). Surtout ne pas
     revenir au CDN Google : chaque chargement enverrait l'adresse IP de l'élève chez
     un tiers hors UE, sans base légale. -->
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  /* Police d'emojis unifiée sur tous les systèmes (cf. assets/fonts/README.md) */
  @font-face{
    font-family:"Fluent Emoji";
    src:url("assets/fonts/fluent-emoji.woff2") format("woff2");
    font-display:swap;
  }
  :root{
    --ink:#22303f; --muted:#5a6b7b;
    --blue:#2563eb; --blue-d:#1d4ed8;
    --amber:#f59e0b; --amber-d:#b45309;
    --green:#16a34a; --green-d:#15803d;
    --red:#ef4444; --red-d:#b91c1c;
    --paper:#ffffff; --line:#d7e0ea; --line-2:#e7eef6;
    --shell:#e9eff7; --canvas:#dde6f1; --sky:#eaf3ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Nunito",system-ui,"Fluent Emoji",sans-serif;color:var(--ink);
    background:var(--shell);height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    padding-bottom:58px;
  }
  /* ===== Fenêtre principale toujours visible sans défilement =====
     Page bloquée à la hauteur de l'écran : les barres (haut, progression, consigne,
     actions) gardent leur taille naturelle et la ZONE DE JEU CENTRALE remplit tout
     l'espace restant (flex-grow, base 0) — elle reste la plus grande possible.
     Sur écran peu haut, on compacte les barres pour donner encore plus au centre.
     Le padding-bas réserve la bande du bouton flottant « Mode dyslexique ». */
  .topbar,.progress-wrap,.banner{flex:0 0 auto;}
  .stage-wrap{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;}
  #stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  #stage>.hud{flex:0 0 auto;}
  #stage>.field,#stage>.type-area{flex:1 1 auto;min-height:220px;}
  /* boss (dragon) en mode NORMAL uniquement : la chaîne remplit la hauteur.
     En PLEIN ÉCRAN on ne touche à rien (dimensionnement propre + transform:scale),
     d'où :not(:fullscreen) — sinon texte manquant / sprites tronqués. */
  #stage .boss-fs-wrap:not(:fullscreen),
  #stage .boss-fs-wrap:not(:fullscreen) .boss-scaler{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  #stage .boss-fs-wrap:not(:fullscreen) .boss-scaler>.hud{flex:0 0 auto;}
  #stage .boss-fs-wrap:not(:fullscreen) .bossfield{flex:1 1 auto;min-height:300px;}
  @media (max-height:860px){
    body>.topbar{padding-top:6px;padding-bottom:6px;}
    body>.progress-wrap{padding-top:5px;padding-bottom:8px;}
    body>.banner{margin-top:7px;padding-top:8px;padding-bottom:9px;}
    body>.stage-wrap{margin-top:7px;margin-bottom:7px;}  }
  @media (max-height:680px){
    body>.banner{font-size:.92rem;}
    body>.banner .b-emoji{font-size:1.4rem;}
  }
  button{font-family:inherit;cursor:pointer;}
  .display{font-family:"Fredoka","Fluent Emoji",sans-serif;}
  kbd{
    display:inline-flex;align-items:center;justify-content:center;min-width:24px;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:.86em;line-height:1;
    padding:4px 8px;border-radius:7px;background:#fff;border:2px solid #c7d4e6;
    border-bottom-width:3px;color:var(--ink);box-shadow:0 1px 0 #e7eef6;margin:0 1px;white-space:nowrap;}

  /* ---------- Top bar ---------- */
  .topbar{background:#fff;border-bottom:2px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;}
  .back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--blue-d);
    font-weight:800;font-size:.98rem;padding:8px 12px;border-radius:10px;}
  .back:hover{background:#eef4ff;}
  .topbar h1{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.15rem;margin:0;flex:1;}
  .topbar h1 .dot{color:var(--blue);}
  .step-count{font-weight:800;color:var(--muted);font-size:.95rem;}
  .reset-btn{border:2px solid var(--line);background:#fff;color:var(--muted);font-weight:700;
    border-radius:10px;padding:7px 11px;font-size:.85rem;}
  .reset-btn:hover{border-color:var(--blue);color:var(--blue-d);}
  .reset-btn.danger:hover{border-color:var(--red);color:var(--red-d);}

  /* ---------- Progress ---------- */
  .progress-wrap{background:#fff;padding:8px 18px 14px;border-bottom:2px solid var(--line);}
  .track{display:flex;gap:6px;align-items:center;max-width:1000px;margin:0 auto;}
  .seg{position:relative;flex:1;height:14px;border-radius:8px;background:var(--line-2);}
  .seg.done{background:var(--green);}
  .seg.current{background:var(--blue);box-shadow:0 0 0 3px #bcd2ff;}
  .seg.milestone{height:20px;display:flex;align-items:center;justify-content:center;font-size:1rem;background:#fdebc4;}
  .seg.milestone.done{background:#facc15;}
  .seg.milestone.current{background:var(--amber);box-shadow:0 0 0 3px #fde2a8;}
  .seg.clickable{cursor:pointer;transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;}
  .seg.clickable:hover{filter:brightness(1.07);transform:translateY(-2px);}
  .seg.clickable.done:hover{box-shadow:0 0 0 3px #b9eccd;}

  /* ---------- Mission banner ---------- */
  .banner{max-width:1000px;margin:12px auto 0;width:calc(100% - 36px);
    background:#fff;border:2px solid var(--line);border-left:7px solid var(--blue);
    border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .banner.test{border-left-color:var(--amber);}
  .banner.review{border-left-color:var(--green);}
  .banner .b-emoji{font-size:1.8rem;line-height:1;}
  .banner .b-txt{flex:1;min-width:200px;}
  .banner .b-title{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.08rem;}
  .banner .b-sub{color:#3a4a59;font-weight:700;font-size:1rem;margin-top:4px;line-height:1.45;}
  .banner .b-goal-label{font-weight:800;color:var(--blue-d);margin-right:3px;}
  .banner.test .b-goal-label{color:var(--amber-d);}
  .banner .b-btn{border:2px solid var(--line);background:#f5f9ff;color:var(--blue-d);font-weight:800;
    border-radius:10px;padding:8px 13px;font-size:.9rem;white-space:nowrap;}
  .banner .b-btn:hover{border-color:var(--blue);}
  .banner .b-btn.ghost{background:#fff;color:var(--muted);}

  /* ---------- Stage (game area) ---------- */
  .stage-wrap{max-width:1000px;margin:12px auto;width:calc(100% - 36px);
    background:#fff;border:2px solid var(--line);border-radius:16px;
    box-shadow:0 18px 40px -28px rgba(34,48,63,.5);}
  .hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;
    background:linear-gradient(#fbfcfe,#eef3fa);border-bottom:2px solid var(--line);}
  .hud .lives{display:inline-block;font-size:1.15rem;letter-spacing:2px;}
  .hud .lives .lost{filter:grayscale(1);opacity:.35;}
  .hud .lives.many{font-size:.95rem;letter-spacing:0;}   /* boss K0RT3X : jusqu'à 10 connexions */
  .hud .lives.hit{animation:livesHit .4s;}
  @keyframes livesHit{0%,100%{transform:none;}25%{transform:translateX(-4px) scale(1.09);}75%{transform:translateX(4px);}}
  .hud .meter{flex:1;min-width:140px;height:14px;background:#e2e8f0;border-radius:8px;overflow:hidden;}
  .hud .meter > i{display:block;height:100%;width:0;background:var(--green);border-radius:8px;transition:width .2s ease;}
  .hud .count{font-weight:800;color:var(--muted);font-size:.95rem;white-space:nowrap;}
  .tip-pill{display:inline-flex;align-items:center;gap:6px;background:#fff6e6;border:2px solid #f6d68a;
    color:#7a5300;border-radius:999px;padding:6px 14px;font-family:inherit;font-weight:800;font-size:.92rem;
    cursor:pointer;line-height:1;transition:transform .12s ease,background .15s ease;}
  .tip-pill:hover{background:#ffedcc;transform:translateY(-1px);}
  .tip-pill:active{transform:translateY(0);}
  .tip-char{font-family:"Fredoka","Fluent Emoji",sans-serif;font-size:2.4rem;margin:2px 0 2px;line-height:1;}
  .tip-cap{font-weight:800;color:var(--ink);font-size:1.05rem;margin:0 0 4px;}
  .tip-cap kbd, .tip-char kbd{vertical-align:middle;}

  /* parachute field */
  .field{position:relative;height:clamp(240px,44vh,540px);overflow:hidden;
    background:linear-gradient(#eaf3ff,#dbeafe 78%,#cfe6d6 78%,#bfe0c7);}
  .field.shake{animation:fieldShake .25s;}
  @keyframes fieldShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .ground{position:absolute;left:0;right:0;bottom:0;height:22%;
    background:repeating-linear-gradient(90deg,#bfe0c7 0 22px,#b6dabd 22px 44px);
    border-top:3px dashed #7bbf8c;}
  .drop{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;
    will-change:transform;}
  .drop .para{font-size:1.5rem;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15));}
  .drop .cap{margin-top:-6px;min-width:46px;height:46px;display:flex;align-items:center;justify-content:center;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.5rem;color:var(--ink);
    background:#fff;border:3px solid var(--blue);border-radius:12px;box-shadow:0 4px 0 #c7d4e6;}
  .drop.sym .cap{border-color:var(--amber);color:var(--amber-d);}
  .drop.pop .cap{animation:dropPop .25s ease forwards;}
  @keyframes dropPop{to{transform:scale(1.5);opacity:0;}}
  .drop.miss .cap{border-color:var(--red);color:var(--red-d);animation:dropMiss .3s ease forwards;}
  @keyframes dropMiss{to{transform:translateY(14px) scale(.6);opacity:0;}}

  /* burst particles */
  .drop-burst{position:absolute;pointer-events:none;z-index:20;}
  .spark{
    position:absolute;width:8px;height:8px;border-radius:50%;
    top:0;left:0;transform:translate(-50%,-50%);
    animation:sparkFly .45s ease-out forwards;
  }
  @keyframes sparkFly{
    0%{transform:translate(-50%,-50%) scale(1);opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0;}
  }

  /* dactylo text */
  .type-area{padding:26px 26px 30px;background:#fbfdff;}
  .type-text{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:500;font-size:clamp(1.15rem,2.8vw,1.7rem);
    line-height:1.9;letter-spacing:.5px;color:#c2ccd8;max-width:780px;margin:0 auto;
    text-align:center;word-spacing:2px;}
  /* chaque mot reste insécable, la coupure ne se fait qu'entre les mots */
  .type-text .word{display:inline-block;white-space:nowrap;vertical-align:top;}
  .type-text .tc.sp{white-space:pre-wrap;}
  .type-text .tc{position:relative;border-radius:4px;padding:1px 0;transition:color .08s,background .08s;}
  .type-text .tc.done{color:var(--green-d);}
  .type-text .tc.cur{color:var(--ink);background:#dbeafe;box-shadow:0 0 0 2px var(--blue);}
  .type-text .tc.cur.sp{background:#bcd4ff;}
  .type-text .tc.bad{animation:tcBad .3s;}
  @keyframes tcBad{0%,100%{background:transparent;}40%{background:#ffd0d0;}}
  /* Poursuite du niveau 7 : la « vague » est l'effacement de K0RT3X (violet/indigo),
     choisi pour contraster avec le repère vert du joueur et rester distinct du rouge
     de son œil et de l'orange de sa barre de riposte au combat de boss.
     Noms de classes historiques (lava/fire/scorch) conservés : seul l'habillage change. */
  .type-text .tc.scorch{background:#ede9fe;color:#5b21b6;}
  .type-text .tc.lavahead{background:#a855f7;color:#fff;box-shadow:0 0 12px 2px rgba(168,85,247,.6);}
  .lava-row{max-width:780px;margin:20px auto 0;height:18px;border-radius:9px;background:#e2e8f0;position:relative;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);}
  .lava-row > .fire{position:absolute;top:0;bottom:0;left:0;width:0;
    background:repeating-linear-gradient(45deg,#a855f7 0 8px,#6366f1 8px 16px);
    transition:width .12s linear;box-shadow:0 0 12px 3px rgba(139,92,246,.55);}
  .lava-row > .me{position:absolute;top:-3px;bottom:-3px;width:6px;left:0;background:var(--green);
    border-radius:4px;transform:translateX(-50%);transition:left .12s linear;z-index:2;
    box-shadow:0 0 0 2px #fff,0 0 7px rgba(22,163,74,.7);}
  .type-stats{max-width:780px;margin:14px auto 0;display:flex;gap:18px;color:var(--muted);font-weight:800;font-size:.95rem;}

  /* ---------- Action bar ---------- */
  /* Barre d'actions FIXÉE dans la bande du bas, centrée entre « Mode Dys »
     (bas gauche) et « Dev » (bas droite) : elle ne prend plus de hauteur dans
     le flux, ce qui agrandit d'autant la fenêtre centrale. */
  .actions{position:fixed;left:50%;bottom:11px;transform:translateX(-50%);z-index:80;
    margin:0;display:flex;gap:9px;justify-content:center;flex-wrap:nowrap;}
  .btn{border:none;border-radius:11px;padding:9px 15px;font-weight:800;font-size:.94rem;display:inline-flex;align-items:center;gap:7px;}
  .btn:active{transform:translateY(1px);}
  .btn-hint{background:#fff;color:var(--amber-d);border:2px solid var(--amber);}
  .btn-hint:hover{background:#fff8ec;}
  .btn-restart{background:#fff;color:var(--muted);border:2px solid var(--line);}
  .btn-restart:hover{border-color:var(--blue);color:var(--blue-d);}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,30,42,.55);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:18px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:22px;max-width:560px;width:100%;padding:22px 26px 20px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.6);animation:pop .22s ease;max-height:92vh;overflow:auto;}
  @keyframes pop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .m-emoji{font-size:2.5rem;line-height:1;display:block;margin-bottom:4px;}
  .modal h2{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.45rem;margin:0 0 9px;}
  .modal p{font-size:1.03rem;line-height:1.55;margin:0 0 12px;color:var(--ink);}
  .modal .kicker{font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:.78rem;color:var(--blue-d);}
  .modal.test-modal .kicker{color:var(--amber-d);}
  .howto{background:#f4f8ff;border:2px solid #dbe7ff;border-radius:14px;padding:13px 15px;margin:0 0 14px;}
  .howto .h-head{font-weight:800;margin:0 0 6px;color:var(--blue-d);}
  .howto p{margin:0;font-size:1rem;line-height:1.6;}
  .howto.test{background:#fffaf0;border-color:#fbe2b0;}
  .howto.test .h-head{color:var(--amber-d);}
  .legend{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr;gap:7px;}
  .legend li{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.97rem;}
  .legend .lg-ch{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.25rem;min-width:30px;text-align:center;color:var(--amber-d);}
  .modal .m-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px;
    position:sticky;bottom:0;background:#fff;padding-top:10px;border-top:1px solid var(--line-2);}
  .m-btn{border:none;border-radius:13px;padding:13px 22px;font-weight:800;font-size:1.05rem;}
  .m-btn.primary{background:var(--blue);color:#fff;}
  .m-btn.primary:hover{background:var(--blue-d);}
  .m-btn.primary.test{background:var(--amber);}
  .m-btn.primary.test:hover{background:var(--amber-d);}
  .m-btn.primary.green{background:var(--green);}
  .m-btn.primary.green:hover{background:var(--green-d);}
  .m-btn.ghost{background:#eef2f7;color:var(--muted);}
  .m-btn.ghost:hover{background:#e2e8f0;}
  .modal.good{border-top:8px solid var(--green);}
  .modal.bad{border-top:8px solid var(--red);}
  .modal.warn{border-top:8px solid var(--amber);}

  .newtools{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .newtools li{display:flex;align-items:center;gap:9px;background:#f4f8ff;border:2px solid #dbe7ff;
    border-radius:12px;padding:9px 11px;font-weight:700;font-size:.95rem;color:var(--ink);}
  .newtools li.wide{grid-column:1 / -1;}
  .ni-glyph{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:30px;
    background:#fff;border:2px solid #c7d8f2;border-radius:8px;font-weight:800;color:var(--blue-d);flex:0 0 auto;font-size:.9rem;}

  /* level selector */
  .lvl-grid{display:grid;gap:10px;margin:6px 0 18px;}
  .lvl-card{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;
    text-align:left;border:2px solid var(--line);background:#fbfdff;border-radius:14px;padding:13px 16px;color:var(--ink);}
  .lvl-card .lc-badge{grid-row:1 / span 2;font-size:1.5rem;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    background:#eef4ff;border-radius:12px;}
  .lvl-card .lc-n{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.02rem;}
  .lvl-card .lc-t{color:var(--muted);font-weight:700;font-size:.88rem;}
  .lvl-card:not(.locked):hover{border-color:var(--blue);background:#f1f6ff;transform:translateY(-2px);}
  .lvl-card.current{border-color:var(--green);background:#f1fbf4;}
  .lvl-card.current .lc-badge{background:#d8f5e3;}
  .lvl-card.locked{opacity:.6;cursor:not-allowed;filter:grayscale(.3);}

  /* ---------- Mini clavier (pédagogie) ---------- */
  .kbd-board{margin:6px auto 14px;max-width:480px;background:#eef3fa;border:2px solid var(--line);
    border-radius:12px;padding:8px;user-select:none;}
  .kbd-row{display:flex;gap:4px;margin:4px 0;justify-content:center;}
  .key{flex:1;min-width:0;height:34px;border-radius:7px;background:#fff;border:2px solid #d4ddea;border-bottom-width:3px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;color:#46586b;position:relative;}
  .key .sub{font-size:.6rem;color:#9aa8b8;line-height:1;}
  .key.wide{flex:2.4;font-size:.72rem;}
  .key.space{flex:6;}
  .key.hl{background:#dbeafe;border-color:var(--blue);color:var(--blue-d);box-shadow:0 0 0 2px #bcd2ff;}
  .key.modhl{background:#fef3c7;border-color:var(--amber);color:var(--amber-d);box-shadow:0 0 0 2px #fde2a8;}

  /* ---------- toast / confetti ---------- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;
    opacity:0;transition:.25s;z-index:120;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:140;overflow:hidden;}
  .confetti i{position:absolute;top:-10px;width:10px;height:14px;opacity:.9;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}

  /* ---------- Animation cadenas (déblocage) ---------- */
  .lock-stage{position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;
    background:rgba(14,22,34,.82);backdrop-filter:blur(5px);transition:opacity .4s;}
  .lock-stage.fade{opacity:0;}
  .lock-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lock-emoji{position:relative;z-index:2;font-size:6.5rem;line-height:1;
    filter:drop-shadow(0 0 18px rgba(255,220,60,.6)) drop-shadow(0 14px 24px rgba(0,0,0,.5));}
  .lock-glow{position:absolute;left:50%;top:44%;width:220px;height:220px;margin:-110px 0 0 -110px;
    border-radius:50%;background:radial-gradient(circle,rgba(255,230,80,.85) 0%,rgba(255,140,30,.5) 40%,transparent 70%);
    opacity:0;pointer-events:none;z-index:1;transform:scale(0);}
  .lock-glow.go{animation:lockGlow .95s ease-out forwards;}
  @keyframes lockGlow{0%{opacity:0;transform:scale(.2);}25%{opacity:1;}100%{opacity:0;transform:scale(3.5);}}
  .lock-burst{position:absolute;left:50%;top:44%;width:90px;height:90px;margin:-45px 0 0 -45px;
    border-radius:50%;border:6px solid rgba(255,215,80,.95);opacity:0;pointer-events:none;z-index:3;}
  .lock-burst.lb2{width:130px;height:130px;margin:-65px 0 0 -65px;border-color:rgba(255,140,40,.8);border-width:5px;}
  .lock-burst.go{animation:lockBurst .95s ease-out forwards;}
  .lock-burst.lb2.go{animation:lockBurst 1s .18s ease-out forwards;}
  @keyframes lockBurst{0%{opacity:.95;transform:scale(.15);}100%{opacity:0;transform:scale(7.5);}}
  .lock-cap{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.5rem;color:#fff;
    background:var(--amber);padding:6px 20px;border-radius:999px;box-shadow:0 8px 20px -8px rgba(0,0,0,.6);}
  @keyframes lockIn{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes lockShake{0%,100%{transform:rotate(0) translateX(0);}22%{transform:rotate(-12deg) translateX(-8px);}
    44%{transform:rotate(10deg) translateX(8px);}66%{transform:rotate(-8deg) translateX(-5px);}88%{transform:rotate(7deg) translateX(5px);}}
  @keyframes lockPop{0%{transform:scale(1);}40%{transform:scale(1.45) rotate(-8deg);}100%{transform:scale(1.12) rotate(0);}}
  .lock-star{position:absolute;left:calc(50% - 5px);top:calc(50% - 5px);width:10px;height:10px;
    pointer-events:none;z-index:4;animation:starFly var(--dur,.7s) var(--delay,0ms) ease-out forwards;}
  @keyframes starFly{0%{opacity:1;transform:rotate(var(--angle,0deg)) translateX(6px) scale(1.4);}
    70%{opacity:.85;}100%{opacity:0;transform:rotate(var(--angle,0deg)) translateX(140px) scale(.1);}}

  /* ---------- Combat de Boss ---------- */
  .field.bossfield{background:radial-gradient(120% 80% at 50% 0%,#3b1d5e 0%,#241043 55%,#160a2e 100%);}
  .boss-top{position:absolute;top:12px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:7px;z-index:3;pointer-events:none;}
  .boss-name{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;color:#ffe9c2;letter-spacing:.03em;font-size:1rem;
    text-shadow:0 2px 7px rgba(0,0,0,.7),0 0 12px rgba(255,120,60,.5);}
  .boss-hpbar{width:min(440px,72vw);height:16px;border-radius:9px;background:rgba(0,0,0,.45);
    border:2px solid #ffd76a;overflow:hidden;box-shadow:0 0 16px rgba(255,90,60,.5);}
  .boss-hpbar > i{display:block;height:100%;width:100%;border-radius:9px;
    background:linear-gradient(90deg,#ef4444,#f59e0b);transition:width .3s ease;box-shadow:0 0 10px rgba(255,120,60,.7) inset;}
  .boss-sprite{font-size:4.6rem;line-height:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));
    animation:bossPulse 2.4s ease-in-out infinite;}
  @keyframes bossPulse{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-7px) scale(1.05);}}
  .boss-sprite.hurt{animation:bossHurt .45s;}
  @keyframes bossHurt{0%,100%{transform:scale(1);filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));}
    30%{transform:scale(1.14) rotate(-7deg);filter:brightness(2.6) sepia(1) saturate(7) hue-rotate(-25deg) drop-shadow(0 0 20px #ff5a5a);}
    65%{transform:scale(.92) rotate(6deg);}}
  .boss-sprite.exhausted{animation:bossTired 1.4s ease-in-out infinite;filter:grayscale(.5) brightness(.85) drop-shadow(0 8px 16px rgba(0,0,0,.6));}
  @keyframes bossTired{0%,100%{transform:rotate(-8deg) translateY(3px);}50%{transform:rotate(7deg) translateY(7px);}}
  .boss-sprite.dead{animation:bossDie 1.1s ease forwards;}
  @keyframes bossDie{0%{transform:scale(1) rotate(0);opacity:1;}35%{transform:scale(1.3) rotate(18deg);filter:brightness(2.4);}
    100%{transform:scale(.1) rotate(240deg);opacity:0;}}
  .boss-sweat{position:absolute;top:-4px;right:-12px;font-size:1.5rem;animation:sweatBob 1s infinite;}
  @keyframes sweatBob{0%,100%{transform:translateY(0);opacity:.95;}50%{transform:translateY(6px);opacity:.4;}}

  .hero{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:2.9rem;line-height:1;z-index:4;
    transition:left .18s ease,bottom .35s ease;filter:drop-shadow(0 4px 9px rgba(0,0,0,.55));}
  /* phase de vulnérabilité (boss essaim) : le vaisseau avance vers le Vaisseau-Mère */
  .hero.vuln{bottom:110px;}
  .hero.hit{animation:heroHit .4s;}
  @keyframes heroHit{0%,100%{transform:translateX(-50%);}
    25%{transform:translateX(calc(-50% - 9px)) rotate(-9deg);filter:brightness(.6) sepia(1) saturate(5) hue-rotate(-30deg);}
    75%{transform:translateX(calc(-50% + 9px)) rotate(9deg);}}

  .spell{position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;will-change:transform;z-index:6;}
  .spell .orb{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.5rem;color:#fff;
    background:radial-gradient(circle at 35% 28%,#c4b5fd,#7c3aed 58%,#4c1d95);
    border:2px solid #ede9fe;box-shadow:0 0 16px 3px rgba(167,139,250,.8);animation:orbGlow 1.3s ease-in-out infinite;}
  @keyframes orbGlow{0%,100%{box-shadow:0 0 14px 2px rgba(167,139,250,.7);}50%{box-shadow:0 0 22px 5px rgba(196,181,253,.95);}}
  .spell.pop .orb{animation:spellPop .25s ease forwards;}
  @keyframes spellPop{to{transform:scale(1.6);opacity:0;}}

  .atk-target{position:absolute;z-index:20;display:flex;align-items:center;justify-content:center;animation:tgtIn .3s ease both;}
  .atk-target .cap{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.7rem;color:#7c2d12;background:#fff;
    border:3px solid #f59e0b;box-shadow:0 0 18px 4px rgba(245,158,11,.75);animation:tgtFloat 1.5s ease-in-out infinite;}
  @keyframes tgtFloat{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-9px) rotate(4deg);}}
  @keyframes tgtIn{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
  .atk-target.hit .cap{animation:tgtHit .25s ease forwards;}
  @keyframes tgtHit{to{transform:scale(1.7);opacity:0;}}
  .dmg-float{position:absolute;z-index:25;font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.6rem;color:#fde047;
    text-shadow:0 2px 7px rgba(0,0,0,.7);pointer-events:none;animation:dmgUp .8s ease forwards;}
  @keyframes dmgUp{0%{transform:translate(-50%,0) scale(.6);opacity:0;}20%{opacity:1;transform:translate(-50%,-8px) scale(1.2);}
    100%{transform:translate(-50%,-48px) scale(1);opacity:0;}}

  /* ---- impact sur le bouclier d'énergie du boss (coup absorbé, pas de dégât réel) ---- */
  .shield-ring{position:absolute;width:70px;height:70px;border-radius:50%;pointer-events:none;z-index:22;
    border:3px solid rgba(125,211,252,.95);box-shadow:0 0 18px 6px rgba(56,189,248,.65),inset 0 0 14px 2px rgba(224,242,254,.6);
    animation:shieldRingPop .45s ease-out forwards;}
  @keyframes shieldRingPop{0%{transform:translate(-50%,-50%) scale(.3);opacity:1;}100%{transform:translate(-50%,-50%) scale(1.7);opacity:0;}}
  .shield-spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:22;
    background:#e0f2fe;box-shadow:0 0 8px 2px rgba(125,211,252,.95);animation:shieldSparkFly .4s ease-out forwards;}
  @keyframes shieldSparkFly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0;}}

  /* ---- dégât réel infligé au boss (bouclier percé) ---- */
  .dmg-flash{position:absolute;inset:0;z-index:21;pointer-events:none;
    background:radial-gradient(circle at 50% 32%,rgba(239,68,68,.45),rgba(239,68,68,0) 60%);
    animation:dmgFlashFade .3s ease forwards;}
  @keyframes dmgFlashFade{0%{opacity:1;}100%{opacity:0;}}
  .dmg-crack{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:23;
    background:#fb923c;box-shadow:0 0 10px 3px rgba(251,146,60,.9);animation:dmgCrackFly .45s ease-out forwards;}
  @keyframes dmgCrackFly{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0;}}

  .attack-banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:30;background:radial-gradient(circle,rgba(239,68,68,.28),rgba(20,8,30,.5));pointer-events:none;padding:16px;text-align:center;}
  .attack-title{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:clamp(1.7rem,6vw,3.2rem);color:#fff;
    text-shadow:0 0 20px #ff5a5a,0 4px 0 #b91c1c,0 9px 24px rgba(0,0,0,.55);
    animation:atkTitle .5s ease both,atkPulse .6s .5s ease-in-out infinite;}
  @keyframes atkTitle{0%{transform:scale(.2) rotate(-12deg);opacity:0;}60%{transform:scale(1.18) rotate(4deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
  @keyframes atkPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .attack-sub{margin-top:10px;font-weight:800;color:#ffe9b0;font-size:1.05rem;text-shadow:0 2px 7px rgba(0,0,0,.7);animation:atkTitle .5s .15s both;}
  .attack-flash{position:absolute;inset:0;background:#fff;z-index:31;pointer-events:none;animation:atkFlash .5s ease forwards;}
  @keyframes atkFlash{0%{opacity:.85;}100%{opacity:0;}}

  /* ---------- Invasion spatiale (Niveaux 3 & 4) ---------- */
  .field.invaders{
    background:
      radial-gradient(1.5px 1.5px at 12% 22%,#fff 100%,transparent 100%),
      radial-gradient(1.5px 1.5px at 78% 8%,#fff 100%,transparent 100%),
      radial-gradient(1px 1px at 45% 38%,#cde3ff 100%,transparent 100%),
      radial-gradient(1.5px 1.5px at 88% 62%,#fff 100%,transparent 100%),
      radial-gradient(1px 1px at 25% 70%,#cde3ff 100%,transparent 100%),
      radial-gradient(1.5px 1.5px at 62% 85%,#fff 100%,transparent 100%),
      radial-gradient(1px 1px at 6% 55%,#fff 100%,transparent 100%),
      radial-gradient(1.5px 1.5px at 95% 30%,#cde3ff 100%,transparent 100%),
      linear-gradient(#0b1330,#171049 55%,#1c0f3d);
    background-repeat:repeat; background-size:220px 220px;
    animation:starDrift 14s linear infinite;
  }
  @keyframes starDrift{from{background-position:0 0;}to{background-position:0 220px;}}
  .ship{position:absolute;bottom:8px;left:50%;transform:translateX(-50%) rotate(-45deg);font-size:2.7rem;line-height:1;z-index:5;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));}
  .ship.hit{animation:shipHit .4s;}
  @keyframes shipHit{0%,100%{transform:translateX(-50%) rotate(-45deg);}
    25%{transform:translateX(calc(-50% - 9px)) rotate(-54deg);filter:brightness(.6) sepia(1) saturate(5) hue-rotate(-30deg);}
    75%{transform:translateX(calc(-50% + 9px)) rotate(-36deg);}}
  .ship.boost1{filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(56,189,248,.65));}
  .ship.boost2{filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(56,189,248,.95)) drop-shadow(0 0 26px rgba(167,139,250,.7));}
  .invader{position:absolute;top:0;left:0;display:flex;flex-direction:column;align-items:center;will-change:transform;z-index:6;}
  .invader .ufo{font-size:1.6rem;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));position:relative;}
  .invader .cap{margin-top:-4px;min-width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.35rem;color:#e6f0ff;
    background:linear-gradient(#132057,#0c1638);border:2px solid #38bdf8;border-radius:11px;
    box-shadow:0 0 12px 2px rgba(56,189,248,.55);}
  .invader.pop .cap{animation:dropPop .25s ease forwards;}
  .invader.miss .cap{animation:dropMiss .3s ease forwards;border-color:var(--red);}
  .invader.big{z-index:8;}
  .invader.big .ufo{font-size:3rem;}
  .invader.big .ufo::before{content:'👑';position:absolute;top:-16px;right:-10px;font-size:1.3rem;
    animation:crownBob 1.1s ease-in-out infinite;}
  @keyframes crownBob{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-3px) rotate(6deg);}}
  .invader.big .cap-ring{position:absolute;inset:-10px;border-radius:50%;
    box-shadow:0 0 0 3px rgba(239,68,68,.6),0 0 22px 6px rgba(239,68,68,.55);
    animation:bigRing 1.3s ease-in-out infinite;pointer-events:none;}
  @keyframes bigRing{0%,100%{transform:scale(1);opacity:.75;}50%{transform:scale(1.12);opacity:1;}}
  .mb-seq{display:flex;gap:6px;margin-top:8px;}
  .mbc{min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.02rem;color:#e6f0ff;
    background:#132057;border:2px solid #4c5a86;}
  .mbc.done{background:#12331f;border-color:var(--green);color:#86efac;opacity:.75;}
  .mbc.current{border-color:#facc15;box-shadow:0 0 12px 3px rgba(250,204,21,.7);animation:mbcPulse 1s ease-in-out infinite;}
  @keyframes mbcPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  .laser{position:absolute;left:0;top:0;height:4px;border-radius:3px;transform-origin:0 50%;z-index:7;
    background:linear-gradient(90deg,rgba(56,189,248,0),#7dd3fc 40%,#e0f2fe);
    box-shadow:0 0 10px 2px rgba(125,211,252,.85);pointer-events:none;animation:laserFire .16s ease-out forwards;}
  @keyframes laserFire{0%{opacity:1;}100%{opacity:0;}}

  /* ---------- Terminal de hacking (Niveau 5 : missions & défi) ---------- */
  .field.hackfield{display:flex;gap:16px;align-items:center;padding:16px;position:relative;
    background:linear-gradient(#050b1a,#081226 60%,#0a0f22);}
  .hackfield .scanlines{position:absolute;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg,rgba(103,232,249,.045) 0 2px,transparent 2px 4px);}
  .hterm{position:relative;z-index:2;flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;
    background:rgba(2,14,26,.88);border:2px solid #155e75;border-radius:14px;padding:14px 16px;
    box-shadow:0 0 26px rgba(34,211,238,.22), inset 0 0 44px rgba(34,211,238,.05);
    font-family:Consolas,"Cascadia Mono",monospace;}
  .hterm.glitch{animation:glitchShift .16s steps(2) 2;}
  .ht-head{font-size:.72rem;font-weight:700;letter-spacing:.12em;color:#67e8f9;opacity:.85;}
  .ht-blink{animation:htBlink 1s steps(1) infinite;}
  @keyframes htBlink{50%{opacity:0;}}
  .ht-log{font-size:.8rem;color:#5eead4;min-height:1.3em;opacity:.9;}
  .ht-log > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ht-code{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;align-items:center;}
  .hc{min-width:42px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.4rem;color:#a5f3fc;
    background:rgba(8,47,73,.75);border:2px solid #155e75;}
  .hc.alien{color:#c4b5fd;border-color:#4c1d95;text-shadow:0 0 9px rgba(167,139,250,.9);}
  .hc.cur{border-color:#facc15;color:#fde68a;box-shadow:0 0 13px rgba(250,204,21,.65);animation:mbcPulse 1s ease-in-out infinite;}
  .hc.done{border-color:var(--green);color:#86efac;background:rgba(20,83,45,.45);}
  .hc.bad{animation:hcBad .3s;}
  @keyframes hcBad{0%,100%{transform:none;}30%{transform:translateX(-5px);border-color:var(--red);color:#fca5a5;}70%{transform:translateX(5px);}}
  .ht-trace{display:flex;align-items:center;gap:10px;}
  .ht-trace-label{font-size:.72rem;font-weight:800;color:#fca5a5;letter-spacing:.1em;white-space:nowrap;animation:htBlink 1.2s steps(1) infinite;}
  .ht-trace-bar{flex:1;height:12px;border-radius:7px;background:rgba(127,29,29,.35);border:1px solid #7f1d1d;overflow:hidden;}
  .ht-trace-bar > i{display:block;height:100%;width:0;border-radius:7px;
    background:repeating-linear-gradient(45deg,#ef4444 0 10px,#b91c1c 10px 20px);box-shadow:0 0 10px rgba(239,68,68,.7);}
  .ht-status{font-size:.92rem;font-weight:800;min-height:1.4em;color:#a5f3fc;}
  .ht-status.ok{color:#86efac;text-shadow:0 0 8px rgba(34,197,94,.55);}
  .ht-status.warn{color:#fca5a5;text-shadow:0 0 8px rgba(239,68,68,.55);}
  .ht-radar{position:relative;z-index:2;width:168px;height:168px;flex:0 0 auto;border-radius:50%;
    border:2px solid #155e75;background:radial-gradient(circle,#052433 0%,#031320 72%);
    box-shadow:0 0 20px rgba(34,211,238,.3);overflow:hidden;}
  .rad-sweep{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(rgba(45,212,191,.45), transparent 65deg, transparent);animation:radSweep 3.2s linear infinite;}
  @keyframes radSweep{to{transform:rotate(360deg);}}
  .rad-ring{position:absolute;border-radius:50%;border:1px solid rgba(45,212,191,.28);}
  .rad-ring.r1{inset:20%;} .rad-ring.r2{inset:40%;}
  .rad-zone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
    width:82%;height:82%;border:2px dashed rgba(248,113,113,.85);background:rgba(248,113,113,.1);
    transition:width .5s ease,height .5s ease;}
  .rad-zone.found{border-color:var(--green);background:rgba(34,197,94,.15);animation:mbcPulse 1s ease-in-out infinite;}
  .rad-ship{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:1.7rem;line-height:1;transition:transform .4s;}
  .rad-ship.on{transform:translate(-50%,-50%) scale(1);}
  @media (max-width:640px){ .ht-radar{display:none;} }

  /* ---------- Boss final « K0RT3X » (Niveau 7) : duel de terminal ---------- */
  .hackboss .hterm{gap:8px;}
  .hb-alert{display:flex;align-items:center;gap:10px;min-height:38px;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:800;font-size:1.12rem;color:#fca5a5;}
  .hb-alert .hba-ic{font-size:1.65rem;line-height:1;}
  .hb-alert .hba-txt{letter-spacing:.05em;text-shadow:0 0 10px rgba(239,68,68,.6);animation:htBlink 1s steps(1) infinite;}
  .hb-alert.ok .hba-txt{color:#86efac;text-shadow:0 0 10px rgba(34,197,94,.6);animation:none;}
  .hb-cmdlab{font-size:.9rem;font-weight:800;color:#a5f3fc;min-height:1.3em;}
  .hb-cmdlab b{color:#fde68a;}
  .hb-rows{display:flex;flex-direction:column;gap:8px;min-height:50px;justify-content:center;}
  .hb-row{min-height:0;flex-wrap:nowrap;overflow-x:auto;}
  .hb-row .hb-prompt{flex:0 0 auto;color:#5eead4;font-weight:800;font-size:1.2rem;margin-right:2px;}
  .hb-row.gone{animation:hbRowGone .4s forwards;}
  @keyframes hbRowGone{0%{opacity:1;}30%{transform:translateX(6px);filter:brightness(1.6) sepia(1) saturate(6) hue-rotate(-40deg);}100%{opacity:0;transform:translateX(-10px);}}
  .ht-log > div.say{color:#e9d5ff;font-weight:800;text-shadow:0 0 8px rgba(217,70,239,.55);}
  /* barre de riposte (K0RT3X ouvert) : orange au lieu du traçage rouge */
  .ht-trace.riposte .ht-trace-label{color:#fde68a;}
  .ht-trace.riposte .ht-trace-bar{background:rgba(120,53,15,.35);border-color:#92400e;}
  .ht-trace.riposte .ht-trace-bar > i{background:repeating-linear-gradient(45deg,#f59e0b 0 10px,#b45309 10px 20px);box-shadow:0 0 10px rgba(245,158,11,.7);}
  /* avatar de K0RT3X : un œil-machine rouge qui pulse, souffre, panique puis s'éteint */
  .hb-boss{position:relative;z-index:2;flex:0 0 auto;width:168px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .hb-name{font-family:Consolas,"Cascadia Mono",monospace;font-weight:700;font-size:.95rem;letter-spacing:.14em;
    color:#f0abfc;text-shadow:0 0 10px rgba(217,70,239,.75);}
  .hb-eye{width:130px;height:130px;border-radius:50%;border:3px solid #7f1d1d;
    background:radial-gradient(circle at 50% 42%,#450a0a 0%,#1c0505 68%,#0a0202 100%);
    box-shadow:0 0 26px rgba(239,68,68,.45), inset 0 0 30px rgba(239,68,68,.25);
    display:flex;align-items:center;justify-content:center;animation:hbPulse 2.6s ease-in-out infinite;}
  .hb-iris{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle,#fecaca 0%,#ef4444 38%,#7f1d1d 82%);box-shadow:0 0 22px rgba(239,68,68,.95);
    transition:background .9s,box-shadow .9s;}
  .hb-pupil{width:17px;height:34px;border-radius:50%;background:#0a0202;}
  @keyframes hbPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  .hb-boss.hurt .hb-eye{animation:hbHurt .45s;}
  @keyframes hbHurt{0%{filter:brightness(2.4);transform:translateX(0) scale(.94);}30%{transform:translateX(-6px);}
    60%{transform:translateX(6px);}100%{filter:none;transform:none;}}
  .hb-boss.laugh .hb-eye{animation:hbLaugh .55s ease-in-out 2;}

<style>
  /* ===== Bascule police OpenDyslexic (accessibilité lecture/dyslexie) ===== */
  @font-face{font-family:"OpenDyslexic";src:url("assets/fonts/opendyslexic-400.woff2") format("woff2");font-weight:400;font-display:swap;}

  html.dys, html.dys *{font-family:"OpenDyslexic","Fluent Emoji",sans-serif !important;}
  /* OpenDyslexic est nettement plus large et plus haute que Nunito : sans rien faire,
     le texte paraît plus gros et déborde sur des lignes supplémentaires, ce qui décale
     la mise en page des missions. On réduit la taille de base d'environ 15 % en mode Dys
     pour que la police conserve le MÊME encombrement visuel qu'en mode normal. Toutes les

  html.dys{font-size:85%;}
  .dys-toggle{position:fixed;bottom:16px;left:16px;z-index:500;display:inline-flex;align-items:center;gap:9px;
    border:2px solid #d7e0ea;background:#fff;color:#22303f;border-radius:999px;padding:7px 9px 7px 13px;

   1. CLAVIER AZERTY — pédagogie (astuces + mini-clavier)

function kbd(s){ return '<kbd>'+s+'</kbd>'; }
const KCAP={'1':'&','2':'é','3':'"','4':"'",'5':'(','6':'-','7':'è','8':'_','9':'ç','0':'à'};
const SYMTIP={
  '.':'Garde '+kbd('Maj ⇧')+' enfoncé et appuie sur la touche '+kbd(';')+' (en bas, à droite des lettres).',
  ',':'Appuie simplement sur la touche '+kbd(',')+' (en bas, à droite des lettres).',
  '?':'Garde '+kbd('Maj ⇧')+' enfoncé et appuie sur la touche '+kbd(',')+'.',
  '!':'Appuie sur la touche '+kbd('!')+' (tout en bas à droite des lettres).',
  ';':'Appuie sur la touche '+kbd(';')+'.',
  ':':'Appuie sur la touche '+kbd(':')+'.',
  "'":'Appuie sur la touche '+kbd("'")+' (la touche du 4).',
  '@':'Garde '+kbd('AltGr')+' enfoncé (à droite de la barre espace) et appuie sur '+kbd('à')+' (la touche du 0).',
  '#':'Garde '+kbd('AltGr')+' enfoncé et appuie sur '+kbd('"')+' (la touche du 3).',
  '€':'Garde '+kbd('AltGr')+' enfoncé et appuie sur '+kbd('E')+'.',
  '+':'Garde '+kbd('Maj ⇧')+' enfoncé et appuie sur '+kbd('=')+' (tout en haut à droite).',
  '-':'Appuie sur la touche '+kbd('-')+' (la touche du 6).',
  '_':'Appuie sur la touche '+kbd('_')+' (la touche du 8).'
};
// Accents : é è à ç ù sont des touches DIRECTES sur AZERTY ; ê/ë… passent par une touche morte
const ACCENT_TIP={
  'é':'Accent aigu : appuie directement sur la touche '+kbd('é')+' (la touche du '+kbd('2')+', en haut à gauche). C\'est une touche toute prête !',
  'è':'Accent grave : appuie directement sur la touche '+kbd('è')+' (la touche du '+kbd('7')+').',
  'à':'Accent grave : appuie directement sur la touche '+kbd('à')+' (la touche du '+kbd('0')+').',
  'ù':'Accent grave : appuie directement sur la touche '+kbd('ù')+' (juste à droite de la touche '+kbd('M')+').',
  'ç':'Cédille : appuie directement sur la touche '+kbd('ç')+' (la touche du '+kbd('9')+').',
  'â':'Accent circonflexe : appuie d\'abord sur la touche morte '+kbd('^')+' (à droite du '+kbd('P')+'), <b>relâche</b>, puis appuie sur '+kbd('A')+'. Le chapeau se pose sur la lettre !',
  'ê':'Accent circonflexe : appuie sur la touche '+kbd('^')+' (à droite du '+kbd('P')+'), puis sur '+kbd('E')+'.',
  'î':'Accent circonflexe : appuie sur la touche '+kbd('^')+' (à droite du '+kbd('P')+'), puis sur '+kbd('I')+'.',
  'ô':'Accent circonflexe : appuie sur la touche '+kbd('^')+' (à droite du '+kbd('P')+'), puis sur '+kbd('O')+'.',
  'û':'Accent circonflexe : appuie sur la touche '+kbd('^')+' (à droite du '+kbd('P')+'), puis sur '+kbd('U')+'.',
  'ë':'Tréma (deux points) : appuie sur '+kbd('Maj ⇧')+' + '+kbd('^')+' (à droite du '+kbd('P')+'), puis sur '+kbd('E')+'.',
  'ï':'Tréma (deux points) : appuie sur '+kbd('Maj ⇧')+' + '+kbd('^')+', puis sur '+kbd('I')+'.',
  'ü':'Tréma (deux points) : appuie sur '+kbd('Maj ⇧')+' + '+kbd('^')+', puis sur '+kbd('U')+'.'
};
const ACCENT_CHARS=new Set(Object.keys(ACCENT_TIP).concat(['É','È','À','Ç','Ù','Â','Ê','Î','Ô','Û','Ë','Ï','Ü']));
function tipFor(ch){
  if(ACCENT_TIP[ch]) return ACCENT_TIP[ch];
  if(/^[a-z]$/.test(ch)) return 'Appuie simplement sur la touche '+kbd(ch.toUpperCase())+'.';
  if(/^[A-Z]$/.test(ch)) return 'Garde '+kbd('Maj ⇧')+' enfoncé et appuie sur '+kbd(ch)+'. Autre option : appuie une fois sur '+kbd('⇪ Caps Lock')+' pour tout mettre en majuscules, tape ta lettre, puis rappuie sur '+kbd('⇪ Caps Lock')+' pour revenir aux minuscules.';
  if(/^[0-9]$/.test(ch)) return 'Garde '+kbd('Maj ⇧')+' enfoncé et appuie sur la touche '+kbd(KCAP[ch])+' (rangée du haut). Tu peux aussi utiliser le '+kbd('pavé numérique')+' à droite du clavier.';
  return SYMTIP[ch] || ('Appuie sur la touche '+kbd(ch)+'.');
}
function niceChar(ch){ return ch===' ' ? 'espace' : ch; }
// Rappel de position des mains, martelé sur les niveaux 1 à 4 (dans les popups de mission + l'astuce)

/* Astuce IMAGE : pour un caractère, quelles touches surligner sur le mini-clavier + une légende très courte.
   Renvoie { hl:{keys:Set, maj, altgr}, cap:'…' } à donner à buildKeyboard(). */
const CIRC_LETTER={'â':'A','ê':'E','î':'I','ô':'O','û':'U'};
const TREMA_LETTER={'ë':'E','ï':'I','ü':'U'};
const SYM_HINT={
  '.':{keys:[';'],maj:true},  ',':{keys:[',']},  '?':{keys:[','],maj:true},  '!':{keys:['!']},
  ';':{keys:[';']},  ':':{keys:[':']},
  '(':{keys:['(']},  ')':{keys:[')']},  '=':{keys:['=']},  '"':{keys:['"']},
  '@':{keys:['à'],altgr:true},  '#':{keys:['"'],altgr:true},  '€':{keys:['e'],altgr:true},
  '+':{keys:['='],maj:true},  '-':{keys:['-']},  '_':{keys:['_']}
};
function keyHint(ch){
  const S=a=>new Set(a);
  if(/^[a-z]$/.test(ch)) return {hl:{keys:S([ch])}, cap:'La touche '+kbd(ch.toUpperCase())};
  if(/^[A-Z]$/.test(ch)) return {hl:{keys:S([ch.toLowerCase()]), maj:true}, cap:kbd('Maj ⇧')+' + '+kbd(ch)};
  if(/^[0-9]$/.test(ch)) return {hl:{keys:S([ch]), maj:true}, cap:kbd('Maj ⇧')+' + '+kbd(ch)};
  if('éèàçù'.includes(ch)) return {hl:{keys:S([ch])}, cap:'La touche '+kbd(ch)};
  if(CIRC_LETTER[ch]) return {hl:{keys:S(['^', CIRC_LETTER[ch].toLowerCase()])}, cap:kbd('^')+' puis '+kbd(CIRC_LETTER[ch])};
  if(TREMA_LETTER[ch]) return {hl:{keys:S(['^', TREMA_LETTER[ch].toLowerCase()]), maj:true}, cap:kbd('Maj ⇧')+' + '+kbd('^')+' puis '+kbd(TREMA_LETTER[ch])};
  const s=SYM_HINT[ch];
  if(s){
    let cap;
    if(s.maj) cap=kbd('Maj ⇧')+' + '+kbd(s.keys[0]);
    else if(s.altgr) cap=kbd('AltGr')+' + '+kbd(s.keys[0]);
    else cap='La touche '+kbd(s.keys[0]);
    return {hl:{keys:S(s.keys), maj:!!s.maj, altgr:!!s.altgr}, cap};
  }
  return {hl:{keys:S([ch])}, cap:'La touche '+kbd(ch)};
}
// Surlignage combiné pour plusieurs caractères (image d'une mission entière)
function comboHint(chars){
  const keys=new Set(); let maj=false, altgr=false;
  chars.forEach(ch=>{ const {hl}=keyHint(ch); (hl.keys||new Set()).forEach(k=>keys.add(k)); if(hl.maj)maj=true; if(hl.altgr)altgr=true; });
  return {keys, maj, altgr};
}

// Disposition AZERTY pour le mini-clavier : [étiquette principale, chiffre secondaire?]
const KB_ROWS=[
  [['&','1'],['é','2'],['"','3'],["'",'4'],['(','5'],['-','6'],['è','7'],['_','8'],['ç','9'],['à','0'],[')'],['=']],
  [['a'],['z'],['e'],['r'],['t'],['y'],['u'],['i'],['o'],['p'],['^'],['$']],
  [['q'],['s'],['d'],['f'],['g'],['h'],['j'],['k'],['l'],['m'],['ù'],['*']],
  [['<'],['w'],['x'],['c'],['v'],['b'],['n'],[','],[';'],[':'],['!']]
];
const ACCENT_KEYS=new Set(['é','è','à','ç','ù']);   // accents en accès direct sur AZERTY
function buildKeyboard(hl){
  hl=hl||{}; const keys=hl.keys||new Set();
  let html='<div class="kbd-board">';
  KB_ROWS.forEach(row=>{
    html+='<div class="kbd-row">';
    row.forEach(k=>{
      const main=k[0], sub=k[1];
      let on=false, mod=false;
      if(hl.letters && /^[a-z]$/.test(main)) on=true;
      if(hl.digits && sub && /^[0-9]$/.test(sub)) on=true;
      if(hl.accents && ACCENT_KEYS.has(main)) on=true;
      if(hl.accents && main==='^') mod=true;   // touche morte circonflexe / tréma
      if(keys.has(main) || (sub && keys.has(sub))) on=true;
      html+='<div class="key'+(on?' hl':'')+(mod?' modhl':'')+'">'+main.toUpperCase()+(sub?'<span class="sub">'+sub+'</span>':'')+'</div>';
    });
    html+='</div>';
  });
  // rangée du bas : Maj — Caps Lock — espace — AltGr — Maj
  const maj=hl.maj?' modhl':'', alt=hl.altgr?' modhl':'', caps=hl.caps?' modhl':'';
  html+='<div class="kbd-row">'
    +'<div class="key wide'+maj+'">Maj ⇧</div>'
    +'<div class="key wide'+caps+'">⇪ Caps</div>'
    +'<div class="key space">espace</div>'
    +'<div class="key wide'+alt+'">AltGr</div>'
    +'<div class="key wide'+maj+'">Maj ⇧</div>'
    +'</div>';
  html+='</div>';
  return html;
}

/* =========================================================
   3. ÉTAT + STOCKAGE
   ========================================================= */
let currentLevel=1, STEPS=[], progressIdx=0, playIdx=0, currentStep=null;
const stage=document.getElementById('stage');
const overlay=document.getElementById('overlay');
const modal=document.getElementById('modal');

/* Tout passe par scripts/store.js, partagé par les six ateliers et l'accueil : même
   API synchrone qu'avant (get / set / del), mais la progression suit l'élève de poste
   en poste dès qu'il est connecté, et retombe sur le navigateur sinon. */
const store=window.Store;
/* Efface TOUTES les clés d'un préfixe (utilisé par « Reset complet » du devkit).
   Balayage par préfixe et non par liste : une liste finit toujours par oublier une clé
   ajoutée plus tard. Store.wipe s'occupe aussi du repli mémoire et du serveur. */
function wipe(pfx){ store.wipe(pfx); }
function getUnlocked(){ let u=parseInt(store.get('kb_unlocked')||'1',10); if(isNaN(u)||u<1)u=1; return Math.min(u,LEVELS.length); }
function getSavedStep(n){ let s=parseInt(store.get('kb_step_l'+n)||'0',10); return (isNaN(s)||s<0)?0:s; }
function saveProgress(){ store.set('kb_step_l'+currentLevel, String(progressIdx)); }

/* ---- Aide « Plus facile » (toutes les missions qui peuvent être perdues) ----
   Après 2 échecs D'AFFILÉE sur une même mission, la popup d'échec propose de ralentir la
   menace. L'aide vaut pour TOUT le reste du niveau (pas seulement la mission ratée) et se
   CUMULE SANS FIN : 2 nouveaux échecs d'affilée la remontent d'un cran, et aucun « dernier
   cran » n'est jamais annoncé à l'élève.
   Elle n'est JAMAIS appliquée aux combats de boss, qui ont leur propre sélecteur de
   difficulté (KB_BOSS_MODES / HB_TUNING) — cf. kbCanEase(). Gardée dans le stockage :
   un élève qui ferme l'atelier après avoir bloqué ne repart pas au niveau le plus dur.

   Où c'est branché — partout où une mission a des cœurs, des connexions ou une vague :
     • N1 et N2, le parachute : lettres qui tombent moins vite, moins souvent, et un cœur
       de plus par cran ;
     • N3 et N4, l'invasion : mêmes trois leviers sur les aliens ;
     • N5, le défi du traçage : barre plus lente, et une connexion 📡 de plus par cran ;
     • N7, les poursuites : vague plus lente, plus de répit avant qu'elle démarre, et une
       plus grande avance au départ.
   (N6 n'a aucune condition d'échec : rien à alléger, et aucune popup où l'accrocher.) */
/* ---- Trophées (scripts/badges.js, partagé par tout l'atelier) ----
   Raccourci tolérant : si le fichier n'est pas chargé, le jeu continue sans trophées. */
const KB_LEVEL_BADGES={3:'kb.l3', 4:'kb.l4', 6:'kb.l6'};
function bdg(id, opts){ return window.Badges ? Badges.award(id, opts) : false; }
/* « Frappe nette » : un niveau est parfait si l'aide « Plus facile » n'y a jamais été activée. */
function kbLevelClean(n){ return loadEase(n)===0; }

/* KB_EASE_MAX n'est PAS un plafond pédagogique mais une borne arithmétique : au-delà,
   0,8^n finit par valoir 0 et une division par zéro donnerait une durée à Infinity. */
const KB_EASE_MAX=50, KB_EASE_MUL=0.8, KB_EASE_FLOOR=0.2, KB_SPAWN_MAX=1.8;
let kbEaseSteps=0;    // nb d'aides accumulées sur le niveau courant
let kbFailStreak=0;   // échecs d'affilée sur la mission en cours
function loadEase(n){ let e=parseInt(store.get('kb_ease_l'+n)||'0',10); return (isNaN(e)||e<0)?0:Math.min(e,KB_EASE_MAX); }
function saveEase(){ store.set('kb_ease_l'+currentLevel, String(kbEaseSteps)); }
function kbEaseRaw(){ return Math.pow(KB_EASE_MUL, kbEaseSteps); }
/* Facteur appliqué à la VITESSE de la menace : 1 = normal, 0,8 = 20 % plus lent. Planchonné :
   sous KB_EASE_FLOOR, une lettre qui tombe encore moins vite ne se verrait plus tomber. */
function kbEaseFactor(){ return Math.max(KB_EASE_FLOOR, kbEaseRaw()); }
/* Une DURÉE allégée (barre de traçage, répit avant la vague) : elle dure plus longtemps, sans borne. */
function kbEaseLonger(ms){ return ms ? ms/kbEaseRaw() : 0; }
/* L'intervalle entre deux apparitions s'étire, mais pas au-delà de KB_SPAWN_MAX : sinon la
   mission ne serait plus difficile, juste interminable — 30 lettres à attendre une par une. */
function kbEaseSpawn(ms){ return ms ? ms*Math.min(KB_SPAWN_MAX, 1/kbEaseRaw()) : ms; }
/* Le levier qui reste utile quand la vitesse a touché son plancher : +1 par cran, sans plafond.
   Sert aux cœurs (parachute, invasion), aux connexions 📡 (N5) et à l'avance de départ (N7). */
function kbEaseBonus(){ return kbEaseSteps; }
/* Une mission peut être allégée si elle peut RÉELLEMENT être perdue (cœurs, connexions ou
   vague qui rattrape) et que ce n'est pas un boss — le boss a des `lives` lui aussi, d'où
   le test sur `mode` en premier. */
function kbCanEase(){
  return !!(currentStep && currentStep.mode!=='boss'
            && (currentStep.pursuit || currentStep.energies || currentStep.lives));
}

let soundOn = (store.get('kb_sound')||'1')==='1';

/* =========================================================
   4. SON (WebAudio, sans fichier externe)
   ========================================================= */
let actx=null;
function audioCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function beep(kind){
  if(!soundOn) return; const a=audioCtx(); if(!a) return;
  const now=a.currentTime;
  function tone(freq,dur,type,vol,delay){
    const o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(a.destination);
    const t=now+(delay||0); g.gain.setValueAtTime(vol||.12,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur);
  }
  if(kind==='key'){ tone(280+Math.random()*40,.05,'square',.05); tone(1600,.03,'triangle',.04); } // clic machine à écrire
  else if(kind==='good'){ tone(740,.09,'sine',.12); tone(1180,.09,'sine',.08,.02); }
  else if(kind==='bad'){ tone(150,.16,'square',.12); }
  else if(kind==='ding'){ tone(880,.12,'sine',.12); tone(1320,.16,'sine',.1,.08); }
  else if(kind==='win'){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.09)); }
}
// carillon d'une étoile de score : le ton monte à chaque étoile gagnée (1re = grave, 5e = aiguë)
const STAR_NOTES=[523,659,784,988,1319];
function beepStar(i){
  if(!soundOn) return; const a=audioCtx(); if(!a) return;
  const f=STAR_NOTES[Math.min(i,STAR_NOTES.length-1)], now=a.currentTime;
  [[f,.18,.12,0],[f*2,.22,.06,.03]].forEach(([freq,dur,vol,delay])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type='triangle'; o.frequency.value=freq; o.connect(g); g.connect(a.destination);
    const t=now+delay; g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur);
  });
}

document.getElementById('soundBtn').onclick=()=>{ soundOn=!soundOn; store.set('kb_sound', soundOn?'1':'0'); refreshSoundBtn(); if(soundOn){ audioCtx(); beep('good'); resumeBossMusic(); resumeHbBossMusic(); resumeHackAmbient(); } else { pauseBossMusic(); pauseHbBossMusic(); pauseHackAmbient(); } };

let gamePaused=false;  // vrai quand une astuce est ouverte : le jeu est gelé

function pauseActive(){ if(activeGame && activeGame.pause){ try{activeGame.pause();}catch(e){} } gamePaused=true; }

/* ---- Parachute ---- */
const P={};
function startParachute(step){
  stopGame(); gamePaused=false;
  stage.innerHTML=
    '<div class="hud">'
    + '<span class="lives" id="hudLives"></span>'
    + '<span class="count" id="hudCount"></span>'
    + '<div class="meter"><i id="hudMeter"></i></div>'
    + (step.showTips? '<button type="button" class="tip-pill" id="hudTip">💡 Astuce</button>' : '')
    + '</div>'
    + '<div class="field" id="field"><div class="ground"></div></div>';
  const field=document.getElementById('field');
  // « Plus facile » : lettres plus lentes, plus espacées, et un cœur de plus par cran.
  // maxLives est gardé à part — le HUD dessinait la rangée de cœurs d'après step.lives,
  // qui ne connaît pas les cœurs ajoutés par l'aide.
  const lives=step.lives+kbEaseBonus();
  Object.assign(P,{
    step, field, items:[], cleared:0, lives, maxLives:lives, target:step.target,
    speed:step.speed*kbEaseFactor(), spawnMs:kbEaseSpawn(step.spawnMs), pool:step.pool, running:true,
    last:0, nextSpawn:0, groundY:0, raf:0
  });
  P.groundY=field.clientHeight - 58;
  updateHud();
  if(step.showTips){
    const tb=document.getElementById('hudTip');
    if(tb) tb.onclick=()=>{ const it=lowestItem(); openGameTip(it?it.ch:P.pool[0]); };
  }
  activeGame={ onKey:onKeyP, stop:stopP,
    pause(){ if(P.running){ P.running=false; cancelAnimationFrame(P.raf); } },
    resume(){ if(!P.running){ P.running=true; P.last=0; P.raf=requestAnimationFrame(loopP); } } };
  P.raf=requestAnimationFrame(loopP);
}
function lowestItem(){ let low=null; if(P.items) for(const it of P.items){ if(!low||it.y>low.y) low=it; } return low; }
/* Au-delà de 10 cœurs (« Plus facile » cumulé), la rangée déborderait du bandeau, qui doit
   tenir sur une ligne : on bascule sur un compteur. Idem dans updateInvHud et hackHud. */
function updateHud(){
  let h;
  if(P.maxLives>10){ h='❤️ ×'+Math.max(0,P.lives); }
  else { h=''; for(let i=0;i<P.maxLives;i++) h+= (i<P.lives?'❤️':'<span class="lost">🖤</span>'); }
  document.getElementById('hudLives').innerHTML=h;
  document.getElementById('hudCount').textContent=P.cleared+' / '+P.target+' réussies';
  document.getElementById('hudMeter').style.width=Math.min(100,P.cleared/P.target*100)+'%';
}
function spawnP(){
  if(P.items.length>=5) return;
  const ch=P.pool[Math.floor(Math.random()*P.pool.length)];
  const el=document.createElement('div');
  const isSym=!/^[a-zA-Z0-9]$/.test(ch) && !ACCENT_CHARS.has(ch);
  el.className='drop'+(isSym?' sym':'');
  el.innerHTML='<span class="para">🪂</span><span class="cap">'+ch+'</span>';
  const x=6+Math.random()*84;
  el.style.left=x+'%';
  el.style.transform='translate(-50%,0)';
  P.field.appendChild(el);
  P.items.push({el,ch,y:0});
}
function loopP(ts){
  if(!P.running) return;
  if(!P.last) P.last=ts;
  const dt=Math.min(.05,(ts-P.last)/1000); P.last=ts;
  if(ts>=P.nextSpawn){ spawnP(); P.nextSpawn=ts+P.spawnMs; }
  for(const it of P.items.slice()){
    it.y+=P.speed*dt;
    it.el.style.transform='translate(-50%,'+it.y+'px)';
    if(it.y>=P.groundY){ missP(it); }
  }
  P.raf=requestAnimationFrame(loopP);
}
function removeItem(it){ const i=P.items.indexOf(it); if(i>=0) P.items.splice(i,1); }
function burstAt(xPx, yPx, field){
  field=field||P.field;
  const COLORS=['#2563eb','#f59e0b','#16a34a','#ef4444','#a78bfa','#fb923c','#34d399','#f472b6'];
  const N=12;
  const burst=document.createElement('div');
  burst.className='drop-burst';
  burst.style.left=xPx+'px';
  burst.style.top=yPx+'px';
  for(let i=0;i<N;i++){
    const angle=(i/N)*2*Math.PI;
    const dist=38+Math.random()*32;
    const sp=document.createElement('div');
    sp.className='spark';
    sp.style.setProperty('--dx',(Math.cos(angle)*dist)+'px');
    sp.style.setProperty('--dy',(Math.sin(angle)*dist)+'px');
    sp.style.background=COLORS[i%COLORS.length];
    sp.style.animationDelay=(Math.random()*0.06)+'s';
    burst.appendChild(sp);
  }
  field.appendChild(burst);
  setTimeout(()=>burst.remove(),500);
}
// explosion bleue (même teinte que le laser) : utilisée pour les aliens de l'essaim du boss
function blueBurstAt(xPx, yPx, field){
  field=field||P.field;
  const COLORS=['#7dd3fc','#38bdf8','#0ea5e9','#e0f2fe'];
  const N=12;
  const burst=document.createElement('div');
  burst.className='drop-burst';
  burst.style.left=xPx+'px';
  burst.style.top=yPx+'px';
  for(let i=0;i<N;i++){
    const angle=(i/N)*2*Math.PI;
    const dist=38+Math.random()*32;
    const sp=document.createElement('div');
    sp.className='spark';
    sp.style.setProperty('--dx',(Math.cos(angle)*dist)+'px');
    sp.style.setProperty('--dy',(Math.sin(angle)*dist)+'px');
    sp.style.background=COLORS[i%COLORS.length];
    sp.style.boxShadow='0 0 8px 2px rgba(56,189,248,.75)';
    sp.style.animationDelay=(Math.random()*0.06)+'s';
    burst.appendChild(sp);
  }
  field.appendChild(burst);
  setTimeout(()=>burst.remove(),500);
}
function missP(it){
  removeItem(it);
  it.el.classList.add('miss'); const el=it.el; setTimeout(()=>el.remove(),300);
  P.lives--; beep('bad');
  P.field.classList.add('shake'); setTimeout(()=>P.field.classList.remove('shake'),250);
  updateHud();
  if(P.lives<=0) failP();
}
function onKeyP(e){
  if(e.key.length!==1) return;          // ignore Maj, AltGr, Flèches, etc.
  e.preventDefault();
  // cherche la cible correspondante la plus basse (la plus urgente)
  let best=null;
  for(const it of P.items){ if(it.ch===e.key){ if(!best||it.y>best.y) best=it; } }
  if(best){
    const xPx=P.field.clientWidth*parseFloat(best.el.style.left)/100;
    const yPx=best.y+28;
    burstAt(xPx, yPx);
    removeItem(best); best.el.classList.add('pop'); const el=best.el; setTimeout(()=>el.remove(),250);
    P.cleared++; beep('good'); updateHud();
    if(P.cleared>=P.target) winP();
  } else {
    beep('key');
  }
}
function stopP(){ P.running=false; cancelAnimationFrame(P.raf); }
function winP(){ stopP(); beep('win'); onWin(); }
function failP(){
  stopP();
  const tip = P.step.showTips
    ? 'Regarde bien l\'astuce de chaque symbole : elle te dit quelles touches presser.'
    : tipFor(P.pool[0]);
  onFail('Trop de parachutes ont touché le sol !', 'Astuce : '+tip+' Vise la lettre la plus basse en premier.');
}

/* ---- Invasion spatiale (Niveaux 3 & 4) ---- */
const I={};
const INV_SPEED_MULT=0.6;     // aliens plus lents que les parachutes
const INV_MAX_CONCURRENT=9;   // beaucoup plus d'aliens visibles à la fois
const MB_INTERVAL=6;          // un mini-boss toutes les N destructions
function alienEmojiFor(ch, lvlN){
  if(lvlN===3){
    if(CIRC_LETTER[ch]) return '🛸';
    if(TREMA_LETTER[ch]) return '👾';
    return '👽';
  }
  const set=['👾','🛸','👽'];
  return set[Math.floor(Math.random()*set.length)];
}
function startInvaders(step){
  stopGame(); gamePaused=false;
  stage.innerHTML=
    '<div class="hud">'
    + '<span class="lives" id="hudLives"></span>'
    + '<span class="count" id="hudCount"></span>'

    last:0, nextSpawn:0, groundY:0, raf:0,

  });

  }
  activeGame={ onKey:onKeyI, stop:stopI,
    pause(){ if(I.running){ I.running=false; cancelAnimationFrame(I.raf); } },
    resume(){ if(!I.running){ I.running=true; I.last=0; I.raf=requestAnimationFrame(loopI); } } };
  I.raf=requestAnimationFrame(loopI);
}
function updateInvHud(){
  let h;
  if(I.maxLives>10){ h='❤️ ×'+Math.max(0,I.lives); }
  else { h=''; for(let i=0;i<I.maxLives;i++) h+= (i<I.lives?'❤️':'<span class="lost">🖤</span>'); }
  document.getElementById('hudLives').innerHTML=h;
  document.getElementById('hudCount').textContent=I.cleared+' / '+I.target+' détruits';
  document.getElementById('hudMeter').style.width=Math.min(100,I.cleared/I.target*100)+'%';
  const ratio=I.cleared/I.target;
  I.ship.classList.toggle('boost1', ratio>=0.33 && ratio<0.67);
  I.ship.classList.toggle('boost2', ratio>=0.67);
}
function mostUrgentInvader(){
  if(I.phase==='miniboss' && I.miniBoss) return {ch:I.miniBoss.seq[I.miniBoss.idx]};
  let low=null; for(const it of I.items){ if(!low||it.y>low.y) low=it; } return low;
}
// le rapprochement horizontal s'arrête à mi-chemin : sinon tous les aliens
// finiraient collés au même point juste au-dessus du vaisseau
function invaderXPct(x0,y){
  const t=Math.min(1, y/I.groundY);
  return x0+(50-x0)*Math.min(t,0.5);
}
function positionInvader(it){
  it.el.style.left=invaderXPct(it.x0,it.y)+'%';
  it.el.style.transform='translate(-50%,'+it.y+'px)';
}
function spawnI(){
  if(I.items.length>=INV_MAX_CONCURRENT) return;
  const ch=I.pool[Math.floor(Math.random()*I.pool.length)];
  const emoji=alienEmojiFor(ch, currentLevel);
  const el=document.createElement('div');
  el.className='invader';
  el.innerHTML='<span class="ufo">'+emoji+'</span><span class="cap">'+ch+'</span>';
  I.field.appendChild(el);
  const it={el,ch,x0:4+Math.random()*92,y:0};
  positionInvader(it);
  I.items.push(it);
}
function loopI(ts){
  if(!I.running) return;
  if(!I.last) I.last=ts;
  const dt=Math.min(.05,(ts-I.last)/1000); I.last=ts;
  if(I.phase==='normal'){
    if(ts>=I.nextSpawn){ spawnI(); I.nextSpawn=ts+I.spawnMs; }
    for(const it of I.items.slice()){
      it.y+=I.speed*dt;
      positionInvader(it);
      if(it.y>=I.groundY) missI(it);
    }
  } else if(I.phase==='miniboss' && I.miniBoss){
    const mb=I.miniBoss;
    mb.y+=mb.speed*dt;
    positionMiniBoss(mb);
    if(mb.y>=I.groundY) miniBossReachesShip();
  }
  I.raf=requestAnimationFrame(loopI);
}
function removeInvader(it){ const i=I.items.indexOf(it); if(i>=0) I.items.splice(i,1); }
// trait de laser générique entre deux points d'un terrain (invaders ET boss essaim)
function drawLaser(field,x1,y1,x2,y2){
  const dist=Math.hypot(x2-x1,y2-y1);
  const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  const el=document.createElement('div');
  el.className='laser';
  el.style.left=x1+'px'; el.style.top=y1+'px';
  el.style.width=dist+'px';
  el.style.transform='rotate('+ang+'deg)';
  field.appendChild(el);
  setTimeout(()=>el.remove(),160);
}
function laserTo(xPx,yPx){ drawLaser(I.field, I.field.clientWidth/2, I.field.clientHeight-30, xPx, yPx); }
function maybeShowCombo(xPx,yPx){
  if(I.combo>0 && I.combo%5===0){
    const d=document.createElement('div'); d.className='dmg-float'; d.textContent='Combo x'+I.combo+' !';
    d.style.left=xPx+'px'; d.style.top=(yPx-20)+'px';
    I.field.appendChild(d); setTimeout(()=>d.remove(),800);
  }
}
function fireLaser(it){
  const xPx=I.field.clientWidth*invaderXPct(it.x0,it.y)/100, yPx=it.y+21;
  laserTo(xPx,yPx);
  removeInvader(it); it.el.classList.add('pop'); const el=it.el; setTimeout(()=>el.remove(),250);
  setTimeout(()=>burstAt(xPx,yPx,I.field),90);
  I.cleared++; I.combo++; beep('good'); updateInvHud();
  maybeShowCombo(xPx,yPx);
  if(I.cleared>=I.target){ winI(); return; }
  I.killsSinceBoss++;
  if(I.killsSinceBoss>=MB_INTERVAL && (I.target-I.cleared)>=2){
    I.killsSinceBoss=0;
    triggerMiniBoss();
  }
}
function missI(it){
  removeInvader(it);
  it.el.classList.add('miss'); const el=it.el; setTimeout(()=>el.remove(),300);
  I.lives--; I.combo=0; beep('bad');
  I.field.classList.add('shake'); setTimeout(()=>I.field.classList.remove('shake'),250);
  I.ship.classList.add('hit'); setTimeout(()=>I.ship.classList.remove('hit'),400);
  updateInvHud();
  if(I.lives<=0) failI();
}
function onKeyI(e){
  if(e.key.length!==1) return;
  e.preventDefault();
  if(I.phase==='miniboss') return onMiniBossKey(e.key);
  let best=null;
  for(const it of I.items){ if(it.ch===e.key){ if(!best||it.y>best.y) best=it; } }
  if(best) fireLaser(best); else beep('key');
}
function stopI(){ I.running=false; cancelAnimationFrame(I.raf); }
function winI(){ stopI(); beep('win'); onWin(); }
function failI(){
  stopI();
  const tip = I.step.showTips
    ? 'Regarde bien l\'astuce de chaque alien : elle te dit quelles touches presser.'
    : tipFor(I.pool[0]);
  onFail('Trop d\'aliens ont atteint ton vaisseau !', 'Astuce : '+tip+' Vise l\'alien le plus proche en premier.');
}
/* -- mini-boss : surgit ponctuellement au milieu d'une mission normale -- */
function positionMiniBoss(mb){
  mb.el.style.left=invaderXPct(mb.x0,mb.y)+'%';
  mb.el.style.transform='translate(-50%,'+mb.y+'px)';
}
function triggerMiniBoss(){
  I.phase='miniboss';
  I.items.forEach(it=>it.el.remove()); I.items=[];
  const ban=document.createElement('div'); ban.className='attack-banner';
  ban.innerHTML='<div class="attack-title">⚠️ ALERTE ! ⚠️</div><div class="attack-sub">Un vaisseau géant approche — tape ses lettres dans l\'ordre !</div>';
  I.field.appendChild(ban);
  beep('ding');
  setTimeout(()=>{
    ban.remove();
    if(!I.running || I.phase!=='miniboss') return;
    spawnMiniBoss();
  },1300);
}
function spawnMiniBoss(){
  const len=3+Math.floor(Math.random()*2);
  const seq=[]; for(let i=0;i<len;i++) seq.push(I.pool[Math.floor(Math.random()*I.pool.length)]);
  const emoji=alienEmojiFor(seq[0], currentLevel);
  const el=document.createElement('div'); el.className='invader big';
  el.innerHTML='<span class="ufo">'+emoji+'<span class="cap-ring"></span></span>'
    + '<div class="mb-seq">'+seq.map((c,i)=>'<span class="mbc'+(i===0?' current':'')+'">'+c+'</span>').join('')+'</div>';
  I.field.appendChild(el);
  I.miniBoss={el,seq,idx:0,x0:30+Math.random()*40,y:0,speed:I.speed*0.32};
  positionMiniBoss(I.miniBoss);
}
function onMiniBossKey(key){
  const mb=I.miniBoss; if(!mb) return;
  if(key===mb.seq[mb.idx]){
    const chips=mb.el.querySelectorAll('.mbc');
    if(chips[mb.idx]){ chips[mb.idx].classList.remove('current'); chips[mb.idx].classList.add('done'); }
    mb.idx++; beep('good');
    if(chips[mb.idx]) chips[mb.idx].classList.add('current');
    if(mb.idx>=mb.seq.length) miniBossDefeated();
  } else {
    beep('bad'); I.lives--; I.combo=0;
    I.field.classList.add('shake'); setTimeout(()=>I.field.classList.remove('shake'),250);
    I.ship.classList.add('hit'); setTimeout(()=>I.ship.classList.remove('hit'),400);
    updateInvHud();
    if(I.lives<=0) failI();
  }
}
function miniBossDefeated(){
  const mb=I.miniBoss; if(!mb) return;
  const xPx=I.field.clientWidth*invaderXPct(mb.x0,mb.y)/100, yPx=mb.y+30;
  laserTo(xPx,yPx);
  burstAt(xPx,yPx,I.field); setTimeout(()=>burstAt(xPx,yPx,I.field),140);
  mb.el.remove(); I.miniBoss=null;
  I.cleared+=mb.seq.length; beep('win'); updateInvHud();
  if(I.cleared>=I.target){ winI(); return; }
  setTimeout(()=>{ if(I.running){ I.phase='normal'; I.nextSpawn=performance.now()+900; } },900);
}
function miniBossReachesShip(){
  const mb=I.miniBoss;
  if(mb){ mb.el.remove(); I.miniBoss=null; }
  I.field.classList.add('shake');
  stopI();
  onFail('Le mini-vaisseau géant a atteint le tien !', 'Astuce : tape vite chaque lettre de sa séquence dès qu\'elle apparaît, dans l\'ordre. Une seule erreur ne te coûte qu\'une vie, alors garde ton calme la prochaine fois !');
}

/* ---- Terminal de hacking (Niveau 5 : infiltrer le réseau alien) ----
   Fenêtre de connexion alien : des codes en symboles à recopier dans l'ordre.
   Missions : sans stress, erreurs comptées (score de précision en fin de mission).
   Défi : barre de TRAÇAGE par code + 3 connexions 📡 ; traçage plein = connexion perdue. */
const H={};
let hackSid=0;
const ALIEN_GLYPHS='⏃⏚☊⎅⟒⎎☌⊑⟟⋉⌰⍜⌿⍾⎋'.split('');
function genCode(pool,len){
  const out=[]; let last=null;
  while(out.length<len){ const c=pool[Math.floor(Math.random()*pool.length)]; if(c!==last){ out.push(c); last=c; } }
  return out;
}
// setTimeout « annulable » : le callback ne part que si la session de jeu n'a pas changé
function htWait(ms,sid,cb){ setTimeout(()=>{ if(H.sid===sid) cb(); }, ms); }
// effet machine à écrire (texte qui se tape tout seul)
function typeInto(el,text,sid,cb,speed){
  el.textContent='';
  let i=0;
  const t=setInterval(()=>{
    if(H.sid!==sid){ clearInterval(t); return; }
    el.textContent+=text[i++]||'';
    if(i>=text.length){ clearInterval(t); cb&&cb(); }
  }, speed||16);
}
function startHackterm(step){
  stopGame(); gamePaused=false;
  const sid=++hackSid;
  const chal=!!step.energies;
  Object.assign(H,{
    sid, step, chal, codes:step.codes.slice(), codeIdx:0, code:[], pos:0,
    // « Plus facile » : une connexion 📡 de plus par cran. maxEnergies est gardé à part,
    // le HUD dessinait la rangée d'après step.energies (qui ignore les crans d'aide).
    hits:0, errors:0, energies:(step.energies||0)+(step.energies?kbEaseBonus():0),
    maxEnergies:(step.energies||0)+(step.energies?kbEaseBonus():0),
    ready:false, running:true,
    raf:0, traceDur:0, traceElapsed:0, lastTs:0
  });
  stage.innerHTML=
    '<div class="hud">'
    + (chal?'<span class="lives" id="htLinks"></span>':'')
    + '<span class="count" id="htCount"></span>'
    + '<div class="meter"><i id="htMeter"></i></div>'
    + '<button type="button" class="tip-pill" id="hudTip">💡 Astuce</button>'
    + '</div>'
    + '<div class="field hackfield" id="hackField">'

function updateHtHud(){

function updateRadar(){

function newHackCode(){

function startTrace(){
  // « Plus facile » : le traçage est une DURÉE, on l'allonge donc au lieu de la réduire
  H.traceDur=kbEaseLonger((H.step.traceBase||4200)+(H.step.tracePerChar||1300)*H.code.length);
  H.traceElapsed=0; H.lastTs=0;
  const f=document.getElementById('htTrace'); if(f) f.style.width='0%';
  if(H.raf) cancelAnimationFrame(H.raf);
  H.raf=requestAnimationFrame(traceLoop);
}
// dt borné (comme loopP/loopI/loopB) : pas de saut de barre si l'onglet passe en arrière-plan
function traceLoop(ts){
  if(!H.running||!H.ready){ H.raf=0; return; }
  if(!H.lastTs) H.lastTs=ts;
  H.traceElapsed+=Math.min(50, ts-H.lastTs); H.lastTs=ts;
  const fr=Math.min(1, H.traceElapsed/H.traceDur);
  const f=document.getElementById('htTrace'); if(f) f.style.width=(fr*100)+'%';
  if(fr>=1){ H.raf=0; traceCaught(); return; }
  H.raf=requestAnimationFrame(traceLoop);
}
function traceCaught(){
  const sid=H.sid;
  H.ready=false; H.energies--; playHackWarning();
  glitchTerm(true);
  updateHtHud();
  if(H.energies<=0){
    stopH();
    onFail('Le Vaisseau-Mère t\'a déconnecté ! 📡',
      'Astuce : tape le code sans t\'arrêter, dans l\'ordre, avant que la barre rouge de traçage soit pleine. Clique sur 💡 au début d\'un code si tu cherches une touche. Courage, tu y es presque !');
    return;
  }
  const st=document.getElementById('htStatus'); st.className='ht-status warn';
  typeInto(st,'⚠ CONNEXION COUPÉE — ouverture d\'un nouveau canal…',sid,()=>{ htWait(700,sid,newHackCode); });
}
function glitchTerm(big){
  const t=document.getElementById('hterm'); if(!t) return;
  t.classList.remove('glitch'); void t.offsetWidth; t.classList.add('glitch');
  if(big){ const f=document.getElementById('hackField'); if(f){ f.classList.add('shake'); setTimeout(()=>f.classList.remove('shake'),300); } }
}
function onKeyH(e){
  if(e.key.length!==1) return;
  e.preventDefault();
  if(!H.ready) return;
  const box=document.getElementById('htCode'); if(!box) return;
  if(e.key===H.code[H.pos]){
    H.hits++;
    const c=box.children[H.pos];
    if(c){ c.classList.remove('cur','bad'); c.classList.add('done'); }
    H.pos++;
    playHackTyping();
    if(H.pos>=H.code.length) return hackCodeDone();
    if(box.children[H.pos]) box.children[H.pos].classList.add('cur');
  } else {
    H.errors++;
    playHackWarning(); glitchTerm(false);
    const c=box.children[H.pos];
    if(c){ c.classList.remove('bad'); void c.offsetWidth; c.classList.add('bad'); }
  }
}
function hackCodeDone(){
  const sid=H.sid;
  H.ready=false;
  if(H.raf){ cancelAnimationFrame(H.raf); H.raf=0; }
  const f=document.getElementById('htTrace'); if(f) f.style.width='0%';
  H.codeIdx++;

  const st=document.getElementById('htStatus'); st.className='ht-status ok';
  if(H.codeIdx>=H.codes.length) return hackFinish();

}
function hackFinish(){
  const sid=H.sid;
  const tot=H.hits+H.errors;
  const prec=tot?Math.round(H.hits/tot*100):100;
  const precTxt=H.errors===0?'Précision : 100 % — aucune erreur, bravo !':'Précision : '+prec+' % ('+H.errors+' erreur'+(H.errors>1?'s':'')+')';
  const st=document.getElementById('htStatus'); st.className='ht-status ok';
  beep('win');
  if(H.chal){
    const ship=document.getElementById('radShip'), zone=document.getElementById('radZone');
    if(ship) ship.classList.add('on');
    if(zone) zone.classList.add('found');

  } else {
    typeInto(st,'✔ SÉCURITÉ PERCÉE ! '+precTxt,sid,()=>{ htWait(1400,sid,()=>{ stopH(); onWin(); }); });
  }
}
function stopH(){
  H.sid=++hackSid;   // invalide les timers/typewriters en attente
  H.running=false; H.ready=false;
  if(H.raf){ cancelAnimationFrame(H.raf); H.raf=0; }
