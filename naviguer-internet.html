<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naviguer sur internet — Atelier informatique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Police d'emojis unifiée sur tous les systèmes (cf. assets/fonts/README.md) */
  @font-face{
    font-family:"Fluent Emoji";
    src:url("assets/fonts/fluent-emoji.woff2") format("woff2");
    font-display:swap;
  }
  :root{
    --ink:#22303f; --muted:#5a6b7b;
    --blue:#2563eb; --blue-d:#1d4ed8;
    --amber:#f59e0b; --amber-d:#b45309;
    --green:#16a34a; --green-d:#15803d;
    --red:#ef4444; --red-d:#b91c1c;
    --paper:#ffffff; --line:#d7e0ea; --line-2:#e7eef6;
    --shell:#e9eff7;
    /* navigateur */
    --br-strip:#dfe3ec; --br-bar:#f9f9fb; --br-line:#dcdfe6; --br-pill:#eff1f6;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Nunito",system-ui,"Fluent Emoji",sans-serif;color:var(--ink);
    background:var(--shell);min-height:100vh;display:flex;flex-direction:column;
  }
  button{font-family:inherit;cursor:pointer;}
  .display{font-family:"Fredoka","Fluent Emoji",sans-serif;}
  kbd{
    display:inline-flex;align-items:center;justify-content:center;min-width:22px;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:.84em;line-height:1;
    padding:3px 7px;border-radius:7px;background:#fff;border:2px solid #c7d4e6;
    border-bottom-width:3px;color:var(--ink);box-shadow:0 1px 0 #e7eef6;margin:0 1px;white-space:nowrap;}

  /* ---------- Top bar ---------- */
  .topbar{background:#fff;border-bottom:2px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;}
  .back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--blue-d);
    font-weight:800;font-size:.98rem;padding:8px 12px;border-radius:10px;}
  .back:hover{background:#eef4ff;}
  .topbar h1{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.15rem;margin:0;flex:1;}
  .topbar h1 .dot{color:var(--blue);}
  .reset-btn{border:2px solid var(--line);background:#fff;color:var(--muted);font-weight:700;
    border-radius:10px;padding:7px 11px;font-size:.85rem;}
  .reset-btn:hover{border-color:var(--blue);color:var(--blue-d);}
  .reset-btn.danger:hover{border-color:var(--red);color:var(--red-d);}

  /* ---------- Progress ---------- */
  .progress-wrap{background:#fff;padding:8px 18px 14px;border-bottom:2px solid var(--line);}
  .track{display:flex;gap:6px;align-items:center;max-width:1000px;margin:0 auto;}
  .seg{position:relative;flex:1;height:14px;border-radius:8px;background:var(--line-2);}
  .seg.done{background:var(--green);}
  .seg.current{background:var(--blue);box-shadow:0 0 0 3px #bcd2ff;}
  .seg.milestone{height:20px;display:flex;align-items:center;justify-content:center;font-size:1rem;background:#fdebc4;}
  .seg.milestone.done{background:#facc15;}
  .seg.milestone.current{background:var(--amber);box-shadow:0 0 0 3px #fde2a8;}
  .seg.clickable{cursor:pointer;transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;}
  .seg.clickable:hover{filter:brightness(1.07);transform:translateY(-2px);}
  .seg.clickable.done:hover{box-shadow:0 0 0 3px #b9eccd;}

  /* ---------- Mission banner ---------- */
  .banner{max-width:1000px;margin:12px auto 0;width:calc(100% - 36px);
    background:#fff;border:2px solid var(--line);border-left:7px solid var(--blue);
    border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .banner.test{border-left-color:var(--amber);}
  .banner.review{border-left-color:var(--green);}
  .banner .b-emoji{font-size:1.8rem;line-height:1;}
  .banner .b-txt{flex:1;min-width:200px;}
  .banner .b-title{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.08rem;}
  .banner .b-sub{color:#3a4a59;font-weight:700;font-size:1rem;margin-top:4px;line-height:1.45;}
  .banner .b-goal-label{font-weight:800;color:var(--blue-d);margin-right:3px;}
  .banner.test .b-goal-label{color:var(--amber-d);}
  .banner .b-btn{border:2px solid var(--line);background:#f5f9ff;color:var(--blue-d);font-weight:800;
    border-radius:10px;padding:8px 13px;font-size:.9rem;white-space:nowrap;}
  .banner .b-btn:hover{border-color:var(--blue);}
  /* objectifs affichés un par un (jalon) */
  .jalon-head{margin:0 0 4px;}
  .jalon-wrap{overflow:hidden;}
  .jalon-obj{display:flex;align-items:center;gap:11px;background:#fff;border:2px solid #f6d68a;
    border-left:6px solid var(--amber);border-radius:12px;padding:10px 14px;font-weight:700;font-size:1rem;
    color:var(--ink);line-height:1.35;
    transition:transform .45s cubic-bezier(.2,.7,.3,1), opacity .45s ease, background .3s, border-color .3s;}
  .jalon-obj .jo-check{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;background:var(--amber);color:#fff;font-weight:800;font-size:1rem;}
  .jalon-obj .jo-text b{color:var(--amber-d);}
  .jalon-obj.done{background:#eafaf0;border-color:#86efac;border-left-color:var(--green);color:var(--green-d);}
  .jalon-obj.done .jo-check{background:var(--green);}
  .jalon-obj.done .jo-text b{color:var(--green-d);}
  .jalon-obj.blue{border-color:#bcd2ff;border-left-color:var(--blue);}
  .jalon-obj.blue .jo-check{background:var(--blue);}
  .jalon-obj.blue .jo-text b{color:var(--blue-d);}
  .jalon-obj.blue.done{background:#eafaf0;border-color:#86efac;border-left-color:var(--green);color:var(--green-d);}
  .jalon-obj.blue.done .jo-check{background:var(--green);}
  .jalon-obj.blue.done .jo-text b{color:var(--green-d);}
  .jalon-obj.entering{transform:translateY(120%);opacity:0;}
  .jalon-obj.slideup{transform:translateY(-160%);opacity:0;}
  @media(prefers-reduced-motion:reduce){.jalon-obj{transition:opacity .2s ease;}.jalon-obj.entering,.jalon-obj.slideup{transform:none;}}

  /* ---------- Stage (l'écran avec le navigateur) ---------- */
  .stage-wrap{max-width:1000px;margin:12px auto 0;width:calc(100% - 36px);}
  .screen{position:relative;height:clamp(460px,68vh,680px);border-radius:16px;overflow:hidden;
    border:3px solid #cdd9e8;box-shadow:0 18px 40px -24px rgba(34,48,63,.55);
    background:#f9f9fb;user-select:none;-webkit-user-select:none;}
  .screen input,.screen textarea{user-select:text;-webkit-user-select:text;}

  /* ---------- Navigateur Goupil (façon Firefox) ---------- */
  .browser{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--br-bar);}
  .tabstrip{display:flex;align-items:flex-end;gap:3px;padding:7px 8px 0;background:var(--br-strip);flex:none;}
  .tab{display:flex;align-items:center;gap:7px;min-width:120px;max-width:200px;height:34px;
    padding:0 6px 0 11px;border-radius:9px 9px 0 0;background:transparent;color:#3f4a58;
    font-weight:700;font-size:.8rem;cursor:default;position:relative;}
  .tab:hover:not(.active){background:#e9edf4;}
  .tab.active{background:var(--br-bar);box-shadow:0 -3px 8px rgba(20,30,50,.10);}
  .tab .t-ic{font-size:.95rem;flex:none;}
  .tab .t-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;}
  .tab .t-close{flex:none;width:20px;height:20px;border:none;background:transparent;border-radius:5px;
    font-size:.75rem;color:#5a6b7b;display:flex;align-items:center;justify-content:center;padding:0;}
  .tab .t-close:hover{background:#d5dae3;color:var(--ink);}
  .newtab-btn{flex:none;width:30px;height:30px;margin:0 0 2px 3px;border:none;background:transparent;border-radius:8px;
    font-size:1.05rem;color:#3f4a58;display:flex;align-items:center;justify-content:center;}
  .newtab-btn:hover{background:#e9edf4;}
  .toolbar{display:flex;align-items:center;gap:5px;padding:7px 10px;background:var(--br-bar);flex:none;}
  .tool-btn{width:34px;height:32px;border:none;background:transparent;border-radius:8px;font-size:1rem;
    color:#3f4a58;display:flex;align-items:center;justify-content:center;flex:none;}
  .tool-btn:hover:not(:disabled){background:#e7eaf1;}
  .tool-btn:disabled{opacity:.3;cursor:default;}
  .addr-pill{flex:1;display:flex;align-items:center;gap:7px;background:var(--br-pill);
    border:2px solid transparent;border-radius:10px;padding:4px 6px 4px 10px;min-width:0;}
  .addr-pill:focus-within{background:#fff;border-color:#7aa7ec;box-shadow:0 0 0 3px rgba(96,165,250,.28);}
  .addr-lock{font-size:.85rem;flex:none;}
  .addr-lock.warn{filter:grayscale(0);}
  #addrInput{flex:1;border:none;background:none;outline:none;font-family:inherit;font-weight:700;
    font-size:.88rem;color:var(--ink);min-width:0;}
  #addrInput::placeholder{color:#8d9cab;font-weight:600;}
  .addr-go{flex:none;width:26px;height:26px;border:none;background:transparent;border-radius:7px;
    font-size:.9rem;color:#3f4a58;display:none;align-items:center;justify-content:center;padding:0;}
  .addr-pill:focus-within .addr-go{display:flex;}
  .addr-go:hover{background:#e7eaf1;}
  .star-btn{flex:none;width:26px;height:26px;border:none;background:transparent;border-radius:7px;
    font-size:.95rem;color:#8d9cab;display:flex;align-items:center;justify-content:center;padding:0;}
  .star-btn:hover{background:#e7eaf1;}
  .star-btn.on{color:#f59e0b;}
  .loadbar{height:3px;position:relative;background:var(--br-bar);flex:none;}
  .loadbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blue);border-radius:2px;
    transition:width .38s ease;opacity:0;}
  .loadbar.on i{opacity:1;width:72%;}
  .loadbar.fin i{opacity:0;width:100%;transition:width .12s ease, opacity .3s ease .15s;}
  .bmbar{display:flex;gap:6px;padding:4px 12px;background:var(--br-bar);border-bottom:1px solid var(--br-line);
    font-size:.78rem;min-height:30px;align-items:center;overflow:hidden;flex:none;}
  .bmbar .bm-none{color:#9aa9b8;font-weight:600;font-size:.74rem;}
  .bm-chip{display:inline-flex;gap:6px;align-items:center;border:none;background:transparent;border-radius:7px;
    padding:3px 9px;font-weight:700;font-size:.78rem;color:var(--ink);white-space:nowrap;}
  .bm-chip:hover{background:#e7eaf1;}
  .main{flex:1;display:flex;min-height:0;position:relative;background:#fff;}
  .viewport{flex:1;overflow:auto;background:#fff;position:relative;}
  .statusbar{position:absolute;left:0;bottom:0;background:#fff;border:1px solid var(--br-line);
    border-left:none;border-bottom:none;border-radius:0 8px 0 0;padding:3px 10px;font-size:.75rem;
    font-weight:700;color:#3f4a58;display:none;z-index:30;max-width:70%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .statusbar.show{display:block;}
  /* menu ☰ */
  .menu-pop{position:absolute;top:2px;right:8px;z-index:60;background:#fff;border:1px solid var(--br-line);
    border-radius:12px;box-shadow:0 14px 36px rgba(20,30,50,.25);padding:6px;min-width:210px;}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;
    border-radius:8px;padding:8px 11px;font-weight:700;font-size:.86rem;color:var(--ink);text-align:left;}
  .menu-item:hover:not(.off){background:#eff1f6;}
  .menu-item .mi-ic{width:20px;text-align:center;}
  .menu-item.off{opacity:.45;cursor:default;}
  .menu-item .mi-soon{margin-left:auto;font-size:.65rem;font-weight:800;background:#fdebc4;color:#8a6d12;
    border-radius:999px;padding:2px 7px;}
  /* panneau latéral (historique / favoris) */
  .sidebar{width:238px;flex:none;border-right:1px solid var(--br-line);background:#fafbfd;
    display:flex;flex-direction:column;min-height:0;}
  .sb-head{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 13px;border-bottom:1px solid var(--br-line);
    font-weight:800;font-size:.86rem;}
  .sb-head .sb-close{margin-left:auto;width:24px;height:24px;border:none;background:transparent;border-radius:6px;
    font-size:.8rem;color:#5a6b7b;display:flex;align-items:center;justify-content:center;}
  .sb-head .sb-close:hover{background:#e7eaf1;}
  .sb-list{flex:1;overflow:auto;padding:6px;}
  .sb-item{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;
    border-radius:8px;padding:7px 8px;text-align:left;font-size:.78rem;color:var(--ink);}
  .sb-item:hover{background:#eef1f6;}
  .sb-item .si-ic{flex:none;font-size:1rem;}
  .sb-item .si-tx{flex:1;min-width:0;}
  .sb-item .si-t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-item .si-u{color:#7b8b9b;font-weight:600;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-item .si-when{flex:none;color:#9aa9b8;font-weight:700;font-size:.68rem;}
  .sb-item .si-del{flex:none;width:22px;height:22px;border:none;background:transparent;border-radius:6px;
    font-size:.78rem;display:flex;align-items:center;justify-content:center;padding:0;}
  .sb-item .si-del:hover{background:#fde3e3;}
  .sb-empty{color:#9aa9b8;font-weight:700;font-size:.78rem;text-align:center;padding:18px 10px;}

  /* ---------- Pages web simulées ---------- */
  .webpage{min-height:100%;--site:#2563eb;--site-soft:#eef4ff;cursor:default;padding-bottom:26px;}
  .wp-head{display:flex;align-items:center;gap:12px;padding:13px 22px;border-bottom:3px solid var(--site);
    flex-wrap:wrap;background:#fff;}
  .wp-logo{display:flex;align-items:center;gap:9px;font-family:"Fredoka","Fluent Emoji",sans-serif;
    font-weight:700;font-size:1.2rem;color:var(--site);cursor:pointer;border-radius:9px;padding:2px 6px;}
  .wp-logo:hover{background:var(--site-soft);}
  .wp-logo .lg-ic{font-size:1.5rem;}
  .wp-nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;}
  .wp-nav a{font-weight:800;font-size:.86rem;color:var(--ink);text-decoration:none;cursor:pointer;
    padding:7px 12px;border-radius:9px;}
  .wp-nav a:hover{background:var(--site-soft);color:var(--site);}
  .wp-nav a.here{background:var(--site);color:#fff;}
  .wp-body{padding:20px 26px 10px;max-width:780px;margin:0 auto;}
  .wp-body h1{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.6rem;margin:4px 0 12px;}
  .wp-body h2{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.15rem;margin:18px 0 8px;color:var(--site);}
  .wp-body p{font-weight:600;font-size:.96rem;line-height:1.55;color:#33424f;margin:0 0 10px;}
  .wp-body ul{font-weight:600;font-size:.95rem;color:#33424f;line-height:1.6;}
  a.lk{color:#1d4ed8;text-decoration:underline;cursor:pointer;font-weight:700;}
  a.lk:hover{color:#7c3aed;}
  .wp-hero{background:var(--site-soft);border-radius:16px;padding:20px 22px;margin:6px 0 18px;
    display:flex;align-items:center;gap:18px;}
  .wp-hero .h-ic{font-size:3rem;line-height:1;}
  .wp-hero .h-tx{flex:1;}
  .wp-hero .h-tx h1{margin:0 0 6px;}
  .wp-hero .h-tx p{margin:0;}
  .wp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0;}
  .wp-card{border:2px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;cursor:pointer;
    background:#fff;transition:transform .15s ease, box-shadow .15s ease, border-color .15s;}
  .wp-card:hover{transform:translateY(-3px);border-color:var(--site);box-shadow:0 10px 22px -14px rgba(34,48,63,.5);}
  .wp-card .c-ic{font-size:2.3rem;display:block;margin-bottom:7px;}
  .wp-card .c-t{font-weight:800;font-size:.92rem;}
  .wp-card .c-s{font-weight:600;font-size:.76rem;color:var(--muted);margin-top:3px;}
  .wp-img{display:flex;align-items:center;justify-content:center;font-size:4rem;background:var(--site-soft);
    border-radius:16px;padding:22px;margin:10px 0;}
  .wp-img.sm{font-size:2.6rem;padding:12px;}
  .wp-imglink{cursor:pointer;transition:transform .15s ease;border:2px solid transparent;}
  .wp-imglink:hover{transform:scale(1.04);border-color:var(--site);}
  .wp-fact{background:#fff;border:2px solid var(--line);border-left:6px solid var(--site);border-radius:12px;
    padding:10px 14px;margin:8px 0;font-weight:700;font-size:.94rem;color:#33424f;}
  .wp-btnlink{display:inline-flex;align-items:center;gap:8px;background:var(--site);color:#fff;border:none;
    border-radius:11px;padding:11px 18px;font-weight:800;font-size:.95rem;cursor:pointer;margin:6px 4px 6px 0;}
  .wp-btnlink:hover{filter:brightness(1.12);}
  .wp-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem;}
  .wp-table th{background:var(--site);color:#fff;font-weight:800;padding:8px 10px;text-align:left;}
  .wp-table td{border:1px solid var(--line);padding:7px 10px;font-weight:700;color:#33424f;}
  .wp-table tr:nth-child(even) td{background:#f7fafd;}
  .wp-footer{margin-top:26px;padding:14px 26px;border-top:2px solid var(--line-2);color:#8d9cab;
    font-weight:600;font-size:.76rem;text-align:center;}
  .wp-center{text-align:center;}

  /* page d'accueil Goupil */
  .start-page{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:30px 20px;background:linear-gradient(160deg,#fff7ed, #eef4ff 70%);cursor:default;}
  .start-fox{font-size:4rem;line-height:1;}
  .start-title{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:2rem;color:#c2410c;margin:8px 0 2px;}
  .start-sub{font-weight:700;color:var(--muted);margin:0 0 20px;}
  .start-search{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);
    border-radius:999px;padding:8px 8px 8px 18px;width:min(440px,90%);box-shadow:0 10px 26px -18px rgba(34,48,63,.6);}
  .start-search:focus-within{border-color:#7aa7ec;}
  .start-search input{flex:1;border:none;outline:none;background:none;font-family:inherit;font-weight:700;font-size:.95rem;min-width:0;}
  .start-search button{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:.85rem;}
  .start-search button:hover{background:var(--blue-d);}
  .start-tiles{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center;}
  .start-tile{width:96px;border:none;background:#fff;border-radius:14px;padding:13px 8px;cursor:pointer;
    box-shadow:0 8px 20px -14px rgba(34,48,63,.55);border:2px solid transparent;font-family:inherit;}
  .start-tile:hover{border-color:var(--blue);transform:translateY(-3px);}
  .start-tile .st-ic{font-size:1.9rem;display:block;margin-bottom:6px;}
  .start-tile .st-t{font-weight:800;font-size:.72rem;color:var(--ink);}

  /* Cherchetout (moteur de recherche) */
  .ct-home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;cursor:default;}
  .ct-logo{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:2.6rem;margin:6px 0 4px;}
  .ct-logo .c1{color:#2563eb;} .ct-logo .c2{color:#ef4444;} .ct-logo .c3{color:#f59e0b;} .ct-logo .c4{color:#16a34a;}
  .ct-tag{font-weight:700;color:var(--muted);margin:0 0 22px;}
  .ct-box{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);
    border-radius:999px;padding:8px 8px 8px 16px;width:min(480px,92%);box-shadow:0 10px 26px -18px rgba(34,48,63,.6);}
  .ct-box:focus-within{border-color:#7aa7ec;box-shadow:0 0 0 3px rgba(96,165,250,.25);}
  .ct-box .ct-ic{color:#8d9cab;}
  .ct-box input{flex:1;border:none;outline:none;background:none;font-family:inherit;font-weight:700;font-size:.98rem;min-width:0;}
  .ct-box button{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:.88rem;}
  .ct-box button:hover{background:var(--blue-d);}
  .ct-tip{margin-top:18px;font-weight:700;font-size:.85rem;color:var(--muted);background:#fff;
    border:2px dashed var(--line);border-radius:12px;padding:9px 15px;}
  /* page de résultats */

<script>
/* =========================================================
   NAVIGUER SUR INTERNET — navigateur « Goupil » simulé
   (façon Firefox) + faux web interne, missions gamifiées.
   Aucun framework. Tout est piloté par LEVELS[].rounds[].
   ========================================================= */

/* ---------------------------------------------------------
   0. OUTILS GÉNÉRAUX
   --------------------------------------------------------- */
function kbd(s){ return '<kbd>'+s+'</kbd>'; }
function normText(s){
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[’']/g,' ').replace(/[?!.,;:«»"]/g,' ')
    .replace(/\s+/g,' ').trim();
}

/* ---------------------------------------------------------
   1. ÉTAT GLOBAL + STOCKAGE
   --------------------------------------------------------- */
const store={
  get(k){ try{return localStorage.getItem(k);}catch(e){return this._m&&this._m[k];} },
  set(k,v){ try{localStorage.setItem(k,v);}catch(e){ (this._m=this._m||{})[k]=v; } },
  del(k){ try{localStorage.removeItem(k);}catch(e){ if(this._m) delete this._m[k]; } },
  _m:{}
};
let currentLevel=1, STEPS=[], progressIdx=0, playIdx=0, currentStep=null;
const stage=document.getElementById('stage');
const overlay=document.getElementById('overlay');
const modal=document.getElementById('modal');
let soundOn=(store.get('nv_sound')||'1')==='1';

/* B = l'état du navigateur simulé */
const B={
  tabs:[], active:0, seq:0,
  bookmarks:[], history:[],
  panel:null, menuOpen:false,
  homepage:'goupil.start',
  evt:{}
};

function getUnlocked(){ let u=parseInt(store.get('nv_unlocked')||'1',10); if(isNaN(u)||u<1)u=1; return Math.min(u,LEVELS.length); }
function getSavedStep(n){ let s=parseInt(store.get('nv_step_l'+n)||'0',10); return (isNaN(s)||s<0)?0:s; }
function saveProgress(){ store.set('nv_step_l'+currentLevel, String(progressIdx)); }

/* ---------------------------------------------------------
   2. SON (WebAudio, sans fichier externe)
   --------------------------------------------------------- */
let actx=null;
function audioCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function beep(kind){
  if(!soundOn) return; const a=audioCtx(); if(!a) return; const now=a.currentTime;
  function tone(freq,dur,type,vol,delay){
    const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(a.destination); const t=now+(delay||0);
    g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur);
  }
  if(kind==='click'){ tone(420,.03,'square',.05); }
  else if(kind==='open'){ tone(540,.06,'sine',.09); tone(760,.07,'sine',.07,.04); }
  else if(kind==='good'){ tone(740,.09,'sine',.12); tone(1180,.09,'sine',.08,.02); }
  else if(kind==='bad'){ tone(150,.16,'square',.12); }
  else if(kind==='delete'){ tone(300,.08,'sawtooth',.08); tone(180,.12,'sawtooth',.07,.05); }
  else if(kind==='ding'){ tone(880,.12,'sine',.12); tone(1320,.16,'sine',.1,.08); }
  else if(kind==='win'){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.09)); }
}
function refreshSoundBtn(){ document.getElementById('soundBtn').textContent=(soundOn?'🔊':'🔈')+' Son'; }
document.getElementById('soundBtn').onclick=()=>{ soundOn=!soundOn; store.set('nv_sound', soundOn?'1':'0'); refreshSoundBtn(); if(soundOn){ audioCtx(); beep('good'); } };

/* ---------------------------------------------------------
   3. MOTEUR DU NAVIGATEUR (onglets, adresse, historique…)
   --------------------------------------------------------- */
function buildScreen(){
  stage.innerHTML=
    '<div class="screen"><div class="browser" id="browser">'
    + '<div class="tabstrip" id="tabstrip"></div>'
    + '<div class="toolbar">'
    +   '<button class="tool-btn" id="btnBack" title="Page précédente">◀</button>'
    +   '<button class="tool-btn" id="btnFwd" title="Page suivante">▶</button>'
    +   '<button class="tool-btn" id="btnReload" title="Actualiser la page">⟳</button>'
    +   '<button class="tool-btn" id="btnHome" title="Page d\'accueil">🏠</button>'
    +   '<div class="addr-pill" id="addrPill">'
    +     '<span class="addr-lock" id="addrLock">🔒</span>'
    +     '<input id="addrInput" placeholder="Rechercher ou saisir une adresse" spellcheck="false" autocomplete="off">'
    +     '<button class="addr-go" id="btnGo" title="Aller à cette adresse">➜</button>'
    +     '<button class="star-btn" id="btnStar" title="Ajouter cette page aux favoris">☆</button>'
    +   '</div>'
    +   '<button class="tool-btn" id="btnMenu" title="Ouvrir le menu">☰</button>'
    + '</div>'
    + '<div class="loadbar" id="loadbar"><i></i></div>'
    + '<div class="bmbar" id="bmBar"></div>'
    + '<div class="main" id="brMain">'
    +   '<div class="sidebar" id="sidebar" hidden></div>'
    +   '<div class="viewport" id="viewport"></div>'
    +   '<div class="statusbar" id="statusbar"></div>'
    +   '<div class="menu-pop" id="menuPop" hidden></div>'
    + '</div>'
    + '</div></div>';

  document.getElementById('btnBack').onclick=goBack;
  document.getElementById('btnFwd').onclick=goForward;
  document.getElementById('btnReload').onclick=doReload;
  document.getElementById('btnHome').onclick=goHome;
  document.getElementById('btnStar').onclick=toggleBookmark;
  document.getElementById('btnMenu').onclick=(e)=>{ e.stopPropagation(); toggleMenu(); };
  document.getElementById('btnMenu').addEventListener('mousedown', e=>e.stopPropagation());
  document.getElementById('btnGo').addEventListener('mousedown', e=>{ e.preventDefault(); submitAddress(); });

  const inp=document.getElementById('addrInput');
  inp.addEventListener('focus', ()=>{ B.evt.addrFocused=true; setTimeout(()=>inp.select(),0); checkMission(); });
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ submitAddress(); }
    else if(e.key==='Escape'){ inp.blur(); }
  });
  inp.addEventListener('blur', ()=>{ setTimeout(syncAddrBar, 80); });

  const vp=document.getElementById('viewport');
  vp.addEventListener('click', onViewportClick);
  vp.addEventListener('mouseover', onViewportOver);
  vp.addEventListener('mouseout', onViewportOut);
  vp.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.classList && e.target.classList.contains('ct-input')){
      doSearch(e.target.value, 'page');
    }
  });

  document.getElementById('menuPop').addEventListener('mousedown', e=>e.stopPropagation());
  document.getElementById('browser').addEventListener('mousedown', ()=>{ closeMenu(); });
}

/* ----- onglets ----- */
function newTabObj(url){ return { id:'t'+(++B.seq), hist:[url], hidx:0, loading:false }; }
function currentTab(){ return B.tabs[B.active]; }
function curUrl(){ const t=currentTab(); return t ? t.hist[t.hidx] : ''; }

function openNewTab(url, opts){
  opts=opts||{};
  B.tabs.push(newTabObj(url||B.homepage));
  B.active=B.tabs.length-1;
  if(!opts.silent){ B.evt.newTab=true; beep('open'); }
  commitLoad(currentTab());
  if(url===undefined || url===B.homepage){ focusAddr(); }
}
function activateTab(i){
  if(i===B.active || !B.tabs[i]) return;
  B.active=i; B.evt.tabSwitched=true; beep('click');
  renderBrowser(); checkMission();
}
function closeTab(i){
  const t=B.tabs[i]; if(!t) return;
  (B.evt.closedTabs=B.evt.closedTabs||new Set()).add(t.hist[t.hidx]);
  B.tabs.splice(i,1); beep('delete');
  if(!B.tabs.length){ B.tabs.push(newTabObj(B.homepage)); B.active=0; }
  else if(B.active>=B.tabs.length) B.active=B.tabs.length-1;
  else if(i<B.active) B.active--;
  renderBrowser(); checkMission();
}

/* ----- navigation ----- */
let _navToken=0;
function resolveUrl(raw){
  let u=String(raw).trim().toLowerCase();
  u=u.replace(/^https?:\/\//,'');
  if(u.startsWith('www.cherchetout.fr/recherche')) return u;
  u=u.replace(/\/+$/,'');
  if(!u) return B.homepage;
  if(WEB[u]) return u;
  if(WEB['www.'+u]) return 'www.'+u;
  return u;
}
function navigate(url, opts){
  opts=opts||{};
  const t=currentTab(); if(!t) return;
  const u=resolveUrl(url);
  const via=opts.via;
  if(via==='link'){ (B.evt.linkClicks=B.evt.linkClicks||new Set()).add(u); }
  if(via==='addr'){ B.evt.addrNav.push(u); }
  if(via==='serp'){ (B.evt.results=B.evt.results||new Set()).add(u); }
  if(via==='bookmark'){ (B.evt.openedBookmark=B.evt.openedBookmark||new Set()).add(u); }
  if(via==='history'){ (B.evt.openedFromHistory=B.evt.openedFromHistory||new Set()).add(u); }
  if(opts.logo){ B.evt.clickedLogo=true; }
  t.hist=t.hist.slice(0, t.hidx+1);
  t.hist.push(u); t.hidx++;
  loadTab(t);
}
function loadTab(t){
  t.loading=true;
  const bar=document.getElementById('loadbar');
  if(bar){ bar.classList.remove('fin'); bar.classList.add('on'); }
  renderTabs(); syncToolbar();
  const tok=++_navToken;
  beep('click');
  setTimeout(()=>{ if(tok!==_navToken) return; t.loading=false; commitLoad(t); }, 430);
}
function commitLoad(t){
  const url=t.hist[t.hidx];
  const page=getPage(url);
  if(page.real!==false){
    (B.evt.visits=B.evt.visits||new Set()).add(url);
    addHistory(url, page);
  }
  const bar=document.getElementById('loadbar');
  if(bar){ bar.classList.remove('on'); bar.classList.add('fin'); setTimeout(()=>bar.classList.remove('fin'), 420); }
  renderBrowser();
  checkMission();
}
function goBack(){
  const t=currentTab(); if(!t || t.hidx<=0) return;
  t.hidx--; B.evt.usedBack=true; beep('click');
  renderBrowser(); checkMission();
}
function goForward(){
  const t=currentTab(); if(!t || t.hidx>=t.hist.length-1) return;
  t.hidx++; B.evt.usedFwd=true; beep('click');
  renderBrowser(); checkMission();
}
function doReload(){
  const t=currentTab(); if(!t) return;
  B.evt.usedReload=true;
  loadTab(t);
}
function goHome(){
  B.evt.usedHome=true;
  navigate(B.homepage, {});
}
function focusAddr(){
  setTimeout(()=>{ const i=document.getElementById('addrInput'); if(i){ i.focus(); i.select(); } }, 60);
}
function submitAddress(){
  const inp=document.getElementById('addrInput'); if(!inp) return;
  const v=inp.value.trim();
  if(!v) return;
  inp.blur();
  if(/\s/.test(v) || !v.includes('.')){
    B.evt.addrSearch=true;
    doSearch(v, 'addr');
  } else {
    navigate(v, {via:'addr'});
  }
}
function doSearch(q, from){
  q=String(q).trim(); if(!q) return;
  B.evt.searches.push(normText(q));
  navigate('www.cherchetout.fr/recherche?q='+encodeURIComponent(q), {via:(from==='serp'?'search':from)});
}

/* ----- historique & favoris ----- */
function addHistory(url, page){
  if(url===B.homepage) return;
  if(B.history.length && B.history[0].url===url) return;
  B.history.unshift({url:url, title:page.title, icon:page.icon||'🌐', t:Date.now()});
  if(B.history.length>40) B.history.pop();
}
function fmtWhen(h){
  if(h.label) return h.label;
  const d=Date.now()-h.t;
  if(d<60000) return 'À l\'instant';
  const m=Math.round(d/60000);
  return 'Il y a '+m+' min';
}
function isBookmarked(url){ return B.bookmarks.some(b=>b.url===url); }
function toggleBookmark(){
  const url=curUrl(); const page=getPage(url);
  if(url===B.homepage || page.real===false){ toast('Cette page ne peut pas être mise en favori.'); beep('bad'); return; }
  const i=B.bookmarks.findIndex(b=>b.url===url);
  if(i>=0){
    B.bookmarks.splice(i,1);
    (B.evt.bmRemoved=B.evt.bmRemoved||new Set()).add(url);
    beep('delete'); toast('☆ Favori retiré');
  } else {
    B.bookmarks.push({url:url, title:page.bm||page.title, icon:page.icon||'🌐'});
    (B.evt.bmAdded=B.evt.bmAdded||new Set()).add(url);
    beep('ding'); toast('⭐ Page ajoutée aux favoris !');
  }
  renderBrowser(); checkMission();
}
function removeBookmark(url){
  const i=B.bookmarks.findIndex(b=>b.url===url);
  if(i<0) return;
  B.bookmarks.splice(i,1);
  (B.evt.bmRemoved=B.evt.bmRemoved||new Set()).add(url);
  beep('delete'); toast('☆ Favori retiré');
  renderBrowser(); checkMission();
}

/* ----- menu ☰ et panneaux ----- */
function toggleMenu(){ B.menuOpen=!B.menuOpen; renderMenu(); }
function closeMenu(){ if(B.menuOpen){ B.menuOpen=false; renderMenu(); } }
function renderMenu(){
  const m=document.getElementById('menuPop'); if(!m) return;
  if(!B.menuOpen){ m.hidden=true; return; }
  m.hidden=false;
  m.innerHTML=
    '<button class="menu-item" data-act="newtab"><span class="mi-ic">🆕</span>Nouvel onglet</button>'
    +'<button class="menu-item" data-act="history"><span class="mi-ic">🕘</span>Historique</button>'
    +'<button class="menu-item" data-act="bookmarks"><span class="mi-ic">⭐</span>Favoris</button>'
    +'<button class="menu-item off" data-act="dl"><span class="mi-ic">⬇️</span>Téléchargements<span class="mi-soon">bientôt</span></button>'
    +'<button class="menu-item" data-act="home"><span class="mi-ic">🏠</span>Page d\'accueil</button>';
  m.querySelectorAll('.menu-item').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const act=b.getAttribute('data-act');
    B.menuOpen=false; renderMenu();
    if(act==='newtab') openNewTab();
    else if(act==='history') openPanel('history');
    else if(act==='bookmarks') openPanel('bookmarks');
    else if(act==='home') goHome();
    else if(act==='dl'){ toast('⬇️ Les téléchargements arrivent dans un prochain niveau !'); }
  });
}
function openPanel(kind){
  B.panel=kind;
  if(kind==='history'){ B.evt.openedHistoryPanel=true; }
  if(kind==='bookmarks'){ B.evt.openedBmPanel=true; }
  beep('open');
  renderBrowser(); checkMission();
}
function closePanel(){ B.panel=null; renderBrowser(); }

/* ----- rendu ----- */
function renderTabs(){
  const strip=document.getElementById('tabstrip'); if(!strip) return;
  strip.innerHTML='';
  B.tabs.forEach((t,i)=>{
    const url=t.hist[t.hidx]; const page=getPage(url);
    const el=document.createElement('div');
    el.className='tab'+(i===B.active?' active':'');
    el.title=page.title;
    el.innerHTML='<span class="t-ic">'+(t.loading?'⏳':(page.icon||'🌐'))+'</span>'
      +'<span class="t-title">'+(t.loading?'Chargement…':page.title)+'</span>'
      +'<button class="t-close" title="Fermer l\'onglet">✕</button>';
    el.addEventListener('mousedown', e=>{ if(!e.target.classList.contains('t-close')) activateTab(i); });
    el.querySelector('.t-close').onclick=(e)=>{ e.stopPropagation(); closeTab(i); };
    strip.appendChild(el);
  });
  const plus=document.createElement('button');
  plus.className='newtab-btn'; plus.id='btnNewTab'; plus.title='Ouvrir un nouvel onglet'; plus.textContent='+';
  plus.onclick=()=>openNewTab();
  strip.appendChild(plus);
}
function syncAddrBar(){
  const inp=document.getElementById('addrInput'); if(!inp) return;
  if(document.activeElement===inp) return;
  const url=curUrl(); const page=getPage(url);
  inp.value=(url===B.homepage)?'':url;
  const lock=document.getElementById('addrLock');
  if(url===B.homepage){ lock.textContent='🦊'; lock.title='Page d\'accueil de Goupil'; }
  else if(page.real===false){ lock.textContent='⚠️'; lock.title='Page introuvable'; }
  else { lock.textContent='🔒'; lock.title='Connexion sécurisée'; }
}
function syncToolbar(){
  const t=currentTab();
  const bb=document.getElementById('btnBack'), bf=document.getElementById('btnFwd');
  if(bb) bb.disabled=!t || t.hidx<=0;
  if(bf) bf.disabled=!t || t.hidx>=t.hist.length-1;
  const star=document.getElementById('btnStar');
  if(star){
    const on=isBookmarked(curUrl());
    star.textContent=on?'★':'☆';
    star.classList.toggle('on', on);
    star.title=on?'Retirer cette page des favoris':'Ajouter cette page aux favoris';
  }
  syncAddrBar();
}
function renderBmBar(){
  const bar=document.getElementById('bmBar'); if(!bar) return;
  bar.innerHTML='';
  if(!B.bookmarks.length){
    bar.innerHTML='<span class="bm-none">📌 Tes favoris apparaîtront ici — clique sur l\'étoile ☆ pour en ajouter !</span>';
    return;
  }
  B.bookmarks.forEach(b=>{
    const c=document.createElement('button');
    c.className='bm-chip'; c.title=b.url;
    c.innerHTML='<span>'+b.icon+'</span><span>'+b.title+'</span>';
    c.onclick=()=>navigate(b.url, {via:'bookmark'});
    bar.appendChild(c);
  });
}
function renderSidebar(){
  const sb=document.getElementById('sidebar'); if(!sb) return;
  if(!B.panel){ sb.hidden=true; return; }
  sb.hidden=false;
  const isH=B.panel==='history';
  let html='<div class="sb-head"><span>'+(isH?'🕘 Historique':'⭐ Favoris')+'</span>'
    +'<button class="sb-close" title="Fermer le panneau">✕</button></div><div class="sb-list">';
  if(isH){
    if(!B.history.length) html+='<div class="sb-empty">Ton historique est vide.<br>Visite des pages pour le remplir !</div>';
    B.history.forEach((h,i)=>{
      html+='<button class="sb-item" data-h="'+i+'"><span class="si-ic">'+h.icon+'</span>'
        +'<span class="si-tx"><span class="si-t">'+h.title+'</span><span class="si-u">'+h.url+'</span></span>'
        +'<span class="si-when">'+fmtWhen(h)+'</span></button>';
    });
  } else {
    if(!B.bookmarks.length) html+='<div class="sb-empty">Aucun favori pour l\'instant.<br>Clique sur l\'étoile ☆ dans la barre d\'adresse !</div>';
    B.bookmarks.forEach((b,i)=>{
      html+='<div class="sb-item"><span class="si-ic">'+b.icon+'</span>'
        +'<span class="si-tx" data-b="'+i+'" style="cursor:pointer"><span class="si-t">'+b.title+'</span><span class="si-u">'+b.url+'</span></span>'
        +'<button class="si-del" data-del="'+i+'" title="Supprimer ce favori">🗑️</button></div>';
    });
  }
  html+='</div>';
  sb.innerHTML=html;
  sb.querySelector('.sb-close').onclick=closePanel;
  sb.querySelectorAll('[data-h]').forEach(el=>el.onclick=()=>{
    const h=B.history[+el.getAttribute('data-h')];
    if(h) navigate(h.url, {via:'history'});
  });
  sb.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{
    const b=B.bookmarks[+el.getAttribute('data-b')];
    if(b) navigate(b.url, {via:'bookmark'});
  });
  sb.querySelectorAll('[data-del]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const b=B.bookmarks[+el.getAttribute('data-del')];
    if(b) removeBookmark(b.url);
  });
}
function renderViewport(){
  const vp=document.getElementById('viewport'); if(!vp) return;
  const url=curUrl();
  vp.innerHTML=renderPage(url);
  vp.scrollTop=0;
  /* champs de recherche internes aux pages */
  vp.querySelectorAll('.ct-btn').forEach(b=>b.onclick=()=>{
    const box=b.parentElement.querySelector('.ct-input');
    if(box) doSearch(box.value, 'page');
  });
  /* carnet de mission éventuel (quiz) : rien ici, géré hors écran */
}
function renderBrowser(){
  renderTabs(); syncToolbar(); renderBmBar(); renderSidebar(); renderViewport(); renderMenu();
}

/* ----- interactions dans les pages ----- */
function onViewportClick(e){
  const go=e.target.closest('[data-go]');
  if(go){
    e.preventDefault();
    const url=go.getAttribute('data-go');

function onViewportOver(e){

    sb.textContent='https://'+go.getAttribute('data-go');

}

/* ----- graine de mission : remise à zéro du navigateur ----- */
function seedBrowser(seed){
  seed=seed||{};
  B.tabs=[]; B.seq=0; B.active=0;
  B.panel=null; B.menuOpen=false;
  B.bookmarks=(seed.bookmarks||[]).map(u=>{
    const p=getPage(u); return {url:u, title:p.bm||p.title, icon:p.icon||'🌐'};
  });
  B.history=(seed.history||[]).map(h=>{
    const u=typeof h==='string'?h:h.url; const p=getPage(u);
    return {url:u, title:p.title, icon:p.icon||'🌐', t:Date.now(), label:(typeof h==='object'&&h.label)||null};
  });
  B.evt={ answers:{}, searches:[], addrNav:[] };
  (seed.tabs && seed.tabs.length ? seed.tabs : [B.homepage]).forEach(u=>{
    B.tabs.push(newTabObj(resolveUrl(u)));
  });
  B.active=Math.min(seed.active||0, B.tabs.length-1);
  /* les pages déjà « ouvertes » comptent comme visitées */
  B.evt.visits=new Set();
  B.tabs.forEach(t=>{ const u=t.hist[t.hidx]; if(u!==B.homepage) B.evt.visits.add(u); });
  renderBrowser();
  if(seed.focusAddr) focusAddr();
}

const STOPWORDS=new Set(['le','la','les','un','une','des','de','du','d','l','et','ou','est','sont','il','elle','on','ce','cette','ces','se','sa','son','ses','quel','quelle','quels','quelles','combien','comment','pourquoi','quand','qui','que','quoi','sur','dans','pour','avec','sans','au','aux','a','y','en','par','plus','tres','faut','fait','je','tu','veux','sait','savoir']);
function searchResults(q){
  const words=normText(q).split(' ').filter(w=>w.length>1 && !STOPWORDS.has(w));
  if(!words.length) return {words:[], list:[]};
  const scored=INDEX.map(e=>{
    let sc=0;
    const kw=' '+e.kw+' ', t=normText(e.t), s=normText(e.s);
    words.forEach(w=>{
      if(kw.includes(w)) sc+=3;
      if(t.includes(w)) sc+=2;
      if(s.includes(w)) sc+=1;
    });
    return {e:e, sc:sc};
  }).filter(r=>r.sc>0);
  scored.sort((a,b)=>b.sc-a.sc);
  return {words:words, list:scored.slice(0,6).map(r=>r.e)};
}
function serpPage(url){
  let q='';
  const m=url.split('q=')[1];
  if(m!=null){ try{ q=decodeURIComponent(m).replace(/\+/g,' '); }catch(e){ q=m; } }
  return {
    title:(q?q+' — Cherchetout':'Cherchetout'), icon:'🔍', serp:true,
    html:function(){
      const r=searchResults(q);
      let items='';
      if(!r.list.length){
        items='<div class="serp-none">😶 Aucun résultat pour « '+q+' ».<br>Essaie avec d\'autres mots-clés !</div>';
      } else {
        items='<p class="serp-count">Environ '+(r.list.length*1234)+' résultats (0,0'+(2+r.list.length)+' secondes)</p>';
        r.list.forEach(e=>{
          items+='<div class="sr-item">'
            +'<div class="sr-url">🌐 https://'+e.url+'</div>'
            +'<a class="sr-title" data-go="'+e.url+'" data-serp="1">'+e.t+'</a>'
            +'<p class="sr-snip">'+e.s+'</p>'
            +'</div>';
        });
      }
      return '<div class="webpage serp">'
        +'<div class="serp-top">'
        +'<div class="ct-logo" data-go="www.cherchetout.fr"><span class="c1">C</span><span class="c2">t</span> 🔍</div>'
        +'<div class="ct-box"><span class="ct-ic">🔍</span><input class="ct-input" value="'+q.replace(/"/g,'&quot;')+'"><button class="ct-btn">Rechercher</button></div>'
        +'</div>'
        +'<div class="serp-body">'+items+'</div>'
        +'</div>';
    }
  };
}

}

/* objectif « question » : la réponse se donne dans le carnet 📝 sous l'écran */
function quizObj(t, key, q, accepted, hint){
  return { t:t, quiz:{key:key, q:q, accepted:accepted},
    goal:{ spot:'quiz',
      hint:(hint||'La réponse est écrite sur la bonne page !')+' Écris-la dans le <b>carnet 📝</b> sous l\'écran, puis clique <b>Valider</b>.',
      test:c=>{ const v=c.answers[key]; if(v==null) return false; const n=normText(v); return accepted.some(a=>n===a||n.includes(a)); } } };
}

let _missionDone=false;
function checkMission(){
  if(!currentStep) return;
  if(_missionDone) return;
  const objs=currentStep.objectives; if(!objs || !objs.length) return;
  if(currentStep._jalonAnim) return;
  const ctx=buildCtx();
  const i=currentStep._jalonIdx;
  if(i<objs.length && !currentStep._objDone[i]){
    if(objs[i].goal.test(ctx)){
      currentStep._objDone[i]=true; beep('good'); jalonAdvance();
    }
  }
}
function renderJalonObjective(enter){
  const sub=document.getElementById('bSub'); if(!sub) return;
  const s=currentStep, objs=s.objectives||[], i=s._jalonIdx, n=objs.length;
  const blue = s.kind!=='jalon';   /* missions normales = bleu ; défis = orange */
  sub.innerHTML='<div class="jalon-head"><span class="b-goal-label">Objectif '+(Math.min(i+1,n))+' / '+n+'</span></div>'
    +'<div class="jalon-wrap"><div class="jalon-obj'+(blue?' blue':'')+(enter?' entering':'')+'"><span class="jo-check">'+(i+1)+'</span><span class="jo-text">'+(objs[i]&&objs[i].t||'')+'</span></div></div>';
  if(enter) requestAnimationFrame(()=>{ const el=sub.querySelector('.jalon-obj'); if(el) el.classList.remove('entering'); });
  renderQuizDock();
}
function jalonAdvance(){
  currentStep._jalonAnim=true;
  const sub=document.getElementById('bSub'); const el=sub&&sub.querySelector('.jalon-obj');
  if(el){ el.classList.add('done'); const ck=el.querySelector('.jo-check'); if(ck) ck.textContent='✓'; }
  setTimeout(()=>{ if(el) el.classList.add('slideup'); }, 520);
  setTimeout(()=>{
    currentStep._jalonIdx++;
    currentStep._jalonAnim=false;
    const objs=currentStep.objectives||[];
    if(currentStep._jalonIdx>=objs.length){ _missionDone=true; renderQuizDock(); onMissionWin(); return; }
    renderJalonObjective(true);
    /* cascade : si l'objectif révélé est déjà rempli, on enchaîne */
    setTimeout(checkMission, 260);
  }, 980);
}
function activeObj(){
  const objs=(currentStep&&currentStep.objectives)||[]; if(!objs.length) return null;
  return objs[Math.min(currentStep._jalonIdx||0, objs.length-1)];
}

/* ----- le carnet de mission (questions / réponses) ----- */
function renderQuizDock(){
  const dock=document.getElementById('quizDock'); if(!dock) return;
  const o=activeObj(); const q=o && o.quiz;
  if(!q || _missionDone){ dock.hidden=true; dock.innerHTML=''; return; }
  dock.hidden=false;
  dock.innerHTML='<span class="qd-ic">📝</span><div class="qd-q">'+q.q+'</div>'
    +'<input id="qdIn" placeholder="Écris ta réponse ici" autocomplete="off" spellcheck="false">'
    +'<button class="qd-ok" id="qdOk">Valider</button><span class="qd-fb" id="qdFb"></span>';
  const inp=dock.querySelector('#qdIn');
  function submit(){
    const v=inp.value.trim(); if(!v) return;
    B.evt.answers[q.key]=v;
    const n=normText(v);
    if(q.accepted.some(a=>n===a||n.includes(a))){
      checkMission();
    } else {
      beep('bad');
      dock.classList.remove('shake'); void dock.offsetWidth; dock.classList.add('shake');
      dock.querySelector('#qdFb').textContent='Ce n\'est pas ça… cherche la réponse sur la page !';
      inp.select();
    }
  }
  dock.querySelector('#qdOk').onclick=submit;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

/* ---------------------------------------------------------
   7. DÉROULÉ DES MISSIONS
   --------------------------------------------------------- */
function reviewing(){ return playIdx<progressIdx; }
function startStep(idx){
  clearSpots();
  playIdx=idx; currentStep=STEPS[idx]; _missionDone=false;
  currentStep._objDone=(currentStep.objectives||[]).map(()=>false);
  currentStep._jalonIdx=0; currentStep._jalonAnim=false;
  buildScreen();
  seedBrowser(currentStep.seed||{});
  updateProgress(); updateBanner();
  openRoundPopup();
}
function updateProgress(){
  const track=document.getElementById('track'); track.innerHTML='';
  STEPS.forEach((st,i)=>{
    const d=document.createElement('div');
    const mile=st.kind==='jalon';
    d.className='seg'+(mile?' milestone':'');
    if(i<progressIdx) d.classList.add('done');
    if(i===playIdx) d.classList.add('current');
    if(mile) d.textContent='🏆';
    if(i<=progressIdx){
      d.classList.add('clickable');
      d.title=(i===playIdx?'Mission en cours : ':'Revenir à ')+(st.label||'')+' · '+(st.title||'');
      d.onclick=()=>{ if(i<=progressIdx) startStep(i); };
    }
    track.appendChild(d);
  });
  const shown=Math.min(playIdx+1, STEPS.length);
  document.getElementById('stepCount').textContent='Niveau '+currentLevel+' · '+(STEPS[playIdx].label||'')+' ('+shown+'/'+STEPS.length+')';
}
function updateBanner(){
  const b=document.getElementById('banner');
  b.className='banner'+(currentStep.kind==='jalon'?' test':'')+(reviewing()?' review':'');
  document.getElementById('bEmoji').textContent=currentStep.emoji;
  document.getElementById('bTitle').textContent=(reviewing()?'Révision · ':'')+(currentStep.label||'')+' : '+(currentStep.title||'');
  renderJalonObjective(false);
  const lbl=(currentStep.kind==='jalon')?'le défi':'la mission';
  document.getElementById('restartBtn').textContent='↺ Recommencer '+lbl;
  document.getElementById('resetBtn').title='Recommencer '+lbl;
}
function stripTags(s){ return String(s).replace(/<[^>]+>/g,''); }
function refreshLevelBtn(){ const b=document.getElementById('levelBtn'); if(b) b.textContent='🗺️ Niveau '+currentLevel+'/'+LEVELS.length; }

function openLevelIntro(n, cont){
  const lvl=LEVELS[n-1], it=lvl.intro;
  const tools=(it.tools||[]).map(t=>'<li><span class="ni-glyph">'+t.g+'</span> '+t.n+'</li>').join('');
  modal.className='modal';
  modal.innerHTML='<span class="m-emoji">'+it.emoji+'</span>'
    +'<div class="kicker">Niveau '+n+'</div><h2>'+lvl.title+'</h2>'
    +'<p>'+it.lead+'</p>'
    +'<div class="howto"><p class="h-head">👉 Comment faire :</p><p>'+it.teach+'</p></div>'
    +(tools?'<ul class="newtools">'+tools+'</ul>':'')
    +'<div class="m-actions"><button class="m-btn primary green" id="lvlGo">C\'est parti ! 🚀</button></div>';
  openOverlay();
  document.getElementById('lvlGo').onclick=()=>{ closeOverlay(); audioCtx(); cont&&cont(); };
}
function openRoundPopup(){
  const s=currentStep, jalon=s.kind==='jalon';
  const list=(s.objectives||[]).map(o=>'<li><span>'+o.t+'</span></li>').join('');
  modal.className='modal'+(jalon?' test-modal':'');
  modal.innerHTML='<span class="m-emoji">'+s.emoji+'</span>'
    +'<div class="kicker">'+(reviewing()?'Entraînement':s.label)+'</div><h2>'+s.title+'</h2>'
    +'<div class="howto'+(jalon?' test':'')+'"><p class="h-head">'+(jalon?'🏆 Le défi :':'👉 Ta mission :')+'</p>'
    +(s.intro?'<p>'+s.intro+'</p>':'')
    +(list?'<ul class="tasklist">'+list+'</ul>':'')
    +'</div>'
    +'<div class="m-actions"><button class="m-btn primary'+(jalon?' test':'')+'" id="goBtn">C\'est parti ! 🚀</button></div>';
  openOverlay();
  document.getElementById('goBtn').onclick=()=>{ closeOverlay(); audioCtx(); };
}
function onMissionWin(){
  beep('win');
  clearSpots();
  if(reviewing()){
    modal.className='modal good';
    modal.innerHTML='<span class="m-emoji">💪</span><h2>Bien joué !</h2>'
      +'<p>Tu as refait cette mission. On revient à <b>ta mission en cours</b>, ta progression est gardée.</p>'
      +'<div class="m-actions"><button class="m-btn primary green" id="bk">Revenir à ma mission</button></div>';
    openOverlay(); document.getElementById('bk').onclick=()=>{ closeOverlay(); startStep(progressIdx); };
    return;
  }
  const last=playIdx===STEPS.length-1;
  if(last){ progressIdx=STEPS.length; saveProgress(); return levelComplete(); }
  progressIdx=Math.max(progressIdx, playIdx+1); saveProgress();
  const jalon=currentStep.kind==='jalon';
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">'+(jalon?'🏆':'✅')+'</span>'
    +'<h2>'+(jalon?'Défi réussi !':'Mission réussie !')+'</h2>'
    +'<p>'+(jalon?'Bravo, tu maîtrises ! Passe à la suite.':'Super, tu progresses bien. En route pour la mission suivante !')+'</p>'
    +'<div class="m-actions"><button class="m-btn primary green" id="next">Continuer →</button></div>';
  openOverlay(); if(jalon) confetti();
  document.getElementById('next').onclick=()=>{ closeOverlay(); startStep(playIdx+1); };
}
function levelComplete(){
  if(currentLevel>=LEVELS.length) return courseFinish();
  const nextN=currentLevel+1;
  store.set('nv_unlocked', String(Math.max(getUnlocked(), nextN)));
  store.set('nv_step_l'+nextN, '0');
  refreshLevelBtn(); confetti();
  const lvl=LEVELS[nextN-1];
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">🎉</span>'
    +'<div class="kicker" style="color:var(--green-d)">Niveau '+nextN+' débloqué</div>'
    +'<h2>Bravo, tu passes au Niveau '+nextN+' !</h2>'
    +'<p>Tu as terminé le <b>Niveau '+currentLevel+'</b>. Prochaine étape : <b>'+lvl.title+'</b> !</p>'
    +'<div class="m-actions">'
    +'<a class="m-btn ghost" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">🏠 Accueil</a>'
    +'<button class="m-btn primary green" id="goNextLvl">Aller au Niveau '+nextN+' →</button></div>';
  openOverlay();
  document.getElementById('goNextLvl').onclick=()=>{ closeOverlay(); loadLevel(nextN,0,true); };
}
function courseFinish(){
  confetti(); confetti();
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">🦊🏅</span><h2>Quel explorateur du web !</h2>'
    +'<p>Tu as terminé les <b>4 premiers niveaux</b> de <b>Naviguer sur internet</b> ! Tu sais piloter ton navigateur, reconnaître les liens, chercher des informations avec de bons mots-clés et retrouver n\'importe quelle page grâce aux favoris et à l\'historique. 👏</p>'
    +'<p><b>La suite arrive bientôt</b> : les pièges du web 🪤, la sécurité 🔒, les téléchargements ⬇️ et les mots de passe 🔑 !</p>'
    +'<div class="m-actions"><button class="m-btn ghost" id="again">↺ Tout recommencer</button>'
    +'<a class="m-btn primary green" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">🏠 Accueil</a></div>';
  openOverlay();
  document.getElementById('again').onclick=()=>{ closeOverlay(); loadLevel(1,0,true); };
}

/* sélecteur de niveaux */
function openLevelSelector(){
  const unlocked=getUnlocked();
  modal.className='modal';
  const cards=LEVELS.map(lv=>{
    const locked=lv.n>unlocked, cur=lv.n===currentLevel;
    const badge=locked?'🔒':(lv.n<currentLevel?'✓':'▶');
    return '<button class="lvl-card'+(locked?' locked':'')+(cur?' current':'')+'" data-n="'+lv.n+'" '+(locked?'disabled':'')+'>'
      +'<span class="lc-badge">'+badge+'</span><span class="lc-n">Niveau '+lv.n+'</span><span class="lc-t">'+lv.title+'</span></button>';
  }).join('');
  modal.innerHTML='<span class="m-emoji">🗺️</span><h2>Choisis ton niveau</h2>'
    +'<p>Reviens sur un niveau déjà débloqué quand tu veux : ta progression est <b>gardée</b>.</p>'
    +'<div class="lvl-grid">'+cards+'</div>'
    +'<div class="m-actions"><button class="m-btn ghost" id="lsClose">Fermer</button></div>';
  openOverlay();
  modal.querySelectorAll('.lvl-card:not(.locked)').forEach(b=>b.onclick=()=>{ closeOverlay(); loadLevel(+b.getAttribute('data-n'), undefined, true); });
  document.getElementById('lsClose').onclick=()=>closeOverlay();
}

function loadLevel(n, stepIdx, showIntro){
  currentLevel=n;
  store.set('nv_curlevel', String(n));
  STEPS=LEVELS[n-1].rounds;
  const saved=(stepIdx!=null)?stepIdx:getSavedStep(n);
  progressIdx=Math.max(0, Math.min(saved, STEPS.length-1));
  document.getElementById('lvlTitle').innerHTML='Naviguer sur internet <span class="dot">·</span> '+LEVELS[n-1].subtitle;
  refreshLevelBtn();
  if(showIntro) openLevelIntro(n, ()=>startStep(progressIdx));
  else startStep(progressIdx);
}

/* ---------------------------------------------------------
   8. OVERLAY, TOAST, CONFETTI
   --------------------------------------------------------- */
function openOverlay(){ overlay.classList.add('open'); }
function closeOverlay(){ overlay.classList.remove('open'); }
let _toastT=null;
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),6000); }
function confetti(){
  const c=document.createElement('div'); c.className='confetti';
  const colors=['#2563eb','#f59e0b','#16a34a','#ef4444','#7c3aed','#06b6d4'];
  for(let i=0;i<80;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(2.2+Math.random()*1.6)+'s';
    p.style.animationDelay=(Math.random()*.5)+'s';
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(()=>{ c.remove(); }, 4800);
}

/* ---------------------------------------------------------
   9. ASTUCES (surbrillance des bons éléments)
   --------------------------------------------------------- */
let _spots=[], _spotT=null;
function spotEl(el){ if(el){ el.classList.add('spot'); _spots.push(el); } }
function clearSpots(){ clearTimeout(_spotT); _spots.forEach(el=>el.classList.remove('spot')); _spots=[]; }
function highlightForStep(){
  clearSpots();
  const o=activeObj(); if(!o || !o.goal) return;
  const spot=o.goal.spot;
  const q=s=>document.querySelector(s);
  if(spot==='addr')        spotEl(q('#addrPill'));
  else if(spot==='back')   spotEl(q('#btnBack'));
  else if(spot==='fwd')    spotEl(q('#btnFwd'));
  else if(spot==='reload') spotEl(q('#btnReload'));
  else if(spot==='home')   spotEl(q('#btnHome'));
  else if(spot==='star')   spotEl(q('#btnStar'));
  else if(spot==='menu')   spotEl(q('#btnMenu'));
  else if(spot==='bmbar')  spotEl(q('#bmBar'));
  else if(spot==='tabs')   spotEl(q('#tabstrip'));
  else if(spot==='newtab') spotEl(q('#btnNewTab'));
  else if(spot==='quiz')   spotEl(q('#quizDock'));
  else if(spot==='logo')   spotEl(q('#viewport .wp-logo'));
  else if(spot==='links'){ document.querySelectorAll('#viewport [data-go]').forEach(spotEl); }
  else if(spot==='search'){ document.querySelectorAll('#viewport .ct-box, #viewport .start-search').forEach(spotEl); spotEl(q('#addrPill')); }
  else if(spot==='sidebar'){ const sb=q('#sidebar'); if(sb && !sb.hidden) spotEl(sb); else spotEl(q('#btnMenu')); }
  if(_spots.length) _spotT=setTimeout(clearSpots, 6000);
}
function onHint(){
  if(overlay.classList.contains('open')) return;
  const s=currentStep; if(!s) return;
  const ao=activeObj();
  const hintTxt=(ao && ao.goal && ao.goal.hint) ? ao.goal.hint : stripTags((ao&&ao.t)||'');
  modal.className='modal test-modal';
  modal.innerHTML='<span class="m-emoji">💡</span><div class="kicker" style="color:var(--amber-d)">Astuce</div>'
    +'<h2>'+(s.title||'Astuce')+'</h2>'
    +'<div class="howto test"><p class="h-head">👉 Comment faire :</p><p>'+hintTxt+'</p></div>'
    +'<p style="font-size:.95rem;color:var(--muted)">Les éléments importants vont <b>briller en jaune</b> ✨ sur l\'écran.</p>'
    +'<div class="m-actions"><button class="m-btn primary test" id="hintGo">Montre-moi ✨</button></div>';
  openOverlay();
  document.getElementById('hintGo').onclick=()=>{ closeOverlay(); highlightForStep(); };
}

/* boutons de la page */
document.getElementById('hintBtn').onclick=onHint;
document.getElementById('restartBtn').onclick=()=>startStep(playIdx);
document.getElementById('resetBtn').onclick=()=>startStep(playIdx);
document.getElementById('seeMission').onclick=()=>openRoundPopup();
document.getElementById('levelBtn').onclick=()=>openLevelSelector();

/* ---------------------------------------------------------
   10. INIT
   --------------------------------------------------------- */
(function init(){
  refreshSoundBtn();
  const go=/[?&]go=(\d+)(?:[.\-_](\d+))?/.exec(location.search);
  if(go){
    const L=Math.max(1,Math.min(LEVELS.length, parseInt(go[1],10)));
    store.set('nv_unlocked', String(Math.max(getUnlocked(), L)));
    store.set('nv_curlevel', String(L));
    if(go[2]!=null) store.set('nv_step_l'+L, String(Math.max(0, parseInt(go[2],10))));
  }
  let lvl=parseInt(store.get('nv_curlevel')||'1',10);
  if(isNaN(lvl)||lvl<1||lvl>LEVELS.length) lvl=1;
  lvl=Math.min(lvl, getUnlocked());
  loadLevel(lvl, getSavedStep(lvl), !go);
})();

/* ---------------------------------------------------------
   11. ACCÈS DÉVELOPPEUR
   --------------------------------------------------------- */
(function devkit(){
  const UNLOCK='nv_unlocked', CUR='nv_curlevel', STEP='nv_step_l', HOME='naviguer-internet.html';
  const css=`
  #devkit{position:fixed;right:14px;bottom:14px;z-index:300;font-family:"Nunito",system-ui,"Fluent Emoji",sans-serif;}
  #devkit .dk-toggle{display:inline-flex;align-items:center;gap:6px;background:#1e2733;color:#e7eef6;border:none;
    border-radius:999px;padding:9px 14px;font-weight:800;font-size:.85rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28);}
  #devkit .dk-toggle:hover{background:#2a3645;}
  #devkit .dk-panel{display:none;position:absolute;right:0;bottom:48px;width:320px;max-height:72vh;overflow:auto;
    background:#1e2733;color:#e7eef6;border-radius:14px;padding:12px 12px 14px;box-shadow:0 16px 40px rgba(0,0,0,.42);}
  #devkit.open .dk-panel{display:block;}
  #devkit .dk-head{font-weight:800;font-size:.95rem;margin:0 0 2px;}
  #devkit .dk-note{color:#9fb0c4;font-size:.72rem;margin:0 0 6px;line-height:1.35;}
  #devkit .dk-lv{font-weight:800;color:#9fc3ff;margin:11px 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;}
  #devkit .dk-step{display:block;width:100%;text-align:left;background:#2b3949;color:#e7eef6;border:1px solid #3a4a5c;
    border-radius:8px;padding:6px 9px;margin:3px 0;cursor:pointer;font-size:.78rem;line-height:1.3;}
  #devkit .dk-step:hover{background:#37485c;border-color:#5a7088;}
  #devkit .dk-step.jalon{border-color:#f6b73c;}
  #devkit .dk-step b{color:#ffd479;}
  #devkit .dk-actions{display:flex;gap:6px;margin-top:12px;}
  #devkit .dk-act{flex:1;background:#33455a;color:#e7eef6;border:1px solid #44586e;border-radius:8px;padding:7px;
    font-weight:700;font-size:.74rem;cursor:pointer;}
  #devkit .dk-act:hover{background:#3d5167;}`;
  const style=document.createElement('style'); style.textContent=css; document.head.appendChild(style);
  const root=document.createElement('div'); root.id='devkit';
  let html='<button class="dk-toggle" id="dkToggle">🛠️ Dev</button>'
    +'<div class="dk-panel"><p class="dk-head">🛠️ Accès développeur</p>'
    +'<p class="dk-note">Saute à une mission : tout ce qui précède est considéré comme réussi.</p>';
  LEVELS.forEach(lv=>{
    html+='<div class="dk-lv">Niveau '+lv.n+' — '+lv.title+'</div>';
    lv.rounds.forEach((d,i)=>{
      const isJ=(d.kind==='jalon');
      html+='<button class="dk-step'+(isJ?' jalon':'')+'" data-l="'+lv.n+'" data-s="'+i+'"><b>'+(d.label||('Mission '+(i+1)))+'</b> · '+(d.title||'')+'</button>';
    });
  });
  html+='<div class="dk-actions"><button class="dk-act" id="dkUnlockAll">🔓 Tout débloquer</button>'
    +'<button class="dk-act" id="dkReset">🧹 Reset complet</button></div></div>';
  root.innerHTML=html; document.body.appendChild(root);
  function devJump(L,S){
    L=Math.max(1,Math.min(LEVELS.length,L));
    const maxS=LEVELS[L-1].rounds.length-1; S=Math.max(0,Math.min(maxS,S||0));
    store.set(UNLOCK, String(Math.max(getUnlocked(),L))); store.set(CUR, String(L)); store.set(STEP+L, String(S));
    closeOverlay(); loadLevel(L,S,false);
  }
  document.getElementById('dkToggle').onclick=()=>root.classList.toggle('open');
  root.querySelectorAll('.dk-step').forEach(b=>b.onclick=()=>{ root.classList.remove('open'); devJump(+b.getAttribute('data-l'), +b.getAttribute('data-s')); });
  document.getElementById('dkUnlockAll').onclick=()=>{ store.set(UNLOCK, String(LEVELS.length)); refreshLevelBtn(); };
  document.getElementById('dkReset').onclick=()=>{ const keys=[UNLOCK,CUR]; for(let i=1;i<=LEVELS.length;i++) keys.push(STEP+i); keys.forEach(k=>store.del(k)); location.href=HOME; };
})();
</script>
<script>
/* Bouton bascule OpenDyslexic — préférence partagée entre toutes les pages */
(function(){
  var KEY='a11y_dys', root=document.documentElement;
  var btn=document.createElement('button');
  btn.type='button'; btn.className='dys-toggle';
  btn.innerHTML='<span class="dys-ic" aria-hidden="true">🔤</span><span class="dys-label">Mode Dyslexique</span><span class="dys-switch"><span class="dys-knob"></span></span>';
  function apply(on){ root.classList.toggle('dys',on); btn.setAttribute('aria-pressed',on?'true':'false');
    btn.title=on?'Mode Dyslexique activé — clique pour revenir à la police normale':'Activer le Mode Dyslexique (police OpenDyslexic)'; }
  btn.addEventListener('click',function(){ var want=!root.classList.contains('dys'); try{localStorage.setItem(KEY,want?'1':'0');}catch(e){} apply(want); });
  document.body.appendChild(btn);
  var on=false; try{on=localStorage.getItem(KEY)==='1';}catch(e){} apply(on);
})();
</script>
