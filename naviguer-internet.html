<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naviguer sur internet — Atelier informatique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Police d'emojis unifiée sur tous les systèmes (cf. assets/fonts/README.md) */
  @font-face{
    font-family:"Fluent Emoji";
    src:url("assets/fonts/fluent-emoji.woff2") format("woff2");
    font-display:swap;
  }
  :root{
    --ink:#22303f; --muted:#5a6b7b;
    --blue:#2563eb; --blue-d:#1d4ed8;
    --amber:#f59e0b; --amber-d:#b45309;
    --green:#16a34a; --green-d:#15803d;
    --red:#ef4444; --red-d:#b91c1c;
    --paper:#ffffff; --line:#d7e0ea; --line-2:#e7eef6;
    --shell:#e9eff7;
    /* navigateur */
    --br-strip:#dfe3ec; --br-bar:#f9f9fb; --br-line:#dcdfe6; --br-pill:#eff1f6;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Nunito",system-ui,"Fluent Emoji",sans-serif;color:var(--ink);
    background:var(--shell);min-height:100vh;display:flex;flex-direction:column;
  }
  button{font-family:inherit;cursor:pointer;}
  .display{font-family:"Fredoka","Fluent Emoji",sans-serif;}
  kbd{
    display:inline-flex;align-items:center;justify-content:center;min-width:22px;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:.84em;line-height:1;
    padding:3px 7px;border-radius:7px;background:#fff;border:2px solid #c7d4e6;
    border-bottom-width:3px;color:var(--ink);box-shadow:0 1px 0 #e7eef6;margin:0 1px;white-space:nowrap;}

  /* ---------- Top bar ---------- */
  .topbar{background:#fff;border-bottom:2px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;}
  .back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--blue-d);
    font-weight:800;font-size:.98rem;padding:8px 12px;border-radius:10px;}
  .back:hover{background:#eef4ff;}
  .topbar h1{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.15rem;margin:0;flex:1;}
  .topbar h1 .dot{color:var(--blue);}
  .reset-btn{border:2px solid var(--line);background:#fff;color:var(--muted);font-weight:700;
    border-radius:10px;padding:7px 11px;font-size:.85rem;}
  .reset-btn:hover{border-color:var(--blue);color:var(--blue-d);}
  .reset-btn.danger:hover{border-color:var(--red);color:var(--red-d);}

  /* ---------- Progress ---------- */
  .progress-wrap{background:#fff;padding:8px 18px 14px;border-bottom:2px solid var(--line);}
  .track{display:flex;gap:6px;align-items:center;max-width:1000px;margin:0 auto;}
  .seg{position:relative;flex:1;height:14px;border-radius:8px;background:var(--line-2);}
  .seg.done{background:var(--green);}
  .seg.current{background:var(--blue);box-shadow:0 0 0 3px #bcd2ff;}
  .seg.milestone{height:20px;display:flex;align-items:center;justify-content:center;font-size:1rem;background:#fdebc4;}
  .seg.milestone.done{background:#facc15;}
  .seg.milestone.current{background:var(--amber);box-shadow:0 0 0 3px #fde2a8;}
  .seg.clickable{cursor:pointer;transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;}
  .seg.clickable:hover{filter:brightness(1.07);transform:translateY(-2px);}
  .seg.clickable.done:hover{box-shadow:0 0 0 3px #b9eccd;}

  /* ---------- Mission banner ---------- */
  .banner{max-width:1000px;margin:12px auto 0;width:calc(100% - 36px);
    background:#fff;border:2px solid var(--line);border-left:7px solid var(--blue);
    border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .banner.test{border-left-color:var(--amber);}
  .banner.review{border-left-color:var(--green);}
  .banner .b-emoji{font-size:1.8rem;line-height:1;}
  .banner .b-txt{flex:1;min-width:200px;}
  .banner .b-title{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.08rem;}
  .banner .b-sub{color:#3a4a59;font-weight:700;font-size:1rem;margin-top:4px;line-height:1.45;}
  .banner .b-goal-label{font-weight:800;color:var(--blue-d);margin-right:3px;}
  .banner.test .b-goal-label{color:var(--amber-d);}
  .banner .b-btn{border:2px solid var(--line);background:#f5f9ff;color:var(--blue-d);font-weight:800;
    border-radius:10px;padding:8px 13px;font-size:.9rem;white-space:nowrap;}
  .banner .b-btn:hover{border-color:var(--blue);}
  /* objectifs affichés un par un (jalon) */
  .jalon-head{margin:0 0 4px;}
  .jalon-wrap{overflow:hidden;}
  .jalon-obj{display:flex;align-items:center;gap:11px;background:#fff;border:2px solid #f6d68a;
    border-left:6px solid var(--amber);border-radius:12px;padding:10px 14px;font-weight:700;font-size:1rem;
    color:var(--ink);line-height:1.35;
    transition:transform .45s cubic-bezier(.2,.7,.3,1), opacity .45s ease, background .3s, border-color .3s;}
  .jalon-obj .jo-check{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;background:var(--amber);color:#fff;font-weight:800;font-size:1rem;}
  .jalon-obj .jo-text b{color:var(--amber-d);}
  .jalon-obj.done{background:#eafaf0;border-color:#86efac;border-left-color:var(--green);color:var(--green-d);}
  .jalon-obj.done .jo-check{background:var(--green);}
  .jalon-obj.done .jo-text b{color:var(--green-d);}
  .jalon-obj.blue{border-color:#bcd2ff;border-left-color:var(--blue);}
  .jalon-obj.blue .jo-check{background:var(--blue);}
  .jalon-obj.blue .jo-text b{color:var(--blue-d);}
  .jalon-obj.blue.done{background:#eafaf0;border-color:#86efac;border-left-color:var(--green);color:var(--green-d);}
  .jalon-obj.blue.done .jo-check{background:var(--green);}
  .jalon-obj.blue.done .jo-text b{color:var(--green-d);}
  .jalon-obj.entering{transform:translateY(120%);opacity:0;}
  .jalon-obj.slideup{transform:translateY(-160%);opacity:0;}
  @media(prefers-reduced-motion:reduce){.jalon-obj{transition:opacity .2s ease;}.jalon-obj.entering,.jalon-obj.slideup{transform:none;}}

  /* ---------- Stage (l'écran avec le navigateur) ---------- */
  .stage-wrap{max-width:1000px;margin:12px auto 0;width:calc(100% - 36px);}
  .screen{position:relative;height:clamp(460px,68vh,680px);border-radius:16px;overflow:hidden;
    border:3px solid #cdd9e8;box-shadow:0 18px 40px -24px rgba(34,48,63,.55);
    background:#f9f9fb;user-select:none;-webkit-user-select:none;}
  .screen input,.screen textarea{user-select:text;-webkit-user-select:text;}

  /* ---------- Navigateur Goupil (façon Firefox) ---------- */
  .browser{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--br-bar);}
  .tabstrip{display:flex;align-items:flex-end;gap:3px;padding:7px 8px 0;background:var(--br-strip);flex:none;}
  .tab{display:flex;align-items:center;gap:7px;min-width:44px;max-width:200px;height:34px;
    padding:0 6px 0 11px;border-radius:9px 9px 0 0;background:transparent;color:#3f4a58;
    font-weight:700;font-size:.8rem;cursor:default;position:relative;}
  .tab:hover:not(.active){background:#e9edf4;}
  .tab.active{background:var(--br-bar);box-shadow:0 -3px 8px rgba(20,30,50,.10);}
  .tab .t-ic{font-size:.95rem;flex:none;}
  .tab .t-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;}
  .tab .t-close{flex:none;width:20px;height:20px;border:none;background:transparent;border-radius:5px;
    font-size:.75rem;color:#5a6b7b;display:flex;align-items:center;justify-content:center;padding:0;}
  .tab .t-close:hover{background:#d5dae3;color:var(--ink);}
  .newtab-btn{flex:none;width:30px;height:30px;margin:0 0 2px 3px;border:none;background:transparent;border-radius:8px;
    font-size:1.05rem;color:#3f4a58;display:flex;align-items:center;justify-content:center;}
  .newtab-btn:hover{background:#e9edf4;}
  .toolbar{display:flex;align-items:center;gap:5px;padding:7px 10px;background:var(--br-bar);flex:none;}
  .tool-btn{width:34px;height:32px;border:none;background:transparent;border-radius:8px;font-size:1rem;
    color:#3f4a58;display:flex;align-items:center;justify-content:center;flex:none;}
  .tool-btn:hover:not(:disabled){background:#e7eaf1;}
  .tool-btn:disabled{opacity:.3;cursor:default;}
  .addr-pill{flex:1;display:flex;align-items:center;gap:7px;background:var(--br-pill);
    border:2px solid transparent;border-radius:10px;padding:4px 6px 4px 10px;min-width:0;}
  .addr-pill:focus-within{background:#fff;border-color:#7aa7ec;box-shadow:0 0 0 3px rgba(96,165,250,.28);}
  .addr-lock{font-size:.85rem;flex:none;}
  .addr-lock.warn{filter:grayscale(0);}
  #addrInput{flex:1;border:none;background:none;outline:none;font-family:inherit;font-weight:700;
    font-size:.88rem;color:var(--ink);min-width:0;}
  #addrInput::placeholder{color:#8d9cab;font-weight:600;}
  .addr-go{flex:none;width:26px;height:26px;border:none;background:transparent;border-radius:7px;
    font-size:.9rem;color:#3f4a58;display:none;align-items:center;justify-content:center;padding:0;}
  .addr-pill:focus-within .addr-go{display:flex;}
  .addr-go:hover{background:#e7eaf1;}
  .star-btn{flex:none;width:26px;height:26px;border:none;background:transparent;border-radius:7px;
    font-size:.95rem;color:#8d9cab;display:flex;align-items:center;justify-content:center;padding:0;}
  .star-btn:hover{background:#e7eaf1;}
  .star-btn.on{color:#f59e0b;}
  .loadbar{height:3px;position:relative;background:var(--br-bar);flex:none;}
  .loadbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blue);border-radius:2px;
    transition:width .38s ease;opacity:0;}
  .loadbar.on i{opacity:1;width:72%;}
  .loadbar.fin i{opacity:0;width:100%;transition:width .12s ease, opacity .3s ease .15s;}
  .bmbar{display:flex;gap:6px;padding:4px 12px;background:var(--br-bar);border-bottom:1px solid var(--br-line);
    font-size:.78rem;min-height:30px;align-items:center;overflow:hidden;flex:none;}
  .bmbar .bm-none{color:#9aa9b8;font-weight:600;font-size:.74rem;}
  .bm-chip{display:inline-flex;gap:6px;align-items:center;border:none;background:transparent;border-radius:7px;
    padding:3px 9px;font-weight:700;font-size:.78rem;color:var(--ink);white-space:nowrap;}
  .bm-chip:hover{background:#e7eaf1;}
  .main{flex:1;display:flex;min-height:0;position:relative;background:#fff;}
  .viewport{flex:1;overflow:auto;background:#fff;position:relative;}
  .statusbar{position:absolute;left:0;bottom:0;background:#fff;border:1px solid var(--br-line);
    border-left:none;border-bottom:none;border-radius:0 8px 0 0;padding:3px 10px;font-size:.75rem;
    font-weight:700;color:#3f4a58;display:none;z-index:30;max-width:70%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .statusbar.show{display:block;}
  /* menu ☰ */
  .menu-pop{position:absolute;top:2px;right:8px;z-index:60;background:#fff;border:1px solid var(--br-line);
    border-radius:12px;box-shadow:0 14px 36px rgba(20,30,50,.25);padding:6px;min-width:210px;}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;
    border-radius:8px;padding:8px 11px;font-weight:700;font-size:.86rem;color:var(--ink);text-align:left;}
  .menu-item:hover:not(.off){background:#eff1f6;}
  .menu-item .mi-ic{width:20px;text-align:center;}
  .menu-item.off{opacity:.45;cursor:default;}
  .menu-item .mi-soon{margin-left:auto;font-size:.65rem;font-weight:800;background:#fdebc4;color:#8a6d12;
    border-radius:999px;padding:2px 7px;}
  /* panneau latéral (historique / favoris) */
  .sidebar{width:238px;flex:none;border-right:1px solid var(--br-line);background:#fafbfd;
    display:flex;flex-direction:column;min-height:0;}
  .sb-head{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 13px;border-bottom:1px solid var(--br-line);
    font-weight:800;font-size:.86rem;}
  .sb-head .sb-close{margin-left:auto;width:24px;height:24px;border:none;background:transparent;border-radius:6px;
    font-size:.8rem;color:#5a6b7b;display:flex;align-items:center;justify-content:center;}
  .sb-head .sb-close:hover{background:#e7eaf1;}
  .sb-list{flex:1;overflow:auto;padding:6px;}
  .sb-item{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;
    border-radius:8px;padding:7px 8px;text-align:left;font-size:.78rem;color:var(--ink);}
  .sb-item:hover{background:#eef1f6;}
  .sb-item .si-ic{flex:none;font-size:1rem;}
  .sb-item .si-tx{flex:1;min-width:0;}
  .sb-item .si-t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-item .si-u{color:#7b8b9b;font-weight:600;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-item .si-when{flex:none;color:#9aa9b8;font-weight:700;font-size:.68rem;}
  .sb-item .si-del{flex:none;width:22px;height:22px;border:none;background:transparent;border-radius:6px;
    font-size:.78rem;display:flex;align-items:center;justify-content:center;padding:0;}
  .sb-item .si-del:hover{background:#fde3e3;}
  .sb-empty{color:#9aa9b8;font-weight:700;font-size:.78rem;text-align:center;padding:18px 10px;}

  /* ---------- Pages web simulées ---------- */
  .webpage{min-height:100%;--site:#2563eb;--site-soft:#eef4ff;cursor:default;padding-bottom:26px;}
  .wp-head{display:flex;align-items:center;gap:12px;padding:13px 22px;border-bottom:3px solid var(--site);
    flex-wrap:wrap;background:#fff;}
  .wp-logo{display:flex;align-items:center;gap:9px;font-family:"Fredoka","Fluent Emoji",sans-serif;
    font-weight:700;font-size:1.2rem;color:var(--site);cursor:pointer;border-radius:9px;padding:2px 6px;}
  .wp-logo:hover{background:var(--site-soft);}
  .wp-logo .lg-ic{font-size:1.5rem;}
  .wp-nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;}
  .wp-nav a{font-weight:800;font-size:.86rem;color:var(--ink);text-decoration:none;cursor:pointer;
    padding:7px 12px;border-radius:9px;}
  .wp-nav a:hover{background:var(--site-soft);color:var(--site);}
  .wp-nav a.here{background:var(--site);color:#fff;}
  .wp-body{padding:20px 26px 10px;max-width:780px;margin:0 auto;}
  .wp-body h1{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.6rem;margin:4px 0 12px;}
  .wp-body h2{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.15rem;margin:18px 0 8px;color:var(--site);}
  .wp-body p{font-weight:600;font-size:.96rem;line-height:1.55;color:#33424f;margin:0 0 10px;}
  .wp-body ul{font-weight:600;font-size:.95rem;color:#33424f;line-height:1.6;}
  a.lk{color:#1d4ed8;text-decoration:underline;cursor:pointer;font-weight:700;}
  a.lk:hover{color:#7c3aed;}
  .wp-hero{background:var(--site-soft);border-radius:16px;padding:20px 22px;margin:6px 0 18px;
    display:flex;align-items:center;gap:18px;}
  .wp-hero .h-ic{font-size:3rem;line-height:1;}
  .wp-hero .h-tx{flex:1;}
  .wp-hero .h-tx h1{margin:0 0 6px;}
  .wp-hero .h-tx p{margin:0;}
  .wp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0;}
  .wp-card{border:2px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;cursor:pointer;
    background:#fff;transition:transform .15s ease, box-shadow .15s ease, border-color .15s;}
  .wp-card:hover{transform:translateY(-3px);border-color:var(--site);box-shadow:0 10px 22px -14px rgba(34,48,63,.5);}
  .wp-card .c-ic{font-size:2.3rem;display:block;margin-bottom:7px;}
  .wp-card .c-t{font-weight:800;font-size:.92rem;}
  .wp-card .c-s{font-weight:600;font-size:.76rem;color:var(--muted);margin-top:3px;}
  .wp-img{display:flex;align-items:center;justify-content:center;font-size:4rem;background:var(--site-soft);
    border-radius:16px;padding:22px;margin:10px 0;}
  .wp-img.sm{font-size:2.6rem;padding:12px;}
  .wp-imglink{cursor:pointer;transition:transform .15s ease;border:2px solid transparent;}
  .wp-imglink:hover{transform:scale(1.04);border-color:var(--site);}
  .wp-fact{background:#fff;border:2px solid var(--line);border-left:6px solid var(--site);border-radius:12px;
    padding:10px 14px;margin:8px 0;font-weight:700;font-size:.94rem;color:#33424f;}
  .wp-btnlink{display:inline-flex;align-items:center;gap:8px;background:var(--site);color:#fff;border:none;
    border-radius:11px;padding:11px 18px;font-weight:800;font-size:.95rem;cursor:pointer;margin:6px 4px 6px 0;}
  .wp-btnlink:hover{filter:brightness(1.12);}
  .wp-doorgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;}
  .wp-doorgrid .wp-btnlink{margin:0;padding:12px 8px;min-width:52px;justify-content:center;font-size:.85rem;}
  .wp-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem;}
  .wp-table th{background:var(--site);color:#fff;font-weight:800;padding:8px 10px;text-align:left;}
  .wp-table td{border:1px solid var(--line);padding:7px 10px;font-weight:700;color:#33424f;}
  .wp-table tr:nth-child(even) td{background:#f7fafd;}
  .wp-footer{margin-top:26px;padding:14px 26px;border-top:2px solid var(--line-2);color:#8d9cab;
    font-weight:600;font-size:.76rem;text-align:center;}
  .wp-center{text-align:center;}
  /* infos cliquables — actives UNIQUEMENT pendant la Course contre Pixel (N3M2) */
  .course-info [data-info]{cursor:pointer;border-radius:8px;outline:2px dashed transparent;
    transition:outline-color .12s ease, background .12s ease;}
  .course-info [data-info]:hover{outline-color:var(--site);background:var(--site-soft);}
  .course-info td[data-info]:hover{box-shadow:inset 0 0 0 2px var(--site);}

  /* page d'accueil Goupil */
  .start-page{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:30px 20px;background:linear-gradient(160deg,#fff7ed, #eef4ff 70%);cursor:default;}
  .start-fox{font-size:4rem;line-height:1;}
  .start-title{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:2rem;color:#c2410c;margin:8px 0 2px;}
  .start-sub{font-weight:700;color:var(--muted);margin:0 0 20px;}
  .start-search{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);
    border-radius:999px;padding:8px 8px 8px 18px;width:min(440px,90%);box-shadow:0 10px 26px -18px rgba(34,48,63,.6);}
  .start-search:focus-within{border-color:#7aa7ec;}
  .start-search input{flex:1;border:none;outline:none;background:none;font-family:inherit;font-weight:700;font-size:.95rem;min-width:0;}
  .start-search button{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:.85rem;}
  .start-search button:hover{background:var(--blue-d);}
  .start-tiles{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center;}
  .start-tile{width:96px;border:none;background:#fff;border-radius:14px;padding:13px 8px;cursor:pointer;
    box-shadow:0 8px 20px -14px rgba(34,48,63,.55);border:2px solid transparent;font-family:inherit;}
  .start-tile:hover{border-color:var(--blue);transform:translateY(-3px);}
  .start-tile .st-ic{font-size:1.9rem;display:block;margin-bottom:6px;}
  .start-tile .st-t{font-weight:800;font-size:.72rem;color:var(--ink);}

  /* Cherchetout (moteur de recherche) */
  .ct-home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;cursor:default;}
  .ct-logo{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:2.6rem;margin:6px 0 4px;}
  .ct-logo .c1{color:#2563eb;} .ct-logo .c2{color:#ef4444;} .ct-logo .c3{color:#f59e0b;} .ct-logo .c4{color:#16a34a;}
  .ct-tag{font-weight:700;color:var(--muted);margin:0 0 22px;}
  .ct-box{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);
    border-radius:999px;padding:8px 8px 8px 16px;width:min(480px,92%);box-shadow:0 10px 26px -18px rgba(34,48,63,.6);}
  .ct-box:focus-within{border-color:#7aa7ec;box-shadow:0 0 0 3px rgba(96,165,250,.25);}

  .ord-card{position:absolute;left:50%;top:128px;transform:translateX(-50%);z-index:110;pointer-events:none;

  .ord-card.pop{animation:ordPopK .3s ease;}
  @keyframes ordPopK{0%{transform:translateX(-50%) scale(.7);}70%{transform:translateX(-50%) scale(1.06);}100%{transform:translateX(-50%) scale(1);}}
  .px-bar{width:230px;height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:7px auto 3px;}
  .px-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#dc2626);border-radius:99px;transition:width .25s linear;}
  .px-lbl{font-size:.74rem;color:var(--muted);display:block;font-family:"Nunito",sans-serif;font-weight:800;}
  /* étoiles gagnées */
  .progress-wrap{padding-top:20px;}

  .lc-stars{font-size:.72rem;font-weight:800;color:#b45309;}

  @keyframes starPopK{0%{transform:scale(.4);opacity:.4;}60%{transform:scale(1.5);opacity:1;}100%{transform:scale(1);opacity:1;}}
  .arc-score-line{font-family:"Fredoka","Fluent Emoji",sans-serif;color:var(--ink);}
  /* pages de mini-jeu (plein viewport) */

  .vp-url{font-weight:800;font-size:clamp(1.05rem,3.2vw,1.5rem);background:#fff;border:3px solid var(--line);

  .vp-url .bad-ch{color:#dc2626;background:#fee2e2;border-radius:4px;animation:badBlink .4s steps(2) 5;}

  .ap-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .ap-btn{border:none;border-radius:14px;padding:15px 30px;font-family:"Fredoka","Fluent Emoji",sans-serif;

  .kw-zone{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;}
  .kw-block{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 17px;

  .kw-block.sel{background:var(--blue);border-color:var(--blue-d);color:#fff;}

    border-radius:12px;padding:10px 16px;font-weight:800;animation:resPopK .3s ease;}
  @keyframes resPopK{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  /* SERP à nettoyer */
  .clean-list{max-width:600px;width:100%;text-align:left;}

  /* tri des favoris */

  .tri-card.done.jet{border-color:#fca5a5;background:#fef2f2;opacity:.7;}

  /* ===== 5 quater. MINI-JEUX N5-N8 + POPZILLA ===== */
  /* --- loupe à pubs --- */
  .lp-page{max-width:620px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden;}
  .lp-head{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:800;border-bottom:2px solid var(--line);background:#f8fafc;}
  .lp-body{padding:12px 14px;}
  .lp-card{border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 9px;font-weight:700;font-size:.86rem;color:#3a4a59;background:#fff;}
  .lp-ad{position:relative;border-color:#f59e0b;background:linear-gradient(120deg,#fff7e2,#ffe9d1);cursor:pointer;padding-bottom:18px;}
  .lp-ad .lp-big{display:block;color:#b91c1c;font-weight:900;font-size:1rem;}

  /* --- loupe du détective --- */
  .det-mail{max-width:640px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;font-size:.92rem;line-height:1.65;}

  .det-z{cursor:pointer;border-radius:5px;padding:0 2px;transition:.12s;}
  .det-z:hover{background:#fef3c7;outline:2px dashed #f59e0b;}
  .det-z.found{background:#fee2e2;outline:2px solid #dc2626;color:#b91c1c;font-weight:800;cursor:default;}
  .det-tag{display:inline-block;background:#dc2626;color:#fff;font-size:.6rem;font-weight:800;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:middle;animation:resPopK .3s ease;}
  /* --- pare-feu (défense de zone) --- */
  .fw-zone{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#0f2038,#15304f 70%,#1d3a5f);cursor:crosshair;}
  .fw-top{position:absolute;top:8px;left:0;right:0;text-align:center;color:#cfe3ff;font-weight:800;font-size:.8rem;z-index:6;pointer-events:none;}

  .fw-file .ff-n{font-weight:800;font-size:.66rem;color:#fff;background:rgba(15,23,42,.72);border-radius:5px;padding:1px 6px;white-space:nowrap;}

  /* --- le vrai bouton --- */
  .vb-wrap{max-width:600px;width:100%;text-align:left;}
  .vb-fake{position:relative;display:block;width:100%;border:2px solid #f59e0b;border-radius:12px;background:linear-gradient(120deg,#fff3d6,#ffe1c9);padding:15px 14px;margin:0 0 10px;cursor:pointer;text-align:center;font-weight:900;color:#b91c1c;font-size:1.02rem;}

  /* --- bris de coffre --- */
  .bc-pw{font-weight:800;font-size:clamp(1.15rem,3.4vw,1.7rem);background:#fff;border:3px solid var(--line);border-radius:14px;padding:12px 26px;margin:0 0 14px;letter-spacing:.05em;}

  .fg-out{font-weight:800;font-size:1.15rem;background:#fff;border:3px solid var(--line);border-radius:12px;padding:10px 18px;min-height:47px;min-width:min(300px,90%);max-width:92%;word-break:break-all;}

  /* --- POPZILLA (mini-boss multi-phases) --- */
  .pz-arena{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;background:linear-gradient(#101828,#1e2a44 60%,#2b3a5e);padding:14px;text-align:center;}

  .pz-sprite .pz-face{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:1.9rem;}
  .pz-sprite.hit{animation:pzHitK .55s ease;}
  @keyframes pzHitK{0%{transform:scale(1);}25%{transform:scale(.8) rotate(-9deg);filter:brightness(1.7);}60%{transform:scale(1.1) rotate(5deg);}100%{transform:scale(1);}}

  @keyframes pzChargeK{from{filter:drop-shadow(0 0 6px #f59e0b);}to{filter:drop-shadow(0 0 24px #f59e0b) brightness(1.35);transform:scale(1.08);}}
  .pz-fs-btn{position:absolute;top:8px;right:10px;z-index:8;border:none;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;font-size:1rem;padding:5px 9px;cursor:pointer;}

  .pp-bar.pzred .pp-x{background:#ef4444;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35);animation:ppPulse 1.1s infinite;}
  /* barre de vie de boss (bandeau permanent) — version POPZILLA */
  .boss-hud.pz{background:linear-gradient(90deg,#4c1d95,#831843 55%,#7f1d1d);gap:9px;padding:6px 12px;}

  .boss-hud .bh-name{font-size:.8rem;font-weight:900;letter-spacing:.05em;}

  .boss-hud .bh-hp{flex:1;height:13px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.4);border-radius:99px;overflow:hidden;min-width:64px;}

  .boss-hud .bh-hp.mid i{background:linear-gradient(90deg,#facc15,#f59e0b);}
  .boss-hud .bh-hp.low i{background:linear-gradient(90deg,#f87171,#dc2626);}
  .boss-hud .bh-hearts{flex:none;font-size:.92rem;letter-spacing:1px;white-space:nowrap;}
  .boss-hud .bh-hearts .lost{filter:grayscale(1);opacity:.4;}
  .boss-hud .bh-phase{flex:none;font-size:.64rem;font-weight:800;background:rgba(0,0,0,.32);border-radius:99px;padding:2px 9px;white-space:nowrap;max-width:34%;overflow:hidden;text-overflow:ellipsis;}
  /* compte à rebours de chaque pop-up */
  .pp-life{height:6px;margin:0;background:#e5e7eb;position:relative;}

  .pp-life.mid i{background:linear-gradient(90deg,#f59e0b,#f97316);}

  .popup.moving{transition:left 1.6s linear, top 1.6s linear;}

  @keyframes ppExpireK{60%{transform:scale(1.08);box-shadow:0 0 0 4px rgba(239,68,68,.5);}100%{transform:scale(.4);opacity:0;}}
  /* page de l'onglet où POPZILLA se cache (fond coloré + POPZILLA qui ricane) */
  .pz-hideout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
    background:radial-gradient(circle at 50% 40%,#7c3aed,#4c1d95 60%,#2b1065);overflow:hidden;}
  .pz-hideout-spr{font-size:5.5rem;line-height:1;position:relative;animation:pzIdle 2s ease-in-out infinite;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));}
  .pz-hideout-spr .pz-face{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:2rem;}
  .pz-hideout-t{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:800;font-size:1.35rem;color:#fff;}
  .pz-hideout-s{font-weight:800;font-size:.9rem;color:#e9d5ff;}
  /* page d'un onglet blanc pendant la traque */

  .pz-emptytab .pe-t{font-weight:800;font-size:1rem;color:#64748b;}
  .pz-emptytab .pe-s{font-weight:700;font-size:.8rem;color:#94a3b8;}
  /* favoris vérolés injectés par POPZILLA */
  .bm-chip.pzbad{background:linear-gradient(90deg,#fee2e2,#fecaca);color:#991b1b;border:1px dashed #ef4444;animation:pzBmIn .3s ease;}
  @keyframes pzBmIn{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
  .bm-x{flex:none;width:16px;height:16px;border:none;border-radius:4px;background:rgba(0,0,0,.12);color:#7f1d1d;font-size:.6rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-left:2px;}
  .bm-x:hover{background:#ef4444;color:#fff;}
  /* SERP piégée (tir au viseur) */
  .pz-serp-top{width:100%;max-width:640px;flex:none;background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 12px;text-align:left;margin:0 auto 4px;font-size:.82rem;color:#334155;}
  .pz-serp-list{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:9px;overflow:auto;padding:2px;}

  .pz-res.boom{animation:pzBoomK .4s ease forwards;pointer-events:none;}
  @keyframes pzBoomK{40%{transform:scale(1.12);filter:brightness(1.8);}100%{transform:scale(0);opacity:0;}}
  .pz-res.wrong{animation:pzWrongK .5s ease;}
  @keyframes pzWrongK{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  /* carte d'annonce de phase (façon « le combat commence ») */
  .pz-phase-card{position:absolute;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:radial-gradient(circle at center,rgba(76,29,149,.72),rgba(2,6,23,.86));color:#fff;text-align:center;padding:20px;animation:pzCardIn .35s ease;}
  .pz-phase-card.out{animation:pzCardOut .4s ease forwards;}
  @keyframes pzCardIn{from{opacity:0;transform:scale(1.1);}to{opacity:1;transform:scale(1);}}
  @keyframes pzCardOut{to{opacity:0;transform:scale(.94);}}
  .pz-phase-card .pc-ic{font-size:3rem;line-height:1;animation:pzIdle 2s ease-in-out infinite;}
  .pz-phase-card .pc-t{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:800;font-size:1.5rem;}

    .normalize('NFD').replace(/[̀-ͯ]/g,'')

    .replace(/\s+/g,' ').trim();

  get(k){ try{return localStorage.getItem(k);}catch(e){return this._m&&this._m[k];} },

/* minuteries de mission (boss, tempêtes de pop-ups, téléchargements…)
   — toutes annulées à chaque startStep() */
let _timers=[];
function after(ms,fn){ const t=setTimeout(fn,ms); _timers.push(t); return t; }
function every(ms,fn){ const t=setInterval(fn,ms); _timers.push(t); return t; }
function clearTimers(){ _timers.forEach(t=>{ clearTimeout(t); clearInterval(t); }); _timers=[]; }

function getUnlocked(){ let u=parseInt(store.get('nv_unlocked')||'1',10); if(isNaN(u)||u<1)u=1; return Math.min(u,LEVELS.length); }
function getSavedStep(n){ let s=parseInt(store.get('nv_step_l'+n)||'0',10); return (isNaN(s)||s<0)?0:s; }
function saveProgress(){ store.set('nv_step_l'+currentLevel, String(progressIdx)); }

/* ---------------------------------------------------------
   2. SON (WebAudio, sans fichier externe)
   --------------------------------------------------------- */
let actx=null;
function audioCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function beep(kind){
  if(!soundOn) return; const a=audioCtx(); if(!a) return; const now=a.currentTime;
  function tone(freq,dur,type,vol,delay){
    const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(a.destination); const t=now+(delay||0);
    g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur);
  }
  if(kind==='click'){ tone(420,.03,'square',.05); }
  else if(kind==='open'){ tone(540,.06,'sine',.09); tone(760,.07,'sine',.07,.04); }
  else if(kind==='good'){ tone(740,.09,'sine',.12); tone(1180,.09,'sine',.08,.02); }
  else if(kind==='bad'){ tone(150,.16,'square',.12); }
  else if(kind==='delete'){ tone(300,.08,'sawtooth',.08); tone(180,.12,'sawtooth',.07,.05); }
  else if(kind==='ding'){ tone(880,.12,'sine',.12); tone(1320,.16,'sine',.1,.08); }
  else if(kind==='alarm'){ tone(360,.18,'square',.10); tone(300,.18,'square',.10,.18); }
  else if(kind==='win'){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.09)); }
}
function refreshSoundBtn(){ document.getElementById('soundBtn').textContent=(soundOn?'🔊':'🔈')+' Son'; }
document.getElementById('soundBtn').onclick=()=>{ soundOn=!soundOn; store.set('nv_sound', soundOn?'1':'0'); refreshSoundBtn(); if(soundOn){ audioCtx(); beep('good'); } };

/* ----- onglets ----- */
function newTabObj(url){ return { id:'t'+(++B.seq), hist:[url], hidx:0, loading:false }; }
function currentTab(){ return B.tabs[B.active]; }
function curUrl(){ const t=currentTab(); return t ? t.hist[t.hidx] : ''; }

function openNewTab(url, opts){
  opts=opts||{};
  if(pzLock('newtab')) return;
  B.tabs.push(newTabObj(url||B.homepage));
  B.active=B.tabs.length-1;
  if(!opts.silent){ B.evt.newTab=true; beep('open'); }
  commitLoad(currentTab());
  if(url===undefined || url===B.homepage){ focusAddr(); }
}
function activateTab(i){
  if(i===B.active || !B.tabs[i]) return;
  B.active=i; B.evt.tabSwitched=true; beep('click');
  renderBrowser(); checkMission();
}
function closeTab(i){
  if(pzLock('closetab')) return;
  const t=B.tabs[i]; if(!t) return;
  if(PZ && !PZ.over && PZ.canCloseTab && !PZ.canCloseTab(t)){ pzTaunt('Pas cet onglet !'); return; }
  (B.evt.closedTabs=B.evt.closedTabs||new Set()).add(t.hist[t.hidx]);
  B.tabs.splice(i,1); beep('delete');
  if(!B.tabs.length){ B.tabs.push(newTabObj(B.homepage)); B.active=0; }
  else if(B.active>=B.tabs.length) B.active=B.tabs.length-1;
  else if(i<B.active) B.active--;
  if(PZ && !PZ.over && PZ.onTabClose){ PZ.onTabClose(t); }
  renderBrowser(); checkMission();
}

/* ----- navigation ----- */
let _navToken=0;
function resolveUrl(raw){
  let u=String(raw).trim().toLowerCase();
  u=u.replace(/^https?:\/\//,'');
  if(u.startsWith('www.cherchetout.fr/recherche')) return u;
  u=u.replace(/\/+$/,'');
  if(!u) return B.homepage;
  if(WEB[u]) return u;
  if(WEB['www.'+u]) return 'www.'+u;
  return u;
}
function navigate(url, opts){
  opts=opts||{};
  const t=currentTab(); if(!t) return;
  const u=resolveUrl(url);
  if(PZ && !PZ.over && PZ.onNavigate && PZ.onNavigate(u, opts)) return;
  const via=opts.via;
  if(via==='link'){ (B.evt.linkClicks=B.evt.linkClicks||new Set()).add(u); }
  if(via==='addr'){ B.evt.addrNav.push(u); }
  if(via==='serp'){ (B.evt.results=B.evt.results||new Set()).add(u); }
  if(via==='bookmark'){ (B.evt.openedBookmark=B.evt.openedBookmark||new Set()).add(u); }
  if(via==='history'){ (B.evt.openedFromHistory=B.evt.openedFromHistory||new Set()).add(u); }
  if(opts.logo){ B.evt.clickedLogo=true; }
  t.hist=t.hist.slice(0, t.hidx+1);
  t.hist.push(u); t.hidx++;
  loadTab(t);
}
function loadTab(t){
  t.loading=true;
  const bar=document.getElementById('loadbar');
  if(bar){ bar.classList.remove('fin'); bar.classList.add('on'); }
  renderTabs(); syncToolbar();
  const tok=++_navToken;
  beep('click');
  setTimeout(()=>{ if(tok!==_navToken) return; t.loading=false; commitLoad(t); }, 430);
}
function commitLoad(t){
  const url=t.hist[t.hidx];
  const page=getPage(url);
  if(page.real!==false){
    (B.evt.visits=B.evt.visits||new Set()).add(url);
    addHistory(url, page);
  }
  const bar=document.getElementById('loadbar');
  if(bar){ bar.classList.remove('on'); bar.classList.add('fin'); setTimeout(()=>bar.classList.remove('fin'), 420); }
  renderBrowser();
  if(page.onOpen) page.onOpen();
  checkMission();
}
function goBack(){
  if(pzLock('back')) return;
  const t=currentTab(); if(!t || t.hidx<=0) return;
  t.hidx--; B.evt.usedBack=true; beep('click');
  if(PZ && !PZ.over && PZ.onNavBtn){ PZ.onNavBtn('back'); }
  renderBrowser(); checkMission();
}
function goForward(){
  if(pzLock('fwd')) return;
  const t=currentTab(); if(!t || t.hidx>=t.hist.length-1) return;
  t.hidx++; B.evt.usedFwd=true; beep('click');
  if(PZ && !PZ.over && PZ.onNavBtn){ PZ.onNavBtn('fwd'); }
  renderBrowser(); checkMission();
}
function doReload(){
  if(pzLock('reload')) return;
  const t=currentTab(); if(!t) return;
  B.evt.usedReload=true;
  loadTab(t);
}
function goHome(){
  if(pzLock('home')) return;
  B.evt.usedHome=true;
  navigate(B.homepage, {});
}
function focusAddr(){
  setTimeout(()=>{ const i=document.getElementById('addrInput'); if(i){ i.focus(); i.select(); } }, 60);
}
function submitAddress(){
  const inp=document.getElementById('addrInput'); if(!inp) return;
  if(pzLock('addr')){ inp.blur(); return; }
  const v=inp.value.trim();
  if(!v) return;
  inp.blur();
  if(/\s/.test(v) || !v.includes('.')){
    B.evt.addrSearch=true;
    doSearch(v, 'addr');
  } else {
    navigate(v, {via:'addr'});
  }
}
function doSearch(q, from){
  q=String(q).trim(); if(!q) return;
  B.evt.searches.push(normText(q));
  navigate('www.cherchetout.fr/recherche?q='+encodeURIComponent(q), {via:(from==='serp'?'search':from)});
}

/* ----- historique & favoris ----- */
function addHistory(url, page){
  if(url===B.homepage) return;
  if(B.history.length && B.history[0].url===url) return;
  B.history.unshift({url:url, title:page.title, icon:page.icon||'🌐', t:Date.now()});
  if(B.history.length>40) B.history.pop();
}
function fmtWhen(h){
  if(h.label) return h.label;
  const d=Date.now()-h.t;
  if(d<60000) return 'À l\'instant';
  const m=Math.round(d/60000);
  return 'Il y a '+m+' min';
}
function isBookmarked(url){ return B.bookmarks.some(b=>b.url===url); }
function toggleBookmark(){
  if(pzLock('star')) return;
  const url=curUrl(); const page=getPage(url);
  if(url===B.homepage || page.real===false){ toast('Cette page ne peut pas être mise en favori.'); beep('bad'); return; }
  const i=B.bookmarks.findIndex(b=>b.url===url);
  if(i>=0){
    B.bookmarks.splice(i,1);
    (B.evt.bmRemoved=B.evt.bmRemoved||new Set()).add(url);
    (B.evt.bmRemovedStar=B.evt.bmRemovedStar||new Set()).add(url);
    beep('delete'); toast('☆ Favori retiré');
  } else {
    B.bookmarks.push({url:url, title:page.bm||page.title, icon:page.icon||'🌐'});
    (B.evt.bmAdded=B.evt.bmAdded||new Set()).add(url);
    beep('ding'); toast('⭐ Page ajoutée aux favoris !');
  }
  renderBrowser(); checkMission();
}
function removeBookmark(url){
  const i=B.bookmarks.findIndex(b=>b.url===url);
  if(i<0) return;
  const wasBad=!!B.bookmarks[i].pzbad;
  /* pendant le combat POPZILLA (phase des favoris) : impossible de jeter un VRAI favori */
  if(PZ && !PZ.over && PZ.curPhase==='favoris' && !wasBad){
    pzHurtPlayer(1,'Ne supprime pas un VRAI favori !'); return;
  }
  B.bookmarks.splice(i,1);
  (B.evt.bmRemoved=B.evt.bmRemoved||new Set()).add(url);
  (B.evt.bmRemovedTrash=B.evt.bmRemovedTrash||new Set()).add(url);
  beep('delete');
  if(PZ && !PZ.over && wasBad && PZ.onFavRemove){ PZ.onFavRemove(url); }
  else toast('☆ Favori retiré');
  renderBrowser(); checkMission();
}

/* ----- menu ☰ et panneaux ----- */
function toggleMenu(){ B.menuOpen=!B.menuOpen; renderMenu(); }
function closeMenu(){ if(B.menuOpen){ B.menuOpen=false; renderMenu(); } }
function renderMenu(){
  const m=document.getElementById('menuPop'); if(!m) return;
  if(!B.menuOpen){ m.hidden=true; return; }
  m.hidden=false;
  m.innerHTML=
    '<button class="menu-item" data-act="newtab"><span class="mi-ic">🆕</span>Nouvel onglet</button>'
    +'<button class="menu-item" data-act="history"><span class="mi-ic">🕘</span>Historique</button>'
    +'<button class="menu-item" data-act="bookmarks"><span class="mi-ic">⭐</span>Favoris</button>'
    +'<button class="menu-item" data-act="dl"><span class="mi-ic">⬇️</span>Téléchargements</button>'
    +'<button class="menu-item" data-act="home"><span class="mi-ic">🏠</span>Page d\'accueil</button>';
  m.querySelectorAll('.menu-item').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const act=b.getAttribute('data-act');
    B.menuOpen=false; renderMenu();
    if(act==='newtab') openNewTab();
    else if(act==='history') openPanel('history');
    else if(act==='bookmarks') openPanel('bookmarks');
    else if(act==='home') goHome();
    else if(act==='dl') openPanel('downloads');
  });
}
function openPanel(kind){
  B.panel=kind;
  if(kind==='history'){ B.evt.openedHistoryPanel=true; }
  if(kind==='bookmarks'){ B.evt.openedBmPanel=true; }
  if(kind==='downloads'){ B.evt.openedDlPanel=true; }
  beep('open');
  renderBrowser(); checkMission();
}
function closePanel(){ B.panel=null; renderBrowser(); }

/* ----- rendu ----- */
function renderTabs(){
  const strip=document.getElementById('tabstrip'); if(!strip) return;
  strip.innerHTML='';
  B.tabs.forEach((t,i)=>{
    const url=t.hist[t.hidx]; const page=getPage(url);
    const el=document.createElement('div');
    el.className='tab'+(i===B.active?' active':'');
    el.title=page.title;
    el.innerHTML='<span class="t-ic">'+(t.loading?'⏳':(page.icon||'🌐'))+'</span>'
      +'<span class="t-title">'+(t.loading?'Chargement…':page.title)+'</span>'
      +'<button class="t-close" title="Fermer l\'onglet">✕</button>';
    el.addEventListener('mousedown', e=>{ if(!e.target.classList.contains('t-close')) activateTab(i); });
    el.querySelector('.t-close').onclick=(e)=>{ e.stopPropagation(); closeTab(i); };
    strip.appendChild(el);
  });
  const plus=document.createElement('button');
  plus.className='newtab-btn'; plus.id='btnNewTab'; plus.title='Ouvrir un nouvel onglet'; plus.textContent='+';
  plus.onclick=()=>openNewTab();
  strip.appendChild(plus);
}
function syncAddrBar(){
  const inp=document.getElementById('addrInput'); if(!inp) return;
  if(document.activeElement===inp) return;
  const url=curUrl(); const page=getPage(url);
  inp.value=(url===B.homepage)?'':url;
  const lock=document.getElementById('addrLock');
  if(page.pz){ lock.textContent='👾'; lock.title='Territoire de POPZILLA'; }
  else if(url===B.homepage){ lock.textContent='🦊'; lock.title='Page d\'accueil de Goupil'; }
  else if(page.game){ lock.textContent='🎮'; lock.title='Zone d\'entraînement de la Cyber-Patrouille'; }
  else if(page.real===false){ lock.textContent='⚠️'; lock.title='Page introuvable'; }
  else if(page.secure===false){ lock.textContent='⚠️'; lock.title='Connexion NON sécurisée (http) — clique pour en savoir plus'; }
  else { lock.textContent='🔒'; lock.title='Connexion sécurisée (https) — clique pour en savoir plus'; }
}
/* info-bulle du cadenas (sécurité de la connexion) */
function toggleLockPop(){
  const lp=document.getElementById('lockPop'); if(!lp) return;
  if(!lp.hidden){ lp.hidden=true; return; }
  const url=curUrl(); const page=getPage(url);
  if(url===B.homepage){
    lp.className='lock-pop ok';
    lp.innerHTML='🦊 Tu es sur la <b>page d\'accueil de Goupil</b> — rien n\'est envoyé sur internet ici.';
  } else if(page.secure===false){
    B.evt.lockCheckedInsecure=true;
    lp.className='lock-pop warn-lp';
    lp.innerHTML='⚠️ <b>Connexion NON sécurisée (http)</b><br>Ce que tu envoies sur ce site peut être lu par n\'importe qui. N\'y tape <b>jamais</b> de mot de passe ni d\'informations personnelles !';
  } else {
    B.evt.lockChecked=true;
    lp.className='lock-pop ok';
    lp.innerHTML='🔒 <b>Connexion sécurisée (https)</b><br>Les données échangées avec ce site sont chiffrées. Attention : ça ne veut pas dire que le site est <b>honnête</b> — lis toujours son adresse !';
  }
  lp.hidden=false;
  checkMission();
}
function closeLockPop(){ const lp=document.getElementById('lockPop'); if(lp) lp.hidden=true; }
function syncToolbar(){
  const t=currentTab();
  const bb=document.getElementById('btnBack'), bf=document.getElementById('btnFwd');
  if(bb) bb.disabled=!t || t.hidx<=0;
  if(bf) bf.disabled=!t || t.hidx>=t.hist.length-1;
  const star=document.getElementById('btnStar');
  if(star){
    const on=isBookmarked(curUrl());
    star.textContent=on?'★':'☆';
    star.classList.toggle('on', on);
    star.title=on?'Retirer cette page des favoris':'Ajouter cette page aux favoris';
  }
  syncAddrBar();
}
function renderBmBar(){
  const bar=document.getElementById('bmBar'); if(!bar) return;
  bar.innerHTML='';
  if(!B.bookmarks.length){
    bar.innerHTML='<span class="bm-none">📌 Tes favoris apparaîtront ici — clique sur l\'étoile ☆ pour en ajouter !</span>';
    return;
  }
  B.bookmarks.forEach(b=>{
    const c=document.createElement('div');
    c.className='bm-chip'+(b.pzbad?' pzbad':''); c.title=b.url; c.style.cursor='pointer';
    c.innerHTML='<span>'+b.icon+'</span><span>'+b.title+'</span>';
    if(b.pzbad){
      /* pas de croix dans la barre des favoris (comme un vrai navigateur) : on supprime via le menu ☰ → Favoris → 🗑️ */
      c.onclick=()=>{ if(PZ&&!PZ.over) pzTaunt('Supprime-le via ☰ → Favoris → 🗑️ !'); };
    } else {
      c.onclick=()=>navigate(b.url, {via:'bookmark'});
    }
    bar.appendChild(c);
  });
}
function renderSidebar(){
  const sb=document.getElementById('sidebar'); if(!sb) return;
  if(!B.panel){ sb.hidden=true; return; }
  sb.hidden=false;
  if(B.panel==='downloads'){ renderDlPanel(sb); return; }
  const isH=B.panel==='history';
  let html='<div class="sb-head"><span>'+(isH?'🕘 Historique':'⭐ Favoris')+'</span>'
    +'<button class="sb-close" title="Fermer le panneau">✕</button></div><div class="sb-list">';
  if(isH){
    if(!B.history.length) html+='<div class="sb-empty">Ton historique est vide.<br>Visite des pages pour le remplir !</div>';
    B.history.forEach((h,i)=>{
      html+='<button class="sb-item" data-h="'+i+'"><span class="si-ic">'+h.icon+'</span>'
        +'<span class="si-tx"><span class="si-t">'+h.title+'</span><span class="si-u">'+h.url+'</span></span>'
        +'<span class="si-when">'+fmtWhen(h)+'</span></button>';
    });
  } else {
    if(!B.bookmarks.length) html+='<div class="sb-empty">Aucun favori pour l\'instant.<br>Clique sur l\'étoile ☆ dans la barre d\'adresse !</div>';
    B.bookmarks.forEach((b,i)=>{
      html+='<div class="sb-item"><span class="si-ic">'+b.icon+'</span>'
        +'<span class="si-tx" data-b="'+i+'" style="cursor:pointer"><span class="si-t">'+b.title+'</span><span class="si-u">'+b.url+'</span></span>'
        +'<button class="si-del" data-del="'+i+'" title="Supprimer ce favori">🗑️</button></div>';
    });
  }
  html+='</div>';
  sb.innerHTML=html;
  sb.querySelector('.sb-close').onclick=closePanel;
  sb.querySelectorAll('[data-h]').forEach(el=>el.onclick=()=>{
    const h=B.history[+el.getAttribute('data-h')];
    if(h) navigate(h.url, {via:'history'});

      size:dl.getAttribute('data-dlsize')||undefined,

      preview:dl.getAttribute('data-dlprev')||undefined

  }
  const act=e.target.closest('[data-act]');
  if(act){

/* ----- téléchargements ----- */
function dlIcon(ext){ return {pdf:'📕',doc:'📝',jpg:'🖼️',png:'🖼️',zip:'🗜️',exe:'⚙️',bat:'⚙️',mp3:'🎵',mp4:'🎬'}[ext]||'📄'; }
function startDownload(name, opts){
  opts=opts||{};
  const ext=(name.split('.').pop()||'').toLowerCase();
  const d={id:'d'+(++B.seq), name:name, ext:ext, size:opts.size||'1,2 Mo', danger:!!opts.danger,
    safeFile:!!opts.safe, preview:opts.preview, state:'progress', progress:0};
  B.downloads.unshift(d);
  beep('click'); toast('⬇️ Téléchargement de « '+name+' »…');
  (function tick(){
    after(300, ()=>{
      d.progress+=22+Math.random()*20;
      if(d.progress>=100){
        d.progress=100;
        if(d.danger){ d.state='warn'; beep('alarm'); spawnPopup(dangerPopup(d)); }
        else{
          d.state='done'; beep('ding');
          (B.evt.downloaded=B.evt.downloaded||new Set()).add(d.name);
          toast('✅ « '+d.name+' » téléchargé');
        }
        renderBrowser(); checkMission();
      } else { renderDlBtn(); renderSidebar(); tick(); }
    });
  })();
  renderBrowser();
}
function removeDownload(id){
  const i=B.downloads.findIndex(x=>x.id===id); if(i<0) return;
  const d=B.downloads[i];
  if(d.safeFile && currentStep && currentStep.guardSafeDl){ dlGuardFail(d); return; }
  B.downloads.splice(i,1);
  (B.evt.dlDeleted=B.evt.dlDeleted||new Set()).add(d.name);
  beep('delete'); toast('🗑️ « '+d.name+' » supprimé');
  renderBrowser(); checkMission();
}
function openDownloadFile(d){
  (B.evt.openedDownload=B.evt.openedDownload||new Set()).add(d.name);
  const bodies={pdf:'Aperçu du document PDF', doc:'Aperçu du document', jpg:'Aperçu de l\'image', png:'Aperçu de l\'image'};
  spawnPopup({kind:'viewer', bar:'sys', title:dlIcon(d.ext)+' '+d.name, x:18, y:12,
    body:(d.preview||bodies[d.ext]||'Aperçu du fichier')+'<br><span style="color:#8d9cab;font-size:.75rem">'+d.size+'</span>',
    buttons:[{label:'Fermer', cls:'ghost', act:'close'}]});
  beep('open'); checkMission();
}
function renderDlBtn(){
  const btn=document.getElementById('btnDl'); if(!btn) return;
  btn.hidden=B.downloads.length===0;
  const n=B.downloads.filter(d=>d.state==='progress').length;
  const badge=document.getElementById('dlBadge'); if(badge) badge.textContent=n?String(n):'';
}
function renderDlPanel(sb){
  let html='<div class="sb-head"><span>⬇️ Téléchargements</span>'
    +'<button class="sb-close" title="Fermer le panneau">✕</button></div><div class="sb-list">';
  if(!B.downloads.length) html+='<div class="sb-empty">Aucun téléchargement.<br>Les fichiers que tu télécharges apparaîtront ici.</div>';
  B.downloads.forEach(d=>{
    html+='<div class="sb-item"><span class="si-ic">'+dlIcon(d.ext)+'</span>'
      +'<span class="si-tx"><span class="si-t">'+d.name+'</span>';
    if(d.state==='progress') html+='<span class="sb-prog"><i style="width:'+Math.round(d.progress)+'%"></i></span>';
    else if(d.state==='warn') html+='<span class="si-danger">⚠️ fichier bloqué — dangereux ?</span>';
    else html+='<span class="si-u">'+d.size+(d.danger?' · ⚠️ fichier suspect':'')+'</span>';
    html+='</span>';
    if(d.state==='done' && !d.danger) html+='<button class="si-open" data-open="'+d.id+'">Ouvrir</button>';
    if(d.state!=='progress') html+='<button class="si-del" data-deldl="'+d.id+'" title="Supprimer ce fichier">🗑️</button>';
    html+='</div>';

    const d=B.downloads.find(x=>x.id===el.getAttribute('data-open'));

/* ----- pop-ups ----- */
function spawnPopup(def){
  const p=Object.assign({id:'p'+(++B.seq)}, def);
  if(p.x==null) p.x=4+Math.random()*54;
  if(p.y==null) p.y=6+Math.random()*46;
  B.popups.push(p);
  beep('open'); renderPopups();
  return p;
}
function closePopup(id, how){
  const i=B.popups.findIndex(p=>p.id===id); if(i<0) return;
  const p=B.popups[i]; B.popups.splice(i,1);
  B.evt.popupsClosed=(B.evt.popupsClosed||0)+1;
  if(p.kind==='prize') B.evt.closedPrize=true;
  if(p.kind==='notif' && how==='block') B.evt.blockedNotif=true;
  beep('delete'); renderPopups();
  if(p.onClose) p.onClose(how);
  checkMission();
}
function popupTrap(p){
  B.evt.trapsClicked=(B.evt.trapsClicked||0)+1;
  beep('bad');
  toast(p.trapMsg||'⚠️ Piège ! La seule bonne façon de fermer un pop-up, c\'est sa croix ✕.');
  if(p.onTrap) p.onTrap(p); else spawnPopup(popupPrize());
  checkMission();
}
function renderPopups(){
  const layer=document.getElementById('popupLayer'); if(!layer) return;
  const alive={};
  B.popups.forEach(p=>{ alive[p.id]=1; });
  /* retirer les pop-ups fermés (leur élément existe encore dans le DOM) */
  Array.from(layer.children).forEach(el=>{ if(!alive[el.getAttribute('data-pid')]) el.remove(); });
  /* n'ajouter que les pop-ups qui n'ont pas encore d'élément (évite de rejouer l'animation d'ouverture sur tous) */
  B.popups.forEach(p=>{
    if(layer.querySelector('[data-pid="'+p.id+'"]')) return;
    const el=document.createElement('div');
    el.className='popup'+(p.moving?' moving':'');
    el.setAttribute('data-pid', p.id);
    el.style.left=p.x+'%'; el.style.top=p.y+'%';
    let btns='';
    (p.buttons||[]).forEach((b,bi)=>{ btns+='<button class="pp-btn '+(b.cls||'ghost')+'" data-pb="'+bi+'">'+b.label+'</button>'; });
    el.innerHTML='<div class="pp-bar '+(p.bar||'')+'"><span class="pp-title">'+p.title+'</span>'
      +'<button class="pp-x" title="Fermer">✕</button></div>'
      +'<div class="pp-body">'+p.body+(btns?'<div>'+btns+'</div>':'')+'</div>'
      +(p.life!=null?'<div class="pp-life" data-life="'+p.id+'"><i style="width:100%"></i></div>':'');
    el.querySelector('.pp-x').onclick=()=>closePopup(p.id,'x');
    el.querySelectorAll('[data-pb]').forEach(bt=>bt.onclick=()=>{
      const b=p.buttons[+bt.getAttribute('data-pb')]; if(!b) return;
      if(typeof b.act==='function') b.act(p);
      else if(b.act==='trap') popupTrap(p);
      else if(b.act==='block') closePopup(p.id,'block');
      else closePopup(p.id,'btn');
    });
    layer.appendChild(el);
  });
}

/* ----- robustesse des mots de passe ----- */
const PW_COMMON=['123456','12345678','azerty','qwerty','motdepasse','password','111111','abc123','soleil','chocolat','doudou','loulou','000000','marseille','bonjour'];
function pwScore(pw, user){
  pw=pw||'';
  const missing=[];
  if(pw.length<12) missing.push('au moins <b>12 caractères</b> ('+pw.length+'/12)');
  if(!/[a-z]/.test(pw) || !/[A-Z]/.test(pw)) missing.push('des <b>majuscules ET des minuscules</b>');
  if(!/[0-9]/.test(pw)) missing.push('au moins <b>un chiffre</b>');
  if(!/[^a-zA-Z0-9]/.test(pw)) missing.push('au moins <b>un symbole</b> (! # % € …)');
  const low=normText(pw).replace(/\s/g,'');
  if(PW_COMMON.some(c=>low.includes(c))) missing.push('pas de suite ultra-connue (azerty, 123456…)');
  if(user && low.includes(normText(user).split(/[.\s]/)[0])) missing.push('pas ton prénom ni ton nom dedans');
  let score=Math.max(0, 4-missing.length);
  if(pw.length===0) score=0;
  if(score===4 && pw.length>=16) score=5;
  const labels=['Très fragile 🔴','Très fragile 🔴','Fragile 🟠','Moyen 🟡','Fort 🟢','Ultra 💪'];
  return {score:score, label:labels[score], missing:missing};
}
function onPwInput(inp){
  const ctx=inp.getAttribute('data-pw');
  const r=pwScore(inp.value, inp.getAttribute('data-user')||'');
  const widget=inp.closest('.wp-form')||inp.parentElement;
  const meter=widget.querySelector('.pw-meter');
  if(meter){
    let bars='<div class="pw-bars">';
    for(let i=1;i<=5;i++) bars+='<i class="'+(i<=r.score?('f'+r.score):'')+'"></i>';
    bars+='</div>';
    const miss=(inp.value && r.missing.length)?'<ul class="pw-missing">'+r.missing.map(m=>'<li>'+m+'</li>').join('')+'</ul>':'';
    meter.innerHTML=bars+'<div class="pw-verdict">'+(inp.value?r.label:'')+'</div>'+miss;
  }
  if(ctx==='tester'){
    if(normText(inp.value)==='azerty123') B.evt.testedAzerty=true;
    if(r.score>=4) B.evt.testedStrong=true;
    if(r.score>=5) B.evt.testedUltra=true;
  }
  B._pwCur=r;
  checkMission();
}

/* ----- graine de mission : remise à zéro du navigateur ----- */
function seedBrowser(seed){
  seed=seed||{};
  B.tabs=[]; B.seq=0; B.active=0;
  B.panel=null; B.menuOpen=false;
  B.popups=[]; B.boss=null; B.storm=null;
  B.downloads=(seed.downloads||[]).map(f=>({
    id:'d'+(++B.seq), name:f.name, ext:(f.name.split('.').pop()||'').toLowerCase(),
    size:f.size||'1,0 Mo', danger:!!f.danger, safeFile:!!f.safe, preview:f.preview,
    state:'done', progress:100
  }));
  const hud=document.getElementById('bossHud'); if(hud){ hud.hidden=true; hud.innerHTML=''; }
  B.bookmarks=(seed.bookmarks||[]).map(u=>{
    const p=getPage(u); return {url:u, title:p.bm||p.title, icon:p.icon||'🌐'};
  });
  B.history=(seed.history||[]).map(h=>{
    const u=typeof h==='string'?h:h.url; const p=getPage(u);
    return {url:u, title:p.title, icon:p.icon||'🌐', t:Date.now(), label:(typeof h==='object'&&h.label)||null};
  });
  B.evt={ answers:{}, searches:[], addrNav:[] };
  (seed.tabs && seed.tabs.length ? seed.tabs : [B.homepage]).forEach(u=>{
    B.tabs.push(newTabObj(resolveUrl(u)));
  });
  B.active=Math.min(seed.active||0, B.tabs.length-1);
  /* les pages déjà « ouvertes » comptent comme visitées */
  B.evt.visits=new Set();
  B.tabs.forEach(t=>{ const u=t.hist[t.hidx]; if(u!==B.homepage) B.evt.visits.add(u); });
  renderBrowser();
  if(seed.focusAddr) focusAddr();
}

const STOPWORDS=new Set(['le','la','les','un','une','des','de','du','d','l','et','ou','est','sont','il','elle','on','ce','cette','ces','se','sa','son','ses','quel','quelle','quels','quelles','combien','comment','pourquoi','quand','qui','que','quoi','sur','dans','pour','avec','sans','au','aux','a','y','en','par','plus','tres','faut','fait','je','tu','veux','sait','savoir']);
function searchResults(q){
  const words=normText(q).split(' ').filter(w=>w.length>1 && !STOPWORDS.has(w));
  if(!words.length) return {words:[], list:[]};
  const scored=INDEX.map(e=>{
    let sc=0;
    const kw=' '+e.kw+' ', t=normText(e.t), s=normText(e.s);
    words.forEach(w=>{
      if(kw.includes(w)) sc+=3;
      if(t.includes(w)) sc+=2;
      if(s.includes(w)) sc+=1;
    });
    return {e:e, sc:sc};
  }).filter(r=>r.sc>0);
  scored.sort((a,b)=>b.sc-a.sc);
  return {
    words:words,
    ads:scored.filter(r=>r.e.ad && r.sc>=6).slice(0,1).map(r=>r.e),
    list:scored.filter(r=>!r.e.ad).slice(0,6).map(r=>r.e)
  };
}
function serpPage(url){
  let q='';
  const m=url.split('q=')[1];
  if(m!=null){ try{ q=decodeURIComponent(m).replace(/\+/g,' '); }catch(e){ q=m; } }
  return {
    title:(q?q+' — Cherchetout':'Cherchetout'), icon:'🔍', serp:true,
    html:function(){
      const r=searchResults(q);
      let items='';
      if(!r.list.length && !r.ads.length){
        items='<div class="serp-none">😶 Aucun résultat pour « '+q+' ».<br>Essaie avec d\'autres mots-clés !</div>';
      } else {
        items='<p class="serp-count">Environ '+(r.list.length*1234)+' résultats (0,0'+(2+r.list.length)+' secondes)</p>';
        r.ads.forEach(e=>{
          items+='<div class="sr-item sr-ad">'
            +'<span class="sr-adtag">Annonce</span>'
            +'<div class="sr-url">'+(getPage(e.url).secure===false?'⚠️ http://':'🌐 https://')+e.url+'</div>'
            +'<a class="sr-title" data-go="'+e.url+'" data-serp="1" data-ad="1">'+e.t+'</a>'
            +'<p class="sr-snip">'+e.s+'</p>'
            +'</div>';
        });
        r.list.forEach(e=>{
          items+='<div class="sr-item">'
            +'<div class="sr-url">'+(getPage(e.url).secure===false?'⚠️ http://':'🌐 https://')+e.url+'</div>'
            +'<a class="sr-title" data-go="'+e.url+'" data-serp="1">'+e.t+'</a>'
            +'<p class="sr-snip">'+e.s+'</p>'
            +'</div>';
        });
      }
      return '<div class="webpage serp">'
        +'<div class="serp-top">'
        +'<div class="ct-logo" data-go="www.cherchetout.fr"><span class="c1">C</span><span class="c2">t</span> 🔍</div>'

        +'</div>'

    }

}

/* ----- Labyrinthes de la Cyber-Patrouille (niveau 2) ----- */
function buildMaze(rooms, winSlug, winPage){
  const base='www.chasse-au-tresor.fr';
  rooms.forEach(function(r,i){
    const nextUrl=base+'/'+(i+1<rooms.length?rooms[i+1].slug:winSlug);
    WEB[base+'/'+r.slug]=pg('tresor', r.t+' — La Chasse au Trésor', function(){
      let doors='';
      if(r.manyDoors){
        const good=1+Math.floor(Math.random()*r.manyDoors);
        for(let n=1;n<=r.manyDoors;n++){
          doors+='<button class="wp-btnlink" data-go="'+(n===good?nextUrl:(base+'/xperdu'))+'">🚪 '+n+'</button>';
        }
        doors='<div class="wp-doorgrid">'+doors+'</div>';
      } else {
        r.doors.forEach(function(d){
          doors+='<button class="wp-btnlink" data-go="'+(d[1]?nextUrl:(base+'/xperdu'))+'">'+d[0]+'</button>';
        });
        doors='<p>'+doors+'</p>';
      }
      return '<div class="wp-center"><h1>'+r.ic+' '+r.t+' <span style="font-size:.55em;color:#8d9cab">salle '+(i+1)+' / '+rooms.length+'</span></h1>'
        +'<div class="wp-fact" style="text-align:left">'+r.q+'</div>'
        +doors+'</div>';
    });
  });
  WEB[base+'/'+winSlug]=pg('tresor', winPage+' — La Chasse au Trésor', function(){
    return '<div class="wp-center"><h1>🏆 '+winPage+' !</h1>'
      +'<div class="wp-img">💰👑💎</div>'
      +'<p><b>Bien joué, agent !</b> Toutes les salles sont derrière toi.</p></div>';
  });
}

let _missionDone=false;
function checkMission(){
  if(!currentStep) return;
  if(currentStep.kind==='game') return; /* les rounds arcade se vérifient eux-mêmes */
  if(_missionDone) return;
  const objs=currentStep.objectives; if(!objs || !objs.length) return;
  if(currentStep._jalonAnim) return;
  const ctx=buildCtx();
  const i=currentStep._jalonIdx;
  if(i<objs.length && !currentStep._objDone[i]){
    if(objs[i].goal.test(ctx)){
      currentStep._objDone[i]=true; beep('good'); jalonAdvance();
    }
  }
}
function renderJalonObjective(enter){
  const sub=document.getElementById('bSub'); if(!sub) return;
  const s=currentStep, objs=s.objectives||[], i=s._jalonIdx, n=objs.length;
  if(objs[i] && objs[i].goal && objs[i].goal.prep) objs[i].goal.prep();
  const blue = s.kind!=='jalon';   /* missions normales = bleu ; défis = orange */
  sub.innerHTML='<div class="jalon-head"><span class="b-goal-label">Objectif '+(Math.min(i+1,n))+' / '+n+'</span></div>'
    +'<div class="jalon-wrap"><div class="jalon-obj'+(blue?' blue':'')+(enter?' entering':'')+'"><span class="jo-check">'+(i+1)+'</span><span class="jo-text">'+(objs[i]&&objs[i].t||'')+'</span></div></div>';
  if(enter) requestAnimationFrame(()=>{ const el=sub.querySelector('.jalon-obj'); if(el) el.classList.remove('entering'); });
  renderQuizDock();
}
function jalonAdvance(){
  currentStep._jalonAnim=true;
  const gen=currentStep._gen;
  const sub=document.getElementById('bSub'); const el=sub&&sub.querySelector('.jalon-obj');
  if(el){ el.classList.add('done'); const ck=el.querySelector('.jo-check'); if(ck) ck.textContent='✓'; }
  setTimeout(()=>{ if(el) el.classList.add('slideup'); }, 520);
  setTimeout(()=>{
    if(!currentStep || currentStep._gen!==gen) return; /* la mission a été relancée entre-temps */
    currentStep._jalonIdx++;
    currentStep._jalonAnim=false;
    const objs=currentStep.objectives||[];
    if(currentStep._jalonIdx>=objs.length){ _missionDone=true; renderQuizDock(); onMissionWin(); return; }
    renderJalonObjective(true);
    /* cascade : si l'objectif révélé est déjà rempli, on enchaîne */
    setTimeout(checkMission, 260);
  }, 980);
}
function activeObj(){
  const objs=(currentStep&&currentStep.objectives)||[]; if(!objs.length) return null;
  return objs[Math.min(currentStep._jalonIdx||0, objs.length-1)];
}

/* ----- le carnet de mission (questions / réponses) ----- */
function renderQuizDock(){
  const dock=document.getElementById('quizDock'); if(!dock) return;
  const o=activeObj(); const q=o && o.quiz;
  if(!q || _missionDone){ dock.hidden=true; dock.innerHTML=''; return; }
  dock.hidden=false;
  dock.innerHTML='<span class="qd-ic">📝</span><div class="qd-q">'+q.q+'</div>'
    +'<input id="qdIn" placeholder="Écris ta réponse ici" autocomplete="off" spellcheck="false">'
    +'<button class="qd-ok" id="qdOk">Valider</button><span class="qd-fb" id="qdFb"></span>';
  const inp=dock.querySelector('#qdIn');
  function submit(){
    const v=inp.value.trim(); if(!v) return;
    B.evt.answers[q.key]=v;
    const n=normText(v);
    if(q.accepted.some(a=>n===a||n.includes(a))){
      checkMission();
    } else {
      beep('bad');
      dock.classList.remove('shake'); void dock.offsetWidth; dock.classList.add('shake');
      dock.querySelector('#qdFb').textContent='Ce n\'est pas ça… cherche la réponse sur la page !';
      inp.select();
    }
  }
  dock.querySelector('#qdOk').onclick=submit;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

/* ----- sons arcade ----- */
function arcTone(freq,dur,type,vol,delay){
  if(!soundOn) return; const a=audioCtx(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(); o.type=type||'triangle'; o.frequency.value=freq;
  o.connect(g); g.connect(a.destination); const t=a.currentTime+(delay||0);
  g.gain.setValueAtTime(vol||.11,t); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.1)); o.start(t); o.stop(t+(dur||.1));
}
function arcJingle(n){
  const f=440*Math.pow(1.09,Math.min(n||1,10));
  arcTone(f,.08,'triangle',.11); arcTone(f*1.5,.1,'triangle',.09,.06);
}

/* ----- juice : shake, flash, particules, "+N" volant ----- */
function scr(){ return document.querySelector('.screen'); }
function screenShake(){ const s=scr(); if(!s) return; s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }
function redFlash(){ const s=scr(); if(!s) return; const f=document.createElement('div'); f.className='arc-flash'; s.appendChild(f); setTimeout(()=>{ try{f.remove();}catch(e){} },340); }
function elCenterInScreen(el){
  const s=scr(); if(!s) return null;
  const sr=s.getBoundingClientRect();
  if(!el || !el.getBoundingClientRect) return {x:sr.width/2, y:sr.height/2};
  const r=el.getBoundingClientRect();
  return {x:r.left-sr.left+r.width/2, y:r.top-sr.top+r.height/2};
}
function flyPts(txt, el){
  const s=scr(); if(!s) return;
  const p=elCenterInScreen(el)||{x:s.offsetWidth/2,y:s.offsetHeight/2};
  const d=document.createElement('div'); d.className='arc-fly'; d.textContent=txt;
  d.style.left=(p.x-14)+'px'; d.style.top=(p.y-16)+'px';
  s.appendChild(d); setTimeout(()=>{ try{d.remove();}catch(e){} },980);
}
function arcBurst(el){
  const s=scr(); if(!s) return;
  const p=elCenterInScreen(el); if(!p) return;
  const burst=document.createElement('div'); burst.className='arc-burst';
  burst.style.left=p.x+'px'; burst.style.top=p.y+'px';
  const colors=['#fde047','#fff','#f59e0b','#60a5fa','#4ade80','#fde047'];
  for(let i=0;i<12;i++){
    const a=(i/12)*2*Math.PI, dist=30+Math.random()*28;
    const sp=document.createElement('div'); sp.className='arc-spark';
    sp.style.setProperty('--dx',(Math.cos(a)*dist)+'px');
    sp.style.setProperty('--dy',(Math.sin(a)*dist)+'px');
    sp.style.background=colors[i%colors.length];
    sp.style.animationDelay=(Math.random()*.06)+'s';
    burst.appendChild(sp);
  }
  s.appendChild(burst); setTimeout(()=>{ try{burst.remove();}catch(e){} },540);
}
function banner(txt, kind){
  const s=scr(); if(!s) return;
  const old=s.querySelector('.arc-banner'); if(old) old.remove();
  const b=document.createElement('div'); b.className='arc-banner'+(kind?' '+kind:'');
  b.innerHTML=txt;
  s.appendChild(b); setTimeout(()=>{ try{b.remove();}catch(e){} },1550);
}

/* ----- compte à rebours 3-2-1-GO ----- */
function countdown(cb){
  const s=scr(); if(!s){ cb&&cb(); return; }
  const old=s.querySelector('.arc-count'); if(old) old.remove();
  const ov=document.createElement('div'); ov.className='arc-count'; s.appendChild(ov);
  const seq=['3','2','1','GO !'];
  let k=0;
  (function tick(){
    if(k>=seq.length){ try{ov.remove();}catch(e){} cb&&cb(); return; }
    ov.innerHTML='<b'+(k===3?' class="go"':'')+'>'+seq[k]+'</b>';
    arcTone(k===3?900:420+k*70,.14,'square',.1);
    k++; after(k===4?520:720, tick);
  })();
}

  g.style.left=(sr.width*.5)+'px'; g.style.top=(sr.height*.72)+'px';

/* ----- cycle de manche ----- */
function arcStart(cfg){
  cfg=cfg||{};
  ARC.on=true; ARC.over=false; ARC.score=0; ARC.combo=0; ARC.misses=0;
  clearTimeout(ARC.comboT);
  ARC.shields=(cfg.shields!=null)?cfg.shields:3; ARC.maxShields=ARC.shields;
  ARC.timer=cfg.timer||null; ARC.left=ARC.timer||0; ARC.bonus=cfg.bonus||null;
  ARC.goalTxt=cfg.goalText||'';
  if(ARC.timer){ ARC.t0=Date.now(); every(250, arcTick); }
  arcHudRender();
  if(ARC.goalTxt) arcGoal('🎯 '+ARC.goalTxt);
}
function arcTick(){
  if(!ARC.on||ARC.over||!ARC.timer) return;
  ARC.left=Math.max(0, ARC.timer-(Date.now()-ARC.t0)/1000);
  arcHudRender();
  if(ARC.left<=0) arcFail('⏱ Temps écoulé !');
}
function arcHit(pts, el){
  if(!ARC.on||ARC.over) return;
  ARC.combo++;
  clearTimeout(ARC.comboT);
  ARC.comboT=setTimeout(()=>{ ARC.combo=0; arcHudRender(); },4000);
  const gain=(pts||10)*Math.max(1,ARC.combo);
  ARC.score+=gain;
  arcJingle(ARC.combo);
  flyPts('+'+gain, el||null);
  if(el) arcBurst(el);
  arcHudRender();
}
function arcMiss(msg){
  if(!ARC.on||ARC.over) return;
  ARC.combo=0; ARC.misses++; ARC.shields=Math.max(0,ARC.shields-1);
  beep('bad'); screenShake(); redFlash();
  arcHudRender();
  if(ARC.shields<=0){ arcFail('💥 Raté ! On recommence…'); }
  else banner('❌ '+(msg||'Raté !'),'bad');
}
function arcFail(msg){
  if(ARC.over) return;
  ARC.over=true;
  beep('alarm'); screenShake(); redFlash();
  banner(msg,'bad');
  after(1600, arcRestart);
}
function arcRestart(){
  clearTimers(); clearTimeout(ARC.comboT); clearSpots();
  ARC.on=false; ARC.over=false; ARC.onAction=null; ARC.onInfoClick=null; ARC.courseInfo=false; ARC.screenHtml='';
  buildScreen();
  seedBrowser(currentStep.seed||{});
  arcLaunch();
}
function arcLaunch(){
  countdown(function(){
    if(currentStep && currentStep.run) currentStep.run(function(){ arcWin(); });
  });
}
function arcWin(){
  if(!ARC.on||ARC.over) return;
  ARC.on=false; ARC.over=true;
  clearTimers(); clearTimeout(ARC.comboT);
  _missionDone=true;
  hideOrder(); arcHudRender();
  let stars=(ARC.misses===0)?3:(ARC.misses<=2?2:1);
  if(ARC.timer && ARC.bonus && ARC.left>=ARC.bonus) stars=Math.min(3,stars+1);
  saveStars(starKey(), stars);
  beep('win'); confetti();
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">🏅</span>'
    +'<h2>'+(currentStep.exam?'Examen réussi !':'Mission accomplie !')+'</h2>'
    +starLineHtml(stars)
    +'<p class="arc-score-line">SCORE <b>'+ARC.score+'</b>'+(ARC.misses?' · '+ARC.misses+' erreur'+(ARC.misses>1?'s':''):' · sans faute !')+'</p>'
    +(stars<3?'<p style="font-size:.9rem;color:var(--muted)">'+(ARC.misses?'Zéro erreur = ⭐⭐⭐ !':'Encore plus rapide = ⭐⭐⭐ !')+'</p>':'')
    +'<div class="m-actions"><button class="m-btn primary green" id="arcNext">Continuer →</button></div>';
  openOverlay();
  popStars(stars);
  document.getElementById('arcNext').onclick=()=>{ closeOverlay(); arcAdvance(); };
}
function arcAdvance(){
  if(reviewing()){ startStep(progressIdx); return; }
  if(playIdx===STEPS.length-1){ progressIdx=STEPS.length; saveProgress(); levelComplete(); return; }
  progressIdx=Math.max(progressIdx, playIdx+1); saveProgress();
  startStep(playIdx+1);
}

/* ----- série d'ordres (détection par sondage de l'état B) ----- */
function arcSeries(cfg){
  let i=-1;
  function show(){
    const o=cfg.steps[i]; if(!o) return;
    if(o.prep) o.prep();
    showOrder('<span class="oc-ic">'+(o.ic||'👉')+'</span><span>'+o.t+'</span><span class="oc-n">'+(i+1)+'/'+cfg.steps.length+'</span>');
    arcGoal((o.ic||'👉')+' '+o.t+' · <b>'+(i+1)+' / '+cfg.steps.length+'</b>');
  }
  function next(){
    i++;
    if(i>=cfg.steps.length){ hideOrder(); cfg.done(); return; }
    show();
  }
  every(150, function(){
    if(!ARC.on||ARC.over) return;
    const o=cfg.steps[i]; if(!o) return;
    if(o.miss){ const m=o.miss(); if(m){ arcMiss(m); if(o.prep) o.prep(); return; } }
    if(o.test()){ arcHit(o.pts||15, orderEl()); next(); }
  });
  next();
}

  arcStart({shields:3, goalText:'10 adresses : vraie ✅ ou piège ❌ ?'});

    if(!it.bad) return it.u;

      banner('🚪 Salle '+(step+1)+' !','good');
      arcGoal('🚪 Salle '+(step+1)+' / '+rooms.length+' — '+opts.goal);
    }
  });
}

  ARC.onAction=function(arg, el){
    if(ARC.over||!ARC.on||lock) return;
    if(arg.indexOf('kw:')===0){
      const bi=+arg.slice(3);
      if(sel.has(bi)) sel.delete(bi); else sel.add(bi);
      beep('click'); draw(); return;
    }
    if(arg==='go'){
      const f=FORGE[i];
      const chosen=Array.from(sel).map(bi=>f.blocks[bi]);
      if(!chosen.length){ banner('Choisis des mots-clés !','bad'); return; }
      if(chosen.some(b=>!b.ok)){ arcMiss('Mot inutile choisi !'); sel=new Set(); draw(); return; }
      if(f.blocks.some((b,bi)=>b.ok && !sel.has(bi))){ arcMiss('Il manque un mot-clé !'); sel=new Set(); draw(); return; }
      lock=true;
      arcHit(25, el); draw(true);
      after(1400, function(){ i++; sel=new Set(); lock=false; if(i>=FORGE.length) done(); else draw(); });
    }
  };
  draw();
}

function infoxBossRun(){
  const k=nvBossMode();
  const md=Object.assign({key:k, label:PZ_MODES[k].label}, IX_MODES[k]);
  IX={md:md, gen:0, phase:1, hp:22, max:22, cut:[5,9,15,20,22], hearts:md.hearts, maxHearts:md.hearts,
      face:'😈', over:false, busy:false, charging:false, boost:false, deadline:null, tTotal:1,
      hVerdict:null, hSosie:null, hFile:null, hForge:null, hTimeout:null};
  ARC.screenHtml=ixArenaHtml();
  renderViewport();
  ixHud(); pzFsSetup(); ixMusic(1);
  banner('👾 INFOX attaque le collège !','bad');
  /* horloge des défis chronométrés */
  every(100, function(){
    if(!IX||IX.over||IX.busy||!IX.deadline) return;
    const rem=IX.deadline-Date.now();
    const bar=document.getElementById('ixTimer'), wrap=document.getElementById('ixTimerWrap');
    if(bar) bar.style.width=Math.max(0,rem/IX.tTotal*100)+'%';
    if(wrap) wrap.classList.toggle('low', rem<=IX.tTotal*.3);
    if(rem<=0){ IX.deadline=null; if(IX.hTimeout) IX.hTimeout(); }
  });
  /* attaques télégraphiées (1,5 s de charge visible) */
  every(9500, function(){
    if(!IX||IX.over||IX.busy||IX.charging||IX.phase<2) return;
    IX.charging=true;
    const spr=document.getElementById('ixSprite'); if(spr) spr.classList.add('charge');
    banner('⚠️ INFOX charge son attaque…','bad'); arcTone(180,.34,'sawtooth',.11);
    after(1500, function(){
      if(!IX||IX.over) return;
      const s2=document.getElementById('ixSprite'); if(s2) s2.classList.remove('charge');
      IX.charging=false;
      if(IX.busy) return;
      beep('alarm');
      if(IX.phase===4){
        IX.boost=true; banner('💨 Fichiers en RAFALE !','bad');
        after(2600, function(){ if(IX) IX.boost=false; });
      } else {
        for(let i=0;i<IX.md.pop;i++) spawnPopup(ixPopupDef());
      }
    });
  });
  ARC.onAction=function(arg, el){
    if(!IX||IX.over||IX.busy) return;
    if(arg.indexOf('v:')===0 && IX.hVerdict) IX.hVerdict(arg.slice(2)==='vrai', el);
    else if(arg.indexOf('s:')===0 && IX.hSosie) IX.hSosie(arg.slice(2)==='sur', el);
    else if(arg.indexOf('w:')===0 && IX.hFile) IX.hFile(arg.slice(2), el);
    else if(arg.indexOf('f:')===0 && IX.hForge) IX.hForge(arg.slice(2), el);
  };
  ixStartPhase();
}

}
