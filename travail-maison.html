<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Travail à la maison — suivi enseignant</title>

<!-- Page enseignant, DISTINCTE du tableau de bord de l'Atelier (prof.html).
     Le suivi de l'Atelier dit où en est chaque COMPTE dans les six ateliers. Celle-ci
     dit qui a fait un travail donné à la maison, sur téléphone et SANS compte. Ce ne
     sont ni les mêmes élèves (un prénom tapé n'est pas un compte — on peut ensuite l'y
     relier, ici), ni la même question : les deux ne partagent donc pas un écran.

     Les élèves, eux, entrent par maison.html, la page d'entrée de l'année, dont le lien
     s'affiche en haut de celle-ci.

     Ce qu'elles partagent, c'est la porte : on entre ici avec son identifiant
     d'enseignant de l'Atelier, et une session ouverte sur l'une vaut pour l'autre
     (même domaine, même scripts/store.js).

     Comme prof.html, elle n'est PAS secrète : tout ce qu'elle affiche vient de l'API,
     qui vérifie le rôle « prof » à chaque requête. La sécurité est côté serveur. -->

<!-- Polices servies EN LOCAL (cf. assets/fonts/README.md) : jamais de CDN. -->
<link rel="stylesheet" href="assets/fonts/fonts.css">

<style>
  :root{
    --fond:#eef2f7; --carte:#fff; --trait:#dde5ee; --encre:#22303f; --gris:#6b7d91;
    --bleu:#2563eb; --vert:#16a34a; --orange:#e0a416; --rouge:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--encre);
       font-family:"Nunito",system-ui,"Fluent Emoji",sans-serif;font-size:15px;}
  h1,h2,h3{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;margin:0;}
  button{font-family:inherit;cursor:pointer}
  [hidden]{display:none!important}

  .barre{position:sticky;top:0;z-index:20;background:var(--carte);border-bottom:2px solid var(--trait);
         padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .barre h1{font-size:1.25rem}
  .barre .creneau{margin-right:auto;display:inline-flex}
  .barre a.btn{text-decoration:none;display:inline-flex;align-items:center}
  .barre .qui{color:var(--gris);font-size:.85rem;font-weight:700}
  .barre .etab{font-family:Fredoka,system-ui,sans-serif;font-size:.95rem;font-weight:600;
    color:var(--bleu);background:#eaf2ff;border-radius:999px;padding:3px 12px;white-space:nowrap}

  .btn{border:2px solid var(--trait);background:#fff;color:var(--encre);border-radius:999px;
       padding:8px 15px;font-weight:800;font-size:.85rem;transition:border-color .15s,background .15s;
       text-decoration:none;display:inline-flex;align-items:center}
  .btn:hover{border-color:#9fb6cd}
  .btn.primaire{background:var(--bleu);border-color:var(--bleu);color:#fff}
  .btn.danger{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.petit{padding:5px 11px;font-size:.78rem}

  .zone{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
  .vide{text-align:center;color:var(--gris);padding:60px 20px;font-weight:700}
  .note{color:var(--gris);font-size:.8rem;margin:8px 0 0;line-height:1.45}
  .msg{border-radius:12px;padding:10px 13px;font-size:.84rem;font-weight:700;margin:0 0 14px;line-height:1.4}
  .msg.ko{background:#fef2f2;color:#b91c1c}
  .msg code{font-family:ui-monospace,Menlo,Consolas,monospace}

  /* ---- connexion ---- */
  .porte{max-width:400px;margin:8vh auto 0;background:var(--carte);border:2px solid var(--trait);
         border-radius:20px;padding:26px 26px 22px}
  .porte h2{font-size:1.35rem;margin-bottom:4px}
  .porte p{color:var(--gris);font-size:.88rem;font-weight:700;margin:0 0 18px;line-height:1.45}
  .porte label{display:block;font-weight:800;font-size:.78rem;margin:12px 0 4px}
  .porte input{width:100%;border:2px solid var(--trait);border-radius:11px;padding:10px 12px;
        font-family:inherit;font-size:1rem;font-weight:700;color:var(--encre);background:#fbfdff}
  .porte input:focus{outline:none;border-color:var(--bleu);background:#fff}
  .porte .btn{width:100%;justify-content:center;margin-top:18px;padding:11px 15px;font-size:.95rem}

  /* ---- la liste des travaux ---- */
  .travaux{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:22px}
  .travail{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
        background:var(--carte);border:2px solid var(--trait);border-radius:16px;padding:13px 15px;
        color:inherit;transition:border-color .15s}
  .travail:hover{border-color:#9fb6cd}
  .travail.on{border-color:var(--bleu);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .travail .ic{font-size:1.7rem;line-height:1.1;flex:none}
  .travail .corps{min-width:0;flex:1}
  .travail .titre{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:1.08rem;display:block}
  .travail .meta{font-size:.76rem;font-weight:800;color:var(--gris);display:block;margin:1px 0 7px}
  .travail .compte{font-size:.82rem;font-weight:800;display:block}
  .travail .compte b{color:var(--vert)}
  .travail .compte.zero{color:var(--gris);font-weight:700}

  /* ---- le travail affiché ---- */
  .fiche{background:var(--carte);border:2px solid var(--trait);border-radius:20px;padding:20px 22px}
  .fiche-tete{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
  .fiche-tete h2{font-size:1.4rem}
  .fiche-tete .meta{font-size:.8rem;font-weight:800;color:var(--gris);background:#f1f5fa;border-radius:999px;padding:2px 10px}
  .fiche .resume{color:var(--gris);font-weight:700;font-size:.9rem;margin:0 0 16px}
  .fiche label{display:block;font-weight:800;font-size:.78rem;margin:0 0 4px}
  .lien{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .lien input{flex:1 1 280px;min-width:0;border:2px solid var(--trait);border-radius:11px;padding:9px 12px;
        font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;font-weight:700;color:var(--encre);background:#fbfdff}
  .lien input:focus{outline:none;border-color:var(--bleu);background:#fff}

  .filtres{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:20px 0 12px}
  .filtres .qui{margin-left:auto;color:var(--gris);font-size:.85rem;font-weight:700}
  .puce{border:2px solid var(--trait);background:#fff;border-radius:999px;padding:6px 13px;
        font-weight:800;font-size:.82rem;color:var(--gris)}
  .puce.on{background:var(--encre);border-color:var(--encre);color:#fff}

  .cadre{overflow-x:auto;border:2px solid var(--trait);border-radius:14px}
  table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:660px}
  th{text-align:left;background:#f1f5fa;padding:8px 12px;font-family:Fredoka,system-ui,sans-serif;
        font-weight:600;font-size:.82rem;color:var(--gris);white-space:nowrap}
  td{padding:8px 12px;border-top:1px solid var(--trait);vertical-align:middle;white-space:nowrap}
  .prenom{font-weight:800;font-size:.98rem}
  .double{font-size:.72rem;font-weight:800;color:#a16207;background:#fff7e0;border-radius:999px;padding:1px 7px;cursor:help}
  .pastille{font-size:.74rem;font-weight:800;border-radius:999px;padding:3px 10px}
  .pastille.fini{background:#eaf7ef;color:#15803d}
  .pastille.cours{background:#fff7e0;color:#854d0e}
  .pastille.ouvert{background:#f1f5fa;color:var(--gris)}
  .etapes{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
  .etapes i{width:18px;height:10px;border-radius:3px;background:#e2e9f1}
  .etapes i.on{background:var(--vert)}
  .nb{font-weight:800;font-variant-numeric:tabular-nums;color:var(--gris);font-size:.82rem}
  .ou{display:block;font-size:.74rem;color:var(--gris);font-weight:700;margin-top:2px}
  .score{font-variant-numeric:tabular-nums;color:var(--gris)}
  .score b{color:var(--encre);font-size:1.05rem}
  .score small{font-weight:800;margin-left:4px}
  .quand{color:var(--gris);font-size:.82rem}
  .rien{padding:34px 20px;border:2px dashed var(--trait);border-radius:14px;text-align:center;
        color:var(--gris);font-weight:700;line-height:1.5}

  .manque{margin-top:14px;padding:12px 14px;border-radius:14px;background:#fff7e0;font-size:.88rem;line-height:1.9}
  .manque b{margin-right:6px}
  .manque span{display:inline-block;background:#fff;border:2px solid #f3dfa4;border-radius:999px;
        padding:0 10px;margin:0 4px 4px 0;font-weight:800}
  .manque .note{margin-top:4px}

  .actes{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .actes .pousse{margin-left:auto}

  /* ---- le lien de l'année, les deux vues ---- */
  .entree{background:var(--carte);border:2px solid var(--trait);border-radius:20px;padding:16px 20px;margin-bottom:16px}
  .entree label{display:block;font-weight:800;font-size:.82rem;margin:0 0 6px}
  .vues{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .vues .puce{font-size:.9rem;padding:8px 16px}
  .badge{background:#fff7e0;color:#854d0e;border-radius:999px;padding:1px 8px;font-size:.74rem;margin-left:4px}
  .puce.on .badge{background:#fde68a}
  .travail.masque{opacity:.6}

  /* ---- relier une ligne à un compte ---- */
  td.eleve{white-space:normal;min-width:190px}
  .relie{font-size:.72rem;font-weight:800;color:#15803d;background:#eaf7ef;border-radius:999px;padding:1px 7px}
  .arelier{font-size:.72rem;font-weight:800;color:#854d0e;background:#fff7e0;border-radius:999px;padding:1px 7px}
  .crayon{border:0;background:none;color:var(--gris);font-size:.9rem;padding:0 4px}
  .crayon:hover{color:var(--bleu)}
  .lier{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
  select.relier{border:2px solid var(--trait);border-radius:9px;padding:4px 6px;font-family:inherit;font-weight:700;
        font-size:.8rem;color:var(--encre);background:#fbfdff;max-width:220px}
  select.relier:focus{outline:none;border-color:var(--bleu)}
  .btn.oui{background:#eaf7ef;border-color:#bbe5c8;color:#15803d}
  .envois{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .envois span{font-size:.72rem;font-weight:700;color:var(--gris);background:#f1f5fa;border-radius:999px;padding:1px 4px 1px 8px}
  .envois button{border:0;background:none;color:var(--gris);font-weight:800;padding:0 4px}
  .envois button:hover{color:var(--rouge)}

  /* ---- par élève ---- */
  table.grille{min-width:0}
  .grille th:not(:first-child){text-align:center;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  td.case{text-align:center;line-height:1.15}
  td.case b{display:block;font-size:.95rem;font-variant-numeric:tabular-nums}
  td.case span{font-size:.72rem;font-weight:700;color:var(--gris)}
  td.case.fini{background:#eaf7ef} td.case.fini b{color:#15803d}
  td.case.cours{background:#fffaeb} td.case.cours b{color:#854d0e}
  td.case.aucun{color:#b8c4d1}
  h3.sous{font-size:1.05rem;margin:22px 0 10px}

  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  @media (max-width:560px){ .barre h1{font-size:1.05rem} .fiche{padding:16px 14px} .zone{padding:14px 12px 50px} }
</style>
</head>
<body>

<div class="barre">
  <h1>📱 Travail à la maison</h1>
  <span class="etab" id="etab" hidden></span>
  <span class="creneau"></span>
  <span class="qui" id="qui"></span>
  <button class="btn" id="bQuitter" hidden>Déconnexion</button>
</div>

<div class="zone">
  <!-- La porte : l'identifiant d'enseignant de l'Atelier informatique. -->
  <form class="porte" id="porte" hidden novalidate>
    <h2>Suivi du travail à la maison</h2>
    <p>Connecte-toi avec ton identifiant d'enseignant de l'Atelier informatique.</p>
    <div id="porteMsg"></div>
    <label for="pId">Identifiant</label>
    <input id="pId" name="identifiant" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="g.nom">
    <label for="pMdp">Mot de passe</label>
    <input id="pMdp" name="motdepasse" type="password" autocomplete="current-password">
    <button class="btn primaire" type="submit" id="pEntrer">Se connecter</button>
  </form>

  <div id="suivi" hidden>
    <div class="entree" id="entree"></div>
    <div class="vues" id="vues" role="tablist"></div>
    <div class="travaux" id="travaux"></div>
    <div class="fiche" id="fiche"></div>
    <div class="fiche" id="parEleve" hidden></div>
  </div>

  <div id="vide" class="vide">Chargement…</div>
</div>

<script src="scripts/config.js"></script>
<script src="scripts/store.js"></script>
<script src="scripts/travaux.js"></script>

<script>
'use strict';

/* =========================================================================
   Cette page ne stocke rien et ne décide rien : elle peint ce que répondent
   /api/prof/devoirs (les lignes reçues, le code du lien) et /api/prof/tableau
   (les comptes de l'établissement). Le catalogue des travaux vient de
   scripts/travaux.js.

   Un travail = une valeur de `devoir`. La page affiche ceux du catalogue,
   plus tout identifiant inconnu pour lequel des lignes existent.

   UNE LIGNE = un téléphone qui a ouvert un travail sous un prénom tapé.
   L'enseignant peut la RELIER à un compte de l'Atelier (ou le serveur le fait
   tout seul quand c'est évident). Les lignes reliées au même compte sont
   FUSIONNÉES : pour un travail, on garde la meilleure étape et le meilleur
   score ; d'un travail à l'autre, la vue « Par élève » les met côte à côte,
   même si l'élève a tapé « Mohamad » ici et « Mohamed » là.
   ========================================================================= */
var RYTHME = 30000;

var etat = {
  passages: [], code: '', conservationMois: 12,
  eleves: [], classes: [], eleveParId: {},
  vue: 'travail',         /* 'travail' | 'eleves' */
  travail: null,          /* identifiant du travail affiché */
  classe: {},             /* travail → classe filtrée ('' = toutes) ; absent = pas encore choisi */
  classeEleves: null,     /* classe affichée dans la vue « Par élève » */
  edition: null           /* clé du groupe dont on change le compte */
};
var minuteur = null, demarre = false, empreinte = '';

function $(s){ return document.querySelector(s); }
function tous(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* Sans accents ni casse, tirets et espaces confondus : « Jean-Noël » = « jean noel ».
   La même règle que le serveur (prenomPlat, api/server.js). */
function plat(t){ return String(t == null ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[\s'’-]+/g, ' ').trim(); }
function pluriel(n, un, plusieurs){ return n + ' ' + (n > 1 ? plusieurs : un); }
function quand(iso){
  var d = new Date(iso), min = Math.max(0, Math.round((Date.now() - d) / 60000));
  if(min < 1) return 'à l\'instant';
  if(min < 60) return 'il y a ' + min + ' min';
  if(min < 60 * 24) return 'il y a ' + Math.round(min / 60) + ' h';
  var j = Math.round(min / 1440);
  return j < 30 ? 'il y a ' + j + ' jour' + (j > 1 ? 's' : '') : 'le ' + d.toLocaleDateString('fr-FR');
}
/* Distance d'édition : « Mohamad » est à 1 de « Mohamed ». Pour proposer, jamais pour décider. */
function distance(a, b){
  if(a === b) return 0;
  var l = [], i, j;
  for(j = 0; j <= b.length; j++) l[j] = j;
  for(i = 1; i <= a.length; i++){
    var diag = l[0]; l[0] = i;
    for(j = 1; j <= b.length; j++){
      var haut = l[j];
      l[j] = Math.min(l[j] + 1, l[j - 1] + 1, diag + (a[i - 1] === b[j - 1] ? 0 : 1));
      diag = haut;
    }
  }
  return l[b.length];
}

/* ---- Réseau -------------------------------------------------------------- */
function api(methode, chemin, corps){
  var cfg = window.ATELIER_CONFIG || {};
  var s = null; try{ s = JSON.parse(localStorage.getItem('atl_session') || 'null'); }catch(e){}
  var init = { method: methode, headers: {}, cache: 'no-store' };
  if(s && s.jeton) init.headers['Authorization'] = 'Bearer ' + s.jeton;
  if(corps !== undefined){ init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(corps); }
  return fetch(String(cfg.api || '').replace(/\/+$/,'') + chemin, init).then(function(r){
    return r.text().then(function(t){
      var j = {}; try{ j = t ? JSON.parse(t) : {}; }catch(e){}
      if(!r.ok){ var e2 = new Error(j.erreur || ('HTTP ' + r.status)); e2.statut = r.status; throw e2; }
      return j;
    });
  });
}

/* ---- Le catalogue, complété par ce qui arrive ---------------------------- */
function travaux(){
  var liste = (window.TRAVAUX || []).slice(), connus = {};
  liste.forEach(function(t){ connus[t.id] = true; });
  etat.passages.forEach(function(p){
    if(connus[p.devoir]) return;
    connus[p.devoir] = true;
    /* Un travail qui envoie des lignes sans être au catalogue : on l'affiche quand même. */
    liste.push({ id: p.devoir, titre: p.devoir, ic: '📄', matiere: '', niveaux: [], duree: '',
                 resume: 'Ce travail n\'est pas décrit dans scripts/travaux.js : il s\'affiche sous son identifiant.',
                 url: '', etapes: [], inconnu: true });
  });
  return liste;
}
function leTravail(){
  var liste = travaux();
  return liste.filter(function(t){ return t.id === etat.travail; })[0] || liste[0] || null;
}
function niveauxDe(t){ return Array.isArray(t.niveaux) ? t.niveaux : []; }
function pourClasse(t, classe){
  var n = niveauxDe(t);
  return !n.length || n.some(function(x){ return plat(x) === plat(classe); });
}
function lignesDe(id){ return etat.passages.filter(function(p){ return p.devoir === id; }); }

function classeExiste(nom){
  return etat.classes.some(function(c){ return plat(c.nom) === plat(nom); });
}
/* La classe filtrée pour un travail. Au premier affichage : son niveau s'il n'en vise
   qu'un et qu'il existe dans l'établissement ; sinon toutes. */
function classeDe(t){
  if(etat.classe[t.id] === undefined){
    var n = niveauxDe(t);
    etat.classe[t.id] = n.length === 1 && classeExiste(n[0]) ? n[0] : '';
  }
  return etat.classe[t.id];
}
/* LE lien des élèves, le même toute l'année : la page d'entrée, à côté de celle-ci. */
function lienEntree(){
  if(!etat.code) return '';
  return new URL('maison.html', location.href).href.replace(/[?#].*$/, '') + '?c=' + encodeURIComponent(etat.code);
}
function eleves(){
  return etat.eleves.filter(function(e){ return e.role === 'eleve'; });
}
function nomCourt(e){ return e.prenom + ' ' + String(e.nom || '').charAt(0) + '.'; }
function nomLong(e){ return e.prenom + ' ' + (e.nom || ''); }
function ordreClasse(nom){
  for(var i = 0; i < etat.classes.length; i++) if(plat(etat.classes[i].nom) === plat(nom)) return i;
  return 999;
}

/* ---- Les groupes : les lignes d'un travail, fusionnées par compte ---------- */
function grouper(lignes){
  var parCle = {}, liste = [];
  lignes.forEach(function(p){
    var e = p.compte_id != null ? etat.eleveParId[p.compte_id] : null;
    var cle = e ? 'c' + e.id : 'p' + p.id;
    var g = parCle[cle];
    if(!g){
      g = parCle[cle] = { cle: cle, eleve: e || null, lignes: [], etape: 0, etapes: 0, score: 0, score_max: 0,
                          termine: false, maj_le: p.maj_le,
                          classe: e ? (e.classe || '') : (p.classe || ''),
                          nom: e ? nomLong(e) : p.prenom };
      liste.push(g);
    }
    g.lignes.push(p);
    /* Deux envois pour le même travail (deux téléphones, un prénom refait) : on garde le
       meilleur de chacun, comme le serveur le fait déjà pour un même téléphone. */
    g.etape = Math.max(g.etape, p.etape); g.etapes = Math.max(g.etapes, p.etapes);
    g.score = Math.max(g.score, p.score); g.score_max = Math.max(g.score_max, p.score_max);
    g.termine = g.termine || p.termine;
    if(p.maj_le > g.maj_le) g.maj_le = p.maj_le;
  });
  liste.forEach(function(g){ g.ids = g.lignes.map(function(p){ return p.id; }); });
  liste.sort(function(a, b){
    return ordreClasse(a.classe) - ordreClasse(b.classe) || (a.eleve ? 0 : 1) - (b.eleve ? 0 : 1) ||
      plat(a.eleve ? a.eleve.nom + ' ' + a.eleve.prenom : a.nom).localeCompare(plat(b.eleve ? b.eleve.nom + ' ' + b.eleve.prenom : b.nom));
  });
  return liste;
}

/* Un compte à proposer pour une ligne pas encore reliée — jamais relié sans clic :
   d'abord celui d'une autre ligne du même téléphone (le serveur le dit dans
   `suggestion`), puis un prénom de la classe très proche et sans ex æquo. */
function suggestion(g){
  for(var i = 0; i < g.lignes.length; i++){
    var s = g.lignes[i].suggestion;
    if(s != null && etat.eleveParId[s]) return { eleve: etat.eleveParId[s], pourquoi: 'même téléphone qu\'un autre devoir déjà relié' };
  }
  var cle = plat(g.nom), meilleurs = [], d0 = 99;
  if(cle.length < 3) return null;
  eleves().forEach(function(e){
    if(e.actif === false || plat(e.classe) !== plat(g.classe)) return;
    var d = distance(cle, plat(e.prenom));
    if(d < d0){ d0 = d; meilleurs = [e]; } else if(d === d0) meilleurs.push(e);
  });
  if(meilleurs.length === 1 && d0 <= 2) return { eleve: meilleurs[0], pourquoi: 'prénom proche dans la même classe' };
  return null;
}

/* La liste déroulante « Relier à… » : la classe de la ligne d'abord, du plus proche
   au plus lointain, puis les autres classes (un élève qui s'est trompé de tuile). */
function choixCompte(g, avecPersonne){
  var cle = plat(g.lignes[0].prenom), memeClasse = [], autres = {};
  eleves().forEach(function(e){
    if(e.actif === false) return;
    if(plat(e.classe) === plat(g.lignes[0].classe)) memeClasse.push(e);
    else (autres[e.classe || '—'] = autres[e.classe || '—'] || []).push(e);
  });
  memeClasse.sort(function(a, b){
    return distance(cle, plat(a.prenom)) - distance(cle, plat(b.prenom)) || plat(a.nom).localeCompare(plat(b.nom));
  });
  var opt = function(e){
    return '<option value="' + e.id + '"' + (g.eleve && g.eleve.id === e.id ? ' selected' : '') + '>' + esc(nomLong(e)) + '</option>';
  };
  var h = '<select class="relier" data-ids="' + esc(g.ids.join(',')) + '" aria-label="Relier ' + esc(g.lignes[0].prenom) + ' à un élève de l\'Atelier">' +
    '<option value="">' + (g.eleve ? 'Changer d\'élève…' : 'Relier à un élève…') + '</option>' +
    (avecPersonne ? '<option value="0">— Ne le relier à personne</option>' : '');
  if(memeClasse.length) h += '<optgroup label="' + esc(g.lignes[0].classe || 'Sans classe') + '">' + memeClasse.map(opt).join('') + '</optgroup>';
  Object.keys(autres).sort(function(a, b){ return ordreClasse(a) - ordreClasse(b); }).forEach(function(c){
    h += '<optgroup label="' + esc(c) + '">' + autres[c].sort(function(a, b){ return plat(a.nom).localeCompare(plat(b.nom)); }).map(opt).join('') + '</optgroup>';
  });
  return h + '</select>';
}

/* La cellule « Élève » : le compte relié, ou le prénom tapé et de quoi le relier. */
function celluleEleve(g, doublons){
  if(g.eleve && etat.edition !== g.cle){
    var tapes = {}, autres = [];
    g.lignes.forEach(function(p){ if(plat(p.prenom) !== plat(g.eleve.prenom) && !tapes[plat(p.prenom)]){ tapes[plat(p.prenom)] = 1; autres.push(p.prenom); } });
    var auto = g.lignes.every(function(p){ return p.lien === 'prenom' || p.lien === 'appareil'; });
    var detail = (autres.length ? 'a écrit « ' + autres.map(esc).join(' », « ') + ' »' : '') +
      (g.lignes.length > 1 ? (autres.length ? ' · ' : '') + pluriel(g.lignes.length, 'envoi fusionné', 'envois fusionnés') : '');
    return '<td class="eleve"><span class="prenom">' + esc(nomLong(g.eleve)) + '</span>' +
      ' <span class="relie" title="' + (auto ? 'Relié automatiquement au compte de l\'Atelier' : 'Relié par toi au compte de l\'Atelier') + '">✓' + (auto ? ' auto' : '') + '</span>' +
      ' <button class="crayon" data-editer="' + esc(g.cle) + '" title="Changer l\'élève relié" aria-label="Changer l\'élève relié à cette ligne">✎</button>' +
      (detail ? '<span class="ou">' + detail + '</span>' : '') +
      (g.lignes.length > 1 ? '<span class="envois">' + g.lignes.map(function(p){
        return '<span>' + esc(p.prenom) + ' · ' + p.etape + '/' + p.etapes +
          ' <button data-delier="' + esc(p.id) + '" title="Sortir cet envoi de la fusion" aria-label="Délier l\'envoi de ' + esc(p.prenom) + '">×</button></span>';
      }).join('') + '</span>' : '') +
      '</td>';
  }
  var k = plat(g.classe) + '|' + plat(g.nom);
  var meme = !g.eleve && doublons && doublons[k] > 1
    ? ' <span class="double" title="Même prénom dans la même classe : deux élèves, ou le même élève sur deux téléphones.">×' + doublons[k] + '</span>' : '';
  var s = !g.eleve ? suggestion(g) : null;
  return '<td class="eleve">' +
    (g.eleve ? '<span class="prenom">' + esc(nomLong(g.eleve)) + '</span>'
             : '<span class="prenom">' + esc(g.nom) + '</span>' + meme + ' <span class="arelier">à relier</span>') +
    '<span class="lier">' +
      (s ? '<button class="btn petit oui" data-lier="' + esc(g.ids.join(',')) + '" data-compte="' + s.eleve.id + '" title="Proposé : ' + esc(s.pourquoi) + '">✓ ' + esc(nomCourt(s.eleve)) + ' ?</button>' : '') +
      choixCompte(g, !!g.eleve) +
      (etat.edition === g.cle ? ' <button class="btn petit" data-annuler="1">Annuler</button>' : '') +
    '</span></td>';
}

/* ---- Peinture ------------------------------------------------------------ */
function peindreLien(){
  var url = lienEntree();
  $('#entree').innerHTML = url
    ? '<label for="lien">Le lien à donner aux élèves — le même toute l\'année</label>' +
      '<div class="lien"><input id="lien" readonly value="' + esc(url) + '">' +
      '<button class="btn primaire" id="bCopier">Copier</button>' +
      '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Ouvrir</a></div>' +
      '<p class="note">L\'élève y écrit son prénom et choisit sa classe une seule fois, puis trouve une tuile par travail ' +
      'prévu pour sa classe. Ajouter un travail dans <code>scripts/travaux.js</code> fait apparaître sa tuile, sans nouveau lien. ' +
      'Les lignes s\'effacent toutes seules ' + esc(String(etat.conservationMois)) + ' mois après la dernière activité.</p>'
    : '<div class="msg ko">Le code du lien n\'a pas pu être créé.</div>';
  if($('#bCopier')) $('#bCopier').addEventListener('click', function(){
    var champ = $('#lien'), bouton = this;
    var fait = function(){ bouton.textContent = 'Copié ✓'; setTimeout(function(){ bouton.textContent = 'Copier'; }, 1800); };
    var aLaMain = function(){ champ.focus(); champ.select(); try{ if(document.execCommand('copy')) fait(); }catch(e){} };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(champ.value).then(fait, aLaMain);
    else aLaMain();
  });
  if($('#lien')) $('#lien').addEventListener('focus', function(){ this.select(); });
}

function peindreVues(){
  var arelier = etat.passages.filter(function(p){ return p.compte_id == null || !etat.eleveParId[p.compte_id]; }).length;
  $('#vues').innerHTML =
    '<button class="puce' + (etat.vue === 'travail' ? ' on' : '') + '" data-vue="travail">📋 Par travail</button>' +
    '<button class="puce' + (etat.vue === 'eleves' ? ' on' : '') + '" data-vue="eleves">👥 Par élève' +
      (arelier ? ' <span class="badge" title="Lignes pas encore reliées à un compte">' + arelier + ' à relier</span>' : '') + '</button>';
  tous('[data-vue]').forEach(function(b){
    b.addEventListener('click', function(){ etat.vue = b.getAttribute('data-vue'); etat.edition = null; peindre(); });
  });
}

function peindreTravaux(){
  var courant = leTravail();
  $('#travaux').hidden = etat.vue !== 'travail';
  $('#travaux').innerHTML = travaux().map(function(t){
    var g = grouper(lignesDe(t.id)), finis = g.filter(function(x){ return x.termine; }).length;
    var meta = [t.matiere, niveauxDe(t).join(', '), t.duree].filter(Boolean).join(' · ');
    var on = courant && t.id === courant.id;
    return '<button class="travail' + (on ? ' on' : '') + (t.masque ? ' masque' : '') + '" data-travail="' + esc(t.id) + '"' +
      (on ? ' aria-current="true"' : '') + '>' +
      '<span class="ic" aria-hidden="true">' + esc(t.ic || '📄') + '</span>' +
      '<span class="corps"><span class="titre">' + esc(t.titre) + '</span>' +
      '<span class="meta">' + (meta ? esc(meta) : '&nbsp;') + (t.masque ? ' · <b>caché aux élèves</b>' : '') + '</span>' +
      (g.length
        ? '<span class="compte">' + pluriel(g.length, 'élève', 'élèves') + ' · <b>' + pluriel(finis, 'terminé', 'terminés') + '</b></span>'
        : '<span class="compte zero">Pas encore ouvert</span>') +
      '</span></button>';
  }).join('');
  tous('[data-travail]').forEach(function(b){
    b.addEventListener('click', function(){
      etat.travail = b.getAttribute('data-travail'); etat.edition = null;
      try{ history.replaceState(null, '', '#' + etat.travail); }catch(e){}
      peindre();
    });
  });
}

function barreEtapes(p, t){
  var n = Math.max(1, p.etapes || 1), h = '';
  for(var i = 0; i < n; i++){
    var nom = t.etapes && t.etapes.length === n ? t.etapes[i] : 'Étape ' + (i + 1);
    h += '<i class="' + (i < p.etape ? 'on' : '') + '" title="' + esc(nom) + '"></i>';
  }
  /* « Où il en est » en clair : le nom de la prochaine étape, quand le catalogue le connaît. */
  var suite = !p.termine && t.etapes && t.etapes.length === n && p.etape < n
    ? '<span class="ou">à faire : ' + esc(t.etapes[p.etape]) + '</span>' : '';
  return '<span class="etapes">' + h + '</span><span class="nb">' + p.etape + ' / ' + n + '</span>' + suite;
}
function pastille(g){
  return g.termine ? '<span class="pastille fini">Terminé</span>'
       : g.etape > 0 ? '<span class="pastille cours">En cours</span>'
       : '<span class="pastille ouvert">Ouvert</span>';
}
function score(g){
  var pc = g.score_max ? Math.round(g.score * 100 / g.score_max) : 0;
  return '<b>' + g.score + '</b> / ' + g.score_max + (g.score_max && g.etape > 0 ? ' <small>' + pc + ' %</small>' : '');
}

function ligne(g, t, doublons){
  return '<tr>' + celluleEleve(g, doublons) +
    '<td>' + esc(g.classe || '—') + '</td>' +
    '<td>' + pastille(g) + '</td>' +
    '<td>' + barreEtapes(g, t) + '</td>' +
    '<td class="score">' + score(g) + '</td>' +
    '<td class="quand">' + esc(quand(g.maj_le)) + '</td>' +
    '<td><button class="btn petit" data-suppr="' + esc(g.ids.join(',')) + '" title="Effacer" aria-label="Effacer la ligne de ' +
      esc(g.nom) + '">🗑</button></td>' +
  '</tr>';
}

function peindreFiche(){
  var t = leTravail();
  $('#fiche').hidden = etat.vue !== 'travail';
  if(etat.vue !== 'travail') return;
  if(!t){
    $('#fiche').innerHTML = '<div class="rien">Aucun travail au catalogue. Ajoute-en un dans <code>scripts/travaux.js</code>.</div>';
    return;
  }
  var groupes = grouper(lignesDe(t.id)), classe = classeDe(t);
  var vus = groupes.filter(function(g){ return !classe || plat(g.classe) === plat(classe); });
  var meta = [t.matiere, niveauxDe(t).length ? 'pour ' + niveauxDe(t).join(', ') : 'toutes les classes', t.duree].filter(Boolean).join(' · ');

  var doublons = {};
  groupes.forEach(function(g){ if(!g.eleve){ var k = plat(g.classe) + '|' + plat(g.nom); doublons[k] = (doublons[k] || 0) + 1; } });

  /* Les classes en filtre : celles de l'établissement, dans son ordre, puis celles qui
     n'existeraient plus mais ont encore des lignes. */
  var noms = etat.classes.map(function(c){ return c.nom; });
  groupes.forEach(function(g){ if(g.classe && !noms.some(function(n){ return plat(n) === plat(g.classe); })) noms.push(g.classe); });
  var avec = {}; groupes.forEach(function(g){ avec[plat(g.classe)] = (avec[plat(g.classe)] || 0) + 1; });
  var puces = '<button class="puce' + (!classe ? ' on' : '') + '" data-classe="">Toutes</button>' +
    noms.filter(function(n){ return avec[plat(n)] || plat(n) === plat(classe) || niveauxDe(t).some(function(x){ return plat(x) === plat(n); }); })
      .map(function(n){
        return '<button class="puce' + (plat(classe) === plat(n) ? ' on' : '') + '" data-classe="' + esc(n) + '">' +
          esc(n) + (avec[plat(n)] ? ' · ' + avec[plat(n)] : '') + '</button>';
      }).join('');

  var finis = vus.filter(function(g){ return g.termine; }).length;
  var arelier = vus.filter(function(g){ return !g.eleve; }).length;

  /* Pas encore vus : les comptes de la classe qu'aucune ligne de ce travail ne relie. */
  var relies = {}; groupes.forEach(function(g){ if(g.eleve) relies[g.eleve.id] = true; });
  var inscrits = classe ? eleves().filter(function(e){ return e.actif !== false && plat(e.classe) === plat(classe); }) : [];
  var manquants = inscrits.filter(function(e){ return !relies[e.id]; });

  $('#fiche').innerHTML =
    '<div class="fiche-tete"><h2>' + esc(t.ic || '') + ' ' + esc(t.titre) + '</h2>' +
      (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') +
      (t.masque ? '<span class="meta">caché aux élèves</span>' : '') + '</div>' +
    '<p class="resume">' + esc(t.resume || '') + '</p>' +
    (!t.url && !t.inconnu ? '<div class="msg ko">Pas de tuile chez les élèves : <code>url</code> est vide pour ce travail dans scripts/travaux.js.</div>' : '') +

    '<div class="filtres">' + puces +
      '<span class="qui">' + (vus.length
        ? pluriel(vus.length, 'élève a ouvert le travail', 'élèves ont ouvert le travail') + ' · ' +
          pluriel(finis, 'l\'a terminé', 'l\'ont terminé')
        : '') + '</span></div>' +

    (vus.length
      ? '<div class="cadre"><table><thead><tr>' +
        '<th>Élève</th><th>Classe</th><th>État</th><th>Jusqu\'où</th><th>Score</th><th>Dernière activité</th><th></th>' +
        '</tr></thead><tbody>' + vus.map(function(g){ return ligne(g, t, doublons); }).join('') + '</tbody></table></div>' +
        (arelier ? '<p class="note">« à relier » : un prénom qui ne correspond à aucun compte de la classe, ou à plusieurs. ' +
          'Relie-le à un élève de l\'Atelier : ses devoirs suivants faits sur le même téléphone se relieront tout seuls.</p>' : '')
      : '<div class="rien">' + (groupes.length
          ? 'Aucun élève de ' + esc(classe) + ' n\'a encore ouvert ce travail.'
          : 'Personne n\'a encore ouvert ce travail.<br>Donne le lien ci-dessus aux élèves : ils apparaissent ici dès qu\'ils l\'ont ouvert.') + '</div>') +

    (classe && inscrits.length
      ? '<div class="manque"><b>Pas encore vus en ' + esc(classe) + ' (' + manquants.length + ' sur ' + inscrits.length + ')</b> ' +
        (manquants.length
          ? manquants.map(function(e){ return '<span>' + esc(nomCourt(e)) + '</span>'; }).join('')
          : '<em>Tous les élèves de la classe sont là.</em>') +
        '<p class="note">Les comptes de la classe dans l\'Atelier qu\'aucune ligne ne relie.' +
          (arelier ? ' Il reste ' + pluriel(arelier, 'ligne', 'lignes') + ' à relier : un élève de cette liste s\'y cache peut-être.' : '') + '</p></div>'
      : (!classe && vus.length ? '<p class="note">Choisis une classe pour voir qui ne l\'a pas encore ouvert.</p>' : '')) +

    '<div class="actes">' +
      '<button class="btn" id="bActualiser">↻ Actualiser</button>' +
      (vus.length ? '<button class="btn danger pousse" id="bVider">🗑 Effacer ' +
        (classe ? 'les lignes de ' + esc(classe) : 'toutes les lignes') + '</button>' : '') +
    '</div>';

  tous('#fiche [data-classe]').forEach(function(b){
    b.addEventListener('click', function(){ etat.classe[t.id] = b.getAttribute('data-classe') || ''; etat.edition = null; peindreFiche(); });
  });
  $('#bActualiser').addEventListener('click', function(){ charger(true); });
  if($('#bVider')) $('#bVider').addEventListener('click', function(){
    var ids = [].concat.apply([], vus.map(function(g){ return g.ids; }));
    if(!confirm('Effacer ' + pluriel(vus.length, 'élève', 'élèves') + ' de « ' + t.titre + ' »' + (classe ? ' en ' + classe : '') + ' ?\n\n' +
      'Les scores sont perdus côté suivi. Les élèves gardent leur avancée sur leur téléphone.')) return;
    api('DELETE', '/api/prof/devoirs', { ids: ids }).then(function(){ return charger(true); }).catch(function(e){ alert(e.message); });
  });
  brancherLignes('#fiche');
}

/* ---- Par élève : la classe, ses comptes, et tous les travaux côte à côte ---- */
function peindreEleves(){
  var zone = $('#parEleve');
  zone.hidden = etat.vue !== 'eleves';
  if(etat.vue !== 'eleves') return;

  var noms = etat.classes.map(function(c){ return c.nom; });
  if(etat.classeEleves == null || !noms.some(function(n){ return plat(n) === plat(etat.classeEleves); })){
    /* Par défaut : la première classe visée par un travail, sinon la première tout court. */
    var vise = noms.filter(function(n){ return travaux().some(function(t){ return niveauxDe(t).some(function(x){ return plat(x) === plat(n); }); }); });
    etat.classeEleves = vise[0] || noms[0] || '';
  }
  var classe = etat.classeEleves;

  var comptes = eleves().filter(function(e){ return plat(e.classe) === plat(classe); })
    .sort(function(a, b){ return plat(a.nom + ' ' + a.prenom).localeCompare(plat(b.nom + ' ' + b.prenom)); });
  var ids = {}; comptes.forEach(function(e){ ids[e.id] = true; });

  /* Les colonnes : les travaux prévus pour cette classe, plus ceux qu'un de ses élèves a
     faits quand même (un 4e qui a ouvert le travail des 5e). */
  var cols = travaux().filter(function(t){
    return (!t.inconnu && pourClasse(t, classe)) ||
      lignesDe(t.id).some(function(p){ return p.compte_id != null && ids[p.compte_id]; });
  });

  var cellule = function(e, t){
    var g = grouper(lignesDe(t.id).filter(function(p){ return p.compte_id === e.id; }))[0];
    if(!g) return '<td class="case aucun">—</td>';
    return '<td class="case ' + (g.termine ? 'fini' : g.etape > 0 ? 'cours' : 'ouvert') + '" title="' +
      esc(t.titre + ' : ' + g.etape + ' / ' + g.etapes + ', score ' + g.score + ' / ' + g.score_max + ', ' + quand(g.maj_le)) + '">' +
      '<b>' + g.etape + '/' + g.etapes + '</b><span>' + g.score + ' / ' + g.score_max + '</span></td>';
  };

  var orphelins = grouper(etat.passages.filter(function(p){
    return (p.compte_id == null || !etat.eleveParId[p.compte_id]) && plat(p.classe) === plat(classe);
  }));
  var titreDe = {}; travaux().forEach(function(t){ titreDe[t.id] = t; });

  zone.innerHTML =
    '<div class="filtres">' + noms.map(function(n){
      return '<button class="puce' + (plat(n) === plat(classe) ? ' on' : '') + '" data-classe-eleves="' + esc(n) + '">' + esc(n) + '</button>';
    }).join('') + '<span class="qui">' + pluriel(comptes.length, 'compte', 'comptes') + '</span></div>' +

    (comptes.length && cols.length
      ? '<div class="cadre"><table class="grille"><thead><tr><th>Élève</th>' +
          cols.map(function(t){ return '<th title="' + esc(t.titre) + '">' + esc(t.ic || '📄') + ' ' + esc(t.titre) + '</th>'; }).join('') +
        '</tr></thead><tbody>' + comptes.map(function(e){
          return '<tr><td class="prenom">' + esc(e.nom) + ' ' + esc(e.prenom) + (e.actif === false ? ' <small>(désactivé)</small>' : '') + '</td>' +
            cols.map(function(t){ return cellule(e, t); }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>' +
        '<p class="note">Chaque case fusionne tout ce que l\'élève a envoyé pour ce travail, quel que soit le prénom tapé ou le téléphone : ' +
          'étapes faites, puis score. « — » : rien de relié à ce compte.</p>'
      : '<div class="rien">' + (!comptes.length ? 'Aucun compte en ' + esc(classe) + ' dans l\'Atelier.' : 'Aucun travail prévu pour la ' + esc(classe) + ' pour l\'instant.') + '</div>') +

    (orphelins.length
      ? '<h3 class="sous">À relier en ' + esc(classe) + ' (' + orphelins.length + ')</h3>' +
        '<div class="cadre"><table><thead><tr><th>Prénom tapé</th><th>Travail</th><th>Jusqu\'où</th><th>Score</th><th>Dernière activité</th></tr></thead><tbody>' +
        orphelins.map(function(g){
          var t = titreDe[g.lignes[0].devoir] || { titre: g.lignes[0].devoir, etapes: [] };
          return '<tr>' + celluleEleve(g, null) + '<td>' + esc(t.ic || '') + ' ' + esc(t.titre) + '</td>' +
            '<td><span class="nb">' + g.etape + ' / ' + g.etapes + '</span></td><td class="score">' + score(g) + '</td>' +
            '<td class="quand">' + esc(quand(g.maj_le)) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '');

  tous('[data-classe-eleves]').forEach(function(b){
    b.addEventListener('click', function(){ etat.classeEleves = b.getAttribute('data-classe-eleves'); etat.edition = null; peindreEleves(); });
  });
  brancherLignes('#parEleve');
}

/* Relier, délier, effacer : les mêmes gestes dans les deux vues. */
function lier(ids, compte){
  return api('PUT', '/api/prof/devoirs/lien', { ids: ids, compte: compte })
    .then(function(){ etat.edition = null; return charger(true); })
    .catch(function(e){ alert(e.message); });
}
function brancherLignes(racine){
  tous(racine + ' select.relier').forEach(function(s){
    s.addEventListener('change', function(){
      if(s.value === '') return;
      s.disabled = true;
      lier(s.getAttribute('data-ids').split(','), s.value === '0' ? null : Number(s.value));
    });
  });
  tous(racine + ' [data-lier]').forEach(function(b){
    b.addEventListener('click', function(){ b.disabled = true; lier(b.getAttribute('data-lier').split(','), Number(b.getAttribute('data-compte'))); });
  });
  tous(racine + ' [data-delier]').forEach(function(b){
    b.addEventListener('click', function(){ lier([b.getAttribute('data-delier')], null); });
  });
  tous(racine + ' [data-editer]').forEach(function(b){
    b.addEventListener('click', function(){ etat.edition = b.getAttribute('data-editer'); peindre(); });
  });
  tous(racine + ' [data-annuler]').forEach(function(b){
    b.addEventListener('click', function(){ etat.edition = null; peindre(); });
  });
  tous(racine + ' [data-suppr]').forEach(function(b){
    b.addEventListener('click', function(){
      var ids = b.getAttribute('data-suppr').split(',');
      var p = etat.passages.filter(function(x){ return x.id === ids[0]; })[0];
      if(!p || !confirm('Effacer ' + (ids.length > 1 ? 'les ' + ids.length + ' envois de ' : 'la ligne de ') + p.prenom + ' (' + (p.classe || 'sans classe') + ') ?\n\n' +
        'Si l\'élève rouvre le travail sur le même téléphone, sa ligne reviendra avec son score.')) return;
      api('DELETE', '/api/prof/devoirs', { ids: ids }).then(function(){ return charger(true); }).catch(function(e){ alert(e.message); });
    });
  });
}

function peindre(){ peindreLien(); peindreVues(); peindreTravaux(); peindreFiche(); peindreEleves(); }

/* ---- Chargement ---------------------------------------------------------- */
function charger(force){
  return Promise.all([api('GET', '/api/prof/devoirs'), api('GET', '/api/prof/tableau')]).then(function(r){
    /* Rien de neuf : on ne repeint pas — un rafraîchissement toutes les 30 s qui
       redessine tout ferait sauter le défilement, la sélection du lien, ou une liste
       « Relier à… » ouverte. */
    var nouvelle = JSON.stringify([r[0], r[1].classes, r[1].eleves.map(function(e){ return [e.id, e.prenom, e.nom, e.classe, e.role, e.actif]; })]);
    if(nouvelle === empreinte && force !== true) return;
    if(force !== true && (etat.edition || (document.activeElement && document.activeElement.tagName === 'SELECT'))) return;
    empreinte = nouvelle;
    etat.passages = r[0].passages || [];
    etat.code = r[0].code || '';
    etat.conservationMois = r[0].conservationMois || 12;
    etat.eleves = r[1].eleves || [];
    etat.classes = r[1].classes || [];
    etat.eleveParId = {};
    etat.eleves.forEach(function(e){ if(e.role === 'eleve') etat.eleveParId[e.id] = e; });
    if(r[1].etablissement){ $('#etab').textContent = r[1].etablissement; $('#etab').hidden = false; }
    $('#vide').hidden = true; $('#suivi').hidden = false;
    peindre();
  }).catch(function(e){
    if(e.statut === 401){ sortir('Ta session a expiré. Reconnecte-toi.'); return; }
    $('#suivi').hidden = true; $('#vide').hidden = false;
    $('#vide').textContent = e.statut === 404
      ? 'Le serveur ne connaît pas encore le travail à la maison : l\'API doit être redéployée (api/README.md § 2.4).'
      : 'Suivi indisponible : ' + e.message;
  });
}

/* ---- Connexion ----------------------------------------------------------- */
function montrerPorte(message){
  $('#vide').hidden = true; $('#suivi').hidden = true; $('#porte').hidden = false;
  $('#bQuitter').hidden = true; $('#qui').textContent = ''; $('#etab').hidden = true;
  $('#porteMsg').innerHTML = message ? '<div class="msg ko">' + esc(message) + '</div>' : '';
  $('#pId').focus();
}

function sortir(message){
  if(minuteur){ clearInterval(minuteur); minuteur = null; }
  demarre = false; empreinte = '';
  montrerPorte(message);
}

function entrer(){
  var el = Store.eleve();
  if(!el) return montrerPorte();
  if(el.role !== 'prof'){
    /* Un élève ou l'administrateur connecté sur ce poste : ce n'est pas sa page. On lui
       propose la porte plutôt que de le laisser devant un refus du serveur. */
    return montrerPorte(el.role === 'admin'
      ? 'Le compte administrateur ne voit pas les élèves. Connecte-toi avec ton compte enseignant.'
      : 'Cette page est réservée aux enseignants.');
  }
  if(demarre) return;
  demarre = true;
  $('#porte').hidden = true; $('#vide').hidden = false; $('#vide').textContent = 'Chargement…';
  $('#qui').textContent = el.prenom + ' ' + el.nom;
  $('#bQuitter').hidden = false;
  etat.travail = decodeURIComponent(location.hash.replace(/^#/, '')) || null;
  charger(true);
  minuteur = setInterval(function(){ if(!document.hidden) charger(); }, RYTHME);
}

$('#porte').addEventListener('submit', function(ev){
  ev.preventDefault();
  var id = $('#pId').value.trim(), mdp = $('#pMdp').value;
  if(!id || !mdp){ $('#porteMsg').innerHTML = '<div class="msg ko">Écris ton identifiant et ton mot de passe.</div>'; return; }
  var b = $('#pEntrer'); b.disabled = true; b.textContent = 'Connexion…';
  Store.connexion(id, mdp).then(function(){
    $('#pMdp').value = '';
    entrer();
  }).catch(function(e){
    $('#porteMsg').innerHTML = '<div class="msg ko">' + esc(e.message || 'Connexion impossible.') + '</div>';
  }).then(function(){ b.disabled = false; b.textContent = 'Se connecter'; });
});

$('#bQuitter').addEventListener('click', function(){
  Store.deconnexion().then(function(){ sortir(); }, function(){ sortir(); });
});

if(!Store.enLigne()){
  $('#vide').textContent = 'Aucun serveur configuré (scripts/config.js) : le suivi demande une API.';
}else{
  /* store.js vérifie la session en tâche de fond ; on attend son verdict. */
  var vu = false;
  Store.surEtat(function(e){
    if(e === 'expire' && demarre){ sortir('Ta session a expiré. Reconnecte-toi.'); return; }
    if(vu) return;
    if(e === 'ok' || e === 'invite' || e === 'expire'){ vu = true; setTimeout(entrer, 0); }
  });
  /* Filet : si aucun état ne tombe (réseau muet), on montre quand même la porte. */
  setTimeout(function(){ if(!vu){ vu = true; entrer(); } }, 5000);
}
</script>
