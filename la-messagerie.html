<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La messagerie — Atelier informatique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Police d'emojis unifiée sur tous les systèmes (cf. assets/fonts/README.md) */
  @font-face{
    font-family:"Fluent Emoji";
    src:url("assets/fonts/fluent-emoji.woff2") format("woff2");
    font-display:swap;
  }
  :root{
    --ink:#22303f; --muted:#5a6b7b;
    --blue:#2563eb; --blue-d:#1d4ed8;
    --amber:#f59e0b; --amber-d:#b45309;
    --green:#16a34a; --green-d:#15803d;
    --red:#ef4444; --red-d:#b91c1c;
    --paper:#ffffff; --line:#d7e0ea; --line-2:#e7eef6;
    --shell:#e9eff7;
    /* messagerie Cui-Cui */
    --cc-brand:#0e7490; --cc-brand-d:#155e75; --cc-soft:#e0f2fe;
    --cc-bar:#f7fafc; --cc-line:#dce4ee; --cc-side:#f2f7fb;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Nunito",system-ui,"Fluent Emoji",sans-serif;color:var(--ink);
    background:var(--shell);height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    padding-bottom:58px;
  }
  /* ===== Fenêtre principale toujours visible sans défilement =====
     Page bloquée à la hauteur de l'écran : les barres gardent leur taille,
     seule la zone de jeu se réduit / défile en interne si l'écran est petit.
     Le padding-bas réserve la bande du bouton flottant « Mode dyslexique ». */
  .topbar,.progress-wrap,.banner,.arc-hud,.quiz-dock{flex:0 0 auto;}
  .stage-wrap{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;}
  #stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  #stage>.screen{flex:1 1 auto;min-height:320px;}
  @media (max-height:860px){
    body>.topbar{padding-top:6px;padding-bottom:6px;}
    body>.progress-wrap{padding-top:6px;padding-bottom:8px;}
    body>.banner{margin-top:7px;padding-top:8px;padding-bottom:9px;}
    body>.stage-wrap{margin-top:7px;}
  }
  @media (max-height:680px){
    body>.banner{font-size:.92rem;}
    body>.banner .b-emoji{font-size:1.4rem;}
  }
  button{font-family:inherit;cursor:pointer;}
  .display{font-family:"Fredoka","Fluent Emoji",sans-serif;}
  kbd{
    display:inline-flex;align-items:center;justify-content:center;min-width:22px;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:.84em;line-height:1;
    padding:3px 7px;border-radius:7px;background:#fff;border:2px solid #c7d4e6;
    border-bottom-width:3px;color:var(--ink);box-shadow:0 1px 0 #e7eef6;margin:0 1px;white-space:nowrap;}

  /* ---------- Top bar ---------- */
  .topbar{background:#fff;border-bottom:2px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;}
  .back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--blue-d);
    font-weight:800;font-size:.98rem;padding:8px 12px;border-radius:10px;}
  .back:hover{background:#eef4ff;}
  .topbar h1{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.15rem;margin:0;flex:1;}
  .topbar h1 .dot{color:var(--cc-brand);}
  .reset-btn{border:2px solid var(--line);background:#fff;color:var(--muted);font-weight:700;
    border-radius:10px;padding:7px 11px;font-size:.85rem;}
  .reset-btn:hover{border-color:var(--blue);color:var(--blue-d);}
  .reset-btn.danger:hover{border-color:var(--red);color:var(--red-d);}

  /* ---------- Progress ---------- */
  .progress-wrap{background:#fff;padding:20px 18px 14px;border-bottom:2px solid var(--line);}
  .track{display:flex;gap:6px;align-items:center;max-width:1000px;margin:0 auto;}
  .seg{position:relative;flex:1;height:14px;border-radius:8px;background:var(--line-2);overflow:visible;}
  .seg.done{background:var(--green);}
  .seg.current{background:var(--blue);box-shadow:0 0 0 3px #bcd2ff;}
  .seg.milestone{height:20px;display:flex;align-items:center;justify-content:center;font-size:1rem;background:#fdebc4;}
  .seg.milestone.done{background:#facc15;}
  .seg.milestone.current{background:var(--amber);box-shadow:0 0 0 3px #fde2a8;}
  .seg.clickable{cursor:pointer;transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;}
  .seg.clickable:hover{filter:brightness(1.07);transform:translateY(-2px);}
  .seg.clickable.done:hover{box-shadow:0 0 0 3px #b9eccd;}
  .seg .seg-stars{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:.6rem;letter-spacing:-2px;pointer-events:none;}

  /* ---------- Mission banner ---------- */
  .banner{max-width:1000px;margin:12px auto 0;width:calc(100% - 36px);
    background:#fff;border:2px solid var(--line);border-left:7px solid var(--blue);
    border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .banner.test{border-left-color:var(--amber);}
  .banner.review{border-left-color:var(--green);}
  .banner.boss{border-left-color:var(--red);}
  .banner .b-emoji{font-size:1.8rem;line-height:1;}
  .banner .b-txt{flex:1;min-width:200px;}
  .banner .b-title{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.08rem;}
  .banner .b-sub{color:#3a4a59;font-weight:700;font-size:1rem;margin-top:4px;line-height:1.45;}
  .banner .b-goal-label{font-weight:800;color:var(--blue-d);margin-right:3px;}
  .banner.test .b-goal-label{color:var(--amber-d);}
  .banner.boss .b-goal-label{color:var(--red-d);}
  .banner .b-btn{border:2px solid var(--line);background:#f5f9ff;color:var(--blue-d);font-weight:800;
    border-radius:10px;padding:8px 13px;font-size:.9rem;white-space:nowrap;}
  .banner .b-btn:hover{border-color:var(--blue);}
  /* objectifs affichés un par un */
  .jalon-head{margin:0 0 4px;}
  .jalon-wrap{overflow:hidden;}
  .jalon-obj{display:flex;align-items:center;gap:11px;background:#fff;border:2px solid #f6d68a;
    border-left:6px solid var(--amber);border-radius:12px;padding:10px 14px;font-weight:700;font-size:1rem;
    color:var(--ink);line-height:1.35;
    transition:transform .45s cubic-bezier(.2,.7,.3,1), opacity .45s ease, background .3s, border-color .3s;}
  .jalon-obj .jo-check{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;background:var(--amber);color:#fff;font-weight:800;font-size:1rem;}
  .jalon-obj .jo-text b{color:var(--amber-d);}
  .jalon-obj.done{background:#eafaf0;border-color:#86efac;border-left-color:var(--green);color:var(--green-d);}
  .jalon-obj.done .jo-check{background:var(--green);}
  .jalon-obj.done .jo-text b{color:var(--green-d);}
  .jalon-obj.blue{border-color:#bcd2ff;border-left-color:var(--blue);}
  .jalon-obj.blue .jo-check{background:var(--blue);}
  .jalon-obj.blue .jo-text b{color:var(--blue-d);}
  .jalon-obj.blue.done{background:#eafaf0;border-color:#86efac;border-left-color:var(--green);color:var(--green-d);}
  .jalon-obj.blue.done .jo-check{background:var(--green);}
  .jalon-obj.blue.done .jo-text b{color:var(--green-d);}
  .jalon-obj.entering{transform:translateY(120%);opacity:0;}
  .jalon-obj.slideup{transform:translateY(-160%);opacity:0;}
  @media(prefers-reduced-motion:reduce){.jalon-obj{transition:opacity .2s ease;}.jalon-obj.entering,.jalon-obj.slideup{transform:none;}}

  /* ---------- Stage (l'écran avec la messagerie) ---------- */
  .stage-wrap{max-width:1000px;margin:12px auto 0;width:calc(100% - 36px);}
  .screen{position:relative;height:clamp(320px,52vh,680px);border-radius:16px;overflow:hidden;
    border:3px solid #cdd9e8;box-shadow:0 18px 40px -24px rgba(34,48,63,.55);
    background:var(--cc-bar);user-select:none;-webkit-user-select:none;}
  .screen input,.screen textarea,.screen [contenteditable]{user-select:text;-webkit-user-select:text;}
  /* le contenu d'un mail reçu (expéditeur, objet, corps) est sélectionnable : on peut copier une adresse */
  .screen .cc-read,.screen .rd-body,.screen .rd-head,.screen .rw-addr,.screen .ph-mb,.screen .ph-mh{user-select:text;-webkit-user-select:text;cursor:text;}
  .screen.shake{animation:scrShake .4s;}
  @keyframes scrShake{0%,100%{transform:translate(0,0);}15%{transform:translate(-9px,4px);}30%{transform:translate(8px,-5px);}
    45%{transform:translate(-7px,-3px);}60%{transform:translate(6px,4px);}75%{transform:translate(-4px,2px);}90%{transform:translate(3px,-2px);}}

  /* ---------- Carnet de mission (questions) ---------- */
  .quiz-dock{max-width:1000px;margin:10px auto 0;width:calc(100% - 36px);
    background:#fffbe8;border:2px solid #f2dd9a;border-radius:14px;padding:11px 16px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .quiz-dock .qd-ic{font-size:1.5rem;}
  .quiz-dock .qd-q{flex:1;min-width:220px;font-weight:800;font-size:.95rem;color:#6b5310;}
  .quiz-dock input{border:2px solid #e3cf82;border-radius:9px;padding:8px 12px;font-family:inherit;
    font-weight:700;font-size:.92rem;outline:none;width:200px;background:#fff;}
  .quiz-dock input:focus{border-color:var(--blue);}
  .quiz-dock .qd-ok{border:none;background:var(--green);color:#fff;border-radius:9px;padding:9px 16px;
    font-weight:800;font-size:.88rem;}
  .quiz-dock .qd-ok:hover{background:var(--green-d);}
  .quiz-dock .qd-fb{font-weight:800;font-size:.84rem;color:var(--red-d);}
  .quiz-dock.shake{animation:qshake .4s ease;}
  @keyframes qshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  /* ---------- Boutons sous l'écran ---------- */
  /* Barre d'actions FIXÉE dans la bande du bas, centrée entre « Mode Dys »
     (bas gauche) et « Dev » (bas droite) : libère la hauteur pour le centre. */
  .stage-actions{position:fixed;left:50%;bottom:11px;transform:translateX(-50%);z-index:40;
    margin:0;display:flex;gap:9px;justify-content:center;flex-wrap:nowrap;}
  .sa-btn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;
    font-weight:800;font-size:.88rem;color:var(--muted);}
  .sa-btn:hover{border-color:var(--blue);color:var(--blue-d);}
  .sa-btn.sa-hint{border-color:#f6d68a;background:#fff8ec;color:var(--amber-d);}
  .sa-btn.sa-hint:hover{border-color:var(--amber);}

  /* ---------- Surbrillance astuce ---------- */
  .spot{box-shadow:0 0 0 4px #ffd54a, 0 0 20px 6px rgba(255,193,7,.6)!important;
    border-radius:10px;animation:spotPulse 1s ease-in-out infinite;position:relative;z-index:80;}
  @keyframes spotPulse{50%{box-shadow:0 0 0 7px #ffd54a, 0 0 26px 10px rgba(255,193,7,.75);}}

  /* ---------- Overlay / modales ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;
    justify-content:center;z-index:320;padding:18px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:20px;max-width:540px;width:100%;padding:26px 26px 22px;
    text-align:center;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);
    animation:modalIn .18s ease;}
  @keyframes modalIn{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .m-emoji{font-size:3rem;line-height:1;display:block;margin-bottom:6px;}
  .modal .kicker{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.74rem;color:var(--blue-d);}
  .modal h2{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.5rem;margin:2px 0 8px;}
  .modal.good h2{color:var(--green-d);}
  .modal.warn h2{color:var(--red-d);}
  .modal p{color:#3a4a59;font-weight:600;font-size:1.04rem;line-height:1.5;margin:0 0 8px;}
  .modal .howto{background:#f3f8ff;border:2px solid #d9e6fb;border-radius:14px;padding:13px 16px;text-align:left;margin:12px 0 4px;}
  .modal .howto.test{background:#fff8ec;border-color:#fbe3b6;}
  .modal .howto.boss{background:#fdeeee;border-color:#f6c9c9;}
  .modal .howto .h-head{font-weight:800;color:var(--blue-d);margin:0 0 6px;font-size:1rem;}
  .modal .howto.test .h-head{color:var(--amber-d);}
  .modal .howto.boss .h-head{color:var(--red-d);}
  .modal .howto p{font-size:.98rem;color:#3a4a59;margin:0 0 4px;}
  .modal .tasklist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;text-align:left;}
  .modal .tasklist li{display:flex;gap:9px;font-weight:700;font-size:.94rem;color:#3a4a59;line-height:1.4;}
  .modal .tasklist li::before{content:'▸';color:var(--blue);font-weight:800;}
  .modal .newtools{list-style:none;padding:0;margin:12px 0 4px;display:flex;flex-direction:column;gap:7px;text-align:left;}
  .modal .newtools li{display:flex;align-items:center;gap:11px;background:#f6f9fd;border:2px solid var(--line);
    border-radius:12px;padding:9px 13px;font-weight:700;font-size:.95rem;}
  .modal .newtools .ni-glyph{font-size:1.35rem;width:34px;height:34px;flex:none;display:flex;align-items:center;
    justify-content:center;background:#fff;border:2px solid var(--line);border-radius:9px;}
  .modal .m-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .m-btn{border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:800;border-radius:12px;
    padding:11px 18px;font-size:1rem;}
  .m-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .m-btn.primary:hover{background:var(--blue-d);}
  .m-btn.primary.green{background:var(--green);border-color:var(--green);}
  .m-btn.primary.green:hover{background:var(--green-d);}
  .m-btn.primary.test{background:var(--amber);border-color:var(--amber);color:#3d2c06;}
  .m-btn.primary.boss{background:var(--red);border-color:var(--red);color:#fff;}
  .m-btn.primary.boss:hover{background:var(--red-d);}
  .m-btn.ghost{background:#fff;color:var(--muted);}
  .m-btn.ghost:hover{border-color:var(--blue);color:var(--blue-d);}
  .lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0 4px;}
  .lvl-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:2px solid var(--line);
    background:#fff;border-radius:12px;padding:11px 12px;text-align:left;}
  .lvl-card:hover:not(.locked){border-color:var(--blue);}
  .lvl-card.current{border-color:var(--blue);background:#eef4ff;}
  .lvl-card.locked{opacity:.5;}
  .lvl-card .lc-badge{font-size:1.1rem;}
  .lvl-card .lc-n{font-weight:800;font-size:.78rem;color:var(--muted);}
  .lvl-card .lc-t{font-weight:700;font-size:.86rem;}
  .lc-stars{font-size:.72rem;font-weight:800;color:#b45309;}

  /* toast */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1f2a37;color:#fff;
    font-weight:700;font-size:.92rem;padding:11px 18px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.3);
    opacity:0;pointer-events:none;transition:.25s;z-index:400;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* confetti */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:350;overflow:hidden;}
  .confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(640deg);}}

  /* ===== MOTEUR ARCADE — HUD, juice, mini-jeux ===== */
  .arc-hud{max-width:1000px;margin:10px auto 0;width:calc(100% - 36px);display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    background:#1f2a37;color:#fff;border-radius:13px;padding:9px 18px;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.02rem;box-shadow:0 8px 22px -14px rgba(15,23,42,.8);}
  /* la « carte d'ordre » de l'examen s'affiche ICI, dans la barre noire (avec le timer et
     les boucliers), au lieu de flotter au-dessus des boutons de la messagerie */
  .arc-hud .ah-order{flex-basis:100%;display:flex;align-items:center;gap:12px;margin-top:2px;
    border-top:1px solid rgba(255,255,255,.16);padding-top:8px;line-height:1.25;}
  .arc-hud .ah-order .oc-n{flex:none;font-size:.72rem;font-weight:700;color:#9fb0c4;background:rgba(255,255,255,.1);border-radius:7px;padding:2px 8px;}
  .arc-hud .ah-order .oc-ic{flex:none;font-size:1.5rem;line-height:1;}
  .arc-hud .ah-order .oc-txt{flex:1;font-size:.98rem;color:#fff;}
  .arc-hud .ah-order .oc-sub{display:block;font-size:.8rem;color:#8fd3e8;font-weight:600;margin-top:2px;}
  .arc-hud .ah-order.pop{animation:ordPopK2 .3s ease;}
  @keyframes ordPopK2{0%{transform:scale(.85);opacity:.4;}70%{transform:scale(1.02);}100%{transform:scale(1);opacity:1;}}
  .arc-hud .ah-score{color:#fde047;letter-spacing:.03em;}
  .arc-hud .ah-combo{color:#fb923c;min-width:66px;transition:transform .15s;}
  .arc-hud .ah-combo.hot{transform:scale(1.22);animation:comboFlame .5s ease infinite alternate;}
  @keyframes comboFlame{from{text-shadow:0 0 4px #fb923c;}to{text-shadow:0 0 14px #f59e0b;}}
  .arc-hud .ah-shields .off{filter:grayscale(1);opacity:.35;}
  .arc-hud .ah-timer{margin-left:auto;font-variant-numeric:tabular-nums;}
  .arc-hud .ah-timer.low{color:#f87171;animation:timBlink .6s steps(2) infinite;}
  @keyframes timBlink{50%{opacity:.4;}}
  .arc-flash{position:absolute;inset:0;z-index:120;pointer-events:none;
    background:radial-gradient(circle,rgba(255,80,40,0) 40%,rgba(255,60,30,.5) 100%);animation:arcFlashK .32s ease-out forwards;}
  @keyframes arcFlashK{0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}}
  .arc-banner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);z-index:130;pointer-events:none;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.5rem;color:#fff;
    background:rgba(31,42,55,.93);padding:12px 26px;border-radius:16px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;
    animation:arcBanK 1.5s ease forwards;}
  .arc-banner.bad{background:rgba(185,28,28,.95);}
  .arc-banner.good{background:rgba(21,128,61,.95);}
  @keyframes arcBanK{0%{transform:translate(-50%,-50%) scale(.5);opacity:0;}14%{transform:translate(-50%,-50%) scale(1.06);opacity:1;}
    24%{transform:translate(-50%,-50%) scale(1);}78%{opacity:1;}100%{opacity:0;}}
  .arc-fly{position:absolute;z-index:125;pointer-events:none;font-family:"Fredoka","Fluent Emoji",sans-serif;
    font-weight:700;font-size:1.3rem;color:#f59e0b;text-shadow:0 2px 0 #fff,0 0 10px #fde047;animation:arcFlyK .95s ease-out forwards;}
  @keyframes arcFlyK{0%{transform:translateY(0) scale(.7);opacity:0;}18%{opacity:1;transform:translateY(-8px) scale(1.15);}
    100%{transform:translateY(-64px) scale(1);opacity:0;}}
  .arc-burst{position:absolute;pointer-events:none;z-index:124;}
  .arc-spark{position:absolute;width:8px;height:8px;border-radius:50%;top:0;left:0;
    transform:translate(-50%,-50%);animation:arcSparkK .5s ease-out forwards;}
  @keyframes arcSparkK{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0;}}
  .arc-count{position:absolute;inset:0;z-index:140;display:flex;align-items:center;justify-content:center;
    background:rgba(15,23,42,.55);}
  .arc-count b{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:5.4rem;color:#fff;
    text-shadow:0 6px 30px rgba(0,0,0,.5);animation:cntPop .65s ease;}
  .arc-count b.go{color:#4ade80;}
  @keyframes cntPop{0%{transform:scale(.3);opacity:0;}55%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);}}
  .ghost-hand{position:absolute;z-index:150;font-size:2.3rem;pointer-events:none;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));
    transition:left 1s cubic-bezier(.35,.7,.3,1), top 1s cubic-bezier(.35,.7,.3,1);}
  .ghost-hand.tap{animation:ghostTapK .45s ease 2;}
  @keyframes ghostTapK{50%{transform:scale(.72);}}

/* ---------------------------------------------------------
   0. OUTILS GÉNÉRAUX
   --------------------------------------------------------- */
function kbd(s){ return '<kbd>'+s+'</kbd>'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normText(s){
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[’']/g,' ').replace(/[?!.,;:«»"]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function stripTags(s){ return String(s).replace(/<[^>]+>/g,''); }

/* ---------------------------------------------------------
   1. ÉTAT GLOBAL + STOCKAGE
   --------------------------------------------------------- */
const store={
  get(k){ try{return localStorage.getItem(k);}catch(e){return this._m&&this._m[k];} },
  set(k,v){ try{localStorage.setItem(k,v);}catch(e){ (this._m=this._m||{})[k]=v; } },
  del(k){ try{localStorage.removeItem(k);}catch(e){ if(this._m) delete this._m[k]; } },
  _m:{}
};
let currentLevel=1, STEPS=[], progressIdx=0, playIdx=0, currentStep=null;
const stage=document.getElementById('stage');
const overlay=document.getElementById('overlay');

/* largeurs des volets (redimensionnables), gardées entre les missions */
const SIDE_DEF=198, LIST_DEF=315;
let sideW=parseInt(store.get('ml_sidew')||SIDE_DEF,10); if(isNaN(sideW)||sideW<120) sideW=SIDE_DEF;
let listW=parseInt(store.get('ml_listw')||LIST_DEF,10); if(isNaN(listW)||listW<180) listW=LIST_DEF;
function makeResizer(handle, pane, opts){
  if(!handle||!pane) return;
  let dragging=false, startX=0, startW=0;
  handle.addEventListener('pointerdown', e=>{
    e.preventDefault(); dragging=true; startX=e.clientX; startW=pane.getBoundingClientRect().width;
    handle.classList.add('dragging'); try{ handle.setPointerCapture(e.pointerId); }catch(_){}
  });
  handle.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const w=Math.round(Math.max(opts.min, Math.min(opts.max(), startW+(e.clientX-startX))));
    pane.style.width=w+'px'; opts.set(w);
  });
  function stop(){ if(!dragging) return; dragging=false; handle.classList.remove('dragging'); opts.save(); }
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
  handle.addEventListener('dblclick', ()=>{ pane.style.width=opts.def+'px'; opts.set(opts.def); opts.save(); });
}
/* déplacement d'une fenêtre (ccwin) par sa barre de titre, borné à son conteneur */
function makeDraggable(handle, win, onMove){
  if(!handle||!win) return;
  let dragging=false, startX=0, startY=0, startL=0, startT=0;
  handle.addEventListener('pointerdown', e=>{
    if(e.target.closest('.w-x')) return;
    e.preventDefault();
    const parent=win.offsetParent||win.parentNode;
    const wr=win.getBoundingClientRect(), pr=parent.getBoundingClientRect();
    startL=wr.left-pr.left; startT=wr.top-pr.top;
    win.style.left=startL+'px'; win.style.top=startT+'px'; win.style.transform='none';
    dragging=true; startX=e.clientX; startY=e.clientY;
    handle.classList.add('dragging'); try{ handle.setPointerCapture(e.pointerId); }catch(_){}
  });
  handle.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const parent=win.offsetParent||win.parentNode; const pr=parent.getBoundingClientRect();
    let left=startL+(e.clientX-startX), top=startT+(e.clientY-startY);
    left=Math.max(0, Math.min(left, pr.width-win.offsetWidth));
    top=Math.max(0, Math.min(top, pr.height-win.offsetHeight));
    win.style.left=left+'px'; win.style.top=top+'px';
    if(onMove) onMove({left:left, top:top});
  });
  function stop(){ if(!dragging) return; dragging=false; handle.classList.remove('dragging'); }
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
}
/* redimensionnement d'une fenêtre (ccwin) par ses bords, ancrée dans son conteneur */
function makeResizableWin(win, opts){
  if(!win) return;
  const parent=win.offsetParent||win.parentNode;
  function bind(dir){
    const handle=win.querySelector('.cmp-rz-'+dir); if(!handle) return;
    let dragging=false, startX=0, startY=0, startW=0, startH=0, startL=0, startT=0;
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault(); e.stopPropagation();
      const wr=win.getBoundingClientRect(), pr=parent.getBoundingClientRect();
      startW=wr.width; startH=wr.height; startL=wr.left-pr.left; startT=wr.top-pr.top;
      win.style.left=startL+'px'; win.style.top=startT+'px'; win.style.transform='none';
      win.style.width=startW+'px'; win.style.height=startH+'px';
      dragging=true; startX=e.clientX; startY=e.clientY;
      handle.classList.add('dragging'); try{ handle.setPointerCapture(e.pointerId); }catch(_){}
    });
    handle.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const pr=parent.getBoundingClientRect();
      const dx=e.clientX-startX, dy=e.clientY-startY;
      let w=startW, h=startH, l=startL;
      if(dir.indexOf('e')>=0) w=Math.max(opts.minW, Math.min(startW+dx, pr.width-startL));
      if(dir.indexOf('w')>=0){ w=Math.max(opts.minW, Math.min(startW-dx, startL+startW)); l=startL+startW-w; }
      if(dir.indexOf('s')>=0) h=Math.max(opts.minH, Math.min(startH+dy, pr.height-startT));
      win.style.width=w+'px'; win.style.height=h+'px'; win.style.left=l+'px';
      if(opts.onResize) opts.onResize({width:w, height:h, left:l, top:startT});
    });
    function stop(){ if(!dragging) return; dragging=false; handle.classList.remove('dragging'); }
    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
  }
  ['e','w','s','se'].forEach(bind);
}

/* ---------------------------------------------------------
   2. SON (WebAudio, sans fichier externe)
   --------------------------------------------------------- */
let actx=null;
function audioCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function beep(kind){
  if(!soundOn) return; const a=audioCtx(); if(!a) return; const now=a.currentTime;
  function tone(freq,dur,type,vol,delay){
    const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(a.destination); const t=now+(delay||0);
    g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur);
  }
  if(kind==='click'){ tone(420,.03,'square',.05); }
  else if(kind==='open'){ tone(540,.06,'sine',.09); tone(760,.07,'sine',.07,.04); }
  else if(kind==='good'){ tone(740,.09,'sine',.12); tone(1180,.09,'sine',.08,.02); }
  else if(kind==='bad'){ tone(150,.16,'square',.12); }
  else if(kind==='delete'){ tone(300,.08,'sawtooth',.08); tone(180,.12,'sawtooth',.07,.05); }
  else if(kind==='ding'){ tone(880,.12,'sine',.12); tone(1320,.16,'sine',.1,.08); }
  else if(kind==='alarm'){ tone(360,.18,'square',.10); tone(300,.18,'square',.10,.18); }
  else if(kind==='send'){ tone(620,.07,'sine',.1); tone(930,.09,'sine',.09,.05); tone(1240,.12,'sine',.08,.11); }
  else if(kind==='mail'){ tone(880,.08,'triangle',.1); tone(660,.1,'triangle',.09,.09); }
  else if(kind==='stamp'){ tone(190,.1,'square',.14); tone(120,.14,'square',.1,.05); }
  else if(kind==='coin'){ tone(990,.06,'square',.08); tone(1320,.1,'square',.07,.05); }
  else if(kind==='win'){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.09)); }
}

const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ---------------------------------------------------------
   4. M = L'ÉTAT DE LA MESSAGERIE SIMULÉE
   --------------------------------------------------------- */
/* buildScreen() fait un premier renderAll() avant seedMail() : il faut des dossiers dès le départ */
const M={ view:'mail', folder:'inbox', folders:baseFolders(), mails:[], seq:1, sel:null,
  contacts:[], lists:[], events:[], agY:SIM.y, agM:SIM.m,
  signature:'', rules:[], search:'', filter:'all', sort:'date',
  compose:null, onSend:null, evt:{} };

function baseFolders(){
  return [
    {id:'inbox', name:'Boîte de réception', ic:'📥', fixed:true},
    {id:'drafts', name:'Brouillons', ic:'📝', fixed:true},
    {id:'sent', name:'Envoyés', ic:'📤', fixed:true},
    {id:'spam', name:'Indésirables', ic:'🚫', fixed:true},
    {id:'trash', name:'Corbeille', ic:'🗑️', fixed:true}
  ];
}
let _mailK=1000;
function mkMail(o){
  /* o : {from,to,cc,bcc,subject,body,date,read,star,atts,folder} */
  return { id:'m'+(M.seq++), folder:o.folder||'inbox',
    from:o.from||ME, to:o.to||[ME], cc:o.cc||[], bcc:o.bcc||[],
    subject:o.subject||'(sans objet)', body:o.body||'',
    date:o.date||'Aujourd\'hui', k:(o.k!=null?o.k:_mailK--),
    read:!!o.read, star:!!o.star, atts:(o.atts||[]).slice() };
}
function getMail(id){ return M.mails.find(m=>m.id===id); }
function folderById(id){ return M.folders.find(f=>f.id===id); }
function unreadCount(fid){ return M.mails.filter(m=>m.folder===fid && !m.read).length; }

/* contacts appris par le joueur (➕ Nouveau contact) : conservés d'une mission à l'autre */
function getExtraContacts(){ try{ return JSON.parse(store.get('ml_extracontacts')||'[]')||[]; }catch(e){ return []; } }
function saveExtraContact(addr,name,av){
  const list=getExtraContacts().filter(c=>c.addr!==addr);
  list.push({addr:addr,name:name,av:av});
  store.set('ml_extracontacts', JSON.stringify(list));
}
function renameExtraContact(oldAddr,newAddr,name,av){
  const list=getExtraContacts().filter(c=>c.addr!==oldAddr && c.addr!==newAddr);
  list.push({addr:newAddr,name:name,av:av});
  store.set('ml_extracontacts', JSON.stringify(list));
}

/* remise à zéro + graine de la mission */
function seedMail(seed){
  seed=seed||{};
  M.view=seed.view||'mail'; M.folder=seed.folder||'inbox';
  M.folders=baseFolders().concat((seed.customFolders||[]).map((n,i)=>({id:'cf'+i,name:n,ic:'📁'})));
  M.mails=[]; M.seq=1; _mailK=1000; M.sel=null;
  (seed.mails||[]).forEach(o=>M.mails.push(mkMail(o)));
  const baseContacts=[
    {addr:'m.leco@erea.fr'},{addr:'papi.marcel@cuicui.fr'},{addr:'tata.monica@cuicui.fr'},
    {addr:'leonce@cuicui.fr'},{addr:'zoe@cuicui.fr'}
  ];
  /* à partir du niveau 4, on ne demande plus jamais d'ajouter de nouveaux contacts (c'est le niveau 3
     qui enseigne ça) : toutes les adresses utiles pour la suite sont donc déjà dans le carnet,
     même si le joueur a sauté directement ici depuis le menu développeur */
  if(currentLevel>=4) baseContacts.push({addr:'pauline.tricot@cuicui.fr'},{addr:'arsene@cuicui.fr'});
  M.contacts=(seed.contacts||baseContacts).map(c=>({addr:c.addr, name:c.name||whoName(c.addr), av:c.av||who(c.addr).av}));
  /* les contacts que le joueur a enregistrés lui-même restent dans son carnet pour la suite,
     sauf dans la mission qui les fait justement découvrir (il doit encore les ajouter !) */
  const freshAddr=currentStep && currentStep.introducesContact;
  getExtraContacts().forEach(c=>{
    if(c.addr===freshAddr) return;
    if(M.contacts.some(x=>x.addr===c.addr)) return;
    M.contacts.push({addr:c.addr, name:c.name, av:c.av});
  });
  M.lists=(seed.lists||[]).map(l=>({name:l.name, members:l.members.slice()}));
  M.events=(seed.events||[]).map((e,i)=>Object.assign({id:'e'+i},e));
  M.agY=SIM.y; M.agM=SIM.m;
  M.signature=seed.signature||'';
  M.rules=(seed.rules||[]).slice();
  M.search=''; M.filter='all'; M.sort='date';
  M.compose=null; M.onSend=null;
  M.evt={ sent:[], searches:[], opened:new Set() };
  if(seed.sel){ M.sel=seed.sel; }
}

/* enregistrement d'un événement de mission + vérification
   (les mini-jeux arcade écoutent aussi via ARC.onEvt) */
function fireEvt(){ checkMission(); if(typeof ARC!=='undefined' && ARC.on && !ARC.over && ARC.onEvt) ARC.onEvt(); }
function evtFlag(k){ M.evt[k]=true; fireEvt(); }
function evtAdd(k,v){ (M.evt[k]=M.evt[k]||new Set()).add(v); fireEvt(); }

/* ----- liste + lecture ----- */
function visibleMails(){
  let list=M.mails.filter(m=>m.folder===M.folder);
  if(M.search){ const q=normText(M.search);
    list=list.filter(m=>normText(m.subject+' '+stripTags(m.body)+' '+whoName(m.from)+' '+m.from).includes(q)); }
  if(M.filter==='unread') list=list.filter(m=>!m.read);
  else if(M.filter==='atts') list=list.filter(m=>m.atts.length);
  else if(M.filter==='star') list=list.filter(m=>m.star);
  if(M.sort==='from') list.sort((a,b)=>whoName(a.from).localeCompare(whoName(b.from),'fr'));
  else if(M.sort==='subject') list.sort((a,b)=>a.subject.localeCompare(b.subject,'fr'));
  else list.sort((a,b)=>b.k-a.k);
  return list;
}
function renderMailView(main){
  const f=folderById(M.folder)||M.folders[0];
  const list=visibleMails();
  const filterLbl={all:'',unread:' · non lus',atts:' · avec 📎',star:' · favoris ⭐'}[M.filter]||'';
  let listHtml='<div class="cc-listhead"><span>'+f.ic+' '+esc(f.name)+filterLbl+'</span>'
    +(M.folder==='trash'&&M.mails.some(m=>m.folder==='trash')?'<button class="rd-abtn danger" id="btnEmptyTrash">🧹 Vider</button>':'')
    +'<span class="lh-count">'+list.length+'</span></div>';
  if(!list.length){
    listHtml+='<div class="cc-empty"><span class="ce-ic">'+(M.search||M.filter!=='all'?'🔍':'🕊️')+'</span>'
      +(M.search||M.filter!=='all'?'Aucun mail ne correspond.':'Ce dossier est vide.')+'</div>';
  } else {
    listHtml+=list.map(m=>{
      const w=who(M.folder==='sent'||M.folder==='drafts'?(m.to[0]||ME):m.from);
      const fromLbl=(M.folder==='sent'||M.folder==='drafts')?('À : '+(m.to.length?whoName(m.to[0])+(m.to.length>1?' +'+(m.to.length-1):''):'…')):whoName(m.from);
      return '<button class="mailrow'+(m.read?'':' unread')+(M.sel===m.id?' sel':'')+'" data-id="'+m.id+'">'
        +'<span class="mr-dot"></span><span class="mr-av">'+w.av+'</span>'
        +'<span class="mr-tx"><span class="mr-l1"><span class="mr-from">'+esc(fromLbl)+'</span>'
        +'<span class="mr-date">'+esc(m.date)+'</span></span>'
        +'<span class="mr-sub">'+esc(m.subject)+'</span>'
        +((m.atts.length||m.star)?('<span class="mr-flags">'+(m.atts.length?'<span class="mr-clip">📎 '+m.atts.length+'</span>':'')+(m.star?'<span class="mr-star">⭐</span>':'')+'</span>'):'')
        +'</span></button>';
    }).join('');
  }
  main.innerHTML='<div class="cc-list" id="mailList" style="width:'+listW+'px">'+listHtml+'</div>'
    +'<div class="cc-resize" id="listResize" title="Fais glisser pour redimensionner · double-clic pour réinitialiser"></div>'
    +'<div class="cc-read" id="reader">'+readerHtml()+'</div>';
  main.querySelectorAll('.mailrow').forEach(b=>b.onclick=()=>openMail(b.getAttribute('data-id')));
  const et=document.getElementById('btnEmptyTrash');
  if(et) et.onclick=(e)=>{ e.stopPropagation(); dlgEmptyTrash(); };
  /* volet de la liste des mails redimensionnable (recréé à chaque rendu de la vue) */

    def:LIST_DEF, min:210,
    max:()=>{ const m=document.getElementById('ccMain'); return m?Math.max(210, m.getBoundingClientRect().width-260):460; },
    set:w=>{ listW=w; }, save:()=>store.set('ml_listw', String(listW))
  });
  bindReader();
}
function openMail(id){
  const m=getMail(id); if(!m) return;
  beep('open'); M.sel=id;
  if(m.folder==='drafts'){ openCompose({draft:m}); return; }
  if(!m.read){ m.read=true; evtAdd('readMail', id); }
  M.evt.opened.add(id);
  evtAdd('openedMail', id);
  renderAll();
}
function readerHtml(){
  const m=M.sel?getMail(M.sel):null;
  if(!m || m.folder!==M.folder){
    return '<div class="rd-void"><span class="rv-ic">📭</span>Clique sur un mail<br>dans la liste pour le lire.</div>';
  }
  const w=who(m.from);
  const isTrash=m.folder==='trash', isSpam=m.folder==='spam', isSent=m.folder==='sent';
  let acts='';
  if(isTrash){
    acts='<button class="rd-abtn" data-act="restore">↩️ Restaurer</button>'
      +'<button class="rd-abtn danger" data-act="harddel">❌ Supprimer définitivement</button>';
  } else if(isSpam){
    acts='<button class="rd-abtn" data-act="notspam">✅ Pas indésirable</button>'
      +'<button class="rd-abtn danger" data-act="del">🗑️ Supprimer</button>';
  } else {
    acts='<button class="rd-abtn" data-act="reply">↩️ Répondre</button>'
      +'<button class="rd-abtn" data-act="replyall">↩️↩️ Répondre à tous</button>'
      +'<button class="rd-abtn" data-act="fwd">➡️ Transférer</button>'
      +'<button class="rd-abtn" data-act="move">📁 Déplacer ▾</button>'
      +'<button class="rd-abtn" data-act="unread">🔵 Non lu</button>'
      +(isSent?'':'<button class="rd-abtn danger" data-act="spam">🚫 Indésirable</button>')
      +'<button class="rd-abtn danger" data-act="del">🗑️ Supprimer</button>';
  }
  const toLine=m.to.map(a=>whoChip(a)).join(' ');
  const ccLine=m.cc.length?('<div class="rd-line"><span class="rl-k">Cc :</span>'+m.cc.map(a=>whoChip(a)).join(' ')+'</div>'):'';
  const bccLine=(m.from===ME&&m.bcc.length)?('<div class="rd-line"><span class="rl-k">Cci :</span>'+m.bcc.map(a=>whoChip(a)).join(' ')+'</div>'):'';
  const atts=m.atts.length?('<div class="rd-atts">'+m.atts.map((a,i)=>
    '<span class="att-item"><button class="att-chip" data-att="'+i+'"><span class="ac-ic">'+a.ic+'</span>'+esc(a.n)
    +'<span class="ac-size">'+fmtSize(a.s)+'</span></button>'
    +'<button class="att-save" data-att="'+i+'" title="Enregistrer sur l\'ordinateur"><span class="as-ic">⬇️</span>Enregistrer</button></span>').join('')+'</div>'):'';
  return '<div class="rd-actions" id="rdActions">'+acts+'</div>'
    +'<div class="rd-head">'
    +  '<h3 class="rd-sub"><button class="rs-star'+(m.star?' on':'')+'" data-act="star" title="Marquer comme favori">⭐</button>'+esc(m.subject)+'</h3>'
    +  '<div class="rd-line"><span class="rl-k">De :</span>'
    +    '<span class="rd-who"><span class="rw-av">'+w.av+'</span>'+esc(w.name)+' <span class="rw-addr">&lt;'+esc(m.from)+'&gt;</span></span>'
    +    '<span class="rd-date">'+esc(m.date)+'</span></div>'
    +  '<div class="rd-line"><span class="rl-k">À :</span>'+toLine+'</div>'+ccLine+bccLine
    +'</div>'+atts
    +'<div class="rd-body" id="rdBody">'+m.body+'</div>';
}
function whoChip(a){
  const w=who(a);
  return '<span class="rd-who"><span class="rw-av">'+w.av+'</span>'+esc(a===ME?'Toi':w.name)
    +' <span class="rw-addr">&lt;'+esc(a)+'&gt;</span></span>';
}
function bindReader(){
  const r=document.getElementById('reader'); if(!r) return;
  const m=M.sel?getMail(M.sel):null; if(!m) return;
  r.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick=(e)=>{ e.stopPropagation(); mailAction(b.getAttribute('data-act'), m, b); };
  });
  r.querySelectorAll('.att-chip').forEach(b=>{
    b.onclick=()=>{ const a=m.atts[+b.getAttribute('data-att')]; if(a) dlgAttPreview(m,a); };
  });
  r.querySelectorAll('.att-save').forEach(b=>{
    b.onclick=(e)=>{ e.stopPropagation(); const a=m.atts[+b.getAttribute('data-att')]; if(a) startAttSave(m,a); };
  });
}
function mailAction(act, m, btn){
  if(act==='reply'||act==='replyall'){
    beep('click');
    const others=(act==='replyall')?m.to.concat(m.cc).filter(a=>a!==ME&&a!==m.from):[];
    openCompose({to:[m.from].concat(others), subject:(/^re :/i.test(m.subject)?m.subject:'Re : '+m.subject),
      replyOf:m.id, all:act==='replyall'});
    evtAdd(act==='replyall'?'repliedAll':'replied', m.id);
  } else if(act==='fwd'){
    beep('click');
    openCompose({subject:'Fwd : '+m.subject, bodyHtml:'<p><br></p><p>—— Message transféré ——</p>'+m.body,
      atts:m.atts.slice(), fwdOf:m.id});
    evtAdd('forwarded', m.id);
  } else if(act==='move'){
    menuMove(btn, m);
  } else if(act==='unread'){
    beep('click'); m.read=false; M.sel=null; evtAdd('markedUnread', m.id); renderAll();
  } else if(act==='read'){
    beep('click'); m.read=true; evtAdd('markedRead', m.id); renderAll();
  } else if(act==='spam'){
    beep('delete'); m.folder='spam'; M.sel=null; evtAdd('markedSpam', m.id);
    toast('🚫 Mail déplacé dans les <b>Indésirables</b>. Bien vu !'); renderAll();
  } else if(act==='notspam'){
    beep('good'); m.folder='inbox'; M.sel=null; evtAdd('unspammed', m.id);
    toast('✅ Mail rendu à la <b>Boîte de réception</b>.'); renderAll();
  } else if(act==='del'){
    beep('delete'); m.folder='trash'; M.sel=null; evtAdd('trashed', m.id); renderAll();
  } else if(act==='restore'){
    beep('good'); m.folder='inbox'; M.sel=null; evtAdd('restored', m.id);
    toast('↩️ Mail restauré dans la <b>Boîte de réception</b>.'); renderAll();
  } else if(act==='harddel'){
    beep('delete'); M.mails=M.mails.filter(x=>x.id!==m.id); M.sel=null; evtAdd('hardDeleted', m.id); renderAll();
  } else if(act==='star'){
    beep('click'); m.star=!m.star; if(m.star) evtAdd('starred', m.id); renderAll();
  }
}

/* ----- menus déroulants ----- */
function closeMenus(){ document.querySelectorAll('.cc-menu').forEach(el=>el.remove()); }
function openMenu(anchor, html){
  closeMenus();
  const app=document.getElementById('ccapp'); if(!app) return null;
  const menu=document.createElement('div'); menu.className='cc-menu'; menu.innerHTML=html;
  app.appendChild(menu);
  const ar=anchor.getBoundingClientRect(), sr=app.getBoundingClientRect();
  let left=ar.left-sr.left, top=ar.bottom-sr.top+4;
  menu.style.left='0px'; menu.style.top='0px';
  const mw=menu.offsetWidth;
  if(left+mw>sr.width-8) left=Math.max(4, sr.width-mw-8);
  menu.style.left=left+'px'; menu.style.top=top+'px';
  menu.addEventListener('pointerdown',e=>e.stopPropagation());
  return menu;
}
/* ----- clic droit : copier / coller (comme un vrai logiciel) ----- */
function ctxHasSelection(el){
  if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') return el.selectionStart!=null && el.selectionStart!==el.selectionEnd;
  const sel=window.getSelection();
  return !!(sel && sel.toString().length && el.contains(sel.anchorNode));
}
function ctxFireInput(el){ el.dispatchEvent(new Event('input',{bubbles:true})); }
function ctxPasteInto(el){
  el.focus();
  function finish(text){
    if(text==null || text==='') return;
    if(!document.execCommand('insertText', false, text) && (el.tagName==='INPUT'||el.tagName==='TEXTAREA')){
      const s=el.selectionStart||0, e2=el.selectionEnd||0, v=el.value;
      el.value=v.slice(0,s)+text+v.slice(e2); el.selectionStart=el.selectionEnd=s+text.length;
    }
    ctxFireInput(el); beep('click');
  }
  function fallback(){
    if(document.execCommand('paste')){ ctxFireInput(el); beep('click'); }
    else toast('✋ Utilise <b>Ctrl+V</b> (ou Cmd+V) pour coller ici.');
  }
  if(navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then(finish).catch(fallback);
  else fallback();
}

function onCtxMenu(e){
  const mailRow=e.target.closest('.mailrow');
  if(mailRow){ onMailCtxMenu(e, mailRow); return; }
  const folderBtn=e.target.closest('.cc-folder');
  if(folderBtn && folderBtn.getAttribute('data-f')==='trash'){ onTrashCtxMenu(e); return; }
  const editable=e.target.closest('input,textarea,[contenteditable="true"]');
  const readable=!editable && e.target.closest('.cc-read,.rd-body,.rd-head,.rw-addr,.ph-mb,.ph-mh');
  const target=editable||readable;
  if(!target) return; /* en dehors d'une zone de texte : menu du navigateur normal */
  e.preventDefault();
  closeMenus();
  const hasSel=ctxHasSelection(target);
  let html='';
  if(editable){
    html+='<button class="cc-mi" data-act="cut"'+(hasSel?'':' disabled')+'><span class="mi-ic">✂️</span>Couper</button>'
      +'<button class="cc-mi" data-act="copy"'+(hasSel?'':' disabled')+'><span class="mi-ic">📋</span>Copier</button>'
      +'<button class="cc-mi" data-act="paste"><span class="mi-ic">📌</span>Coller</button>';
  } else {
    html+='<button class="cc-mi" data-act="copy"'+(hasSel?'':' disabled')+'><span class="mi-ic">📋</span>Copier</button>';
  }
  const app=document.getElementById('ccapp'); if(!app) return;
  const menu=document.createElement('div'); menu.className='cc-menu'; menu.innerHTML=html;
  app.appendChild(menu);
  const ar=app.getBoundingClientRect();
  let left=e.clientX-ar.left, top=e.clientY-ar.top;
  menu.style.left='0px'; menu.style.top='0px';
  const mw=menu.offsetWidth, mh=menu.offsetHeight;
  if(left+mw>ar.width-6) left=Math.max(4, ar.width-mw-6);
  if(top+mh>ar.height-6) top=Math.max(4, ar.height-mh-6);
  menu.style.left=left+'px'; menu.style.top=top+'px';
  menu.addEventListener('pointerdown',ev=>ev.stopPropagation());
  menu.querySelectorAll('.cc-mi').forEach(b=>{
    b.onclick=()=>{
      const act=b.getAttribute('data-act');
      closeMenus();
      if(editable) editable.focus();
      if(act==='copy'){
        if(!hasSel) return;
        try{ document.execCommand('copy'); beep('click'); }catch(err){}
      } else if(act==='cut'){
        if(!hasSel) return;
        try{ document.execCommand('cut'); beep('click'); ctxFireInput(editable); }catch(err){}
      } else if(act==='paste'){
        ctxPasteInto(editable);
      }
    };
  });
}

/* explorateur de fichiers Windows simulé — deux usages :
   • mode 'save' : « Enregistrer sous » (champ nom + Enregistrer) — pour télécharger une PJ reçue ;
   • mode 'open' : « Choisir un fichier » (double-clic pour joindre) — pour envoyer une PJ.
   Volet gauche : clic simple (accès rapide + Ce PC). Liste de droite : DOUBLE-CLIC pour ouvrir
   un dossier ou choisir un fichier, comme dans un vrai explorateur. */
function openFileExplorer(cfg){
  cfg=cfg||{};
  const mode=cfg.mode||'save';
  beep('click');
  const w=winsBox(); if(!w) return;
  const a=cfg.attObj||null;
  const ext=a?((String(a.n).match(/\.[a-z0-9]+$/i)||[''])[0]):'';
  const baseOf=n=>String(n).replace(/\.[a-z0-9]+$/i,'');
  let path=cfg.startPath?cfg.startPath.slice():[PC_CEPC];
  let sbExpanded=true, sideScroll=0;
  let name=(mode==='save')?((cfg.suggestName!=null)?cfg.suggestName:baseOf(a.n)):'';
  let selFile=null;
  const cur=()=>path[path.length-1];
  const win=document.createElement('div');
  win.className='ccwin ccdlg fxsave'; win.id='fxSaveWin'; win.style.zIndex=90;
  w.appendChild(win);
  const titleTxt=cfg.title||(mode==='save'?'💾 Enregistrer sous':'📎 Choisir un fichier à joindre');
  function guideText(){
    if(cfg.guide) return cfg.guide;
    if(mode==='save') return 'Choisis le <b>dossier</b> (<b>double-clic</b> pour l\'ouvrir), écris le <b>nom</b>, puis clique <b>Enregistrer</b>.';
    return cfg.imageOnly
      ? 'Ouvre les dossiers en <b>double-cliquant</b> dessus, puis <b>double-clique</b> l\'image à insérer.'
      : 'Ouvre les dossiers en <b>double-cliquant</b> dessus, puis <b>double-clique</b> le fichier à joindre.';
  }
  function footHtml(){
    if(mode==='save'){
      return '<span class="fx-lbl">Nom du fichier :</span>'
        +'<input class="fx-namebox" id="fxName" maxlength="40" placeholder="mon-fichier" value="'+esc(name)+'">'
        +'<span class="fx-type">'+(ext?esc(ext):'fichier')+'</span>'
        +'<button class="d-btn" id="fxCancel">Annuler</button>'
        +'<button class="d-btn grn" id="fxSave">💾 Enregistrer</button>';
    }
    return '<span class="fx-lbl">'+(cfg.imageOnly?'Image :':'Fichier :')+'</span>'
      +'<input class="fx-namebox" id="fxName" readonly placeholder="'+(cfg.imageOnly?'aucune image choisie':'aucun fichier choisi')+'" value="'+esc(selFile?selFile.name:'')+'">'
      +'<button class="d-btn" id="fxCancel">Annuler</button>'
      +'<button class="d-btn grn" id="fxOpen"'+(selFile?'':' disabled')+'>'+(cfg.imageOnly?'🖼️ Insérer':'📎 Joindre')+'</button>';
  }
  function render(){
    win.innerHTML='<div class="w-bar"><span class="wb-t">'+titleTxt+'</span>'
      +'<button class="w-x" id="fxX">✕</button></div>'
      +'<div class="fx-addr"><span style="font-weight:800">📁</span><span class="fx-crumb" id="fxCrumb"></span></div>'
      +'<div class="fx-guide"><span>🧭</span><span>'+guideText()+'</span></div>'
      +'<div class="fx-body"><div class="fx-side" id="fxSide"></div><div class="fx-main" id="fxMain"></div></div>'
      +'<div class="fx-foot">'+footHtml()+'</div>';
    /* fil d'Ariane cliquable */
    const crumb=win.querySelector('#fxCrumb'); crumb.innerHTML='';
    path.forEach((node,i)=>{
      if(i) crumb.insertAdjacentHTML('beforeend','<span class="fx-sep">›</span>');
      const last=i===path.length-1;
      const b=document.createElement('button'); b.className='fx-seg'+(last?' cur':''); b.textContent=node.name;
      if(!last) b.onclick=()=>{ path=path.slice(0,i+1); selFile=null; render(); };
      crumb.appendChild(b);
    });
    /* volet gauche (clic simple) : accès rapide + Ce PC développable */
    const side=win.querySelector('#fxSide'); side.innerHTML='';
    const navTo=p=>{ path=p.slice(); selFile=null; render(); };
    PC_QUICK.forEach(q=>{
      const b=document.createElement('button');
      b.className='fx-folder'+(cur()===q.path[q.path.length-1]?' active':'');
      b.innerHTML='<span>'+q.icon+'</span> '+esc(q.label);
      b.onclick=()=>navTo(q.path);
      side.appendChild(b);
    });
    const row=document.createElement('div');
    row.className='fx-pcrow'+(cur()===PC_CEPC?' active':'');
    const chev=document.createElement('button'); chev.className='fx-chev'; chev.textContent=sbExpanded?'▾':'▸';
    chev.onclick=e=>{ e.stopPropagation(); sbExpanded=!sbExpanded; render(); };
    const lab=document.createElement('button'); lab.className='fx-pclabel';
    lab.innerHTML='<span>'+PC_CEPC.icon+'</span> '+PC_CEPC.name;
    lab.onclick=()=>{ sbExpanded=true; navTo([PC_CEPC]); };
    row.appendChild(chev); row.appendChild(lab); side.appendChild(row);
    if(sbExpanded){
      PC_CEPC.children.forEach(dk=>{ const b=document.createElement('button');
        b.className='fx-folder sub'+(cur()===dk?' active':'');
        b.innerHTML='<span>'+dk.icon+'</span> '+esc(dk.name);
        b.onclick=()=>navTo([PC_CEPC,dk]);
        side.appendChild(b); });
    }
    side.scrollTop=sideScroll; side.onscroll=()=>{ sideScroll=side.scrollTop; };
    /* contenu du dossier courant (double-clic pour ouvrir/choisir) */
    const main=win.querySelector('#fxMain'); main.innerHTML='';
    let items=cur().children||[];
    /* en mode « insérer une image », on ne montre que les dossiers et les images */
    if(cfg.imageOnly) items=items.filter(n=>n.kind!=='file'||n.img);
    if(!items.length){ main.innerHTML='<div class="fx-empty">'+(cfg.imageOnly?'🖼️ Aucune image dans ce dossier.':'📂 Ce dossier est vide.')+'</div>'; }
    else{
      const grid=document.createElement('div'); grid.className='fx-grid';
      items.forEach(node=>{ const isFolder=node.kind!=='file';
        const f=document.createElement('button');
        f.className='fx-file'+(isFolder?' is-folder':'')+((!isFolder&&selFile===node)?' sel':'');
        if(!isFolder) f.dataset.fn=String(node.name).toLowerCase();
        f.title=isFolder?'Double-cliquer pour ouvrir':(mode==='open'?(cfg.imageOnly?'Double-cliquer pour insérer':'Double-cliquer pour joindre'):'');
        f.innerHTML='<span class="fx-thumb"'+(isFolder?'':' style="background:#eef4ff;font-size:1.9rem"')+'>'+node.icon+'</span><span class="fx-fn">'+esc(node.name)+'</span>';
        if(isFolder){
          f.ondblclick=()=>{ path=path.concat(node); selFile=null; render(); };
        } else if(mode==='open'){
          f.onclick=()=>{ selFile=node; render(); };
          f.ondblclick=()=>doPick(node);
        } else {
          f.onclick=()=>toast('📄 Ce fichier est déjà rangé ici.');
        }
        grid.appendChild(f); });
      main.appendChild(grid);
    }
    win.querySelector('#fxX').onclick=()=>{ beep('click'); win.remove(); };
    win.querySelector('#fxCancel').onclick=()=>{ beep('click'); win.remove(); };
    if(mode==='save'){
      const nameEl=win.querySelector('#fxName');
      nameEl.oninput=e=>{ name=e.target.value; };
      nameEl.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); doSave(); } };
      win.querySelector('#fxSave').onclick=doSave;
    } else {
      const ob=win.querySelector('#fxOpen'); if(ob) ob.onclick=()=>{ if(selFile) doPick(selFile); };
    }
  }
  function doSave(){
    const clean=baseOf(name.trim());
    if(!clean){ beep('bad'); toast('✏️ Écris un <b>nom de fichier</b> avant d\'enregistrer.'); return; }
    if(cfg.targetPath && pcKey(path)!==pcKey(cfg.targetPath)){
      beep('bad'); toast(cfg.folderHint||('📁 Ce n\'est pas le bon dossier : range le fichier dans <b>'+esc(cfg.targetPath.join(' › '))+'</b>.')); return;
    }
    if(cfg.requireName && normFileName(clean)!==normFileName(cfg.requireName)){
      beep('bad'); toast(cfg.nameHint||('✏️ Enregistre le fichier sous le nom <b>'+esc(baseOf(cfg.requireName))+'</b>.')); return;
    }
    const finalName=clean+ext;
    const folder=cur();
    if(folder.children && !folder.children.some(f=>normText(f.name)===normText(finalName)))
      folder.children.push({name:finalName, icon:'⭐', kind:'file', s:(a?a.s:100), img:(a?a.img:false), emoji:(a?a.emoji:'')});
    const pk=pcKey(path);
    winsBox().innerHTML=''; beep('good');
    toast('💾 <b>'+esc(finalName)+'</b> enregistré dans <b>'+esc(cur().name)+'</b> !');
    evtAdd('downloaded', a.n.toLowerCase());
    evtAdd('savedTo', a.n.toLowerCase()+'>'+pk);
    evtAdd('savedName', normFileName(clean)+'>'+pk);
    if(cfg.onSaved) cfg.onSaved(finalName, pk);
  }
  function doPick(node){ if(cfg.onPick) cfg.onPick(node, ()=>{ try{ win.remove(); }catch(e){} }); }
  render();
  if(mode==='save'){ const nameEl=win.querySelector('#fxName'); if(nameEl) setTimeout(()=>{ try{ nameEl.focus(); nameEl.select(); }catch(e){} },40); }
}
function openSaveExplorer(a, cfg){ openFileExplorer(Object.assign({}, cfg||{}, {mode:'save', attObj:a})); }
/* fenêtre « Choisir un fichier à joindre » : on va chercher la PJ dans les dossiers du PC */
function openAttachExplorer(){
  openFileExplorer({ mode:'open',
    onPick:function(node, close){
      const c=M.compose; if(!c){ close(); return; }
      const sz=node.s||100;
      if(sz>MAX_ATT_KO){
        beep('bad');
        toast('⛔ <b>'+esc(node.name)+'</b> est trop lourd ('+fmtSize(sz)+') ! Les mails acceptent <b>25 Mo maximum</b>. Les grosses vidéos passent par un lien de partage.');
        evtFlag('tooBigTried'); fireEvt(); return;
      }
      if(!c.atts.some(x=>normText(x.n)===normText(node.name)))
        c.atts.push({n:node.name, s:sz, ic:node.icon, img:!!node.img, emoji:node.emoji});
      M.evt.maxAtts=Math.max(M.evt.maxAtts||0, c.atts.length);
      close(); beep('good'); renderCmpAtts();
      evtAdd('attAdded', node.name.toLowerCase()); fireEvt();
    }});
}

   6. LA FENÊTRE « NOUVEAU MESSAGE » (composition)
   --------------------------------------------------------- */
function parseAddr(s){
  s=s.trim().replace(/[;,]$/,'').trim(); if(!s) return null;
  /* nom de contact ou de liste ? */
  const nc=normText(s);
  const c=M.contacts.find(x=>normText(x.name)===nc || normText(x.name).startsWith(nc) || x.addr===s.toLowerCase());
  if(c) return {addr:c.addr};
  const l=M.lists.find(x=>normText(x.name)===nc);
  if(l) return {list:l.name};
  if(/^[\w.+-]+@[\w-]+\.[\w.]{2,}$/.test(s.toLowerCase())) return {addr:s.toLowerCase()};
  return {bad:s};
}
function openCompose(preset){
  preset=preset||{};
  closeMenus();
  const d=preset.draft;
  M.compose={
    to:(d?d.to.filter(a=>a!==ME):(preset.to||[])).slice(),
    cc:(d?d.cc:(preset.cc||[])).slice(),
    bcc:(d?d.bcc:(preset.bcc||[])).slice(),
    lists:(d&&d._lists?d._lists:(preset.lists||[])).slice(),
    showCc:!!(preset.cc&&preset.cc.length)||!!(d&&d.cc.length),
    showBcc:!!(preset.bcc&&preset.bcc.length)||!!(d&&d.bcc.length),
    subject:d?d.subject:(preset.subject||''),
    bodyHtml:d?d.body:(preset.bodyHtml||''),
    atts:(d?d.atts:(preset.atts||[])).slice(),
    draftId:d?d.id:null,
    replyOf:preset.replyOf||null, fwdOf:preset.fwdOf||null,
    sigAdded:false
  };
  if(d){ evtAdd('draftResumed', d.id); }
  else evtFlag('openedCompose'); /* une fenêtre de rédaction est ouverte (nouveau, répondre, transférer) */
  /* signature ajoutée automatiquement aux nouveaux messages */
  if(M.signature && !d && M.compose.bodyHtml.indexOf('class="sig"')<0){
    /* une ligne modifiable vide doit toujours précéder la signature : sans elle, le navigateur
       n'a aucun point d'ancrage éditable où insérer du texte (la signature est en lecture seule) */
    if(!M.compose.bodyHtml) M.compose.bodyHtml='<p><br></p>';
    M.compose.bodyHtml+='<p class="sig" contenteditable="false">'+esc(M.signature)+'</p>';
    M.compose.sigAdded=true;
  }
  renderCompose();
}

  renderChips('to'); if(c.showCc) renderChips('cc'); if(c.showBcc) renderChips('bcc');
  renderCmpAtts();
  const cmpWin=document.getElementById('cmpWin');
  if(c._pos){ cmpWin.style.left=c._pos.left+'px'; cmpWin.style.top=c._pos.top+'px'; cmpWin.style.transform='none'; }
  if(c._size){ cmpWin.style.width=c._size.width+'px'; cmpWin.style.height=c._size.height+'px'; }
  makeDraggable(cmpWin.querySelector('.w-bar'), cmpWin, pos=>{ c._pos=pos; });
  makeResizableWin(cmpWin, {minW:380, minH:300, onResize:size=>{ c._size={width:size.width,height:size.height}; c._pos={left:size.left,top:size.top}; }});
  document.getElementById('cmpX').onclick=()=>{ beep('click'); closeWins(); renderAll(); };
  document.getElementById('cmpSubj').addEventListener('input',e=>{ c.subject=e.target.value; });
  const body=document.getElementById('cmpBody');

  /* la signature n'est pas modifiable : le curseur ne doit jamais s'y trouver, ni passer après elle */
  const sigEl=body.querySelector('.sig');
  if(sigEl){
    const clampSigCaret=()=>{
      const sel=window.getSelection(); if(!sel||!sel.rangeCount) return;
      const r=sel.getRangeAt(0); if(!body.contains(r.startContainer)) return;
      const testRange=document.createRange(); testRange.selectNode(sigEl);
      let cmp; try{ cmp=testRange.comparePoint(r.startContainer, r.startOffset); }catch(e){ return; }
      if(cmp>=0){
        const nr=document.createRange(); nr.setStartBefore(sigEl); nr.collapse(true);
        sel.removeAllRanges(); sel.addRange(nr);
      }
    };
    body.addEventListener('mouseup', clampSigCaret);
    body.addEventListener('keydown', clampSigCaret);
  }
  /* mise en forme */
  function applyFmt(f){
    body.focus();
    if(f==='bold') document.execCommand('bold');
    else if(f==='italic') document.execCommand('italic');
    else if(f==='underline') document.execCommand('underline');
    else if(f==='hilite'){ document.execCommand('hiliteColor',false,'#fef08a'); }
    else if(f==='center'){ document.execCommand('justifyCenter'); }
    c.bodyHtml=body.innerHTML; beep('click');
    evtAdd('fmtUsed', f); fireEvt();
  }
  document.querySelectorAll('#cmpTools .fmt-btn[data-fmt]').forEach(b=>{
    b.onclick=(e)=>{ e.preventDefault(); applyFmt(b.getAttribute('data-fmt')); };
    b.addEventListener('pointerdown',e=>e.preventDefault()); /* garde la sélection du texte */
  });
  /* raccourcis clavier de mise en forme, comme dans le traitement de texte : Ctrl/Cmd + B (ou G) / I / U */
  body.addEventListener('keydown', e=>{
    if(!(e.ctrlKey||e.metaKey) || e.altKey) return;
    const k=e.key.toLowerCase();
    let f=null;
    if(k==='b'||k==='g') f='bold';
    else if(k==='i') f='italic';
    else if(k==='u') f='underline';
    else return;
    e.preventDefault();
    applyFmt(f);
  });
  const fontSel=document.getElementById('cmpFont');
  /* le clic natif sur le menu déroulant peut faire perdre la sélection de texte avant le
     changement : on la mémorise donc AVANT l'ouverture du menu, pour la restaurer ensuite */
  let savedFontRange=null;
  fontSel.addEventListener('pointerdown',()=>{
    const sel=window.getSelection();
    if(sel && sel.rangeCount && body.contains(sel.anchorNode)) savedFontRange=sel.getRangeAt(0).cloneRange();
  });
  fontSel.onchange=()=>{
    body.focus();
    if(savedFontRange){ const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(savedFontRange); }
    if(fontSel.value) document.execCommand('fontName',false,fontSel.value);
    c.bodyHtml=body.innerHTML; evtAdd('fmtUsed','font'); fireEvt(); };
  document.getElementById('cmpImg').onclick=()=>openImageExplorer();
  document.getElementById('cmpAtt').onclick=()=>openAttachExplorer();
  document.getElementById('cmpSend').onclick=sendCompose;
  document.getElementById('cmpDraft').onclick=saveDraft;

function renderChips(k){
  const c=M.compose; const zone=document.getElementById('zone_'+k); if(!zone) return;
  const inp=document.getElementById('in_'+k);
  zone.querySelectorAll('.chip').forEach(x=>x.remove());
  const frag=document.createDocumentFragment();
  function addChip(html, cls, onDel){
    const s=document.createElement('span'); s.className='chip'+(cls?' '+cls:''); s.innerHTML=html;
    const x=document.createElement('button'); x.className='ch-x'; x.textContent='✕';
    x.onclick=()=>{ onDel(); evtAdd('recipientRemoved', k); renderChips(k); };
    s.appendChild(x); frag.appendChild(s);
  }
  if(k==='to'){
    c.lists.forEach((ln,i)=>{
      const l=M.lists.find(x=>x.name===ln);
      addChip('📣 '+esc(ln)+' ('+(l?l.members.length:0)+')','list',()=>c.lists.splice(i,1));
    });
  }
  c[k].forEach((a,i)=>{ addChip(esc(a===ME?'Toi':whoName(a)),'',()=>c[k].splice(i,1)); });
  zone.insertBefore(frag, inp);
  /* saisie — on ne reconstruit QUE les chips du champ (pas toute la fenêtre),
     sinon l'animation d'ouverture de la fenêtre se rejoue (effet « la fenêtre
     se réduit puis se rouvre ») quand on quitte le champ pour l'objet/le corps. */
  function commit(refocus){
    const v=inp.value; if(!v.trim()) return true;
    const r=parseAddr(v);
    if(!r) return true;
    if(r.bad){
      beep('bad'); inp.value='';
      toast('🤔 « '+esc(r.bad)+' » n\'est pas une adresse mail. Il faut un <b>@</b> et un point, comme <b>papi.marcel@cuicui.fr</b>.');
      evtFlag('badAddrTried');
      return false;
    }
    if(r.list){ if(k==='to' && !c.lists.includes(r.list)) c.lists.push(r.list); }
    else if(!c[k].includes(r.addr)) c[k].push(r.addr);
    inp.value=''; beep('click'); renderChips(k);
    if(refocus){ const ni=document.getElementById('in_'+k); if(ni) ni.focus(); }
    fireEvt();
    return true;
  }
  inp.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===','||e.key===';'||e.key==='Tab'){ e.preventDefault(); commit(true); } };
  inp.onblur=()=>{ commit(false); };
  /* auto-complétion façon messagerie moderne (dès le niveau 3, une fois le carnet enseigné) :
     dès qu'on tape le début d'une adresse déjà dans le carnet, elle se complète toute seule,
     avec la partie ajoutée sélectionnée — Entrée la valide, continuer à taper l'efface. */
  if(currentLevel>=3){
    inp.oninput=(e)=>{
      if(e.inputType && e.inputType.indexOf('delete')===0) return;
      const val=inp.value; if(!val) return;
      const low=val.toLowerCase();
      const match=M.contacts.find(x=>x.addr.toLowerCase().startsWith(low) && x.addr.toLowerCase()!==low);
      if(match){ inp.value=match.addr; inp.setSelectionRange(val.length, match.addr.length); }
    };
  }
  const lkCc=document.getElementById('lkCc'), lkBcc=document.getElementById('lkBcc');
  if(lkCc) lkCc.onclick=()=>{ c.showCc=true; evtFlag('openedCc'); renderCompose(); document.getElementById('in_cc').focus(); };
  if(lkBcc) lkBcc.onclick=()=>{ c.showBcc=true; evtFlag('openedBcc'); renderCompose(); document.getElementById('in_bcc').focus(); };
  zone.parentNode.querySelector('.cr-book').onclick=(e)=>{ e.stopPropagation(); menuBook(e.currentTarget, k); };
}

function expandRecipients(c){

  let to=c.to.slice();
  c.lists.forEach(ln=>{

function sendCompose(){
  const c=M.compose; if(!c) return;
  const inTo=document.getElementById('in_to'); if(inTo && inTo.value.trim()){ const r=parseAddr(inTo.value); if(r&&r.addr&&!c.to.includes(r.addr)){ c.to.push(r.addr); inTo.value=''; } }
  const to=expandRecipients(c);
  if(!to.length){
    beep('bad'); toast('✋ Il faut au moins <b>un destinataire</b> dans « À » ! À qui envoies-tu ce mail ?');
    evtFlag('sendNoTo');
    const z=document.getElementById('zone_to'); if(z){ z.classList.add('spot'); after(2000,()=>z.classList.remove('spot')); }
    return;
  }
  if(!c.subject.trim()){
    beep('bad'); toast('✋ N\'oublie pas l\'<b>objet</b> : il dit de quoi parle ton mail, comme un titre !');
    evtFlag('sendNoSubject');
    const s=document.getElementById('cmpSubj'); if(s){ s.parentNode.classList.add('spot'); after(2000,()=>s.parentNode.classList.remove('spot')); s.focus(); }
    return;
  }
  const bodyEl=document.getElementById('cmpBody'); if(bodyEl) c.bodyHtml=bodyEl.innerHTML;
  if(!stripTags(c.bodyHtml).trim() && c.bodyHtml.indexOf('m-img')<0){
    beep('bad'); toast('✋ Ton mail est <b>vide</b> ! Écris ton message avant d\'envoyer.');
    evtFlag('sendNoBody');
    return;
  }
  /* enregistrement pour les missions */
  const bh=c.bodyHtml;
  const rec={
    to:to.slice(), cc:c.cc.slice(), bcc:c.bcc.slice(), lists:c.lists.slice(),
    subject:c.subject.trim(), body:normText(stripTags(bh)),
    atts:c.atts.map(a=>a.n.toLowerCase()),
    img:bh.indexOf('m-img')>=0,
    sig:bh.indexOf('class="sig"')>=0,
    fmt:{
      b:/<(b|strong)[\s>]/.test(bh), i:/<(i|em)[\s>]/.test(bh), u:/<u[\s>]/.test(bh),
      hl:/background-color/.test(bh), center:/text-align:\s*center|<center/.test(bh),
      font:/face="|font-family/.test(bh)
    },
    replyOf:c.replyOf, all:!!c.all, fwdOf:c.fwdOf
  };
  const sent=mkMail({folder:'sent', from:ME, to:to, cc:c.cc, bcc:c.bcc,
    subject:c.subject.trim(), body:bh, read:true, atts:c.atts, k:_mailK+900+M.seq});
  sent._lists=c.lists.slice();
  M.mails.push(sent);
  if(c.draftId){ M.mails=M.mails.filter(m=>m.id!==c.draftId); evtAdd('draftSent', c.draftId); }
  const cb=M.onSend;
  closeWins();
  beep('send');
  toast('📨 Mail envoyé ! Tu le retrouveras dans <b>Envoyés</b>.');
  M.evt.sent.push(rec);
  renderAll();
  fireEvt();
  if(cb) cb(rec);
}
function saveDraft(){
  const c=M.compose; if(!c) return;
  const bodyEl=document.getElementById('cmpBody'); if(bodyEl) c.bodyHtml=bodyEl.innerHTML;
  const d=c.draftId?getMail(c.draftId):null;
  if(d){
    d.to=expandRecipients(c); d.cc=c.cc.slice(); d.bcc=c.bcc.slice();
    d.subject=c.subject||'(sans objet)'; d.body=c.bodyHtml; d.atts=c.atts.slice(); d._lists=c.lists.slice();
  } else {
    const nd=mkMail({folder:'drafts', from:ME, to:c.to, cc:c.cc, bcc:c.bcc,
      subject:c.subject||'(sans objet)', body:c.bodyHtml, read:true, atts:c.atts, k:_mailK+900+M.seq});
    nd._lists=c.lists.slice();
    M.mails.push(nd);
  }
  closeWins(); beep('good');
  toast('💾 Brouillon enregistré ! Tu le retrouveras dans <b>Brouillons</b> pour le finir plus tard.');
  evtFlag('draftSaved');
  renderAll();
}

function dlgNewContact(preset, editIdx){
  beep('click'); preset=preset||{}; const editing=editIdx!=null;
  openDlg(editing?'✏️ Modifier le contact':'➕ Nouveau contact',
    '<p>Un contact enregistré = plus besoin de retaper son adresse !</p>'
    +'<label>Prénom (ou nom)</label><input class="d-in" id="ncName" placeholder="Par exemple : Pauline" value="'+esc(preset.name||'')+'" autocomplete="off">'
    +'<label>Adresse mail</label><input class="d-in" id="ncAddr" placeholder="Par exemple : pauline.tricot@cuicui.fr" value="'+esc(preset.addr||'')+'" autocomplete="off" spellcheck="false">',
    '<button class="d-btn" id="ncCancel">Annuler</button><button class="d-btn grn" id="ncOk">Enregistrer</button>');
  document.getElementById('ncCancel').onclick=()=>{ winsBox().innerHTML=''; };
  document.getElementById('ncOk').onclick=()=>{
    const n=document.getElementById('ncName').value.trim();
    const a=document.getElementById('ncAddr').value.trim().toLowerCase();
    if(!n){ document.getElementById('ncName').focus(); return; }
    if(!/^[\w.+-]+@[\w-]+\.[\w.]{2,}$/.test(a)){
      beep('bad'); toast('🤔 Cette adresse ne ressemble pas à une adresse mail. Il faut un <b>@</b> et un point !');
      document.getElementById('ncAddr').focus(); return;
    }
    if(M.contacts.some((c,i)=>c.addr===a && i!==editIdx)){
      beep('bad'); toast('🤔 Un contact a déjà cette adresse !'); document.getElementById('ncAddr').focus(); return;
    }
    if(editing){
      const oldAddr=preset.addr;
      M.contacts[editIdx]={addr:a, name:n, av:who(a).av};
      /* si l'ancien contact était enregistré dans le carnet persistant, on renomme son adresse là aussi */
      if(getExtraContacts().some(x=>x.addr===oldAddr)) renameExtraContact(oldAddr, a, n, who(a).av);
    } else { M.contacts.push({addr:a, name:n, av:who(a).av}); saveExtraContact(a, n, who(a).av); }
    winsBox().innerHTML=''; beep('good');
    toast(editing?('✏️ Contact <b>'+esc(n)+'</b> modifié !'):('📇 Contact <b>'+esc(n)+'</b> enregistré !'));
    if(editing) evtAdd('contactEdited', a); else evtAdd('contactAdded', a);
    renderMain();
  };
}
function dlgNewList(editIdx){
  beep('click'); const editing=editIdx!=null; const existing=editing?M.lists[editIdx]:null;
  if(!M.contacts.length){ toast('Ajoute d\'abord des contacts !'); return; }

      +'<input type="checkbox" class="nl-m" value="'+esc(c.addr)+'"'+(existing&&existing.members.includes(c.addr)?' checked':'')+' style="width:16px;height:16px;cursor:pointer"> '

  document.getElementById('nlCancel').onclick=()=>{ winsBox().innerHTML=''; };
  document.getElementById('nlOk').onclick=()=>{

  };
}

function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function firstDow(y,m){ return (new Date(y,m,1).getDay()+6)%7; } /* 0 = lundi */
function renderAgenda(main){
  const y=M.agY, m=M.agM;
  const n=daysInMonth(y,m), start=firstDow(y,m);
  let cells=JOURS.map(j=>'<div class="ag-dow">'+j+'</div>').join('');
  for(let i=0;i<start;i++) cells+='<div class="ag-day off"></div>';
  for(let d=1;d<=n;d++){
    const evs=M.events.filter(e=>e.d===d && e.m===m && (e.y===y || (e.yearly && e.y<=y)));
    const today=(y===SIM.y&&m===SIM.m&&d===SIM.d);
    cells+='<div class="ag-day'+(today?' today':'')+'" data-d="'+d+'">'
      +'<span class="ad-n">'+d+(today?' · auj.':'')+'</span>'
      +evs.map(e=>'<span class="ag-ev '+(e.type==='devoir'?'devoir':(e.type==='anniv'?'anniv':''))+'" title="'+esc(e.title)+'">'
        +(e.type==='devoir'?'📚 ':(e.type==='anniv'?'🎂 ':'🎈 '))+esc(e.title)+'</span>').join('')
      +'</div>';
  }
  main.innerHTML='<div class="cc-agenda"><div class="ag-head">'
    +'<button class="ag-nav" id="agPrev" title="Mois précédent">◀</button>'
    +'<h3>📅 '+MOIS[m]+' '+y+'</h3>'
    +'<button class="ag-nav" id="agNext" title="Mois suivant">▶</button></div>'
    +'<div class="ag-grid">'+cells+'</div></div>';
  document.getElementById('agPrev').onclick=()=>{ beep('click'); M.agM--; if(M.agM<0){M.agM=11;M.agY--;} evtAdd('agNav','prev'); renderMain(); };
  document.getElementById('agNext').onclick=()=>{ beep('click'); M.agM++; if(M.agM>11){M.agM=0;M.agY++;} evtAdd('agNav','next'); renderMain(); };
  main.querySelectorAll('.ag-day:not(.off)').forEach(c=>c.onclick=()=>dlgNewEvent(+c.getAttribute('data-d')));
}
function dlgNewEvent(d){
  beep('click');
  const y=M.agY, m=M.agM;

  const exHtml=existing.length?('<p style="background:#f2f7fb;border-radius:9px;padding:7px 10px">Déjà noté ce jour-là : '

    +'<label id="evYearlyWrap" style="display:none;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="evYearly" checked style="width:16px;height:16px"> 🔁 Se répète chaque année</label>',
    '<button class="d-btn" id="evCancel">Annuler</button><button class="d-btn grn" id="evOk">Ajouter à l\'agenda</button>');
  const typeSel=document.getElementById('evType');
  function syncYearly(){ document.getElementById('evYearlyWrap').style.display=(typeSel.value==='anniv')?'flex':'none'; }
  typeSel.onchange=syncYearly; syncYearly();
  document.querySelectorAll('[data-ev]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation();
    M.events=M.events.filter(x=>x.id!==b.getAttribute('data-ev')); beep('delete'); winsBox().innerHTML=''; renderMain(); });
  document.getElementById('evCancel').onclick=()=>{ winsBox().innerHTML=''; };

    const t=document.getElementById('evTitle').value.trim();
    if(!t){ document.getElementById('evTitle').focus(); return; }
    const ev={id:'e'+Date.now()+Math.floor(Math.random()*999), y:y, m:m, d:d, type:typeSel.value, title:t,
      yearly:typeSel.value==='anniv'&&document.getElementById('evYearly').checked};
    M.events.push(ev);
    winsBox().innerHTML=''; beep('good');
    toast((ev.type==='devoir'?'📚':'🎈')+' Noté dans l\'agenda : <b>'+esc(t)+'</b> le '+d+' '+MOIS[m]+' !');
    (M.evt.eventAdded=M.evt.eventAdded||[]).push(ev);

const G={
  /* génériques */
  flag:(key,hint,spot)=>({spot:spot||'list', hint:hint, test:c=>!!c.evt[key]}),
  inSet:(key,val,hint,spot)=>({spot:spot||'list', hint:hint, sel:inSetSel(key,val), test:c=>c.evt[key] && c.evt[key].has(val)}),
  /* police : ne valide que si TOUT le texte écrit est passé dans la police demandée (pas juste un mot) */
  fontAllUsed:(fontName,hint)=>({spot:'toolbar', hint:hint, sel:inSetSel('fmtUsed','font'), test:()=>bodyAllInFont(fontName)}),
  setSize:(key,n,hint,spot)=>({spot:spot||'list', hint:hint, test:c=>c.evt[key] && c.evt[key].size>=n}),
  /* lecture */
  openedMail:(id,hint)=>({spot:'list', hint:hint||'Clique sur le mail dans la <b>liste du milieu</b> pour l\'ouvrir.', sel:mailRowSel(id), test:c=>c.evt.openedMail && c.evt.openedMail.has(id)}),
  reopenedSent:(hint)=>({spot:'list', hint:hint||'Clique sur ton mail dans la liste du milieu pour le relire.',
    sel:function(){ const m=M.mails.find(x=>x.folder==='sent'); if(m){ const row=document.querySelector('#mailList [data-id="'+m.id+'"]'); if(row) return row; } return document.querySelector('#ccFolders [data-f="sent"]'); },
    test:c=>c.evt.openedMail && [...c.evt.openedMail].some(id=>{const mm=c.mails.find(x=>x.id===id); return mm && mm.folder==='sent';})}),
  allRead:(hint)=>({spot:'list', hint:hint||'Ouvre <b>tous</b> les mails avec un point bleu (non lus) : clique-les un par un.',
    sel:function(){ if(M.folder!=='inbox') return document.querySelector('#ccFolders [data-f="inbox"]'); const m=M.mails.find(x=>x.folder==='inbox'&&!x.read); return m?document.querySelector('#mailList [data-id="'+m.id+'"]'):null; },
    test:c=>!c.mails.some(m=>m.folder==='inbox'&&!m.read)}),
  /* envoi : match sur le DERNIER mail envoyé */
  sent:(match,hint)=>({spot:'compose', hint:hint||'Clique sur <b>✏️ Nouveau message</b>, remplis les champs demandés, puis <b>📨 Envoyer</b>.',
    sel:function(){
      if(document.getElementById('cmpWin')) return document.getElementById('cmpSend');
      if(match.reply && match.to && match.to.length){
        const m=M.mails.find(x=>x.folder==='inbox' && match.to.includes(x.from));
        if(m){
          if(M.sel!==m.id){ const row=document.querySelector('#mailList [data-id="'+m.id+'"]'); if(row) return row; }
          const btn=document.querySelector('#reader [data-act="reply"]'); if(btn) return btn;
        }
      }
      return document.getElementById('btnNew');
    },
    test:c=>c.evt.sent.some(r=>sentMatches(r,match))}),
  /* enregistrement d'une pièce jointe dans un dossier précis de l'ordinateur.
     pathArr : chemin cible (ex. ['Ce PC','Documents','Collège']). saveName (optionnel) :
     nom exact à donner au fichier. */
  savedIn:(file,pathArr,saveName,hint)=>{
    const pathLbl=pathArr.join(' › ');
    const cfg={file:file, targetPath:pathArr,
      guide:(saveName?('Range le fichier dans <b>'+pathLbl+'</b> et nomme-le <b>'+saveName+'</b>, puis clique <b>Enregistrer</b>.')
                      :('Range le fichier dans <b>'+pathLbl+'</b>, puis clique <b>Enregistrer</b>.')),
      folderHint:'📁 Ce n\'est pas le bon dossier : range-le dans <b>'+pathLbl+'</b>.'};
    if(saveName){ cfg.requireName=saveName; cfg.suggestName=''; cfg.nameHint='✏️ Enregistre le fichier sous le nom <b>'+saveName+'</b>.'; }
    return {spot:'reader', saveCfg:cfg,
      hint:hint||('À côté de la pièce jointe <b>'+file+'</b>, clique <b>⬇️ Enregistrer</b>, ouvre <b>'+pathLbl+'</b>'+(saveName?(', écris le nom <b>'+saveName+'</b>'):'')+', puis <b>💾 Enregistrer</b>.'),
      sel:downloadSel(file),
