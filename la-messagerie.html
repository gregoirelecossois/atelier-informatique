function sentMatches(r, m){
  if(m.to && !m.to.every(a=>r.to.includes(a))) return false;
  if(m.toOnly && (r.to.length!==m.toOnly.length || !m.toOnly.every(a=>r.to.includes(a)))) return false;
  if(m.cc && !m.cc.every(a=>r.cc.includes(a))) return false;
  if(m.ccEmpty && r.cc.length) return false;
  if(m.bcc && !m.bcc.every(a=>r.bcc.includes(a))) return false;
  if(m.bccN!=null && r.bcc.length<m.bccN) return false;
  if(m.bccEmpty && r.bcc.length) return false;
  if(m.list && !r.lists.some(l=>normText(l)===normText(m.list))) return false;
  if(m.subjIncl && !normText(r.subject).includes(normText(m.subjIncl))) return false;
  if(m.bodyIncl && !m.bodyIncl.some(w=>r.body.includes(normText(w)))) return false;
  if(m.att && !r.atts.some(a=>a.includes(m.att.toLowerCase()))) return false;
  if(m.atts && !m.atts.every(x=>r.atts.some(a=>a.includes(x.toLowerCase())))) return false;
  if(m.attN!=null && r.atts.length<m.attN) return false;
  if(m.attExact!=null && r.atts.length!==m.attExact) return false;
  if(m.img && !r.img) return false;
  if(m.sig && !r.sig) return false;
  if(m.reply && !r.replyOf) return false;
  if(m.fmt){ for(const k of m.fmt){ if(!r.fmt[k]) return false; } }
  return true;
}
function eventMatches(e, m){
  if(m.type && e.type!==m.type) return false;
  if(m.d!=null && e.d!==m.d) return false;
  if(m.m!=null && e.m!==m.m) return false;
  if(m.titleIncl && !m.titleIncl.some(w=>normText(e.title).includes(normText(w)))) return false;
  if(m.yearly && !e.yearly) return false;
  return true;
}
/* vrai seulement si TOUT le texte du corps du message (hors signature) est dans la police demandée */
function bodyAllInFont(fontName){
  const body=document.getElementById('cmpBody'); if(!body) return false;
  const walker=document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  let any=false, node;
  while((node=walker.nextNode())){
    if(!node.textContent.trim()) continue;
    const el=node.parentElement; if(!el || el.closest('.sig')) continue;
    any=true;
    let faceOk=false;
    for(let a=el; a && a!==body; a=a.parentElement){
      if(a.tagName==='FONT' && a.getAttribute('face')===fontName){ faceOk=true; break; }
    }
    const familyOk=getComputedStyle(el).fontFamily.toLowerCase().includes(fontName.toLowerCase());
    if(!faceOk && !familyOk) return false;
  }
  return any;
}
let _missionDone=false;
function checkMission(){
  if(!currentStep) return;
  if(currentStep.kind==='game') return; /* les rounds arcade se vérifient eux-mêmes */
  if(_missionDone) return;
  const objs=currentStep.objectives; if(!objs || !objs.length) return;
  if(currentStep._jalonAnim) return;
  const ctx=buildCtx();
  const i=currentStep._jalonIdx;
  if(i<objs.length && !currentStep._objDone[i]){
    if(objs[i].goal.test(ctx)){
      currentStep._objDone[i]=true; beep('good'); jalonAdvance();
    }
  }
}
function renderJalonObjective(enter){
  const sub=document.getElementById('bSub'); if(!sub) return;
  const s=currentStep, objs=s.objectives||[], i=s._jalonIdx, n=objs.length;
  if(objs[i] && objs[i].goal && objs[i].goal.prep) objs[i].goal.prep();
  sub.innerHTML='<div class="jalon-head"><span class="b-goal-label">Objectif '+(Math.min(i+1,n))+' / '+n+'</span></div>'
    +'<div class="jalon-wrap"><div class="jalon-obj blue'+(enter?' entering':'')+'"><span class="jo-check">'+(i+1)+'</span><span class="jo-text">'+(objs[i]&&objs[i].t||'')+'</span></div></div>';
  if(enter) requestAnimationFrame(()=>{ const el=sub.querySelector('.jalon-obj'); if(el) el.classList.remove('entering'); });
  renderQuizDock();
}
function jalonAdvance(){
  currentStep._jalonAnim=true;
  const gen=currentStep._gen;
  const sub=document.getElementById('bSub'); const el=sub&&sub.querySelector('.jalon-obj');
  if(el){ el.classList.add('done'); const ck=el.querySelector('.jo-check'); if(ck) ck.textContent='✓'; }
  setTimeout(()=>{ if(el) el.classList.add('slideup'); }, 520);
  setTimeout(()=>{
    if(!currentStep || currentStep._gen!==gen) return; /* la mission a été relancée entre-temps */
    currentStep._jalonIdx++;
    currentStep._jalonAnim=false;
    const objs=currentStep.objectives||[];
    if(currentStep._jalonIdx>=objs.length){
      _missionDone=true; renderQuizDock();
      setTimeout(()=>{ if(!currentStep || currentStep._gen!==gen) return; onMissionWin(); }, currentStep.winDelay||0);
      return;
    }
    renderJalonObjective(true);
    /* cascade : si l'objectif révélé est déjà rempli, on enchaîne */
    setTimeout(checkMission, 260);
  }, 980);
}
function activeObj(){
  const objs=(currentStep&&currentStep.objectives)||[]; if(!objs.length) return null;
  return objs[Math.min(currentStep._jalonIdx||0, objs.length-1)];
}

/* ----- le carnet de mission (questions / réponses) ----- */
function renderQuizDock(){
  const dock=document.getElementById('quizDock'); if(!dock) return;
  const o=activeObj(); const q=o && o.quiz;
  if(!q || _missionDone){ dock.hidden=true; dock.innerHTML=''; return; }
  dock.hidden=false;
  dock.innerHTML='<span class="qd-ic">📝</span><div class="qd-q">'+q.q+'</div>'
    +'<input id="qdIn" placeholder="Écris ta réponse ici" autocomplete="off" spellcheck="false">'
    +'<button class="qd-ok" id="qdOk">Valider</button><span class="qd-fb" id="qdFb"></span>';
  const inp=dock.querySelector('#qdIn');
  function submit(){
    const v=inp.value.trim(); if(!v) return;
    const n=normText(v);
    if(q.accepted.some(a=>n===a||n.includes(a)||v===a)){
      M.evt['quiz_'+q.key]=true;
      checkMission();
    } else {
      beep('bad');
      dock.classList.remove('shake'); void dock.offsetWidth; dock.classList.add('shake');
      dock.querySelector('#qdFb').textContent='Ce n\'est pas ça… la réponse est dans le mail !';
      inp.select();
    }
  }
  dock.querySelector('#qdOk').onclick=submit;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

/* ----- sons arcade ----- */
function arcTone(freq,dur,type,vol,delay){
  if(!soundOn) return; const a=audioCtx(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(); o.type=type||'triangle'; o.frequency.value=freq;
  o.connect(g); g.connect(a.destination); const t=a.currentTime+(delay||0);
  g.gain.setValueAtTime(vol||.11,t); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.1)); o.start(t); o.stop(t+(dur||.1));
}
function arcJingle(n){
  const f=440*Math.pow(1.09,Math.min(n||1,10));
  arcTone(f,.08,'triangle',.11); arcTone(f*1.5,.1,'triangle',.09,.06);
}

/* ----- juice : shake, flash, particules, "+N" volant ----- */
function scr(){ return document.querySelector('.screen'); }
function screenShake(){ const s=scr(); if(!s) return; s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }
function redFlash(){ const s=scr(); if(!s) return; const f=document.createElement('div'); f.className='arc-flash'; s.appendChild(f); setTimeout(()=>{ try{f.remove();}catch(e){} },340); }
function elCenterInScreen(el){
  const s=scr(); if(!s) return null;
  const sr=s.getBoundingClientRect();
  if(!el || !el.getBoundingClientRect) return {x:sr.width/2, y:sr.height/2};
  const r=el.getBoundingClientRect();
  return {x:r.left-sr.left+r.width/2, y:r.top-sr.top+r.height/2};
}
function flyPts(txt, el){
  const s=scr(); if(!s) return;
  const p=elCenterInScreen(el)||{x:s.offsetWidth/2,y:s.offsetHeight/2};
  const d=document.createElement('div'); d.className='arc-fly'; d.textContent=txt;
  d.style.left=(p.x-14)+'px'; d.style.top=(p.y-16)+'px';
  s.appendChild(d); setTimeout(()=>{ try{d.remove();}catch(e){} },980);
}
function arcBurst(el){
  const s=scr(); if(!s) return;
  const p=elCenterInScreen(el); if(!p) return;
  const burst=document.createElement('div'); burst.className='arc-burst';
  burst.style.left=p.x+'px'; burst.style.top=p.y+'px';
  const colors=['#fde047','#fff','#f59e0b','#60a5fa','#4ade80','#fde047'];
  for(let i=0;i<12;i++){
    const a=(i/12)*2*Math.PI, dist=30+Math.random()*28;
    const sp=document.createElement('div'); sp.className='arc-spark';
    sp.style.setProperty('--dx',(Math.cos(a)*dist)+'px');
    sp.style.setProperty('--dy',(Math.sin(a)*dist)+'px');
    sp.style.background=colors[i%colors.length];
    sp.style.animationDelay=(Math.random()*.06)+'s';
    burst.appendChild(sp);
  }
  s.appendChild(burst); setTimeout(()=>{ try{burst.remove();}catch(e){} },540);
}
function banner(txt, kind){
  const s=scr(); if(!s) return;
  const old=s.querySelector('.arc-banner'); if(old) old.remove();
  const b=document.createElement('div'); b.className='arc-banner'+(kind?' '+kind:'');
  b.innerHTML=txt;
  s.appendChild(b); setTimeout(()=>{ try{b.remove();}catch(e){} },1550);
}

/* ----- compte à rebours 3-2-1-GO ----- */
function countdown(cb){
  const s=scr(); if(!s){ cb&&cb(); return; }
  const old=s.querySelector('.arc-count'); if(old) old.remove();
  const ov=document.createElement('div'); ov.className='arc-count'; s.appendChild(ov);
  const seq=['3','2','1','GO !'];
  let k=0;
  (function tick(){
    if(k>=seq.length){ try{ov.remove();}catch(e){} cb&&cb(); return; }
    ov.innerHTML='<b'+(k===3?' class="go"':'')+'>'+seq[k]+'</b>';
    arcTone(k===3?900:420+k*70,.14,'square',.1);
    k++; after(k===4?520:720, tick);
  })();
}

/* ----- main fantôme de démonstration ----- */
function ghostClick(sel){
  const s=scr(); const el=document.querySelector(sel);
  if(!s||!el) return;
  const g=document.createElement('div'); g.className='ghost-hand'; g.textContent='👆';
  const sr=s.getBoundingClientRect(), er=el.getBoundingClientRect();
  g.style.left=(sr.width*.5)+'px'; g.style.top=(sr.height*.72)+'px';
  s.appendChild(g);
  requestAnimationFrame(()=>{ g.style.left=(er.left-sr.left+er.width/2-15)+'px'; g.style.top=(er.top-sr.top+er.height/2-6)+'px'; });
  after(1050, ()=>{ g.classList.add('tap'); el.classList.add('spot'); beep('click'); });
  after(2100, ()=>{ try{g.remove();}catch(e){} el.classList.remove('spot'); });
}

/* ----- carte d'ordre : affichée dans la barre noire (HUD), avec le timer et
   les boucliers — plus AU-DESSUS des boutons de la messagerie (évite qu'elle

function showOrder(html){

function hideOrder(){ ARC.orderHtml=''; arcHudRender(); }

/* ----- HUD, consigne dynamique ----- */
function fmtTime(sec){ sec=Math.max(0,Math.ceil(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function arcHudRender(){
  const h=document.getElementById('arcHud'); if(!h) return;
  if(!ARC.on){ h.hidden=true; return; }
  h.hidden=false;
  let sh='';
  for(let i=0;i<ARC.maxShields;i++) sh+=(i<ARC.shields?'🛡️':'<span class="off">🛡️</span>');
  h.innerHTML='<span class="ah-score">SCORE '+ARC.score+'</span>'
    +'<span class="ah-combo'+(ARC.combo>=3?' hot':'')+'">'+(ARC.combo>=2?'🔥 x'+ARC.combo:'')+'</span>'
    +'<span class="ah-shields">'+sh+'</span>'
    +(ARC.timer?'<span class="ah-timer'+(ARC.left<=10?' low':'')+'">⏱ '+fmtTime(ARC.left)+'</span>':'')
    +(ARC.orderHtml?'<div class="ah-order" id="ahOrder">'+ARC.orderHtml+'</div>':'');
}
function arcGoal(txt){ const el=document.getElementById('arcGoalTxt'); if(el) el.innerHTML=txt; }

/* ----- cycle de manche ----- */
function arcStart(cfg){
  cfg=cfg||{};
  ARC.on=true; ARC.over=false; ARC.score=0; ARC.combo=0; ARC.misses=0;
  ARC.onEvt=null; ARC.saveCfg=null;
  clearTimeout(ARC.comboT);
  ARC.shields=(cfg.shields!=null)?cfg.shields:3; ARC.maxShields=ARC.shields;
  ARC.timer=cfg.timer||null; ARC.left=ARC.timer||0; ARC.bonus=cfg.bonus||null;
  ARC.goalTxt=cfg.goalText||''; ARC.orderHtml='';
  if(ARC.timer){ ARC.t0=Date.now(); every(250, arcTick); }
  arcHudRender();
  if(ARC.goalTxt) arcGoal('🎯 '+ARC.goalTxt);
}
function arcTick(){
  if(!ARC.on||ARC.over||!ARC.timer) return;
  ARC.left=Math.max(0, ARC.timer-(Date.now()-ARC.t0)/1000);
  arcHudRender();
  if(ARC.left<=0) arcFail('⏱ Temps écoulé !');
}
function arcHit(pts, el){
  if(!ARC.on||ARC.over) return;
  ARC.combo++;
  clearTimeout(ARC.comboT);
  ARC.comboT=setTimeout(()=>{ ARC.combo=0; arcHudRender(); },4000);
  const gain=(pts||10)*Math.max(1,ARC.combo);
  ARC.score+=gain;
  arcJingle(ARC.combo);
  flyPts('+'+gain, el||null);
  if(el) arcBurst(el);
  arcHudRender();
}
function arcMiss(msg){
  if(!ARC.on||ARC.over) return;
  ARC.combo=0; ARC.misses++; ARC.shields=Math.max(0,ARC.shields-1);
  beep('bad'); screenShake(); redFlash();
  arcHudRender();
  if(ARC.shields<=0){ arcFail('💥 Raté ! On recommence…'); }
  else banner('❌ '+(msg||'Raté !'),'bad');
}
function arcFail(msg){
  if(ARC.over) return;
  ARC.over=true;
  beep('alarm'); screenShake(); redFlash();
  banner(msg,'bad');
  after(1600, arcRestart);
}
function arcRestart(){
  clearTimers(); clearTimeout(ARC.comboT); clearSpots();
  ARC.on=false; ARC.over=false;
  buildScreen();
  seedMail(currentStep.seed||{});
  renderAll();
  arcLaunch();
}
function arcLaunch(){
  countdown(function(){
    if(currentStep && currentStep.run) currentStep.run(function(){ arcWin(); });
  });
}
function arcWin(){
  if(!ARC.on||ARC.over) return;
  ARC.on=false; ARC.over=true;
  clearTimers(); clearTimeout(ARC.comboT);
  _missionDone=true;
  hideOrder(); arcHudRender();
  let stars=(ARC.misses===0)?3:(ARC.misses<=2?2:1);
  if(ARC.timer && ARC.bonus && ARC.left>=ARC.bonus) stars=Math.min(3,stars+1);
  saveStars(starKey(), stars);
  beep('win'); confetti();
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">🏅</span>'
    +'<h2>'+(currentStep.exam?'Examen réussi !':'Mission accomplie !')+'</h2>'
    +starLineHtml(stars)
    +'<p class="arc-score-line">SCORE <b>'+ARC.score+'</b>'+(ARC.misses?' · '+ARC.misses+' erreur'+(ARC.misses>1?'s':''):' · sans faute !')+'</p>'
    +(stars<3?'<p style="font-size:.9rem;color:var(--muted)">'+(ARC.misses?'Zéro erreur = ⭐⭐⭐ !':'Encore plus rapide = ⭐⭐⭐ !')+'</p>':'')
    +'<div class="m-actions"><button class="m-btn primary green" id="arcNext">Continuer →</button></div>';
  openOverlay();
  popStars(stars);
  document.getElementById('arcNext').onclick=()=>{ closeOverlay(); arcAdvance(); };
}
function arcAdvance(){
  if(reviewing()){ startStep(progressIdx); return; }
  if(playIdx===STEPS.length-1){ progressIdx=STEPS.length; saveProgress(); levelComplete(); return; }
  progressIdx=Math.max(progressIdx, playIdx+1); saveProgress();
  startStep(playIdx+1);
}

/* ---------------------------------------------------------
   11. AIDES DE MINI-JEUX
   --------------------------------------------------------- */
/* page de jeu posée PAR-DESSUS la messagerie */
function arcPage(html){
  const s=scr(); if(!s) return null;
  const d=document.createElement('div'); d.className='arcpage'; d.innerHTML=html;
  s.appendChild(d); return d;
}
/* série d'ordres à exécuter DANS la vraie messagerie */
function serieRun(cfg, done){
  arcStart({shields:cfg.shields!=null?cfg.shields:3, timer:cfg.timer, bonus:cfg.bonus, goalText:cfg.goal});
  let i=-1, checking=false;
  function next(){
    i++;
    if(i>=cfg.steps.length){ hideOrder(); done(); return; }
    const st=cfg.steps[i];
    ARC.saveCfg=st.saveCfg||null;
    if(st.prep) st.prep();
    showOrder('<span class="oc-n">'+(i+1)+'/'+cfg.steps.length+'</span><span class="oc-ic">'+(st.ic||'📨')+'</span>'
      +'<span class="oc-txt">'+st.ord+(st.sub?'<span class="oc-sub">'+st.sub+'</span>':'')+'</span>');
    beep('open');
    /* certains ordres sont peut-être déjà remplis (cascade) */
    after(120, check);
  }
  function check(){
    if(ARC.over||checking||i<0||i>=cfg.steps.length) return;
    const st=cfg.steps[i];
    if(st.test(buildCtx())){
      checking=true;
      arcHit(st.pts||15);
      /* st.hold : petite pause pour laisser VOIR le résultat (ex. le mail parti)
         avant de valider et de passer à l'ordre suivant */
      const wait=st.hold||160;
      if(st.hold) banner('✅ Bien joué !','good');
      after(wait,()=>{ checking=false; next(); });
    }
  }
  ARC.onEvt=check;
  next();
}
/* quiz arcade : questions à 2 ou 3 choix */
function quizRun(cfg, done){
  arcStart({shields:cfg.shields!=null?cfg.shields:3, timer:cfg.timer, bonus:cfg.bonus, goalText:cfg.goal});
  let i=0;
  function show(){
    if(i>=cfg.questions.length){ done(); return; }
    const q=cfg.questions[i];
    const old=scr().querySelector('.arcpage'); if(old) old.remove();
    const p=arcPage('<p class="ap-k">'+cfg.kicker+' · question '+(i+1)+' / '+cfg.questions.length+'</p>'
      +(q.card||'')
      +'<h3 class="ap-q">'+q.q+'</h3>'
      +'<div class="ap-btns">'+q.opts.map((o,k)=>'<button class="ap-btn '+(o.cls||(k===0?'yes':'no'))+'" data-k="'+k+'">'+o.t+'</button>').join('')+'</div>');
    p.querySelectorAll('.ap-btn').forEach(b=>b.onclick=()=>{
      const o=q.opts[+b.getAttribute('data-k')];
      if(o.ok){ arcHit(15,b); banner(q.why?'✅ '+q.why:'✅ Exact !','good'); i++; after(900,show); }
      else { arcMiss(q.why||'Regarde bien la carte du mail !'); }
    });
  }
  show();
}

          +'<div class="ap-cards" style="width:300px;max-width:300px;flex:none;gap:6px" id="pAddrs">'

/* ---------------------------------------------------------
   13. N9 M1 — L'ÉCOLE DU SOUPÇON (indices à cliquer)
   --------------------------------------------------------- */
function soupconRun(done){
  arcStart({shields:3, goalText:'Trouve les 3 indices louches de chaque mail !'});
  const MAILS=[
    { from:'loterie@grand-gagnant.biz', name:'Loterie Nationale ???', sub:'🎉 FÉLICITATIONS, tu as GAGNÉ !!!',
      html:'<p>Cher ami,</p><p>Tu as gagné <span class="det-z" data-bad="Un cadeau énorme tombé du ciel : personne ne gagne à une loterie sans avoir joué !">1 000 000 € à notre grande loterie</span> !</p>'
        +'<p><span class="det-z" data-bad="L\'urgence, c\'est LE truc des arnaqueurs : ils veulent t\'empêcher de réfléchir.">Réponds dans les 10 MINUTES ou tout est perdu</span> !!!</p>'
        +'<p>Envoie-nous juste <span class="det-z" data-bad="On ne donne JAMAIS son adresse et sa date de naissance à un inconnu.">ton adresse et ta date de naissance</span>.</p>'
        +'<p>Le comité <span class="det-z" data-ok>des grands gagnants</span>.</p>' },
    { from:'suivi@la-p0ste-colis.net', name:'La Poste ???', sub:'⚠️ Votre colis est bloqué',
      html:'<p>Bonjour,</p><p>Votre colis n° 88121 est bloqué à l\'entrepôt.</p>'
        +'<p>Regarde bien l\'expéditeur : <span class="det-z" data-bad="la-p0ste avec un ZÉRO à la place du o, et en .net : c\'est un sosie de la vraie Poste !">suivi@la-p0ste-colis.net</span></p>'
        +'<p>Pour le débloquer, <span class="det-z" data-bad="Un vrai transporteur ne demande jamais de payer par mail pour « débloquer » un colis.">payez 1,99 € en cliquant ici</span>.</p>'
        +'<p><span class="det-z" data-bad="Menacer de tout jeter en 24h : encore l\'urgence pour te faire paniquer.">Sinon il sera détruit sous 24 h</span>.</p>'
        +'<p><span class="det-z" data-ok>Le service colis</span>.</p>' },
    { from:'securite@cuicui-verification.net', name:'Sécurité Cui-Cui ???', sub:'Ton compte va être supprimé !',
      html:'<p>Cher utilisateur,</p>'
        +'<p><span class="det-z" data-bad="Encore la peur et l\'urgence : « ce soir », « supprimé »… un vrai service ne parle pas comme ça.">Ton compte Cui-Cui sera SUPPRIMÉ ce soir</span> !</p>'
        +'<p>Pour le sauver, réponds-nous avec <span class="det-z" data-bad="JAMAIS, au grand jamais : personne de sérieux ne demande ton mot de passe par mail. Personne.">ton mot de passe</span>.</p>'
        +'<p>Note l\'adresse : <span class="det-z" data-bad="cuicui-verification.net n\'est PAS cuicui.fr : c\'est un déguisement !">securite@cuicui-verification.net</span></p>'
        +'<p><span class="det-z" data-ok>L\'équipe sécurité</span>.</p>' }
  ];
  let mi=0;
  function show(){
    if(mi>=MAILS.length){ done(); return; }
    const m=MAILS[mi];
    const old=scr().querySelector('.arcpage'); if(old) old.remove();
    const p=arcPage('<p class="ap-k">🧐 L\'collège du soupçon · mail '+(mi+1)+' / '+MAILS.length+' · <b id="scFound">0</b>/3 indices</p>'
      +'<div class="det-mail"><div class="dm-h">De : <b>'+m.name+'</b> &lt;'+m.from+'&gt;<br>Objet : <b>'+esc(m.sub)+'</b></div>'+m.html+'</div>'
      +'<p style="font-weight:800;color:var(--muted);font-size:.84rem;margin-top:12px">Clique les 3 passages louches !</p>');
    let found=0;
    p.querySelectorAll('.det-z').forEach(z=>{
      z.onclick=()=>{
        if(z.classList.contains('found')) return;
        if(z.hasAttribute('data-bad')){
          z.classList.add('found');
          z.insertAdjacentHTML('beforeend','<span class="det-tag">INDICE !</span>');
          arcHit(15,z); found++;
          const f=document.getElementById('scFound'); if(f) f.textContent=found;
          toast('🧐 '+z.getAttribute('data-bad'));
          if(found>=3){ banner('🕵️ Mail démasqué !','good'); mi++; after(1400,show); }
        } else {
          arcMiss('Ce passage-là est normal… cherche l\'adresse, l\'urgence, les demandes bizarres !');
        }
      };
    });
  }
  show();
}

/* construit la file d'une manche : moitié pièges, avec les mails
   « spéciaux » réservés aux outils achetés */
function phBuildQueue(){
  const pool=phPool();
  const owned=id=>PH.tools[id];
  const ok=pool.filter(m=>!m.req && !m.phish);
  const ko=pool.filter(m=>!m.req && m.phish);
  const gatedOk=pool.filter(m=>m.req && owned(m.req) && !m.phish);
  const gatedKo=pool.filter(m=>m.req && owned(m.req) && m.phish);
  const n=PH_WAVES[PH.wave].n;
  const nKo=Math.ceil(n/2), nOk=n-nKo;
  function pick(arr, count){
    const a=arr.slice().sort(()=>Math.random()-.5);
    const out=[]; let i=0;
    while(out.length<count && a.length){ out.push(a[i%a.length]); i++; if(i>=a.length) break; }
    while(out.length<count) out.push(a[Math.floor(Math.random()*a.length)]);
    return out;
  }
  /* priorité aux mails spéciaux fraîchement débloqués */
  const kos=pick(gatedKo, Math.min(gatedKo.length, Math.max(0,nKo-2))).concat(pick(ko, 99)).slice(0,nKo);
  const oks=pick(gatedOk, Math.min(gatedOk.length, Math.max(0,nOk-2))).concat(pick(ok, 99)).slice(0,nOk);
  PH.queue=kos.concat(oks).sort(()=>Math.random()-.5);
  PH.hp=PH.queue.length; PH.hpMax=PH.queue.length;
  PH.waveMistakes=0;
}

    +(tools?'<ul class="newtools">'+tools+'</ul>':'')
    +'<div class="m-actions"><button class="m-btn primary green" id="lvlGo">C\'est parti ! 🚀</button></div>';
  modal.dataset.ttsText = lvl.title + '. ' + (it.lead||'') + (it.teach ? ' ' + it.teach : '');
  openOverlay();
  document.getElementById('lvlGo').onclick=()=>{ closeOverlay(); audioCtx(); cont&&cont(); };
}
function openRoundPopup(){
  const s=currentStep, exam=!!s.exam;
  const boss=s.mode==='boss';
  const game=s.kind==='game';
  modal.className='modal'+(exam?' test-modal':'');
  modal.innerHTML='<span class="m-emoji">'+s.emoji+'</span>'
    +'<div class="kicker"'+(boss?' style="color:var(--red-d)"':'')+'>'+(reviewing()?'Entraînement':(boss?'⚔️ Boss final':s.label))+'</div><h2>'+s.title+'</h2>'
    +'<div class="howto'+(boss?' boss':(exam?' test':''))+'"><p class="h-head">'+(boss?'⚔️ Le combat :':(exam?'🏆 L\'examen :':'👉 Ta mission :'))+'</p>'
    +(s.intro?'<p>'+s.intro+'</p>':'')
    +'</div>'
    +'<div class="m-actions"><button class="m-btn primary'+(boss?' boss':(exam?' test':' green'))+'" id="goBtn">'
    +(boss?'À l\'attaque ! ⚔️':(game?(s._launched?'Reprendre 🎮':'GO ! 🎮'):'C\'est parti ! 🚀'))+'</button></div>';
  modal.dataset.ttsText = s.title + '. ' + (s.intro||'');
  openOverlay();
  document.getElementById('goBtn').onclick=()=>{
    closeOverlay(); audioCtx();
    if(currentStep && currentStep.kind==='game'){
      if(!currentStep._launched){ currentStep._launched=true; arcLaunch(); }
      return;
    }
    if(currentStep && currentStep.boot && !currentStep._booted){ currentStep._booted=true; currentStep.boot(); }
  };
}
function onMissionWin(){
  beep('win');
  clearSpots();
  if(reviewing()){
    modal.className='modal good';
    modal.innerHTML='<span class="m-emoji">💪</span><h2>Bien joué !</h2>'
      +'<p>Tu as refait cette mission. On revient à <b>ta mission en cours</b>, ta progression est gardée.</p>'
      +'<div class="m-actions"><button class="m-btn primary green" id="bk">Revenir à ma mission</button></div>';
    modal.dataset.ttsText = (window.TTS_STATIC||{}).win_review || '';
    openOverlay(); document.getElementById('bk').onclick=()=>{ closeOverlay(); startStep(progressIdx); };
    return;
  }
  const guidedStars=Math.max(1, 3-Math.min(2, currentStep._hints||0));
  if(currentStep.kind!=='game') saveStars(starKey(), guidedStars);
  const last=playIdx===STEPS.length-1;
  if(last){ progressIdx=STEPS.length; saveProgress(); return levelComplete(); }
  progressIdx=Math.max(progressIdx, playIdx+1); saveProgress();
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">✅</span>'
    +'<h2>Mission réussie !</h2>'
    +starLineHtml(guidedStars)
    +'<p>'+(guidedStars<3?'Sans l\'astuce 💡, c\'est ⭐⭐⭐ !':'Nickel, facteur. Mission suivante !')+'</p>'
    +'<div class="m-actions"><button class="m-btn primary green" id="next">Continuer →</button></div>';
  modal.dataset.ttsText = (window.TTS_STATIC||{}).win_mission || '';
  openOverlay();
  popStars(guidedStars);
  document.getElementById('next').onclick=()=>{ closeOverlay(); startStep(playIdx+1); };
}
function levelComplete(){
  if(currentLevel>=LEVELS.length) return courseFinish();
  const nextN=currentLevel+1;
  store.set('ml_unlocked', String(Math.max(getUnlocked(), nextN)));
  store.set('ml_step_l'+nextN, '0');
  refreshLevelBtn(); confetti();
  const lvl=LEVELS[nextN-1];
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">🎉</span>'
    +'<div class="kicker" style="color:var(--green-d)">Niveau '+nextN+' débloqué</div>'
    +'<h2>Bravo, tu passes au Niveau '+nextN+' !</h2>'
    +'<p>Tu as terminé le <b>Niveau '+currentLevel+'</b>. Prochaine étape : <b>'+lvl.title+'</b> !</p>'
    +'<div class="m-actions">'
    +'<a class="m-btn ghost" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">🏠 Accueil</a>'
    +'<button class="m-btn primary green" id="goNextLvl">Aller au Niveau '+nextN+' →</button></div>';
  modal.dataset.ttsText = (window.TTS_STATIC||{}).unlocked || '';
  openOverlay();
  document.getElementById('goNextLvl').onclick=()=>{ closeOverlay(); loadLevel(nextN,0,true); };
}
function courseFinish(){
  confetti(); confetti();
  const m=getStarsMap();
  let tot=0, max=0;
  LEVELS.forEach(lv=>{ lv.rounds.forEach((r,i)=>{ max+=3; tot+=(m[lv.n+'.'+(i+1)]||0); }); });
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">🐦🏅</span>'
    +'<div class="kicker" style="color:var(--green-d)">Messagerie Cui-Cui · tournée terminée</div>'
    +'<h2>Facteur d\'or !</h2>'
    +'<p><b>9 niveaux</b>, et <b>LE PHISHER</b> à la corbeille. Écrire, ranger, retrouver, déjouer les pièges : plus aucun mail n\'a de secret pour toi. 🫡</p>'
    +'<p class="arc-score-line" style="font-size:1.3rem">⭐ <b>'+tot+' / '+max+'</b> étoiles récoltées</p>'
    +(tot<max
      ?'<p style="font-size:.9rem;color:var(--muted)">Rejoue tes missions préférées (🗺️ Niveaux) pour tout dorer !</p>'
      :'<p style="font-size:.9rem;color:var(--muted)">Récolte PARFAITE. Chapeau bas, inspecteur. 🎩</p>')
    +'<div class="m-actions"><a class="m-btn primary green" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">🏠 Accueil</a></div>';
  modal.dataset.ttsText = (window.TTS_STATIC||{}).course_finish || '';
  openOverlay();
}

/* sélecteur de niveaux */
function openLevelSelector(){
  const unlocked=getUnlocked();
  modal.className='modal';
  const cards=LEVELS.map(lv=>{
    const locked=lv.n>unlocked, cur=lv.n===currentLevel;
    const badge=locked?'🔒':(lv.n<currentLevel?'✓':'▶');
    const st=locked?0:levelStars(lv.n), stMax=lv.rounds.length*3;
    return '<button class="lvl-card'+(locked?' locked':'')+(cur?' current':'')+'" data-n="'+lv.n+'" '+(locked?'disabled':'')+'>'
      +'<span class="lc-badge">'+badge+'</span><span class="lc-n">Niveau '+lv.n+'</span><span class="lc-t">'+lv.title+'</span>'
      +(locked?'':'<span class="lc-stars">⭐ '+st+' / '+stMax+'</span>')+'</button>';
  }).join('');
  modal.innerHTML='<span class="m-emoji">🗺️</span><h2>Choisis ton niveau</h2>'
    +'<p>Reviens sur un niveau déjà débloqué quand tu veux : ta progression est <b>gardée</b>.</p>'
    +'<div class="lvl-grid">'+cards+'</div>'
    +'<div class="m-actions"><button class="m-btn ghost" id="lsClose">Fermer</button></div>';
  openOverlay();
  modal.querySelectorAll('.lvl-card:not(.locked)').forEach(b=>b.onclick=()=>{ closeOverlay(); loadLevel(+b.getAttribute('data-n'), undefined, true); });
  document.getElementById('lsClose').onclick=()=>closeOverlay();
}

function loadLevel(n, stepIdx, showIntro){
  currentLevel=n;
  store.set('ml_curlevel', String(n));
  STEPS=LEVELS[n-1].rounds;
  const saved=(stepIdx!=null)?stepIdx:getSavedStep(n);
  progressIdx=Math.max(0, Math.min(saved, STEPS.length-1));
  document.getElementById('lvlTitle').innerHTML='La messagerie <span class="dot">·</span> '+LEVELS[n-1].subtitle;
  refreshLevelBtn();
  if(showIntro) openLevelIntro(n, ()=>startStep(progressIdx));
  else startStep(progressIdx);
}

/* ---------------------------------------------------------
   16. OVERLAY, TOAST, CONFETTI
   --------------------------------------------------------- */
function openOverlay(){
  overlay.classList.add('open');
  if(window.ttsDecorateModal) ttsDecorateModal(modal);
}
function closeOverlay(){
  overlay.classList.remove('open');
  if(window.ttsStopCurrent) ttsStopCurrent();
}
let _toastT=null;
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),6000); }
function confetti(){
  const c=document.createElement('div'); c.className='confetti';
  const colors=['#0e7490','#f59e0b','#16a34a','#ef4444','#7c3aed','#06b6d4'];
  for(let i=0;i<80;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(2.2+Math.random()*1.6)+'s';
    p.style.animationDelay=(Math.random()*.5)+'s';
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(()=>{ c.remove(); }, 4800);
}

/* ---------------------------------------------------------
   17. ASTUCES (surbrillance des bons éléments)
   --------------------------------------------------------- */
let _spots=[], _spotT=null;
function spotEl(el){ if(el){ el.classList.add('spot'); _spots.push(el); } }
function clearSpots(){ clearTimeout(_spotT); _spots.forEach(el=>el.classList.remove('spot')); _spots=[]; }
function highlightForStep(){
  clearSpots();
  const o=activeObj(); if(!o || !o.goal) return;
  const q=s=>document.querySelector(s);
  /* priorité au sélecteur précis du bon bouton (goal.sel) ; le "spot" large ne sert plus que de repli */
  let el=null;
  if(o.goal.sel){
    try{ el = typeof o.goal.sel==='function' ? o.goal.sel() : q(o.goal.sel); }catch(e){ el=null; }
  }
  if(!el){
    const spot=o.goal.spot;
    if(spot==='list')          el=q('#mailList');
    else if(spot==='folders')  el=q('#ccFolders');
    else if(spot==='addfolder')el=q('#btnAddFolder');
    else if(spot==='reader')   el=q('#rdActions')||q('#reader');
    else if(spot==='search')   el=q('#ccSearchBox');
    else if(spot==='filter')   el=q('#btnFilter');
    else if(spot==='sort')     el=q('#btnSort');
    else if(spot==='settings') el=q('#btnSettings');
    else if(spot==='quiz')     el=q('#quizDock');
    else if(spot==='toolbar')  el=q('#cmpTools')||q('#btnNew');
    else if(spot==='compose')  el=q('#cmpWin')||q('#btnNew');
    else if(spot==='contacts') el=q('#ccNav [data-view="contacts"]');
    else if(spot==='agenda')   el=M.view==='agenda'?q('.cc-agenda'):q('#ccNav [data-view="agenda"]');
  }
  spotEl(el);
  if(_spots.length) _spotT=setTimeout(clearSpots, 6000);
}
function onHint(){
  if(overlay.classList.contains('open')) return;
  const s=currentStep; if(!s) return;
  s._hints=(s._hints||0)+1;
  const game=s.kind==='game';
  const ao=activeObj();
  const hintTxt=game
    ? (s.hint||'Suis la consigne affichée sur l\'écran !')
    : ((ao && ao.goal && ao.goal.hint) ? ao.goal.hint : stripTags((ao&&ao.t)||''));
  const hintTitle=s.title||'Astuce';
  modal.className='modal test-modal';
  modal.innerHTML='<span class="m-emoji">💡</span><div class="kicker" style="color:var(--amber-d)">Astuce</div>'
    +'<h2>'+hintTitle+'</h2>'
    +'<div class="howto test"><p class="h-head">👉 Comment faire :</p><p>'+hintTxt+'</p></div>'
    +(game?'':'<p style="font-size:.95rem;color:var(--muted)">Les éléments importants vont <b>briller en jaune</b> ✨ sur l\'écran.</p>')
    +'<div class="m-actions"><button class="m-btn primary test" id="hintGo">'+(game?'Compris !':'Montre-moi ✨')+'</button></div>';
  modal.dataset.ttsText = hintTitle + '. ' + hintTxt;
  openOverlay();
  document.getElementById('hintGo').onclick=()=>{ closeOverlay(); if(!game) highlightForStep(); };
}

/* boutons de la page */
document.getElementById('hintBtn').onclick=onHint;
document.getElementById('restartBtn').onclick=()=>startStep(playIdx);
document.getElementById('seeMission').onclick=()=>openRoundPopup();
document.getElementById('stepCount').onclick=()=>openLevelSelector();

/* ---------------------------------------------------------
   18. INIT
   --------------------------------------------------------- */
(function init(){
  refreshSoundBtn();
  const go=/[?&]go=(\d+)(?:[.\-_](\d+))?/.exec(location.search);
  if(go){
    const L=Math.max(1,Math.min(LEVELS.length, parseInt(go[1],10)));
    store.set('ml_unlocked', String(Math.max(getUnlocked(), L)));
    store.set('ml_curlevel', String(L));
    if(go[2]!=null) store.set('ml_step_l'+L, String(Math.max(0, parseInt(go[2],10))));
  }
  let lvl=parseInt(store.get('ml_curlevel')||'1',10);
  if(isNaN(lvl)||lvl<1||lvl>LEVELS.length) lvl=1;
  lvl=Math.min(lvl, getUnlocked());
  loadLevel(lvl, getSavedStep(lvl), !go);
})();

/* ---------------------------------------------------------
   19. ACCÈS DÉVELOPPEUR
   --------------------------------------------------------- */
(function devkit(){
  const UNLOCK='ml_unlocked', CUR='ml_curlevel', STEP='ml_step_l', HOME='la-messagerie.html';
  const css=`
  #devkit{position:fixed;right:14px;bottom:14px;z-index:300;font-family:"Nunito",system-ui,"Fluent Emoji",sans-serif;}
  #devkit .dk-toggle{display:inline-flex;align-items:center;gap:6px;background:#1e2733;color:#e7eef6;border:none;
    border-radius:999px;padding:9px 14px;font-weight:800;font-size:.85rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28);}
  #devkit .dk-toggle:hover{background:#2a3645;}
  #devkit .dk-panel{display:none;position:absolute;right:0;bottom:48px;width:320px;max-height:72vh;overflow:auto;
    background:#1e2733;color:#e7eef6;border-radius:14px;padding:12px 12px 14px;box-shadow:0 16px 40px rgba(0,0,0,.42);}
  #devkit.open .dk-panel{display:block;}
  #devkit .dk-head{font-weight:800;font-size:.95rem;margin:0 0 2px;}
  #devkit .dk-note{color:#9fb0c4;font-size:.72rem;margin:0 0 6px;line-height:1.35;}
  #devkit .dk-lv{font-weight:800;color:#9fc3ff;margin:11px 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;}
  #devkit .dk-step{display:block;width:100%;text-align:left;background:#2b3949;color:#e7eef6;border:1px solid #3a4a5c;
    border-radius:8px;padding:6px 9px;margin:3px 0;cursor:pointer;font-size:.78rem;line-height:1.3;}
  #devkit .dk-step:hover{background:#37485c;border-color:#5a7088;}
  #devkit .dk-step.exam{border-color:#f6b73c;}
  #devkit .dk-step b{color:#ffd479;}
  #devkit .dk-actions{display:flex;gap:6px;margin-top:12px;}
  #devkit .dk-act{flex:1;background:#33455a;color:#e7eef6;border:1px solid #44586e;border-radius:8px;padding:7px;
    font-weight:700;font-size:.74rem;cursor:pointer;}
  #devkit .dk-act:hover{background:#3d5167;}`;
  const style=document.createElement('style'); style.textContent=css; document.head.appendChild(style);
  const root=document.createElement('div'); root.id='devkit';
  let html='<button class="dk-toggle" id="dkToggle">🛠️ Dev</button>'
    +'<div class="dk-panel"><p class="dk-head">🛠️ Accès développeur</p>'
    +'<p class="dk-note">Saute à une mission : tout ce qui précède est considéré comme réussi.</p>';
  LEVELS.forEach(lv=>{
    html+='<div class="dk-lv">Niveau '+lv.n+' — '+lv.title+'</div>';
    lv.rounds.forEach((d,i)=>{
      html+='<button class="dk-step'+(d.exam?' exam':'')+'" data-l="'+lv.n+'" data-s="'+i+'"><b>'+(d.label||('Mission '+(i+1)))+'</b> · '+(d.title||'')+'</button>';
    });
  });
  html+='<div class="dk-actions"><button class="dk-act" id="dkUnlockAll">🔓 Tout débloquer</button>'
    +'<button class="dk-act" id="dkReset">🧹 Reset complet</button></div></div>';
  root.innerHTML=html; document.body.appendChild(root);
  function devJump(L,S){
    L=Math.max(1,Math.min(LEVELS.length,L));
    const maxS=LEVELS[L-1].rounds.length-1; S=Math.max(0,Math.min(maxS,S||0));
    store.set(UNLOCK, String(Math.max(getUnlocked(),L))); store.set(CUR, String(L)); store.set(STEP+L, String(S));
    closeOverlay(); loadLevel(L,S,false);
  }
  document.getElementById('dkToggle').onclick=()=>root.classList.toggle('open');
  root.querySelectorAll('.dk-step').forEach(b=>b.onclick=()=>{ root.classList.remove('open'); devJump(+b.getAttribute('data-l'), +b.getAttribute('data-s')); });
  document.getElementById('dkUnlockAll').onclick=()=>{ store.set(UNLOCK, String(LEVELS.length)); refreshLevelBtn(); };
  document.getElementById('dkReset').onclick=()=>{ const keys=[UNLOCK,CUR,'ml_stars']; for(let i=1;i<=LEVELS.length;i++) keys.push(STEP+i); keys.forEach(k=>store.del(k)); location.href=HOME; };
})();
</script>
<script>
/* Bouton bascule OpenDyslexic — préférence partagée entre toutes les pages */
(function(){
  var KEY='a11y_dys', root=document.documentElement;
  var btn=document.createElement('button');
  btn.type='button'; btn.className='dys-toggle';
  btn.innerHTML='<span class="dys-ic" aria-hidden="true">🔤</span><span class="dys-label">Mode Dys</span><span class="dys-switch"><span class="dys-knob"></span></span>';
  function apply(on){ root.classList.toggle('dys',on); btn.setAttribute('aria-pressed',on?'true':'false');
    btn.title=on?'Mode Dyslexique activé — clique pour revenir à la police normale':'Activer le Mode Dyslexique (police OpenDyslexic)'; }
  btn.addEventListener('click',function(){ var want=!root.classList.contains('dys'); try{localStorage.setItem(KEY,want?'1':'0');}catch(e){} apply(want); });
  document.body.appendChild(btn);
  var on=false; try{on=localStorage.getItem(KEY)==='1';}catch(e){} apply(on);
})();
</script>
