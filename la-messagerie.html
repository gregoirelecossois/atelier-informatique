function sentMatches(r, m){
  if(m.to && !m.to.every(a=>r.to.includes(a))) return false;
  if(m.toOnly && (r.to.length!==m.toOnly.length || !m.toOnly.every(a=>r.to.includes(a)))) return false;
  if(m.cc && !m.cc.every(a=>r.cc.includes(a))) return false;
  if(m.ccEmpty && r.cc.length) return false;
  if(m.bcc && !m.bcc.every(a=>r.bcc.includes(a))) return false;
  if(m.bccN!=null && r.bcc.length<m.bccN) return false;
  if(m.bccEmpty && r.bcc.length) return false;
  if(m.list && !r.lists.some(l=>normText(l)===normText(m.list))) return false;
  if(m.subjIncl && !normText(r.subject).includes(normText(m.subjIncl))) return false;
  if(m.bodyIncl && !m.bodyIncl.some(w=>r.body.includes(normText(w)))) return false;
  if(m.att && !r.atts.some(a=>a.includes(m.att.toLowerCase()))) return false;
  if(m.atts && !m.atts.every(x=>r.atts.some(a=>a.includes(x.toLowerCase())))) return false;
  if(m.attN!=null && r.atts.length<m.attN) return false;
  if(m.attExact!=null && r.atts.length!==m.attExact) return false;
  if(m.img && !r.img) return false;
  if(m.sig && !r.sig) return false;
  if(m.reply && !r.replyOf) return false;
  if(m.fmt){ for(const k of m.fmt){ if(!r.fmt[k]) return false; } }
  return true;
}
function eventMatches(e, m){
  if(m.type && e.type!==m.type) return false;
  if(m.d!=null && e.d!==m.d) return false;
  if(m.m!=null && e.m!==m.m) return false;
  if(m.titleIncl && !m.titleIncl.some(w=>normText(e.title).includes(normText(w)))) return false;
  if(m.yearly && !e.yearly) return false;
  return true;
}
/* vrai seulement si TOUT le texte du corps du message (hors signature) est dans la police demandée */
function bodyAllInFont(fontName){
  const body=document.getElementById('cmpBody'); if(!body) return false;
  const walker=document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  let any=false, node;
  while((node=walker.nextNode())){
    if(!node.textContent.trim()) continue;
    const el=node.parentElement; if(!el || el.closest('.sig')) continue;
    any=true;
    let faceOk=false;
    for(let a=el; a && a!==body; a=a.parentElement){
      if(a.tagName==='FONT' && a.getAttribute('face')===fontName){ faceOk=true; break; }
    }
    const familyOk=getComputedStyle(el).fontFamily.toLowerCase().includes(fontName.toLowerCase());
    if(!faceOk && !familyOk) return false;
  }
  return any;
}
let _missionDone=false;
/* test d'un objectif à l'abri d'une exception (sélecteurs DOM absents, etc.) */
function goalPasses(goal, ctx){ try{ return !!goal.test(ctx); }catch(e){ return false; } }
function checkMission(){
  if(!currentStep) return false;
  if(currentStep.kind==='game') return false; /* les rounds arcade se vérifient eux-mêmes */
  if(_missionDone) return false;
  const objs=currentStep.objectives; if(!objs || !objs.length) return false;
  if(currentStep._jalonAnim) return false;
  const ctx=buildCtx();
  const i=currentStep._jalonIdx;
  if(i>=objs.length || currentStep._objDone[i]) return false;
  if(!goalPasses(objs[i].goal, ctx)) return false;
  /* --- l'ordre est obligatoire ---------------------------------------
     Un objectif rempli AVANT son affichage ne compte pas : il faut refaire
     le geste maintenant qu'il est demandé. On le repère en comparant le
     compteur d'événements à sa valeur au moment où l'objectif est apparu.
     Exception : les objectifs déjà vrais dès la graine de la mission
     (rien à faire, sinon la mission se bloquerait). */
  if(!currentStep._seedSat[i] && currentStep._armSeq!=null && (M.evt._seq||0)<=currentStep._armSeq){
    currentStep._objStale=i; /* l'astuce le rappellera */
    return false;
  }
  currentStep._objStale=-1;
  currentStep._objDone[i]=true;
  /* l'objectif suivant comptera tout ce qui vient APRÈS cet instant précis :
     l'animation de validation dure ~1 s, un geste fait pendant ne doit pas
     être perdu (les objectifs enchaînés dans une même fenêtre en dépendent) */
  currentStep._pendingArm=M.evt._seq||0;
  beep('good'); jalonAdvance();
  return true;
}

/* ---------------------------------------------------------
   9 bis. GARDE-FOU : les actions non demandées
   ---------------------------------------------------------
   Une action « notable » qui ne fait pas avancer l'objectif en cours est une
   fausse manœuvre. Deux niveaux :
   - MAJEURE : elle abîme la boîte (supprimer, classer, créer un filtre…).
     Popup rouge + on recommence la mission depuis le début.
   - MINEURE : elle ne casse rien (envoyer un mail à côté de la plaque, créer
     un dossier en trop…). Popup orange + on continue.
   Dans les examens/défis chronométrés, la même faute coûte un bouclier. */
const FAULT_MAJOR={
  trashed:'supprimer ce mail', hardDeleted:'supprimer définitivement ce mail',
  trashEmptied:'vider la corbeille', markedSpam:'classer ce mail en indésirable',
  unspammed:'sortir ce mail des indésirables', movedTo:'ranger ce mail dans ce dossier',
  restored:'restaurer ce mail', contactDeleted:'supprimer ce contact',
  listDeleted:'supprimer cette liste', ruleCreated:'créer un filtre automatique',
  signatureSet:'changer ta signature'
};
const FAULT_MINOR={
  sent:'envoyer ce mail', folderCreated:'créer ce dossier',
  contactAdded:'ajouter ce contact', listCreated:'créer cette liste',
  eventAdded:'noter ça dans l\'agenda'
};
/* actions intermédiaires légitimes pour certains objectifs en plusieurs gestes */
function goalAllows(goal, key){
  if(!goal) return false;
  const st=goal.steps; return !!(st && st.indexOf(key)>=0);
}
let _faultOpen=false;
function guardAction(key, consumed){
  if(consumed || _faultOpen) return;
  const s=currentStep; if(!s) return;
  if(s.mode==='boss') return;              /* le boss a son propre décompte */
  const major=FAULT_MAJOR[key], minor=FAULT_MINOR[key];
  if(!major && !minor) return;             /* action anodine : navigation, lecture, tri… */

  /* --- examens et défis chronométrés : ça coûte un bouclier --- */
  if(s.kind==='game'){
    if(typeof ARC!=='undefined' && ARC.on && !ARC.over) arcMiss('Ce n\'était pas l\'ordre en cours !');
    return;
  }

  /* --- missions guidées --- */
  if(_missionDone || s._jalonAnim) return;
  const o=activeObj(); if(!o) return;
  if(goalAllows(o.goal, key)) return;      /* geste intermédiaire attendu */
  s._faults=s._faults||{major:0,minor:0};
  if(major){ s._faults.major++; missionFault(true, major); }
  else     { s._faults.minor++; missionFault(false, minor); }
}
function missionFault(isMajor, what){
  _faultOpen=true;
  clearSpots(); closeMenus();
  beep('bad'); screenShake(); redFlash();
  const o=activeObj();
  const objTxt=(o && o.t) || '';
  modal.className='modal'+(isMajor?' warn':' test-modal');
  modal.innerHTML='<span class="m-emoji">'+(isMajor?'🚨':'🤔')+'</span>'
    +'<div class="kicker" style="color:var(--'+(isMajor?'red':'amber')+'-d)">'
    +(isMajor?'Ce n\'était pas ça !':'Pas tout à fait…')+'</div>'
    +'<h2>'+(isMajor?'Attention, fausse manœuvre':'Ce n\'était pas l\'objectif')+'</h2>'
    +'<p>Personne ne t\'a demandé de <b>'+what+'</b>.</p>'
    +'<div class="howto'+(isMajor?'':' test')+'"><p class="h-head">🎯 L\'objectif en cours :</p><p>'+objTxt+'</p></div>'
    +'<p style="font-size:.95rem;color:var(--muted)">Relis bien l\'objectif avant d\'agir'
    +(isMajor?' : on remet la boîte en ordre et on repart du début.':'.')+'</p>'
    +'<div class="m-actions"><button class="m-btn primary'+(isMajor?' boss':' test')+'" id="fltGo">'
    +(isMajor?'↺ Recommencer la mission':'Continuer')+'</button></div>';
  modal.dataset.ttsText=(window.TTS_STATIC||{})[isMajor?'fault_major':'fault_minor'] || '';
  openOverlay(); fitModalWidth();
  document.getElementById('fltGo').onclick=()=>{
    closeOverlay(); _faultOpen=false;
    if(isMajor) startStep(playIdx);
  };
}
function renderJalonObjective(enter){
  const sub=document.getElementById('bSub'); if(!sub) return;
  const s=currentStep, objs=s.objectives||[], i=s._jalonIdx, n=objs.length;
  if(objs[i] && objs[i].goal && objs[i].goal.prep) objs[i].goal.prep();
  /* repère « à partir d'ici » : tout ce qui a été fait avant ne validera pas cet
     objectif. On se cale sur la validation de l'objectif précédent (et non sur
     l'affichage) pour ne pas perdre les gestes faits pendant l'animation. */
  s._armSeq=(s._pendingArm!=null)?s._pendingArm:(M.evt._seq||0);
  s._pendingArm=null; s._objStale=-1;
  sub.innerHTML='<div class="jalon-head"><span class="b-goal-label">Objectif '+(Math.min(i+1,n))+' / '+n+'</span></div>'
    +'<div class="jalon-wrap"><div class="jalon-obj blue'+(enter?' entering':'')+'"><span class="jo-check">'+(i+1)+'</span><span class="jo-text">'+(objs[i]&&objs[i].t||'')+'</span></div></div>';
  if(enter) requestAnimationFrame(()=>{ const el=sub.querySelector('.jalon-obj'); if(el) el.classList.remove('entering'); });
  renderQuizDock();
}
function jalonAdvance(){
  currentStep._jalonAnim=true;
  const gen=currentStep._gen;
  const sub=document.getElementById('bSub'); const el=sub&&sub.querySelector('.jalon-obj');
  if(el){ el.classList.add('done'); const ck=el.querySelector('.jo-check'); if(ck) ck.textContent='✓'; }
  setTimeout(()=>{ if(el) el.classList.add('slideup'); }, 520);
  setTimeout(()=>{
    if(!currentStep || currentStep._gen!==gen) return; /* la mission a été relancée entre-temps */
    currentStep._jalonIdx++;
    currentStep._jalonAnim=false;
    const objs=currentStep.objectives||[];
    if(currentStep._jalonIdx>=objs.length){
      _missionDone=true; renderQuizDock();
      setTimeout(()=>{ if(!currentStep || currentStep._gen!==gen) return; onMissionWin(); }, currentStep.winDelay||0);
      return;
    }
    renderJalonObjective(true);
    /* cascade : si l'objectif révélé est déjà rempli, on enchaîne */
    setTimeout(checkMission, 260);
  }, 980);
}
function activeObj(){
  const objs=(currentStep&&currentStep.objectives)||[]; if(!objs.length) return null;
  return objs[Math.min(currentStep._jalonIdx||0, objs.length-1)];
}

/* ----- le carnet de mission (questions / réponses) ----- */
function renderQuizDock(){
  const dock=document.getElementById('quizDock'); if(!dock) return;
  const o=activeObj(); const q=o && o.quiz;
  if(!q || _missionDone){ dock.hidden=true; dock.innerHTML=''; return; }
  dock.hidden=false;
  dock.innerHTML='<span class="qd-ic">📝</span><div class="qd-q">'+q.q+'</div>'
    +'<input id="qdIn" placeholder="Écris ta réponse ici" autocomplete="off" spellcheck="false">'
    +'<button class="qd-ok" id="qdOk">Valider</button><span class="qd-fb" id="qdFb"></span>';
  const inp=dock.querySelector('#qdIn');
  function submit(){
    const v=inp.value.trim(); if(!v) return;
    const n=normText(v);
    if(q.accepted.some(a=>n===a||n.includes(a)||v===a)){
      evtFlag('quiz_'+q.key);
    } else {
      beep('bad');
      dock.classList.remove('shake'); void dock.offsetWidth; dock.classList.add('shake');
      dock.querySelector('#qdFb').textContent='Ce n\'est pas ça… la réponse est dans le mail !';
      inp.select();
    }
  }
  dock.querySelector('#qdOk').onclick=submit;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

/* ---------------------------------------------------------
   10. MOTEUR ARCADE (score, combo, boucliers, étoiles)
   --------------------------------------------------------- */
const ARC={ on:false, over:false, score:0, combo:0, comboT:null, misses:0,
  shields:3, maxShields:3, timer:null, left:0, bonus:null, t0:0, goalTxt:'', onEvt:null, orderHtml:'' };

/* ----- étoiles persistées (ml_stars, on garde le max) ----- */
function getStarsMap(){ try{ return JSON.parse(store.get('ml_stars')||'{}')||{}; }catch(e){ return {}; } }
function saveStars(key,n){ const m=getStarsMap(); if(!m[key]||n>m[key]){ m[key]=n; store.set('ml_stars', JSON.stringify(m)); } }
function starKey(){ return currentLevel+'.'+(playIdx+1); }
function levelStars(n){ const m=getStarsMap(); let t=0; LEVELS[n-1].rounds.forEach((r,i)=>{ t+=m[n+'.'+(i+1)]||0; }); return t; }
/* Trophées de perfection : un niveau est « trois étoiles » quand CHAQUE mission y a décroché ⭐⭐⭐. */
function mlLevelPerfect(n){ return levelStars(n) === LEVELS[n-1].rounds.length*3; }
function starLineHtml(stars){
  return '<div class="star-line">'+[0,1,2].map(i=>'<span class="sp" id="spStar'+i+'">'+(i<stars?'⭐':'☆')+'</span>').join('')+'</div>';
}
function popStars(stars){
  [0,1,2].forEach(i=>{ if(i<stars) setTimeout(()=>{ const s=document.getElementById('spStar'+i); if(s){ s.classList.add('on'); beep('ding'); } }, 420+i*360); });
}

/* ----- sons arcade ----- */
function arcTone(freq,dur,type,vol,delay){
  if(!soundOn) return; const a=audioCtx(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(); o.type=type||'triangle'; o.frequency.value=freq;
  o.connect(g); g.connect(a.destination); const t=a.currentTime+(delay||0);
  g.gain.setValueAtTime(vol||.11,t); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.1)); o.start(t); o.stop(t+(dur||.1));
}
function arcJingle(n){
  const f=440*Math.pow(1.09,Math.min(n||1,10));
  arcTone(f,.08,'triangle',.11); arcTone(f*1.5,.1,'triangle',.09,.06);
}

/* ----- juice : shake, flash, particules, "+N" volant ----- */
function scr(){ return document.querySelector('.screen'); }
function screenShake(){ const s=scr(); if(!s) return; s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }
function redFlash(){ const s=scr(); if(!s) return; const f=document.createElement('div'); f.className='arc-flash'; s.appendChild(f); setTimeout(()=>{ try{f.remove();}catch(e){} },340); }
function elCenterInScreen(el){
  const s=scr(); if(!s) return null;
  const sr=s.getBoundingClientRect();
  if(!el || !el.getBoundingClientRect) return {x:sr.width/2, y:sr.height/2};
  const r=el.getBoundingClientRect();
  return {x:r.left-sr.left+r.width/2, y:r.top-sr.top+r.height/2};
}
function flyPts(txt, el){
  const s=scr(); if(!s) return;
  const p=elCenterInScreen(el)||{x:s.offsetWidth/2,y:s.offsetHeight/2};
  const d=document.createElement('div'); d.className='arc-fly'; d.textContent=txt;
  d.style.left=(p.x-14)+'px'; d.style.top=(p.y-16)+'px';
  s.appendChild(d); setTimeout(()=>{ try{d.remove();}catch(e){} },980);
}
function arcBurst(el){
  const s=scr(); if(!s) return;
  const p=elCenterInScreen(el); if(!p) return;
  const burst=document.createElement('div'); burst.className='arc-burst';
  burst.style.left=p.x+'px'; burst.style.top=p.y+'px';
  const colors=['#fde047','#fff','#f59e0b','#60a5fa','#4ade80','#fde047'];
  for(let i=0;i<12;i++){
    const a=(i/12)*2*Math.PI, dist=30+Math.random()*28;
    const sp=document.createElement('div'); sp.className='arc-spark';
    sp.style.setProperty('--dx',(Math.cos(a)*dist)+'px');
    sp.style.setProperty('--dy',(Math.sin(a)*dist)+'px');
    sp.style.background=colors[i%colors.length];
    sp.style.animationDelay=(Math.random()*.06)+'s';
    burst.appendChild(sp);
  }
  s.appendChild(burst); setTimeout(()=>{ try{burst.remove();}catch(e){} },540);
}
function banner(txt, kind){
  const s=scr(); if(!s) return;
  const old=s.querySelector('.arc-banner'); if(old) old.remove();
  const b=document.createElement('div'); b.className='arc-banner'+(kind?' '+kind:'');
  b.innerHTML=txt;
  s.appendChild(b); setTimeout(()=>{ try{b.remove();}catch(e){} },1550);
}

/* ----- compte à rebours 3-2-1-GO ----- */
function countdown(cb){
  const s=scr(); if(!s){ cb&&cb(); return; }
  const old=s.querySelector('.arc-count'); if(old) old.remove();
  const ov=document.createElement('div'); ov.className='arc-count'; s.appendChild(ov);
  const seq=['3','2','1','GO !'];
  let k=0;
  (function tick(){
    if(k>=seq.length){ try{ov.remove();}catch(e){} cb&&cb(); return; }
    ov.innerHTML='<b'+(k===3?' class="go"':'')+'>'+seq[k]+'</b>';
    arcTone(k===3?900:420+k*70,.14,'square',.1);
    k++; after(k===4?520:720, tick);
  })();
}

/* ----- main fantôme de démonstration ----- */
function ghostClick(sel){
  const s=scr(); const el=document.querySelector(sel);
  if(!s||!el) return;
  const g=document.createElement('div'); g.className='ghost-hand'; g.textContent='👆';
  const sr=s.getBoundingClientRect(), er=el.getBoundingClientRect();
  g.style.left=(sr.width*.5)+'px'; g.style.top=(sr.height*.72)+'px';
  s.appendChild(g);
  requestAnimationFrame(()=>{ g.style.left=(er.left-sr.left+er.width/2-15)+'px'; g.style.top=(er.top-sr.top+er.height/2-6)+'px'; });
  after(1050, ()=>{ g.classList.add('tap'); el.classList.add('spot'); beep('click'); });
  after(2100, ()=>{ try{g.remove();}catch(e){} el.classList.remove('spot'); });
}

/* ----- carte d'ordre : affichée dans la barre noire (HUD), avec le timer et
   les boucliers — plus AU-DESSUS des boutons de la messagerie (évite qu'elle
   empiète sur « Nouveau message », « Répondre »…) ----- */
function showOrder(html){
  ARC.orderHtml=html; arcHudRender();
  const c=document.getElementById('ahOrder');
  if(c){ c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
}
function hideOrder(){ ARC.orderHtml=''; arcHudRender(); }

/* ----- HUD, consigne dynamique ----- */
function fmtTime(sec){ sec=Math.max(0,Math.ceil(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function arcHudRender(){
  const h=document.getElementById('arcHud'); if(!h) return;
  if(!ARC.on){ h.hidden=true; return; }
  h.hidden=false;
  let sh='';
  for(let i=0;i<ARC.maxShields;i++) sh+=(i<ARC.shields?'🛡️':'<span class="off">🛡️</span>');
  h.innerHTML='<span class="ah-score">SCORE '+ARC.score+'</span>'
    +'<span class="ah-combo'+(ARC.combo>=3?' hot':'')+'">'+(ARC.combo>=2?'🔥 x'+ARC.combo:'')+'</span>'
    +'<span class="ah-shields">'+sh+'</span>'
    +(ARC.timer?'<span class="ah-timer'+(ARC.left<=10?' low':'')+'">⏱ '+fmtTime(ARC.left)+'</span>':'')
    +(ARC.orderHtml?'<div class="ah-order" id="ahOrder">'+ARC.orderHtml+'</div>':'');
}
function arcGoal(txt){ const el=document.getElementById('arcGoalTxt'); if(el) el.innerHTML=txt; }

/* ----- cycle de manche ----- */
function arcStart(cfg){
  cfg=cfg||{};
  ARC.on=true; ARC.over=false; ARC.score=0; ARC.combo=0; ARC.misses=0;
  ARC.onEvt=null; ARC.saveCfg=null;
  clearTimeout(ARC.comboT);
  ARC.shields=(cfg.shields!=null)?cfg.shields:3; ARC.maxShields=ARC.shields;
  ARC.timer=cfg.timer||null; ARC.left=ARC.timer||0; ARC.bonus=cfg.bonus||null;
  ARC.goalTxt=cfg.goalText||''; ARC.orderHtml='';
  if(ARC.timer){ ARC.t0=Date.now(); every(250, arcTick); }
  arcHudRender();
  if(ARC.goalTxt) arcGoal('🎯 '+ARC.goalTxt);
}
function arcTick(){
  if(!ARC.on||ARC.over||!ARC.timer) return;
  ARC.left=Math.max(0, ARC.timer-(Date.now()-ARC.t0)/1000);
  arcHudRender();
  if(ARC.left<=0) arcFail('⏱ Temps écoulé !');
}
function arcHit(pts, el){
  if(!ARC.on||ARC.over) return;
  ARC.combo++;
  clearTimeout(ARC.comboT);
  ARC.comboT=setTimeout(()=>{ ARC.combo=0; arcHudRender(); },4000);
  const gain=(pts||10)*Math.max(1,ARC.combo);
  ARC.score+=gain;
  arcJingle(ARC.combo);
  flyPts('+'+gain, el||null);
  if(el) arcBurst(el);
  arcHudRender();
}
function arcMiss(msg){
  if(!ARC.on||ARC.over) return;
  ARC.combo=0; ARC.misses++; ARC.shields=Math.max(0,ARC.shields-1);
  beep('bad'); screenShake(); redFlash();
  arcHudRender();
  if(ARC.shields<=0){ arcFail('💥 Raté ! On recommence…'); }
  else banner('❌ '+(msg||'Raté !'),'bad');
}
function arcFail(msg){
  if(ARC.over) return;
  ARC.over=true;
  beep('alarm'); screenShake(); redFlash();
  banner(msg,'bad');
  after(1600, arcRestart);
}
function arcRestart(){
  clearTimers(); clearTimeout(ARC.comboT); clearSpots();
  ARC.on=false; ARC.over=false;
  buildScreen();
  seedMail(currentStep.seed||{});
  renderAll();
  arcLaunch();
}
function arcLaunch(){
  countdown(function(){
    if(currentStep && currentStep.run) currentStep.run(function(){ arcWin(); });
  });
}
function arcWin(){
  if(!ARC.on||ARC.over) return;
  ARC.on=false; ARC.over=true;
  clearTimers(); clearTimeout(ARC.comboT);
  _missionDone=true;
  hideOrder(); arcHudRender();
  let stars=(ARC.misses===0)?3:(ARC.misses<=2?2:1);
  if(ARC.timer && ARC.bonus && ARC.left>=ARC.bonus) stars=Math.min(3,stars+1);
  saveStars(starKey(), stars);
  beep('win'); confetti();
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">🏅</span>'
    +'<h2>'+(currentStep.exam?'Examen réussi !':'Mission accomplie !')+'</h2>'
    +starLineHtml(stars)
    +'<p class="arc-score-line">SCORE <b>'+ARC.score+'</b>'+(ARC.misses?' · '+ARC.misses+' erreur'+(ARC.misses>1?'s':''):' · sans faute !')+'</p>'
    +(stars<3?'<p style="font-size:.9rem;color:var(--muted)">'+(ARC.misses?'Zéro erreur = ⭐⭐⭐ !':'Encore plus rapide = ⭐⭐⭐ !')+'</p>':'')
    +'<div class="m-actions"><button class="m-btn primary green" id="arcNext">Continuer →</button></div>';
  openOverlay();
  popStars(stars);
  document.getElementById('arcNext').onclick=()=>{ closeOverlay(); arcAdvance(); };
}
function arcAdvance(){
  if(reviewing()){ startStep(progressIdx); return; }
  if(playIdx===STEPS.length-1){ progressIdx=STEPS.length; saveProgress(); levelComplete(); return; }
  progressIdx=Math.max(progressIdx, playIdx+1); saveProgress();
  startStep(playIdx+1);
}

/* ---------------------------------------------------------
   11. AIDES DE MINI-JEUX
   --------------------------------------------------------- */
/* page de jeu posée PAR-DESSUS la messagerie */
function arcPage(html){
  const s=scr(); if(!s) return null;
  const d=document.createElement('div'); d.className='arcpage'; d.innerHTML=html;
  s.appendChild(d); return d;
}
/* série d'ordres à exécuter DANS la vraie messagerie */
function serieRun(cfg, done){
  arcStart({shields:cfg.shields!=null?cfg.shields:3, timer:cfg.timer, bonus:cfg.bonus, goalText:cfg.goal});
  let i=-1, checking=false;
  function next(){
    i++;
    if(i>=cfg.steps.length){ hideOrder(); done(); return; }
    const st=cfg.steps[i];
    ARC.saveCfg=st.saveCfg||null;
    ARC.curStep=st;               /* pour que l'astuce sache quoi faire briller */
    if(st.prep) st.prep();
    showOrder('<span class="oc-n">'+(i+1)+'/'+cfg.steps.length+'</span><span class="oc-ic">'+(st.ic||'📨')+'</span>'
      +'<span class="oc-txt">'+st.ord+(st.sub?'<span class="oc-sub">'+st.sub+'</span>':'')+'</span>');
    beep('open');
    /* certains ordres sont peut-être déjà remplis (cascade) */
    after(120, check);
  }
  function check(){
    /* `true` = « rien à reprocher » : ordre déjà validé, pause de transition,
       ou série terminée. Évite qu'un geste légitime coûte un bouclier. */
    if(ARC.over||checking||i<0||i>=cfg.steps.length) return true;
    const st=cfg.steps[i];
    if(goalPasses(st, buildCtx())){
      checking=true;
      arcHit(st.pts||15);
      /* st.hold : petite pause pour laisser VOIR le résultat (ex. le mail parti)
         avant de valider et de passer à l'ordre suivant */
      const wait=st.hold||160;
      if(st.hold) banner('✅ Bien joué !','good');
      after(wait,()=>{ checking=false; next(); });
      return true;
    }
    return false;
  }
  ARC.onEvt=check;
  next();
}
/* quiz arcade : questions à 2 ou 3 choix */
function quizRun(cfg, done){
  arcStart({shields:cfg.shields!=null?cfg.shields:3, timer:cfg.timer, bonus:cfg.bonus, goalText:cfg.goal});
  let i=0;
  function show(){
    if(i>=cfg.questions.length){ done(); return; }
    const q=cfg.questions[i];
    const old=scr().querySelector('.arcpage'); if(old) old.remove();
    const p=arcPage('<p class="ap-k">'+cfg.kicker+' · question '+(i+1)+' / '+cfg.questions.length+'</p>'
      +(q.card||'')
      +'<h3 class="ap-q">'+q.q+'</h3>'
      +'<div class="ap-btns">'+q.opts.map((o,k)=>'<button class="ap-btn '+(o.cls||(k===0?'yes':'no'))+'" data-k="'+k+'">'+o.t+'</button>').join('')+'</div>');
    p.querySelectorAll('.ap-btn').forEach(b=>b.onclick=()=>{
      const o=q.opts[+b.getAttribute('data-k')];
      if(o.ok){ arcHit(15,b); banner(q.why?'✅ '+q.why:'✅ Exact !','good'); i++; after(900,show); }
      else { arcMiss(q.why||'Regarde bien la carte du mail !'); }
    });
  }
  show();
}

/* ---------------------------------------------------------
   12. LES NIVEAUX 1 → 4

function soupconRun(done){
  arcStart({shields:3, goalText:'Trouve les 3 indices louches de chaque mail !'});
  const MAILS=[
    { from:'loterie@grand-gagnant.biz', name:'Loterie Nationale ???', sub:'🎉 FÉLICITATIONS, tu as GAGNÉ !!!',

        +'<p>Le comité <span class="det-z" data-ok>des grands gagnants</span>.</p>' },
    { from:'suivi@la-p0ste-colis.net', name:'La Poste ???', sub:'⚠️ Votre colis est bloqué',
      html:'<p>Bonjour,</p><p>Votre colis n° 88121 est bloqué à l\'entrepôt.</p>'
        +'<p>Regarde bien l\'expéditeur : <span class="det-z" data-bad="la-p0ste avec un ZÉRO à la place du o, et en .net : c\'est un sosie de la vraie Poste !">suivi@la-p0ste-colis.net</span></p>'
        +'<p>Pour le débloquer, <span class="det-z" data-bad="Un vrai transporteur ne demande jamais de payer par mail pour « débloquer » un colis.">payez 1,99 € en cliquant ici</span>.</p>'
        +'<p><span class="det-z" data-bad="Menacer de tout jeter en 24h : encore l\'urgence pour te faire paniquer.">Sinon il sera détruit sous 24 h</span>.</p>'
        +'<p><span class="det-z" data-ok>Le service colis</span>.</p>' },
    { from:'securite@cuicui-verification.net', name:'Sécurité Cui-Cui ???', sub:'Ton compte va être supprimé !',
      html:'<p>Cher utilisateur,</p>'
        +'<p><span class="det-z" data-bad="Encore la peur et l\'urgence : « ce soir », « supprimé »… un vrai service ne parle pas comme ça.">Ton compte Cui-Cui sera SUPPRIMÉ ce soir</span> !</p>'
        +'<p>Pour le sauver, réponds-nous avec <span class="det-z" data-bad="JAMAIS, au grand jamais : personne de sérieux ne demande ton mot de passe par mail. Personne.">ton mot de passe</span>.</p>'
        +'<p>Note l\'adresse : <span class="det-z" data-bad="cuicui-verification.net n\'est PAS cuicui.fr : c\'est un déguisement !">securite@cuicui-verification.net</span></p>'
        +'<p><span class="det-z" data-ok>L\'équipe sécurité</span>.</p>' }
  ];
  let mi=0;
  function show(){
    if(mi>=MAILS.length){ done(); return; }
    const m=MAILS[mi];
    const old=scr().querySelector('.arcpage'); if(old) old.remove();
    const p=arcPage('<p class="ap-k">🧐 L\'collège du soupçon · mail '+(mi+1)+' / '+MAILS.length+' · <b id="scFound">0</b>/3 indices</p>'
      +'<div class="det-mail"><div class="dm-h">De : <b>'+m.name+'</b> &lt;'+m.from+'&gt;<br>Objet : <b>'+esc(m.sub)+'</b></div>'+m.html+'</div>'
      +'<p style="font-weight:800;color:var(--muted);font-size:.84rem;margin-top:12px">Clique les 3 passages louches !</p>');
    let found=0;
    p.querySelectorAll('.det-z').forEach(z=>{
      z.onclick=()=>{
        if(z.classList.contains('found')) return;
        if(z.hasAttribute('data-bad')){
          z.classList.add('found');
          z.insertAdjacentHTML('beforeend','<span class="det-tag">INDICE !</span>');
          arcHit(15,z); found++;
          const f=document.getElementById('scFound'); if(f) f.textContent=found;
          toast('🧐 '+z.getAttribute('data-bad'));

        } else {
          arcMiss('Ce passage-là est normal… cherche l\'adresse, l\'urgence, les demandes bizarres !');
        }
      };
    });
  }
  show();
}

/* ---- 14.2 Fabrique de sosies, graduée -----------------------------
   niv 0 : voyant (adresse inventée, ridicule)
   niv 1 : plausible (nom officiel + mot ajouté, extension changée)
   niv 2 : fin (caractère truqué, vrai nom collé devant un autre site)   */
function phFakeMail(mail, niv){
  const at=mail.indexOf('@'), user=mail.slice(0,at), dom=mail.slice(at+1);
  const base=dom.slice(0, dom.lastIndexOf('.')), tld=dom.slice(dom.lastIndexOf('.'));
  const r=[];
  if(niv<=0){
    r.push({m:user+'@'+base+'-officiel'+pickOne(['.biz','.top','.xyz']), w:'une adresse en <b>'+'.biz / .top / .xyz</b>, jamais celle d\'un vrai service'});
    r.push({m:pickOne(['service','alerte','contact'])+'@'+base+'-express'+pickOne(['.biz','.info']), w:'un nom de site bricolé pour ressembler au vrai'});
  }
  if(niv===1){
    r.push({m:user+'@'+base+'-'+pickOne(['securite','verification','support','connexion','espace'])+tld, w:'un <b>mot ajouté</b> après le vrai nom'});
    r.push({m:user+'@'+base+pickOne(['.net','.info','.co','.org']), w:'la <b>fin de l\'adresse</b> a changé : ce n\'est plus <b>'+tld+'</b>'});
    r.push({m:user.replace(/\./,'-')+'@'+base+'-'+pickOne(['pro','edu','fr'])+tld, w:'un tiret de plus, et ce n\'est déjà plus le même site'});
  }
  if(niv>=2){
    if(/o/.test(base)) r.push({m:user+'@'+base.replace('o','0')+tld, w:'un <b>zéro</b> à la place du « o »'});
    if(/l/.test(base)) r.push({m:user+'@'+base.replace('l','1')+tld, w:'un <b>chiffre 1</b> à la place du « l »'});
    if(/i/.test(base)) r.push({m:user+'@'+base.replace(/i(?!$)/,'ii')+tld, w:'une <b>lettre en double</b>, presque invisible'});
    if(/m/.test(base)) r.push({m:user+'@'+base.replace('m','rn')+tld, w:'un <b>« rn »</b> qui imite le « m »'});
    r.push({m:user+'@'+base+tld+'.'+pickOne(['espace-connexion.co','mon-suivi.info','portail-securise.net']), w:'le vrai nom est <b>collé devant un autre site</b> : ce qui compte est à la fin'});
  }
  if(!r.length) r.push({m:user+'@'+base+'-'+pickOne(['securite','support'])+tld, w:'un <b>mot ajouté</b> après le vrai nom'});
  const p=pickOne(r);
  return {mail:p.m, why:'L\'adresse est un <b>sosie</b> : '+p.w+'. Le vrai, c\'est <b>'+mail+'</b>.'};
}
/* Expéditeurs totalement inventés (arnaques qui n'imitent personne). */
function phWildMail(niv){
  const u=pickOne(['contact','service','info','no-reply','support','notification','secretariat']);
  const d=niv<=0
    ? pickOne(['grand-gagnant','cadeau-du-jour','super-bonus','recompense-vip','tirage-magique'])
    : pickOne(['espace-notification','suivi-dossier','portail-messages','centre-avis','service-en-ligne']);
  return u+'@'+d+pickOne(niv<=0?['.biz','.top','.xyz']:['.info','.co','.net']);
}

function rnd(a,b){ return Math.floor(a+Math.random()*(b-a+1)); }
function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }
function V(k){ const v=PH_V[k]; return typeof v==='function'?v():pickOne(v); }
/* « de » + matière, avec élision : de français, mais d'anglais, d'histoire, d'E.P.S. */
function matDe(mat){ return (/^[aeiouyéèêh]/i.test(mat)?'d\'':'de ')+mat; }


const PH_TYPOS=[['colis','colit'],['arrêté','areter'],['payer','pailler'],['votre','vôtre'],['compte','conte'],
  ['envoyer','envoiyer'],['secret','secrét'],['gagné','gagner'],['avez','aver'],['coordonnées','coordoné'],
  ['livraison','livrezon'],['adresse','adrèsse'],['bloqué','blocké'],['réponse','réponce'],['merci','mercie']];
function phTypo(html){
  let n=0;
  for(const [bon,faux] of PH_TYPOS.slice().sort(()=>Math.random()-.5)){
    if(n>=3) break;
    const re=new RegExp('\\b'+bon+'\\b','i');
    if(re.test(html)){ html=html.replace(re,'<span class="ph-typo">'+faux+'</span>'); n++; }
  }
  return {html, n};
}

/* ---- 14.5 Boutons, liens, pièces jointes --------------------------
   Deux formes d'appel à l'action, visuellement distinctes :
     btn = un beau bouton              url = une adresse écrite en clair
   Dans les deux cas : SURVOLER est gratuit, CLIQUER, c'est agir.     */
function phLink(bad, c, niv, style){
  const off=(c&&c.mail)?c.mail.split('@')[1]:'ville.fr';
  const path=pickOne(['espace-eleves','mon-compte','suivi','documents','inscription','programme']);
  if(!bad){
    const real='www.'+off+'/'+path+(Math.random()<.4?'/'+pickOne(['2024-2025','details','page-complete-des-informations']):'');
    return {style:style, txt:style==='url'?real:pickOne(['Consulter la page','Voir le document','Accéder à mon espace','Ouvrir le programme']),
      real:real, bad:false, dom:off,
      why:'Le lien mène vraiment à <b>'+off+'</b>, le site annoncé.'};
  }
  let host, w;
  if(niv<=0){
    host=pickOne(['cadeau-immediat.biz','gain-express.top','recompense-vip.xyz']);
    w='le lien part vers <b>'+host+'</b>, qui n\'a aucun rapport.';
  } else if(niv===1){
    const base=off.slice(0,off.lastIndexOf('.'));
    host=base+'-'+pickOne(['connexion','espace','securite','portail'])+pickOne(['.net','.info','.co']);
    w='le lien ressemble à <b>'+off+'</b>… mais c\'est <b>'+host+'</b>, un autre site.';
  } else {
    host=off+'.'+pickOne(['espace-connexion.co','portail-securise.net','mon-suivi.info']);
    w='le vrai site est <b>à la fin</b> de l\'adresse : ici c\'est <b>'+host.split('.').slice(-2).join('.')+'</b>, pas <b>'+off+'</b>.';
  }
  const real='www.'+host+'/'+path;
  return {style:style, txt:style==='url'?'www.'+off+'/'+path:pickOne(['Confirmer maintenant','Consulter mon compte','Régulariser ma situation','Accéder à mon espace','Récupérer mon dossier']),
    real:real, bad:true, dom:host, facade:off,
    why:'Le bouton est rassurant, mais '+w};
}
function phAtt(bad, v, niv){
  const base=v.fichier;
  if(!bad){
    const t=pickOne([{e:'pdf',ic:'📄'},{e:'jpg',ic:'🖼️'},{e:'png',ic:'🖼️'},{e:'odt',ic:'📝'}]);
    return {n:base+'.'+t.e, s:rnd(80,900), ic:t.ic, trap:false, ext:t.e,
      why:'Extension <b>.'+t.e+'</b> : un vrai document, cohérent avec le message.'};
  }
  let n, ext, ic, w;
  if(niv<=0){ ext='exe'; ic='📦'; n=base+'.exe';
    w='le fichier finit par <b>.exe</b> : c\'est un <b>programme</b>, pas un document.'; }
  else if(niv===1){ ext=pickOne(['exe','scr']); ic='📄'; n=base+'.'+pickOne(['pdf','doc','jpg'])+'.'+ext;
    w='<b>double extension</b> : ça commence comme un document et ça finit par <b>.'+ext+'</b>, un programme.'; }
  else { const f=pickOne([
      {n:base+'.pdf .exe', e:'exe', w:'un <b>espace</b> cache la vraie fin du nom : <b>.exe</b>.'},
      {n:base+'.docm',     e:'docm',w:'l\'extension <b>.docm</b> est un document <b>qui contient un programme</b>.'},
      {n:base+'.zip',      e:'zip', w:'une <b>archive</b> que personne ne t\'a annoncée : on ne l\'ouvre pas.'},
      {n:base+'.pdf.lnk',  e:'lnk', w:'<b>.lnk</b> : ce n\'est pas le document, c\'est un <b>raccourci</b> qui lance autre chose.'}]);
    n=f.n; ext=f.e; ic='📄'; w=f.w; }
  return {n:n, s:rnd(600,3400), ic:ic, trap:true, ext:ext, why:'Regarde la <b>fin</b> du nom : '+w};
}

let _phUid=0;
function shuffle(a){ return a.slice().sort(()=>Math.random()-.5); }
function phPickWho(spec){
  const pool=[];
  for(const s of (spec||[])){
    if(s.charAt(0)==='#'){ const c=phById(s.slice(1)); if(c) pool.push(c); }
    else PH_ALL.filter(c=>c.fam===s && !c.neuf).forEach(c=>pool.push(c));
  }
  return pool.length?pickOne(pool):pickOne(PH_CONTACTS);
}
function phVars(who){
  return {who:who, jour:V('jour'), heure:V('heure'), lieu:V('lieu'), item:V('item'),
    livre:V('livre'), repas:V('repas'), repas2:V('repas'), sport:V('sport'),
    euro:V('euro'), petit:V('petit'), gros:V('gros'), delai:V('delai'),
    colisN:V('colisN'), marque:V('marque'), lot:V('lot'), fichier:V('fichier')};
}
function phDate(){
  const j=['lundi','mardi','mercredi','jeudi','vendredi'][rnd(0,4)];
  return j+' '+rnd(1,28)+'/'+rnd(1,12)+' à '+rnd(7,19)+'h'+String(rnd(0,59)).padStart(2,'0');
}
function phMakeOk(t, niv, opt){
  opt=opt||{};
  const c=phPickWho(t.who), v=phVars(c);
  if(t.file) v.fichier=pickOne([].concat(t.file));
  const m={uid:++_phUid, tpl:t.id, phish:false, c:c, name:c.name, mail:c.mail, date:phDate(),
    sub:t.sub(v), body:t.body(v), sign:c.name, clues:[], ok:t.ok, neuf:!!t.neuf};
  if(t.att)  m.atts=[phAtt(false, v, niv)];
  if(t.link) m.link=phLink(false, c, niv, Math.random()<.5?'btn':'url');
  if(opt.pressed){
    m.body+='<p>Merci de répondre <b>avant '+v.jour+'</b> : la liste part ce jour-là.</p>';
    m.ok='une date limite existe, mais aucune demande interdite et aucun lien piégé';
  }
  /* Quelques vrais messages ont aussi des fautes : une faute n\'est pas la preuve
     d\'une arnaque. Jamais chez un professeur, ni sur un service officiel. */
  if(opt.typo && c.fam!=='prof' && c.fam!=='ecole'){
    const r=phTypo(m.body); if(r.n) m.body=r.html;
  }
  return m;
}
function phMakeKo(t, niv, opt){
  opt=opt||{};
  const clues=[];
  let c=null, name, mail;
  if(t.imite){
    c=phPickWho(t.imite); name=c.name;
    const f=phFakeMail(c.mail, niv);
    mail=f.mail;
    clues.push({k:'domain', why:f.why});
  } else {
    name=pickOne(['Service client','Alerte sécurité','Loterie Nationale','Support technique','Espace abonnés',
                  'Notification','Service de livraison','Un ami','Assistance en ligne']);
    mail=phWildMail(niv);
    clues.push({k:'domain', why:'Expéditeur <b>totalement inconnu</b> : ce nom ne correspond à aucun contact ni service enregistré.'});
  }
  const v=phVars(c||{name:name, mail:mail, mat:pickOne(['mathématiques','français','SVT','technologie'])});
  if(t.file) v.fichier=pickOne([].concat(t.file));
  const m={uid:++_phUid, tpl:t.id, phish:true, c:c, name:name, mail:mail, date:phDate(),
    sub:t.sub(v), body:t.body(v), sign:name, clues:clues, shout:!!t.shout};
  for(const k of t.clues){ if(k!=='att'&&k!=='usurp') clues.push({k:k, why:PH_CLUES[k].d}); }
  if(t.clues.indexOf('usurp')>=0 && c)
    clues.push({k:'usurp', why:'Quelqu\'un se fait passer pour <b>'+c.name+'</b>, qui écrit toujours depuis <b>'+c.mail+'</b>.'});
  if(t.att){ const a=phAtt(true, v, niv); m.atts=[a]; clues.push({k:'att', why:a.why}); }
  if(t.act){ const l=phLink(true, c, niv, t.act); m.link=l; clues.push({k:'link', why:l.why}); }
  if(t.perso) m.body=m.body.replace('<p>','<p><i>'+pickOne(['Tu es bien en 5ᵉ B, non ?','On s\'est vus à la sortie '+v.lieu+'.','Ton professeur principal m\'a transmis ton adresse.'])+'</i> ');
  if(opt.typo){ const r=phTypo(m.body); if(r.n){ m.body=r.html; clues.push({k:'typo', why:r.n+' faute'+(r.n>1?'s':'')+' grossière'+(r.n>1?'s':'')+' : associée à d\'autres signes, la langue bâclée trahit l\'arnaque.'}); } }
  m.clues=clues;
  m.ko=PH_CLUES[clues[clues.length-1].k].t.toLowerCase();
  return m;
}

/* ---- 14.11 La file d'une phase : jamais deux mails qui se ressemblent ----
   Une même trame n'est jamais tirée deux fois dans la même phase, ni deux
   fois dans la partie tant qu'il reste des trames neuves. Et deux mails de
   la même phase ne partent jamais du même expéditeur. */
function phKoPool(){ const n=phCfg().niv; return PH_KO_T.filter(t=>t.niv<=n); }
function phOkPool(){
  const c=phCfg();
  return PH_OK_T.filter(t=>{
    if(t.neuf && !c.neuf) return false;
    if(t.att  && PH.phase<3) return false;
    if(t.link && PH.phase<2) return false;
    return true;
  });
}
function phBodySig(m){
  return (m.sub+' '+m.body).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
}
function phPickTpls(pool, n, taken){
  const fresh=shuffle(pool.filter(t=>!PH.usedTpl[t.id] && !taken[t.id]));
  const again=shuffle(pool.filter(t=>PH.usedTpl[t.id] && !taken[t.id]));
  const out=[];
  for(const t of fresh.concat(again)){
    if(out.length>=n) break;
    out.push(t); taken[t.id]=1;
  }
  return out;
}
function phBuildQueue(){
  PH.usedTpl=PH.usedTpl||{}; PH.bodies=PH.bodies||{};
  const c=phCfg(), n=c.n, niv=c.niv;
  const nKo=Math.round(n*(c.neuf?.45:.5)), nOk=n-nKo;
  const taken={}, senders={}, q=[];
  /* Garde-fou : aucun corps de mail deja vu dans la partie, et jamais deux
     mails du meme expediteur dans une meme phase. On retire les variables
     jusqu a obtenir un message reellement neuf. */
  const makeUnique=(build)=>{
    for(let i=0;i<24;i++){
      const m=build(), who=(m.c?m.c.id:m.mail), sig=phBodySig(m);
      if(!senders[who] && !PH.bodies[sig]){ senders[who]=1; PH.bodies[sig]=1; return m; }
    }
    const m=build(); PH.bodies[phBodySig(m)]=1; return m;
  };
  for(const t of phPickTpls(phKoPool(), nKo, taken)){
    PH.usedTpl[t.id]=1;
    q.push(makeUnique(()=>phMakeKo(t, niv, {
      typo : (niv===0 ? Math.random()<.5 : Math.random()<.25)
    })));
  }
  for(const t of phPickTpls(phOkPool(), nOk, taken)){
    PH.usedTpl[t.id]=1;
    q.push(makeUnique(()=>phMakeOk(t, niv, {
      pressed : Math.random()<.28,
      typo    : Math.random()<.25
    })));
  }
  PH.queue=shuffle(q);
  PH.pjLeft=PH.tools.pj?1:0;
  PH.scanLeft=PH.tools.scan2?2:0;
  PH.adviceUsed=0;
  PH.pstats={total:0,right:0,wrong:0,clues:0,tools:0,gain:0,missed:{},found:{}};
}

function phHud(){
  // Trophée « Sans une fuite » : on retient le plus bas niveau atteint par la Sécurité
  // réseau. phHud() étant rappelée après CHAQUE variation de jauge, ce point de mesure
  // couvre tous les chemins qui font baisser PH.net, sans avoir à les instrumenter un à un.
  PH.netMin=Math.min(PH.netMin==null?PH_MAXG:PH.netMin, PH.net);
  const g1=document.getElementById('gNet'); if(!g1) return;
  const g2=document.getElementById('gTrust');
  g1.style.width=Math.max(0,PH.net)+'%';  g1.parentElement.className='g-bar'+(PH.net<=30?' low':(PH.net<=60?' mid':''));
  g2.style.width=Math.max(0,PH.trust)+'%';g2.parentElement.className='g-bar'+(PH.trust<=30?' low':(PH.trust<=60?' mid':''));
  document.getElementById('phCred').textContent='🪙 '+PH.credits;
  document.getElementById('phProg').textContent=(PH.phase+1)+'/'+PH_PHASES.length;
  document.getElementById('phPhaseName').textContent=phCfg().name;
  const left=PH.queue?PH.queue.length:0;
  const q=document.getElementById('phQueue');
  if(q && !phCfg().duel) q.innerHTML='📨 Encore <b>'+left+'</b> mail'+(left>1?'s':'');
  phTools();
}

/* ---- 14.15 Envoi : le PHISHER lance sa ligne, l'enveloppe arrive ---- */
function phNextMail(){
  if(PH.over) return;
  if(!PH.queue.length){ phPhaseEnd(); return; }
  PH.cur=PH.queue.shift();
  PH.revealed=false;                       /* l'adresse n'est jamais montrée d'office */
  PH.canReveal=(PH.phase>=1);              /* le bouton « voir l'adresse » apparaît dès la phase 2 */
  PH.pointing=(PH.phase>=PH_POINT_FROM);   /* tamponner INDÉSIRABLE demande de pointer le problème */
  PH.found={}; PH.toolUsedWell=false; PH.stamping=false; PH.shownAt=0;
  phHud();
  phCast();
}
/* le PHISHER lance sa ligne AVANT chaque envoi */
function phCast(){
  phMood('cast');
  beep('send');
  after(560,()=>{ phMood('idle'); if(!PH.over) phEnvelope(); });
  if(Math.random()<.3) after(120,()=>{ if(!PH.over) phSay('arrive'); });
}
function phEnvelope(){
  const z=document.getElementById('phPaper'); if(!z) return;
  beep('mail');
  z.innerHTML='<div class="ph-env" id="phEnv">'
    +'<div class="env-body"></div><div class="env-letter"></div>'
    +'<div class="env-flap"></div><div class="env-front"></div>'
    +'<div class="env-seal">✉️</div></div>';
  after(400,()=>{ const e=document.getElementById('phEnv'); if(e) e.classList.add('open'); beep('open'); });
  after(900,()=>{ if(!PH.over && PH.cur) renderPhMail(); });
}

  const cls='mlk '+(l.style==='url'?'mlk-url':'mlk-btn');
  return '<span class="'+cls+'" data-real="'+esc(l.real)+'">'+esc(l.txt)+'</span>';
}
function phAddrRowHtml(m){
  if(PH.revealed) return '<span class="mh-addr pop" id="phAddr">&lt;'+esc(m.mail)+'&gt;</span>';
  if(PH.canReveal) return '<button class="mh-reveal" id="phReveal">👆 voir l\'adresse</button>';
  return '';                               /* phase 1 : le nom seul, pas d'adresse */
}
function renderPhMail(){
  const m=PH.cur, z=document.getElementById('phPaper'); if(!z||!m) return;
  let body='<div class="ph-mtext" data-zone="body"><span class="pz-tag">le texte</span>'+m.body+'</div>';
  if(m.link) body+='<p class="ph-cta" data-zone="link"><span class="pz-tag">le bouton</span>'+phLinkHtml(m.link)+'</p>';
  if(m.atts) body+='<p class="ph-atts" data-zone="att"><span class="pz-tag">la pièce jointe</span>'+m.atts.map((a,i)=>
      '<span class="ph-att" data-ai="'+i+'" title="Cliquer = ouvrir le fichier"><span class="pa-n">'+a.ic+' '+esc(a.n)+'</span>'
      +'<span class="ac-size">'+fmtSize(a.s)+'</span><span class="pa-res" id="paRes'+i+'"></span></span>').join('')+'</p>';
  body+='<p class="ph-sign" data-zone="sign"><span class="pz-tag">la signature</span>'+esc(m.sign)+'</p>';
  z.innerHTML='<div class="ph-mail'+(m.shout?' shout':'')+'" id="phMail">'
    +'<div class="ph-mh">'
    +  '<div class="mh-row" data-zone="from"><span class="pz-tag">l\'expéditeur</span><span class="mh-k">De</span>'
    +    '<span class="mh-from" id="phFrom">'+esc(m.name)+'</span>'+phAddrRowHtml(m)+'</div>'
    +  '<div class="mh-row" data-zone="date"><span class="pz-tag">la date</span><span class="mh-k">Date</span><span class="mh-date">'+esc(m.date)+'</span></div>'
    +  '<div class="mh-row" data-zone="sub"><span class="pz-tag">l\'objet</span><span class="mh-k">Objet</span><span class="mh-sub">'+esc(m.sub)+'</span></div>'
    +'</div>'
    +'<div class="ph-mb">'+body+'</div>'
    +'</div>';
  PH.shownAt=Date.now();
  document.getElementById('stampOk').disabled=false;
  document.getElementById('stampBad').disabled=false;
  phWireMail();
  phHud();
}
function phWireMail(){
  const m=PH.cur, z=document.getElementById('phPaper');
  const rv=document.getElementById('phReveal');
  if(rv) rv.onclick=(e)=>{ e.stopPropagation(); beep('click'); PH.revealed=true;
    rv.outerHTML='<span class="mh-addr pop" id="phAddr" data-zone="from">&lt;'+esc(m.mail)+'&gt;</span>'; };
  /* boutons et liens : SURVOLER est gratuit, CLIQUER, c'est y aller */
  z.querySelectorAll('.mlk').forEach(a=>{
    a.onmouseenter=()=>{
      if(PH.stamping) return;
      const real=a.getAttribute('data-real')||'';
      const t=document.createElement('div'); t.className='ph-linktip'; t.id='phTip';
      t.innerHTML='🔗 Ce lien mène vraiment vers :<br><span class="lt-real">'+esc(real)+'</span>';
      document.body.appendChild(t);
      const r=a.getBoundingClientRect();
      t.style.left=Math.min(window.innerWidth-340, Math.max(8,r.left))+'px';
      t.style.top=(r.bottom+8)+'px';
    };
    a.onmouseleave=()=>{ const t=document.getElementById('phTip'); if(t) t.remove(); };
    a.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); phActLink(); };
  });
  /* pièces jointes : cliquer, c'est OUVRIR */
  z.querySelectorAll('.ph-att').forEach(el=>{
    el.onclick=(e)=>{ e.stopPropagation(); phActAtt(+el.getAttribute('data-ai')); };
  });
}
/* ---- agir sur un lien / une PJ : c'est là que ça se paie ---- */
function phActLink(){
  const m=PH.cur; if(!m||PH.stamping||PH.pointMode) return;
  const tip=document.getElementById('phTip'); if(tip) tip.remove();
  if(m.link && m.link.bad){ phActFail('link'); return; }
  phInfo('🔗 Le lien était sûr, cette fois. Mais on ne le sait qu\'<b>après avoir survolé</b> : garde le réflexe de vérifier avant de cliquer.','ok');
  phAutoTrust();
}
function phActAtt(i){
  const m=PH.cur; if(!m||PH.stamping||PH.pointMode) return;
  const a=(m.atts||[])[i]; if(!a) return;
  if(a.trap){ phActFail('att'); return; }
  phInfo('📎 Le fichier était sain. Mais tu l\'as ouvert <b>sans le vérifier</b> : la prochaine fois, regarde la fin du nom d\'abord.','ok');
  phAutoTrust();
}
/* ouvrir un piège = comme valider le mail, en pire : c'est immédiat */
function phActFail(kind){
  const m=PH.cur, mail=document.getElementById('phMail');
  phLockStamps();
  beep('alarm'); screenShake(); redFlash();
  if(mail){
    const st=document.createElement('div'); st.className='ph-stampmark bad boom';
    st.innerHTML='<span class="sm-t">'+(kind==='att'?'FICHIER OUVERT':'LIEN OUVERT')+'</span>'
      +'<span class="sm-w">'+(kind==='att'?'Le programme s\'est lancé sur ta machine.':'Tu es arrivé sur le faux site du PHISHER.')+'</span>';
    mail.appendChild(st);
  }
  PH.stats.total++; PH.pstats.total++; PH.stats.wrong++; PH.pstats.wrong++; PH.streak=0;
  (m.clues||[]).forEach(c=>{ if(!PH.found[c.k]){ PH.stats.missed[c.k]=(PH.stats.missed[c.k]||0)+1; PH.pstats.missed[c.k]=(PH.pstats.missed[c.k]||0)+1; } });
  PH.credits=Math.max(0,PH.credits-3);
  PH.net=Math.max(0,PH.net-PH_HIT);
  phSay('click');
  phVerdict(false, m, 0, [], kind==='att'
    ? 'Une pièce jointe ne se vérifie <b>jamais</b> en l\'ouvrant : on lit la fin de son nom, ou on la scanne.'
    : 'Un lien ne se vérifie <b>jamais</b> en cliquant : on le survole pour lire sa vraie destination.');
  phRevealClue(m);
  phHud();
  if(PH.net<=0||PH.trust<=0){ after(3200, phDefeat); return; }
  after(4200,()=>{ if(mail) mail.classList.add('out-bad'); after(420, phNextMail); });
}
function phLockStamps(){
  PH.stamping=true;
  const a=document.getElementById('stampOk'), b=document.getElementById('stampBad');
  if(a) a.disabled=true; if(b) b.disabled=true;
}
/* cliquer un élément sain = on a agi sans vérifier : ça vaut un tampon LÉGITIME */
function phAutoTrust(){ after(900,()=>{ if(!PH.stamping) phStamp(false, true); }); }

/* ---- 14.17 Le panneau d'outils ---- */
function phAdviceCost(){ return 3+3*(PH.adviceUsed||0); }
function phTools(){
  const box=document.getElementById('phTools'); if(!box) return;
  const c=phCfg();
  if(c.duel){ box.innerHTML='<div class="ph-duelhint">⚔️ <b>Duel</b><br>Compare les deux mails ligne par ligne.<br>Cherche <b>1 ou 2 détails</b> qui changent.<br><br>Survole un mail pour le valider comme sûr.</div>'; return; }
  let h='<button class="ph-toolbtn act" data-a="reg"><span class="pt-ic">📒</span><span class="pt-n">Registre des contacts</span></button>';
  for(const t of PH_TOOLS){
    if(PH.phase+1<t.from) continue;
    const owned=PH.tools[t.id];
    let extra='';
    if(t.id==='scan2'&&owned) extra=' ('+PH.scanLeft+')';
    if(t.id==='pj'&&owned)    extra=' ('+PH.pjLeft+')';
    if(t.id==='url'&&owned)   extra=' (2🪙)';
    const spent=owned&&((t.id==='scan2'&&PH.scanLeft<=0)||(t.id==='pj'&&PH.pjLeft<=0));
    h+='<button class="ph-toolbtn'+(owned?(spent?' spent':' on'):' locked')+'" data-t="'+t.id+'"'+(owned&&!spent?'':' disabled')+'>'
      +'<span class="pt-ic">'+t.ic+'</span><span class="pt-n">'+t.name+extra+(owned?'':' 🔒')+'</span></button>';
  }
  if(c.advice||PH.phase>=PH_POINT_FROM)
    h+='<button class="ph-toolbtn act" data-a="adv"><span class="pt-ic">🙋</span><span class="pt-n">Demander conseil ('+phAdviceCost()+'🪙)</span></button>';
  box.innerHTML=h;
  box.querySelectorAll('[data-t]').forEach(b=>{ const id=b.getAttribute('data-t');
    if(PH.tools[id]) b.onclick=()=>phUseTool(id); });
  box.querySelectorAll('[data-a]').forEach(b=>{ const a=b.getAttribute('data-a');
    b.onclick=()=>{ if(a==='reg') phRegistre(); else phAdvice(); }; });
}
function phMarkFound(k, viaTool){
  if(viaTool) PH.toolUsedWell=true;
  if(!PH.cur||!PH.cur.phish||!k) return;
  if(PH.cur.clues.some(c=>c.k===k)) PH.found[k]=1;
}
/* petite bulle collée sous l'élément analysé */
function phPop(el, html, tone){
  const mail=document.getElementById('phMail'); if(!mail||!el) return phInfo(html,tone);
  const old=mail.querySelector('.scan-pop'); if(old) old.remove();
  const r=el.getBoundingClientRect(), mr=mail.getBoundingClientRect();
  const p=document.createElement('div'); p.className='scan-pop '+(tone||'');
  p.innerHTML=html;
  p.style.left=Math.max(6,Math.min(r.left-mr.left, mail.clientWidth-250))+'px';
  p.style.top=(r.bottom-mr.top+8)+'px';
  mail.appendChild(p);
  clearTimeout(PH._popT); PH._popT=setTimeout(()=>{ try{p.remove();}catch(e){} }, 8200);
}
/* la loupe traverse l'adresse, PUIS le verdict tombe */
function phScanAnim(el, done){
  const mail=document.getElementById('phMail'); if(!mail||!el){ done(); return; }
  const r=el.getBoundingClientRect(), mr=mail.getBoundingClientRect();
  const band=document.createElement('div'); band.className='scan-band';
  band.style.left=(r.left-mr.left-4)+'px'; band.style.top=(r.top-mr.top-3)+'px';
  band.style.width=(r.width+8)+'px'; band.style.height=(r.height+6)+'px';
  const lens=document.createElement('div'); lens.className='scan-lens'; lens.textContent='🔎';
  lens.style.left=(r.left-mr.left-16)+'px'; lens.style.top=(r.top-mr.top-14)+'px';
  lens.style.setProperty('--dx',(r.width+18)+'px');
  mail.appendChild(band); mail.appendChild(lens);
  after(1080,()=>{ try{band.remove(); lens.remove();}catch(e){} done(); });
}
function phUseTool(id){
  const m=PH.cur; if(!m||PH.stamping) return;
  PH.stats.tools++; PH.pstats.tools++;
  if(id==='scan2'){
    if(PH.scanLeft<=0){ beep('bad'); phInfo('🔎 Plus de scan disponible. Il s\'en recharge <b>2</b> à la phase suivante.','warn'); return; }
    PH.scanLeft--; beep('click');
    if(!PH.revealed){ PH.revealed=true; renderPhMail(); }
    const el=document.getElementById('phAddr'); if(el) el.classList.add('scanning');
    phHud();
    phScanAnim(el,()=>{
      if(el) el.classList.remove('scanning');
      const off=m.c?m.c.mail:null;
      const dom=m.mail.split('@')[1];
      if(off && off!==m.mail){ phMarkFound('domain',true); phMarkFound('usurp',true);
        phPop(el,'🔎 <b>Scan terminé</b><br>Le nom affiché est <b>'+esc(m.name)+'</b>.<br>Son adresse officielle : <b>'+esc(off)+'</b><br>Adresse de ce mail : <b>'+esc(m.mail)+'</b><br><span class="sp-x">Ce ne sont pas les mêmes.</span>','warn');
      } else if(!m.c){
        phPop(el,'🔎 <b>Scan terminé</b><br>Aucun contact connu ne porte ce nom.<br>Domaine : <b>'+esc(dom)+'</b><br><span class="sp-n">Inconnu ne veut pas dire malhonnête : lis la demande.</span>','');
      } else { PH.toolUsedWell=true;
        phPop(el,'🔎 <b>Scan terminé</b><br>Adresse conforme à celle de <b>'+esc(m.c.name)+'</b>.<br><span class="sp-o">Écriture normale, aucun caractère truqué.</span>','ok');
      }
      phHud();
    });
    return;
  }
  if(id==='url'){
    if(!m.link){ phInfo('🔗 Aucun lien dans ce mail : analyse annulée, rien n\'est débité.',''); return; }
    if(PH.credits<2){ beep('bad'); phInfo('🔗 Pas assez de crédits (2 🪙 par analyse).','warn'); return; }
    PH.credits-=2; beep('click');
    const parts=m.link.real.replace(/^www\./,'').split('/');
    const bits=parts[0].split('.'), rest=parts.slice(1).join('/');
    const dom=bits.slice(-2).join('.');
    phMarkFound(m.link.bad?'link':null,true);
    phInfo('🔗 <b>Analyseur d\'URL</b><div class="url-x">'
      +bits.map((b,i)=>'<span class="'+(i>=bits.length-2?'u-dom':'u-sub')+'">'+esc(b)+'</span>').join('<i>.</i>')
      +(rest?'<i>/</i><span class="u-path">'+esc(rest)+'</span>':'')+'</div>'
      +'<div class="url-v '+(m.link.bad?'bad':'ok')+'">Le vrai site est <b>'+esc(dom)+'</b> — '
      +(m.link.bad?'ce n\'est pas celui annoncé. Adresse <b>piégée</b>.':'c\'est bien celui annoncé. Adresse <b>sûre</b>.')+'</div>',
      m.link.bad?'warn':'ok');
    phHud(); return;
  }
  if(id==='pj'){
    if(PH.pjLeft<=0){ beep('bad'); phInfo('🔬 Le scanner est déchargé jusqu\'à la phase suivante.','warn'); return; }
    if(!m.atts||!m.atts.length){ phInfo('🔬 Aucune pièce jointe à analyser. Charge conservée.',''); return; }
    PH.pjLeft--; beep('ding');
    const a=m.atts[0], res=document.getElementById('paRes0');
    if(res) res.innerHTML=a.trap?'<span class="pa-verdict bad">☠️ DANGEREUSE</span>':'<span class="pa-verdict ok">✔️ sûre</span>';
    phMarkFound(a.trap?'att':null,true);
    phInfo('🔬 <b>Scanner</b> — Fichier <b>'+(a.trap?'dangereux':'sûr')+'</b>. '+a.why, a.trap?'warn':'ok');
    phHud(); return;
  }
}

/* ---- 14.19 Demander conseil : clair une fois sur deux ---- */
function phAdvice(){
  const m=PH.cur; if(!m||PH.stamping) return;
  const cost=phAdviceCost();
  if(PH.credits<cost){ beep('bad'); phInfo('🙋 Le service informatique demande '+cost+' 🪙 pour ce conseil. Tu n\'en as pas assez.','warn'); return; }
  PH.credits-=cost; PH.adviceUsed++; beep('ding');
  PH.stats.tools++; PH.pstats.tools++;
  const direct=Math.random()<.5;
  let piste;
  if(m.phish){
    const c=m.clues[m.clues.length-1], z=PH_CLUES[c.k].zone;
    if(direct){
      const dit={
        domain :'L\'adresse affichée <b>ne correspond pas</b> au domaine officiel de ce contact.',
        usurp  :'Ce n\'est pas la bonne adresse pour cette personne : quelqu\'un <b>se fait passer</b> pour elle.',
        link   :'Le bouton et sa vraie destination <b>ne mènent pas au même endroit</b>.',
        att    :'La <b>fin du nom du fichier</b> ne correspond pas à un document.',
        pass   :'Aucun service sérieux ne fait <b>ressaisir un mot de passe</b> depuis un mail.',
        money  :'On ne règle <b>jamais</b> ce genre de somme depuis un lien reçu par mail.',
        perso  :'Ces informations personnelles <b>ne se demandent pas</b> par mail.',
        gift   :'Ce gain n\'existe pas : personne ne gagne à un jeu <b>auquel il n\'a pas joué</b>.',
        urgency:'Ce délai est une <b>pression fabriquée</b> pour t\'empêcher de vérifier.',
        contra :'Deux endroits de ce message <b>se contredisent</b>.',
        typo   :'Le niveau de langue <b>ne correspond pas</b> à un vrai service.'
      }[c.k]||'Quelque chose ne va pas dans ce message.';
      piste='Je suis formel : '+dit;
    } else {
      piste='Je ne te donne pas la réponse. Mais à ta place, je relirais <b>'+PH_ZONE[z]+'</b>, très lentement.';
    }
  } else {
    piste=direct
      ? 'J\'ai vérifié l\'adresse et la demande : <b>rien d\'anormal</b>. Ce message peut passer.'
      : 'Rien ne m\'a sauté aux yeux. Demande-toi surtout : est-ce qu\'on te réclame quelque chose <b>d\'interdit</b> ?';
  }
  phInfo('🙋 <b>Service informatique</b> — '+piste
    +'<span class="pi-cost">−'+cost+' 🪙 · le prochain conseil coûtera '+phAdviceCost()+' 🪙</span>','');
  phHud();
}
const PH_ZONE={from:'l\'expéditeur', date:'la date', sub:'l\'objet', body:'le texte', link:'le bouton', att:'la pièce jointe', sign:'la signature'};
/* ---- 14.20 Vérifier par un autre canal ---- */
/* ---- 14.21 Le tampon ----
   LÉGITIME : validation directe.
   INDÉSIRABLE : à partir de la phase 5, il faut POINTER ce qui cloche. */
function phStamp(asPhish, auto){
  if(PH.over||PH.stamping||PH.pointMode||!PH.cur) return;
  const m=PH.cur;
  if(asPhish && PH.pointing && !auto){ phEnterPoint(m); return; }
  const correct=(asPhish===m.phish);
  phCommit(m, {asPhish:asPhish, correct:correct, auto:auto, gauge:(m.phish?'net':'trust')});
}
/* mode « pointe le problème » : mail grisé, zones cliquables mises en avant */
function phEnterPoint(m){
  PH.pointMode=true;
  const tip=document.getElementById('phTip'); if(tip) tip.remove();
  const so=document.getElementById('stampOk'), sb=document.getElementById('stampBad');
  if(so) so.disabled=true; if(sb) sb.disabled=true;
  if(!PH.revealed && PH.canReveal){ PH.revealed=true; renderPhMail(); }
  beep('click');
  const mail=document.getElementById('phMail'); if(!mail) return;
  mail.classList.add('pointing');
  const bar=document.createElement('div'); bar.className='ph-pointbar';
  bar.innerHTML='🎯 <b>Montre CE qui pose problème</b> — clique la partie du mail qui ne va pas';
  mail.appendChild(bar);
  mail.querySelectorAll('[data-zone]').forEach(el=>{
    el.classList.add('pt-zone');
    el.onclick=(e)=>{ e.stopPropagation(); phPointClick(el.getAttribute('data-zone'), el); };
  });
}
function phZoneClue(m, zoneKey){
  for(const c of (m.clues||[])){ if(PH_CLUES[c.k] && PH_CLUES[c.k].zone===zoneKey) return c; }
  return null;
}
function phPointClick(zoneKey, el){
  if(!PH.pointMode||PH.stamping) return;
  const m=PH.cur;
  const c=m.phish?phZoneClue(m, zoneKey):null;
  PH.pointMode=false;
  const mail=document.getElementById('phMail');
  if(mail){ const b=mail.querySelector('.ph-pointbar'); if(b) b.remove();
    mail.classList.remove('pointing');
    mail.querySelectorAll('.pt-zone').forEach(z=>{ z.onclick=null; z.classList.remove('pt-zone'); }); }
  if(el) el.classList.add(c?'pt-good':'pt-bad');
  if(c){                                   /* bien pointé : le mail EST un piège, et voilà où */
    PH.found[c.k]=1;
    phCommit(m, {asPhish:true, correct:true, pointClue:c});
  } else if(m.phish){                      /* c'était un piège, mais cette partie-là est normale */
    phCommit(m, {asPhish:true, correct:false, soft:true, gauge:'net', pickedSafe:zoneKey});
  } else {                                 /* mail honnête : tout est normal, aucune cible ne vaut */
    phCommit(m, {asPhish:true, correct:false, gauge:'trust', pickedSafe:zoneKey});
  }
}
/* finalise une décision : tampon, score, jauges, verdict, mail suivant */
function phCommit(m, o){
  phLockStamps();
  const tip=document.getElementById('phTip'); if(tip) tip.remove();
  beep('stamp');
  const mail=document.getElementById('phMail');
  const nClues=(m.clues||[]).length;
  let nFound=o.auto?0:Object.keys(PH.found||{}).length;
  if(o.pointClue) nFound=Math.max(1,nFound);
  const motif=o.correct
      ? (o.asPhish?('Indésirable : '+(o.pointClue?PH_CLUES[o.pointClue.k].t.toLowerCase():m.ko)):('Validé : '+m.ok))
      : (o.soft?'Bloqué, mais mauvaise cible'
             : (m.phish?'Ce mail était un PIÈGE':'Ce mail était HONNÊTE'));
  if(mail){
    const st=document.createElement('div');
    st.className='ph-stampmark '+(o.asPhish?'bad':'ok');
    st.innerHTML='<span class="sm-t">'+(o.asPhish?'INDÉSIRABLE':'LÉGITIME')+'</span><span class="sm-w">'+motif+'</span>';
    mail.appendChild(st);
  }
  PH.stats.total++; PH.pstats.total++;
  after(820,()=>{
    if(o.correct){
      PH.streak++; PH.stats.right++; PH.pstats.right++;
      let gain=1, bonus=[];
      if(nFound>=1) gain=2;
      if(nClues>=2 && nFound>=2) gain=3;
      if(o.pointClue){ gain=Math.max(gain,2); bonus.push('preuve pointée'); }
      if(PH.toolUsedWell && !o.auto){ gain+=1; bonus.push('outil bien utilisé'); }
      if(PH.streak>0 && PH.streak%5===0){ gain+=3; bonus.push('série de '+PH.streak); }
      if(o.auto) bonus.push('agi sans vérifier : aucun bonus');
      PH.credits+=gain; PH.pstats.gain+=gain;
      PH.stats.clues+=nFound; PH.pstats.clues+=nFound;
      Object.keys(PH.found||{}).forEach(k=>{ if(o.auto) return;
        PH.stats.found[k]=(PH.stats.found[k]||0)+1; PH.pstats.found[k]=(PH.pstats.found[k]||0)+1; });
      beep('coin'); flyPts('+'+gain+' 🪙', mail);
      phVerdict(true, m, gain, bonus, o);
      if(mail) mail.classList.add(m.phish?'out-bad':'out-ok');
      if(Math.random()<.3) phSay('lose');
      after(2600, phNextMail);
    } else {
      PH.streak=0; PH.stats.wrong++; PH.pstats.wrong++;
      (m.clues||[]).forEach(c=>{ if(!PH.found[c.k]){ PH.stats.missed[c.k]=(PH.stats.missed[c.k]||0)+1; PH.pstats.missed[c.k]=(PH.pstats.missed[c.k]||0)+1; } });
      PH.credits=Math.max(0,PH.credits-3);
      const amt=o.soft?PH_SOFT:PH_HIT;
      if(o.gauge==='trust') PH.trust=Math.max(0,PH.trust-amt); else PH.net=Math.max(0,PH.net-amt);
      beep('alarm'); screenShake(); redFlash();
      phVerdict(false, m, 0, [], o);
      phRevealClue(m);
      phSay(o.soft?'lose':(m.phish?'win':'parano'));
      phHud();
      if(PH.net<=0||PH.trust<=0){ after(3400, phDefeat); return; }
      if(PH.net<=30||PH.trust<=30) after(3000,()=>phSay('low'));
      after(4200,()=>{ if(mail) mail.classList.add('out-bad'); after(420, phNextMail); });
    }
    phHud();
  });
}
function phRevealClue(m){
  const mail=document.getElementById('phMail'); if(!mail) return;
  if(!m.phish){
    const el=mail.querySelector('.ph-mb');
    if(el){ el.classList.add('clue-pop');
      el.insertAdjacentHTML('beforeend','<span class="clue-tag ok">✅ rien d\'interdit ici</span>'); }
    return;
  }
  const c=m.clues[m.clues.length-1], zone=PH_CLUES[c.k].zone;
  const rv=document.getElementById('phReveal');
  if(rv) rv.outerHTML='<span class="mh-addr pop" id="phAddr">&lt;'+esc(m.mail)+'&gt;</span>';
  let el=mail.querySelector('[data-zone="'+zone+'"]');
  if(zone==='from') el=document.getElementById('phAddr')||el;
  if(zone==='link'){ const lk=mail.querySelector('.mlk');
    if(lk){ lk.insertAdjacentHTML('afterend',' <span class="clue-real">→ '+esc(m.link.real)+'</span>'); el=lk.parentElement; } }
  if(!el) el=mail.querySelector('.ph-mb');
  if(el){ el.classList.add('clue-pop');
    el.insertAdjacentHTML('beforeend','<span class="clue-tag">'+PH_CLUES[c.k].ic+' '+PH_CLUES[c.k].t+'</span>'); }
}
function phVerdict(good, m, gain, bonus, o){
  const a=phArena(); if(!a) return;
  const old=a.querySelector('.ph-verdict'); if(old) old.remove();
  const last=(m.clues||[])[(m.clues||[]).length-1];
  const primaryWhy=m.phish&&last?(PH_CLUES[last.k].ic+' '+last.why):('👍 '+ (m.ok?m.ok.charAt(0).toUpperCase()+m.ok.slice(1):'Rien d\'anormal')+'.');
  const opt=(o&&typeof o==='object')?o:{};
  const extraStr=(typeof o==='string')?o:'';
  let head, clue, extra=extraStr;
  if(good){
    head='✅ <b>Bien vu !</b> +'+gain+' 🪙'+(bonus&&bonus.length?' <span class="pv-b">'+bonus.join(' · ')+'</span>':'');
    clue=opt.pointClue?(PH_CLUES[opt.pointClue.k].ic+' '+opt.pointClue.why):primaryWhy;
  } else if(opt.soft){
    head='🟠 <b>Presque !</b>';
    clue='Tu avais raison de le bloquer, mais <b>'+(PH_ZONE[opt.pickedSafe]||'cette partie')+'</b> est une partie normale.';
    extra=primaryWhy;
  } else if(m.phish){
    head='❌ <b>Raté.</b> Ce mail était un <b>piège</b> — tu l\'as laissé passer.';
    clue=primaryWhy;
  } else {
    head='❌ <b>Raté.</b> Ce mail était <b>honnête</b> : tu as bloqué un vrai message.';
    clue=primaryWhy;
  }
  const v=document.createElement('div'); v.className='ph-verdict '+(good?'good':(opt.soft?'soft':'bad'));
  v.innerHTML=head+'<span class="pv-clue">'+clue+'</span>'+(extra?'<span class="pv-clue">'+extra+'</span>':'');
  a.appendChild(v);
  clearTimeout(PH._verdictT); PH._verdictT=setTimeout(()=>{ try{v.remove();}catch(e){} }, 8200);
}

function phShop(){

      +'<div class="sh-grid">'
      +(avail.length?avail.map(t=>{
        const owned=PH.tools[t.id], can=PH.credits>=t.price;

          +'<span class="shc-h"><span class="shc-ic">'+t.ic+'</span>'+t.name+'</span>'
          +(owned?'':'<span class="shc-new">⚡ '+esc(t.unlock)+'</span>')

          +'<span class="shc-w">⚠️ '+t.warn+'</span>'

      }).join(''):'<span class="sh-none">Aucun outil en rayon pour l\'instant : ils arrivent avec les phases.</span>')
      +'</div><button class="sh-go" id="shGo">Phase suivante ⚔️</button>';
  }
  s.innerHTML=html(); a.appendChild(s);
  function bind(){
    s.querySelectorAll('.sh-card').forEach(b=>b.onclick=()=>{
      const t=PH_TOOLS.find(x=>x.id===b.getAttribute('data-t'));
      if(!t||PH.tools[t.id]) return;
      if(PH.credits<t.price){ beep('bad'); toast('Pas assez de crédits ! Tamponne juste pour en gagner.'); return; }
      PH.credits-=t.price; PH.tools[t.id]=true;

  {id:'colis', who:['#colis'], sub:v=>'Votre colis n° '+v.colisN,

  {id:'ecole', who:['#secr','#vies'], sub:v=>'Document à rapporter avant '+v.jour,
   body:v=>'<p>Bonjour,</p><p>Merci de rapporter le document signé avant <b>'+v.jour+'</b>.</p><p>Le secrétariat reste à votre disposition.</p>'},
  {id:'prof', who:['prof'], sub:v=>'Documents '+matDe(v.who.mat),
   body:v=>'<p>Bonjour,</p><p>Voici les documents '+matDe(v.who.mat)+' pour '+v.jour+'.</p><p>Bonne relecture !</p>'},
  {id:'ville', who:['#biblio','#musee','#mairie'], sub:v=>'Programme des ateliers',
   body:v=>'<p>Bonjour,</p><p>Le programme des ateliers de '+v.jour+' est disponible.</p><p>Inscriptions sur place, à l\'accueil.</p>'}
];
function phDuelPair(){
  const sc=pickOne(PH_DUEL_SC), c=phPickWho(sc.who), v=phVars(c);
  const base={name:c.name, mail:c.mail, date:phDate(), sub:sc.sub(v), body:sc.body(v), sign:c.name, c:c};
  const good=Object.assign({}, base, {phish:false, atts:null, link:null});
  const bad =Object.assign({}, base, {phish:true,  atts:null, link:null, diffs:[]});
  const kit=[
    ()=>{ const f=phFakeMail(c.mail, 2); bad.mail=f.mail;
          bad.diffs.push({ic:'📧', t:'L\'adresse', w:f.why}); },
    ()=>{ good.link=phLink(false,c,2,'btn'); bad.link=phLink(true,c,2,'btn'); bad.link.txt=good.link.txt;
          bad.diffs.push({ic:'🔗', t:'Le bouton', w:'Même texte affiché, mais il mène à <b>'+esc(bad.link.dom)+'</b> au lieu de <b>'+esc(good.link.dom)+'</b>.'}); },
    ()=>{ const a=phAtt(false,v,2); good.atts=[a];
          const b2=phAtt(true,v,2); b2.n=a.n.replace(/\.[a-z]+$/,'')+'.'+a.n.split('.').pop()+'.exe'; b2.ext='exe';
          bad.atts=[b2];
          bad.diffs.push({ic:'📎', t:'La pièce jointe', w:'Le nom finit par <b>.exe</b> : c\'est un programme, pas un document.'}); },
    ()=>{ bad.body=bad.body.replace('</p>','</p><p>Un règlement de <b>'+v.petit+' €</b> est nécessaire pour finaliser.</p>');
          bad.diffs.push({ic:'💶', t:'La demande', w:'Ce message réclame de l\'argent. L\'autre ne demande rien.'}); },
    ()=>{ bad.body=bad.body.replace('</p>','</p><p>Confirmez avec votre <b>identifiant et votre mot de passe</b>.</p>');
          bad.diffs.push({ic:'🔑', t:'La demande', w:'Un mot de passe réclamé par mail : jamais, dans aucun cas.'}); },
    ()=>{ bad.body=bad.body.replace('</p>','</p><p><b>Attention :</b> sans réponse sous <b>'+v.delai+'</b>, l\'accès sera définitivement supprimé.</p>');
          bad.diffs.push({ic:'⏰', t:'Le ton', w:'Une menace et un délai serré, alors que l\'autre message est calme.'}); }
  ];
  const order=shuffle(kit.map((f,i)=>i));
  const n=Math.random()<.55?1:2;
  for(let i=0;i<n;i++) kit[order[i]]();
  return Math.random()<.5?[good,bad]:[bad,good];
}

function phDuelPick(i){
  if(PH.over||PH.duelBusy) return;
  PH.duelBusy=true;
  const pair=PH.duelPair, chosen=pair[i];
  const badI=pair[0].phish?0:1, bad=pair[badI];
  const z=document.getElementById('phPaper');
  const tip=document.getElementById('phTip'); if(tip) tip.remove();
  const correct=!chosen.phish;
  PH.stats.total++; PH.pstats.total++;
  z.querySelector('.dl-mail[data-i="'+badI+'"]').classList.add('is-bad');
  z.querySelector('.dl-mail[data-i="'+(1-badI)+'"]').classList.add('is-ok');
  const diffs='<div class="dl-diffs">'+bad.diffs.map(d=>'<span class="dl-d"><b>'+d.ic+' '+d.t+'</b> '+d.w+'</span>').join('')+'</div>';
  if(correct){
    PH.stats.right++; PH.pstats.right++; PH.streak++;
    PH.credits+=4; PH.pstats.gain+=4;
    beep('coin'); flyPts('+4 🪙', z);
    phVerdictBox(true,'✅ <b>Bien vu !</b> +4 🪙', diffs); phSay('lose');
  } else {
    PH.stats.wrong++; PH.pstats.wrong++; PH.streak=0;
    PH.net=Math.max(0,PH.net-PH_HIT); PH.credits=Math.max(0,PH.credits-3);

    phVerdictBox(false,'❌ <b>Raté.</b> Tu as choisi le mail piégé.', diffs); phSay('win');
  }
  phHud();
  if(PH.net<=0||PH.trust<=0){ after(4200, phDefeat); return; }
  PH.duelIdx++;
  after(correct?3600:5200, phDuelNext);

  modal.innerHTML='<span class="m-emoji">🎣💥</span>'

function reviewing(){ return playIdx<progressIdx; }
let _prevStepIdx=null;
function startStep(idx){
  clearSpots(); clearTimers(); closeMenus();
  ARC.on=false; ARC.over=false; ARC.onEvt=null;
  clearTimeout(ARC.comboT); arcHudRender();
  PH.over=true; stopPhMusic(); /* stoppe un éventuel boss en cours */
  _faultOpen=false;
  playIdx=idx; currentStep=STEPS[idx]; _missionDone=false;
  /* astuces et fautes ne se remettent à zéro qu'en CHANGEANT de mission :
     recommencer la même (bouton ↺ ou fausse manœuvre) garde la note acquise */
  if(_prevStepIdx!==idx){ currentStep._hints=0; currentStep._faults={major:0,minor:0}; }
  _prevStepIdx=idx;
  currentStep._booted=false; currentStep._launched=false;
  currentStep._faults=currentStep._faults||{major:0,minor:0};
  currentStep._gen=(currentStep._gen||0)+1;
  currentStep._objDone=(currentStep.objectives||[]).map(()=>false);
  currentStep._jalonIdx=0; currentStep._jalonAnim=false;
  currentStep._objStale=-1; currentStep._pendingArm=null;
  buildScreen();
  seedMail(currentStep.seed||{});
  if(currentStep.onSendHook) M.onSend=currentStep.onSendHook;
  /* objectifs déjà satisfaits par la graine : ceux-là n'exigent pas de geste
     neuf, sinon la mission resterait bloquée (voir checkMission) */
  const ctx0=buildCtx();
  currentStep._seedSat=(currentStep.objectives||[]).map(o=>goalPasses(o.goal, ctx0));
  currentStep._armSeq=M.evt._seq||0;
  renderAll();
  updateProgress(); updateBanner();
  openRoundPopup();
}
function updateProgress(){
  const track=document.getElementById('track'); track.innerHTML='';
  const starsMap=getStarsMap();
  STEPS.forEach((st,i)=>{
    const d=document.createElement('div');
    const mile=!!st.exam;
    d.className='seg'+(mile?' milestone':'');
    if(i<progressIdx) d.classList.add('done');
    if(i===playIdx) d.classList.add('current');
    if(mile) d.textContent=(st.mode==='boss'?'🎣':'🏆');
    const stn=starsMap[currentLevel+'.'+(i+1)]||0;
    if(stn){ const sp=document.createElement('span'); sp.className='seg-stars'; sp.textContent='⭐'.repeat(stn); d.appendChild(sp); }
    if(i<=progressIdx){
      d.classList.add('clickable');
      d.title=(i===playIdx?'Mission en cours : ':'Revenir à ')+(st.label||'')+' · '+(st.title||'')+(stn?' · '+stn+'⭐':'');
      d.onclick=()=>{ if(i<=progressIdx) startStep(i); };
    }
    track.appendChild(d);
  });
  const shown=Math.min(playIdx+1, STEPS.length);
  document.getElementById('stepCount').textContent='🗺️ Niveau '+currentLevel+' · '+(STEPS[playIdx].label||'')+' ('+shown+'/'+STEPS.length+')';
}

function onMissionWin(){
  beep('win');

  if(reviewing()){
    modal.className='modal good';
    modal.innerHTML='<span class="m-emoji">💪</span><h2>Bien joué !</h2>'

    return;
  }
  /* note : on part de 3 ⭐ et on retire 1 par écart — astuce demandée,
     action non demandée (mineure), fausse manœuvre (majeure). Plancher à 1 ⭐. */
  const _f=currentStep._faults||{major:0,minor:0};
  const _hi=currentStep._hints||0;

    : (_hi ? 'Sans l\'astuce 💡, c\'est ⭐⭐⭐ !' : 'Nickel, facteur. Mission suivante !');

function openOverlay(){
  modal.style.maxWidth='';
  overlay.classList.add('open');
  if(window.ttsDecorateModal) ttsDecorateModal(modal);
}
/* Popups longues : élargir plutôt que faire scroller.
   Sur un écran court, une popup de niveau ou de mission peut déborder et obliger l'élève à
   scroller pour trouver le bouton « C'est parti ». Plutôt que ça, on l'élargit par paliers
   (jusqu'à 1,6× sa largeur normale, sans dépasser l'écran) : le texte tient sur moins de
   lignes et la popup rentre en hauteur. On n'y touche que si elle déborde vraiment, et on
   annule si l'élargissement n'a rien arrangé. À n'appeler que juste après openOverlay() —
   y compris pour le briefing du boss LE PHISHER. */
function fitModalWidth(){
  modal.style.maxWidth='';
  const ov=modal.parentElement; if(!ov) return;
  const base=modal.offsetWidth;                        // offsetWidth : insensible à l'animation (scale)
  if(!base || modal.scrollHeight<=modal.clientHeight+1) return;   // ça tient déjà : rien à faire
  const cs=getComputedStyle(ov);
  const avail=ov.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0);
  const cap=Math.min(base*1.6, avail);
  if(cap<base+40) return;                              // écran trop étroit : on garde le scroll
  const h0=modal.scrollHeight;
  let w=base;
  while(w<cap-1 && modal.scrollHeight>modal.clientHeight+1){
    w=Math.min(w+60,cap); modal.style.maxWidth=w+'px';
  }
  if(modal.scrollHeight>=h0) modal.style.maxWidth='';  // élargir n'a pas aidé : on revient à la normale
}
function closeOverlay(){
  overlay.classList.remove('open');
  if(window.ttsStopCurrent) ttsStopCurrent();
}
let _toastT=null;
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),6000); }
function confetti(){
  const c=document.createElement('div'); c.className='confetti';
  const colors=['#0e7490','#f59e0b','#16a34a','#ef4444','#7c3aed','#06b6d4'];
  for(let i=0;i<80;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(2.2+Math.random()*1.6)+'s';
    p.style.animationDelay=(Math.random()*.5)+'s';
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(()=>{ c.remove(); }, 4800);
}

let _spots=[], _spotT=null;
function spotEl(el){
  if(!el || _spots.indexOf(el)>=0) return;
  el.classList.add('spot'); _spots.push(el);
  try{ el.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'}); }catch(e){}
}
function clearSpots(){ clearTimeout(_spotT); _spots.forEach(el=>el.classList.remove('spot')); _spots=[]; }
/* traduit un « spot » large en élément de l'écran */
function spotZone(spot){
  const q=s=>document.querySelector(s);
  if(spot==='list')          return q('#mailList');
  if(spot==='folders')       return q('#ccFolders');
  if(spot==='addfolder')     return q('#btnAddFolder');
  if(spot==='reader')        return q('#rdActions')||q('#reader');
  if(spot==='search')        return q('#ccSearchBox');
  if(spot==='filter')        return q('#btnFilter');
  if(spot==='sort')          return q('#btnSort');
  if(spot==='settings')      return q('#btnSettings');
  if(spot==='quiz')          return q('#quizDock');
  if(spot==='toolbar')       return q('#cmpTools')||q('#btnNew');
  if(spot==='compose')       return q('#cmpWin')||q('#btnNew');
  if(spot==='contacts')      return q('#ccNav [data-view="contacts"]');
  if(spot==='agenda')        return M.view==='agenda'?q('.cc-agenda'):q('#ccNav [data-view="agenda"]');
  return null;
}
/* dernier recours : on fait toujours briller QUELQUE CHOSE d'utile, jamais rien.
   Une fenêtre ouverte passe avant le reste (c'est là que ça se joue). */
function spotFallback(){
  const q=s=>document.querySelector(s);
  return q('.ccdlg')||q('#cmpWin')||q('.ccwin')
    ||(M.view==='agenda'?q('.cc-agenda'):null)
    ||(M.view==='contacts'?q('#ccMain'):null)
    ||q('#rdActions')||q('#mailList')||q('#ccapp');
}
function highlightForStep(){
  clearSpots();
  const s=currentStep; if(!s) return;
  /* --- examens et défis : on éclaire l'ordre en cours et sa zone d'action --- */
  if(s.kind==='game'){
    const st=(typeof ARC!=='undefined' && ARC.on && !ARC.over) ? ARC.curStep : null;
    let el=null;
    if(st && st.sel){ try{ el = typeof st.sel==='function' ? st.sel() : document.querySelector(st.sel); }catch(e){ el=null; } }
    if(!el && st && st.spot) el=spotZone(st.spot);
    spotEl(document.getElementById('ahOrder'));
    spotEl(el||spotFallback());
    if(_spots.length) _spotT=setTimeout(clearSpots, 8000);
    return;
  }
  const o=activeObj(); if(!o || !o.goal) return;
  /* priorité au sélecteur précis du bon bouton (goal.sel) ; le "spot" large sert de repli */
  let el=null;
  if(o.goal.sel){
    try{ el = typeof o.goal.sel==='function' ? o.goal.sel() : document.querySelector(o.goal.sel); }catch(e){ el=null; }
  }
  if(!el) el=spotZone(o.goal.spot);
  spotEl(el||spotFallback());
  if(_spots.length) _spotT=setTimeout(clearSpots, 8000);
}
function onHint(){
  if(overlay.classList.contains('open')) return;
  const s=currentStep; if(!s) return;
  s._hints=(s._hints||0)+1;
  const game=s.kind==='game';
  const ao=activeObj();
  const st=(game && typeof ARC!=='undefined' && ARC.on && !ARC.over) ? ARC.curStep : null;
  let hintTxt=game
    ? ((st && (st.hint||st.sub)) || s.hint || 'Suis la consigne affichée sur l\'écran !')
    : ((ao && ao.goal && ao.goal.hint) ? ao.goal.hint : stripTags((ao&&ao.t)||''));
  /* cas « déjà fait trop tôt » : on explique qu'il faut refaire le geste maintenant.
     À l'écran on garde AUSSI la marche à suivre ; la voix, elle, lit le clip
     pré-généré qui explique le pourquoi (l'audio doit rester un clip connu). */
  const stale=(!game && s._objStale===s._jalonIdx);
  const baseHint=hintTxt;
  if(stale){
    hintTxt='Tu l\'as déjà fait <b>avant</b> qu\'on te le demande : ça ne compte pas. '
      +'Refais le geste maintenant que c\'est l\'objectif affiché.<br><br>'+hintTxt;
  }
  const hintTitle=s.title||'Astuce';
  modal.className='modal test-modal';
  modal.innerHTML='<span class="m-emoji">💡</span><div class="kicker" style="color:var(--amber-d)">Astuce</div>'
    +'<h2>'+hintTitle+'</h2>'
    +'<div class="howto test"><p class="h-head">👉 Comment faire :</p><p>'+hintTxt+'</p></div>'
    +'<p style="font-size:.95rem;color:var(--muted)">Les éléments importants vont <b>briller en jaune</b> ✨ sur l\'écran.</p>'
    +'<div class="m-actions"><button class="m-btn primary test" id="hintGo">Montre-moi ✨</button></div>';
  modal.dataset.ttsText = stale
    ? ((window.TTS_STATIC||{}).hint_stale || '')
    : (hintTitle + '. ' + baseHint);
  openOverlay();
  document.getElementById('hintGo').onclick=()=>{ closeOverlay(); highlightForStep(); };
}
