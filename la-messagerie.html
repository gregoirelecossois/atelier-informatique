  }
  let lvl=parseInt(store.get('ml_curlevel')||'1',10);
  if(isNaN(lvl)||lvl<1||lvl>LEVELS.length) lvl=1;
  lvl=Math.min(lvl, getUnlocked());
  loadLevel(lvl, getSavedStep(lvl), !go);
})();

/* ---------------------------------------------------------
   19. ACCÈS DÉVELOPPEUR
   --------------------------------------------------------- */
(function devkit(){
  const UNLOCK='ml_unlocked', CUR='ml_curlevel', STEP='ml_step_l', HOME='la-messagerie.html';
  const css=`
  #devkit{position:fixed;right:14px;bottom:14px;z-index:300;font-family:"Nunito",system-ui,"Fluent Emoji",sans-serif;}
  #devkit .dk-toggle{display:inline-flex;align-items:center;gap:6px;background:#1e2733;color:#e7eef6;border:none;
    border-radius:999px;padding:9px 14px;font-weight:800;font-size:.85rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28);}
  #devkit .dk-toggle:hover{background:#2a3645;}
  #devkit .dk-panel{display:none;position:absolute;right:0;bottom:48px;width:320px;max-height:72vh;overflow:auto;
    background:#1e2733;color:#e7eef6;border-radius:14px;padding:12px 12px 14px;box-shadow:0 16px 40px rgba(0,0,0,.42);}
  #devkit.open .dk-panel{display:block;}
  #devkit .dk-head{font-weight:800;font-size:.95rem;margin:0 0 2px;}
  #devkit .dk-note{color:#9fb0c4;font-size:.72rem;margin:0 0 6px;line-height:1.35;}
  #devkit .dk-lv{font-weight:800;color:#9fc3ff;margin:11px 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;}
  #devkit .dk-step{display:block;width:100%;text-align:left;background:#2b3949;color:#e7eef6;border:1px solid #3a4a5c;
    border-radius:8px;padding:6px 9px;margin:3px 0;cursor:pointer;font-size:.78rem;line-height:1.3;}
  #devkit .dk-step:hover{background:#37485c;border-color:#5a7088;}
  #devkit .dk-step.exam{border-color:#f6b73c;}
  #devkit .dk-step b{color:#ffd479;}
  #devkit .dk-actions{display:flex;gap:6px;margin-top:12px;}
  #devkit .dk-act{flex:1;background:#33455a;color:#e7eef6;border:1px solid #44586e;border-radius:8px;padding:7px;
    font-weight:700;font-size:.74rem;cursor:pointer;}
  #devkit .dk-act:hover{background:#3d5167;}`;
  const style=document.createElement('style'); style.textContent=css; document.head.appendChild(style);
  const root=document.createElement('div'); root.id='devkit';
  let html='<button class="dk-toggle" id="dkToggle">🛠️ Dev</button>'
    +'<div class="dk-panel"><p class="dk-head">🛠️ Accès développeur</p>'
    +'<p class="dk-note">Saute à une mission : tout ce qui précède est considéré comme réussi.</p>';
  LEVELS.forEach(lv=>{
    html+='<div class="dk-lv">Niveau '+lv.n+' — '+lv.title+'</div>';
    lv.rounds.forEach((d,i)=>{
      html+='<button class="dk-step'+(d.exam?' exam':'')+'" data-l="'+lv.n+'" data-s="'+i+'"><b>'+(d.label||('Mission '+(i+1)))+'</b> · '+(d.title||'')+'</button>';
    });
  });
  html+='<div class="dk-actions"><button class="dk-act" id="dkUnlockAll">🔓 Tout débloquer</button>'
    +'<button class="dk-act" id="dkReset">🧹 Reset complet</button></div></div>';
  root.innerHTML=html; document.body.appendChild(root);
  function devJump(L,S){
    L=Math.max(1,Math.min(LEVELS.length,L));
    const maxS=LEVELS[L-1].rounds.length-1; S=Math.max(0,Math.min(maxS,S||0));
    store.set(UNLOCK, String(Math.max(getUnlocked(),L))); store.set(CUR, String(L)); store.set(STEP+L, String(S));
    closeOverlay(); loadLevel(L,S,false);
  }
  // Petit verrou enseignant : rien de sensible, juste éviter qu'un élève ouvre le
  // panneau par curiosité. Le mot de passe est retenu pour la session de l'onglet.
  function dkAuth(){
    try{ if(sessionStorage.getItem('dk_auth')==='1') return true; }catch(e){}
    const a=prompt('Espace enseignant — mot de passe :');
    if(a==='dev35'){ try{ sessionStorage.setItem('dk_auth','1'); }catch(e){} return true; }
    if(a!==null) alert('Mot de passe incorrect.');
    return false;
  }
  document.getElementById('dkToggle').onclick=()=>{
    if(!root.classList.contains('open') && !dkAuth()) return;
    root.classList.toggle('open');
  };
  root.querySelectorAll('.dk-step').forEach(b=>b.onclick=()=>{ root.classList.remove('open'); devJump(+b.getAttribute('data-l'), +b.getAttribute('data-s')); });
  document.getElementById('dkUnlockAll').onclick=()=>{ store.set(UNLOCK, String(LEVELS.length)); refreshLevelBtn(); };
  document.getElementById('dkReset').onclick=()=>{
    // Balayage par PRÉFIXE plutôt qu'une liste de clés : une liste finit toujours par
    // oublier une clé ajoutée plus tard (étoiles, carnet, largeur du panneau…), et le
    // reset paraît alors « incomplet ». Ici, tout ce qui commence par ml_ disparaît.
    wipe('ml_');
    // « Reset complet » remet aussi les trophées à zéro, pour rejouer la popup du premier
    if(window.Badges) Badges.reset();
    location.href=HOME;
  };
})();
</script>

  var btn=document.createElement('button');
  btn.type='button'; btn.className='dys-toggle';
  btn.innerHTML='<span class="dys-ic" aria-hidden="true">🔤</span><span class="dys-label">Mode Dys</span><span class="dys-switch"><span class="dys-knob"></span></span>';
  function apply(on){ root.classList.toggle('dys',on); btn.setAttribute('aria-pressed',on?'true':'false');
    btn.title=on?'Mode Dyslexique activé — clique pour revenir à la police normale':'Activer le Mode Dyslexique (police OpenDyslexic)'; }
  btn.addEventListener('click',function(){ var want=!root.classList.contains('dys'); Store.set(KEY,want?'1':'0'); apply(want); });
  document.body.appendChild(btn);
  var on=Store.get(KEY)==='1'; apply(on);
})();
