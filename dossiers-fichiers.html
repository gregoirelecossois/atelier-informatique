/* construit, à partir des objectifs, la liste des actions destructives autorisées */
function buildGuard(step){
  const g={del:[], ren:[], mov:[], restoreTargets:[]};
  (step.objectives||[]).forEach(o=>{
    if(o.del) g.del=g.del.concat(o.del);
    if(o.ren) g.ren=g.ren.concat(o.ren);
    if(o.mov) g.mov=g.mov.concat(o.mov);
    // deletedTogether / lassoDeleted : les noms sont dans le goal lui-même
    if(o.goal && o.goal.togetherNames) g.del=g.del.concat(o.goal.togetherNames);
    if(o.goal && o.goal.restoreTarget) g.restoreTargets.push(o.goal.restoreTarget);
  });
  return g;
}
function _allowed(rec, list){ return list.some(a=>a===rec.name || a===rec.display); }
/* détecte une action « hors objectif » : suppression / renommage / déplacement
   d'un élément du décor (seeded) qui n'était pas demandé, ou suppression définitive
   (corbeille vidée / « Supprimer définitivement ») d'un fichier qu'il fallait restaurer.
   Renvoie le type ou null. */
function missionViolation(){
  if(!currentStep || currentStep.mode==='boss' || reviewing() || _missionDone) return null;
  const g=currentStep._guard; if(!g) return null;
  for(const r of (EX.evt.dels||[])){ if(r.seeded && !_allowed(r, g.del)) return 'delete'; }
  for(const r of (EX.evt.rens||[])){ if(r.seeded && !_allowed({name:r.from, display:r.from}, g.ren)) return 'rename'; }
  for(const r of (EX.evt.movs||[])){ if(r.seeded && !_allowed(r, g.mov)) return 'move'; }
  for(const r of (EX.evt.permaDels||[])){ if(_allowed(r, g.restoreTargets)) return 'permaDelete'; }
  return null;
}
function missionFail(type){
  beep('bad');
  const map={
    delete:'Tu as <b>supprimé</b> un élément qui n\'était pas demandé.',
    rename:'Tu as <b>renommé</b> un élément que tu ne devais pas toucher.',
    move:'Tu as <b>déplacé</b> un élément qui n\'était pas dans l\'objectif.',
    permaDelete:'Tu as supprimé <b>définitivement</b> un fichier qu\'il fallait restaurer.'
  };
  modal.className='modal warn';
  modal.innerHTML='<span class="m-emoji">🧭</span><h2>Ce n\'était pas l\'objectif !</h2>'
    +'<p>'+(map[type]||'Tu as fait <b>autre chose</b> que l\'objectif affiché en haut.')
    +' Pas de souci : on <b>recommence la mission</b> depuis le début, et on refait les objectifs <b>un par un</b>.</p>'
    +'<p style="font-size:.95rem;color:var(--muted)">Besoin d\'aide ? Le bouton <b>💡 Astuce</b> te montre quoi faire.</p>'
    +'<div class="m-actions"><button class="m-btn primary test" id="failRetry">↺ Recommencer la mission</button></div>';
  modal.dataset.ttsText = (map[type]||"Tu as fait autre chose que l'objectif affiché en haut.");
  openOverlay();
  document.getElementById('failRetry').onclick=()=>{ closeOverlay(); startStep(playIdx); };
}
/* mauvaise méthode utilisée pour atteindre le dossier cible d'un objectif (ex: fil d'Ariane au lieu de ⬆) :
   on ne recommence pas toute la mission, on relance juste cet objectif */
function wrongMethodFail(goal){
  beep('bad');
  modal.className='modal warn';
  modal.innerHTML='<span class="m-emoji">🧭</span><h2>Pas par là !</h2>'
    +'<p>'+(goal.hint||'Il faut utiliser la méthode demandée par l\'objectif.')+'</p>'
    +'<div class="m-actions"><button class="m-btn primary test" id="failRetry">↺ Réessayer</button></div>';
  modal.dataset.ttsText = goal.hint || "Il faut utiliser la méthode demandée par l'objectif.";
  openOverlay();
  document.getElementById('failRetry').onclick=()=>{ closeOverlay(); retryObjective(); };
}
function captureObjStart(){
  const ctx=buildCtx();
  currentStep._objStartNode = ctx.win ? ctx.win.cur : null;
}
function retryObjective(){
  const ctx=buildCtx();
  if(ctx.win && currentStep._objStartNode) navTo(ctx.win, currentStep._objStartNode);
  ['usedUp','usedBack','usedFwd','usedCrumb','usedNavPane'].forEach(k=>{ delete EX.evt[k]; });
  _missionDone=false;
}
function checkMission(){
  if(_seeding) return;
  if(!currentStep || currentStep.mode==='boss') return;
  if(_missionDone) return;
  const v=missionViolation();
  if(v){ _missionDone=true; setTimeout(()=>missionFail(v), 200); return; }
  const objs=currentStep.objectives; if(!objs || !objs.length) return;
  if(currentStep._jalonAnim) return;
  const ctx=buildCtx();
  const i=currentStep._jalonIdx;
  if(i<objs.length && !currentStep._objDone[i]){
    const goal=objs[i].goal;
    // vérification partielle pour deletedTogether : si certains fichiers sont dans la corbeille
    // mais pas tous → l'utilisateur les a supprimés un par un → recommencer la mission
    if(goal.togetherNames){
      const inBin=goal.togetherNames.filter(n=>ctx.bin.some(b=>b.name===n||displayName(b)===n));
      if(inBin.length>0 && inBin.length<goal.togetherNames.length){
        _missionDone=true;
        setTimeout(()=>{
          beep('bad');
          modal.className='modal warn';
          const isLasso=goal.lasso;
          modal.innerHTML='<span class="m-emoji">'+(isLasso?'🖱️':'🤝')+'</span>'
            +'<h2>'+(isLasso?'Il faut entourer tous les fichiers !':'Il faut tout sélectionner d\'abord !')+'</h2>'
            +'<p>'+(isLasso
              ? 'Tu as supprimé des fichiers <b>un par un</b>. Pour cette mission, tu dois <b>entourer tous les fichiers au lasso</b> (clique dans un coin vide et glisse ta souris pour tout encadrer), puis appuyer sur '+kbd('Suppr')+' une seule fois.'
              : 'Tu les as supprimés <b>un par un</b>. Pour cette mission, tu dois sélectionner <b>tous les fichiers en même temps</b> ('+kbd('Ctrl')+'+clic sur chacun, ou entoure-les au <b>lasso</b>), puis supprimer d\'un seul coup.'
            )+'</p>'
            +'<div class="m-actions"><button class="m-btn primary test" id="failRetry">↺ Recommencer la mission</button></div>';
          openOverlay();
          document.getElementById('failRetry').onclick=()=>{ closeOverlay(); startStep(playIdx); };
        }, 300);
        return;
      }
    }
    if(goal.test(ctx)){
      currentStep._objDone[i]=true; beep('good'); jalonAdvanceDF();
    } else if(goal.viaMethod && ctx.win && ctx.win.cur.name===goal.viaTarget && !ctx.evt[goal.viaMethod]){
      _missionDone=true;
      setTimeout(()=>wrongMethodFail(goal), 200);
    }
  }
}
function renderJalonObjective(enter){
  const sub=document.getElementById('bSub'); if(!sub) return;
  const s=currentStep, objs=s.objectives||[], i=s._jalonIdx, n=objs.length;
  const blue = s.kind!=='jalon';   // missions normales = bleu ; défis = orange
  sub.innerHTML='<div class="jalon-head"><span class="b-goal-label">Objectif '+(Math.min(i+1,n))+' / '+n+'</span></div>'
    +'<div class="jalon-wrap"><div class="jalon-obj'+(blue?' blue':'')+(enter?' entering':'')+'"><span class="jo-check">'+(i+1)+'</span><span class="jo-text">'+(objs[i]&&objs[i].t||'')+'</span></div></div>';
  if(enter) requestAnimationFrame(()=>{ const el=sub.querySelector('.jalon-obj'); if(el) el.classList.remove('entering'); });
}
function jalonAdvanceDF(){
  currentStep._jalonAnim=true;
  const sub=document.getElementById('bSub'); const el=sub&&sub.querySelector('.jalon-obj');
  if(el){ el.classList.add('done'); const ck=el.querySelector('.jo-check'); if(ck) ck.textContent='✓'; }
  setTimeout(()=>{ if(el) el.classList.add('slideup'); }, 520);
  setTimeout(()=>{
    currentStep._jalonIdx++;
    currentStep._jalonAnim=false;
    const objs=currentStep.objectives||[];
    if(currentStep._jalonIdx>=objs.length){ _missionDone=true; onMissionWin(); return; }
    captureObjStart();
    renderJalonObjective(true);
    // cascade : si l'objectif révélé est déjà rempli (action faite en avance), on enchaîne
    setTimeout(checkMission, 260);
  }, 980);
}
function activeObj(){
  const objs=(currentStep&&currentStep.objectives)||[]; if(!objs.length) return null;
  return objs[Math.min(currentStep._jalonIdx||0, objs.length-1)];
}

/* ---------------------------------------------------------
   12. CHARGEMENT D'UNE MISSION (graine → écran)
   --------------------------------------------------------- */
function seedWorld(seed){
  _seeding=true;
  _uid=1;
  EX.desktopRoot=buildNode(folder('Bureau', (seed.desktop||[]).slice()), null);
  BUREAU=EX.desktopRoot;
  BIN=buildNode(folder('Corbeille', (seed.bin||[]).map(b=>Object.assign({},b))), null);
  EX.binNode=BIN; BIN.isBin=true; BIN.parent=null; BIN.locked=true;
  EX.windows.forEach(w=>{ if(w.el) w.el.remove(); });
  EX.windows=[]; EX.focusedWin=null; EX.winSeq=0;
  EX.sel=new Set(); EX.selBox=null; EX.clip=null; EX.opened=new Set();
  EX.evt={};
  buildScreen();
  renderDesktop(); renderTaskbar();
  // ouverture automatique d'une fenêtre + navigation initiale
  if(seed.open){
    const target=EX.desktopRoot.kids.find(k=>k.name===seed.open);
    if(target){
      const w=openWindow(target, {evt:false});
      EX.evt.openedAny=false;
      if(seed.go){ seed.go.forEach(nm=>{ const sub=(w.cur.kids||[]).find(k=>k.name===nm); if(sub) navTo(w, sub); }); }
      if(seed.back){ for(let i=0;i<seed.back;i++) navBack(w); EX.evt.usedBack=false; }
      if(seed.minimize){ w.min=true; }
      renderAll();
    }
  }
  // remise à zéro des drapeaux d'évènements pour la mission
  EX.evt={};
  if(EX.windows.length) EX.evt.everHadWindow=true;
  _seeding=false;
}

/* ---------------------------------------------------------
   13. DÉROULÉ (flow) — repris du modèle des autres ateliers
   --------------------------------------------------------- */
function reviewing(){ return playIdx<progressIdx; }
function loadLevel(n, stepIdx, showIntro){
  n=Math.max(1,Math.min(LEVELS.length,n));
  currentLevel=n; const lvl=LEVELS[n-1];
  STEPS=lvl.rounds;
  progressIdx=(typeof stepIdx==='number')?stepIdx:getSavedStep(n);
  if(isNaN(progressIdx)||progressIdx<0) progressIdx=0;
  if(progressIdx>STEPS.length) progressIdx=STEPS.length;
  document.getElementById('lvlTitle').innerHTML='Dossiers et fichiers <span class="dot">·</span> '+lvl.subtitle;
  store.set('df_curlevel', String(n));
  refreshLevelBtn();
  const startIdx=Math.min(progressIdx, STEPS.length-1);
  const isBossLevel=STEPS[startIdx]&&STEPS[startIdx].mode==='boss';
  if(showIntro && !isBossLevel) openLevelIntro(n, ()=>startStep(startIdx));
  else startStep(startIdx);
}
function startStep(idx){
  clearSpots();
  playIdx=idx; currentStep=STEPS[idx]; _missionDone=false;
  currentStep._objDone=(currentStep.objectives||[]).map(()=>false);
  currentStep._jalonIdx=0; currentStep._jalonAnim=false;
  currentStep._guard=buildGuard(currentStep);
  if(currentStep.mode==='boss'){ seedWorld(bossSeed()); updateProgress(); updateBanner(); openBossBriefing(); return; }
  const seed=currentStep.seed && currentStep.seed.custom ? makeSeed(currentStep.seed.custom) : (currentStep.seed||{desktop:homeTree()});
  seedWorld(seed);
  captureObjStart();
  updateProgress(); updateBanner();
  openRoundPopup();
}
function updateProgress(){
  const track=document.getElementById('track'); track.innerHTML='';
  STEPS.forEach((st,i)=>{
    const d=document.createElement('div');
    const mile=st.kind==='jalon';
    d.className='seg'+(mile?' milestone':'');
    if(i<progressIdx) d.classList.add('done');
    if(i===playIdx) d.classList.add('current');
    if(mile) d.textContent=(st.mode==='boss'?'👾':'🏆');
    if(i<=progressIdx){
      d.classList.add('clickable');
      d.title=(i===playIdx?'Mission en cours : ':'Revenir à ')+(st.label||'')+' · '+(st.title||'');
      d.onclick=()=>{ if(i<=progressIdx) startStep(i); };
    }
    track.appendChild(d);
  });
  const shown=Math.min(playIdx+1, STEPS.length);
  document.getElementById('stepCount').textContent='Niveau '+currentLevel+' · '+(STEPS[playIdx].label||'')+' ('+shown+'/'+STEPS.length+')';
}
function updateBanner(){
  const b=document.getElementById('banner');
  b.className='banner'+(currentStep.mode==='boss'?' boss':(currentStep.kind==='jalon'?' test':''))+(reviewing()?' review':'');
  document.getElementById('bEmoji').textContent=currentStep.emoji;
  document.getElementById('bTitle').textContent=(reviewing()?'Révision · ':'')+(currentStep.label||'')+' : '+(currentStep.title||'');
  if(currentStep.objectives && currentStep.objectives.length) renderJalonObjective(false);
  else document.getElementById('bSub').innerHTML='<span class="b-goal-label">Objectif :</span> '+stripTags(currentStep.desc||'');
}
function stripTags(s){ return s.replace(/<[^>]+>/g,''); }
function refreshLevelBtn(){ const b=document.getElementById('levelBtn'); if(b) b.textContent='🗺️ Niveau '+currentLevel+'/'+LEVELS.length; }

  const lvl=LEVELS[n-1], it=lvl.intro;

function onMissionWin(){
  beep('win');
  if(reviewing()){
    modal.className='modal good';
    modal.innerHTML='<span class="m-emoji">💪</span><h2>Bien joué !</h2>'
      +'<p>Tu as refait cette mission. On revient à <b>ta mission en cours</b>, ta progression est gardée.</p>'
      +'<div class="m-actions"><button class="m-btn primary green" id="bk">Revenir à ma mission</button></div>';
    modal.dataset.ttsText = (window.TTS_STATIC||{}).win_review || '';
    openOverlay(); document.getElementById('bk').onclick=()=>{ closeOverlay(); startStep(progressIdx); };
    return;
  }
  const last=playIdx===STEPS.length-1;
  if(last){ progressIdx=STEPS.length; saveProgress(); return levelComplete(); }
  progressIdx=Math.max(progressIdx, playIdx+1); saveProgress();
  const jalon=currentStep.kind==='jalon';
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">'+(jalon?'🏆':'✅')+'</span>'
    +'<h2>'+(jalon?'Défi réussi !':'Mission réussie !')+'</h2>'
    +'<p>'+(jalon?'Bravo, tu maîtrises ! Passe à la suite.':'Super, tu progresses bien. En route pour la mission suivante !')+'</p>'
    +'<div class="m-actions"><button class="m-btn primary green" id="next">Continuer →</button></div>';
  modal.dataset.ttsText = (window.TTS_STATIC||{})[jalon?'win_jalon':'win_mission'] || '';
  openOverlay(); if(jalon) confetti();
  document.getElementById('next').onclick=()=>{ closeOverlay(); startStep(playIdx+1); };
}
function levelComplete(){
  if(currentLevel>=LEVELS.length) return courseFinish();
  const nextN=currentLevel+1;
  store.set('df_unlocked', String(Math.max(getUnlocked(), nextN)));
  store.set('df_step_l'+nextN, '0');
  refreshLevelBtn(); confetti();
  const lvl=LEVELS[nextN-1];
  modal.className='modal good';
  modal.innerHTML='<span class="m-emoji">🎉</span>'
    +'<div class="kicker" style="color:var(--green-d)">Niveau '+nextN+' débloqué</div>'
    +'<h2>Bravo, tu passes au Niveau '+nextN+' !</h2>'
    +'<p>Tu as terminé le <b>Niveau '+currentLevel+'</b>. Prochaine étape : <b>'+lvl.title+'</b> !</p>'
    +'<div class="m-actions">'
    +'<a class="m-btn ghost" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">🏠 Accueil</a>'
    +'<button class="m-btn primary green" id="goNextLvl">Aller au Niveau '+nextN+' →</button></div>';
  modal.dataset.ttsText = (window.TTS_STATIC||{}).unlocked || '';
  openOverlay();
  document.getElementById('goNextLvl').onclick=()=>{ closeOverlay(); loadLevel(nextN,0,true); };
}

  modal.className='modal';
  const cards=LEVELS.map(lv=>{

    const badge=locked?'🔒':(lv.n<currentLevel?'✓':'▶');
    return '<button class="lvl-card'+(locked?' locked':'')+(cur?' current':'')+'" data-n="'+lv.n+'" '+(locked?'disabled':'')+'>'
      +'<span class="lc-badge">'+badge+'</span><span class="lc-n">Niveau '+lv.n+'</span><span class="lc-t">'+lv.title+'</span></button>';

/* ---- boucle principale ---- */
function bossTick(ts){
  if(!EX.boss || !EX.boss.running) return;
  EX.boss.raf=requestAnimationFrame(bossTick);
  if(!EX.boss.last) EX.boss.last=ts;
  const dt=Math.min(0.1,(ts-EX.boss.last)/1000); EX.boss.last=ts;
  if(bossPaused() || EX.boss.busy) return;   // un briefing/une astuce est ouvert → on met le danger en pause
  if(!EX.boss.coreFelled){
    addContam(EX.boss.diff.rate*dt);
    EX.boss.saboT+=dt*1000;
    if(EX.boss.saboT>=bossSaboInterval()){ EX.boss.saboT=0; bossSabotage(); }
  }
  // logique de la phase en cours
  if(EX.boss.phase && EX.boss.phase.tick) EX.boss.phase.tick();
  updateContamUI();
  if(EX.boss.contam>=100 && !EX.boss.coreFelled) return bossGameOver();
}
function bossSaboInterval(){
  const base=12000*EX.boss.diff.saboMul*(1-EX.boss.phaseIdx*0.06);
  return Math.max(6500, base);

/* ---- sabotage : surtout des fausses erreurs, la lutte terminal et la tempête.
   Les déplacements / fermetures sont RARES et toujours ANNONCÉS 6 s à l'avance. ---- */
function bossSabotage(){
  if(bossPaused()||EX.boss.busy||EX.boss.saboLock) return;
  const av=document.getElementById('corrAvatar'); if(av){ av.classList.remove('sabotage'); void av.offsetWidth; av.classList.add('sabotage'); }
  const now=Date.now(), cd=EX.boss.cooldowns, key=EX.boss.phase&&EX.boss.phase.key;
  const pool=['fake','fake'];                                   // léger, fréquent
  if(now-(cd.struggle||0) > 26000) pool.push('struggle','struggle');
  if(now-(cd.storm||0)    > 42000) pool.push('storm');
  if(key!=='cache' && now-(cd.teleport||0) > 24000) pool.push('teleport');
  if(now-(cd.closeAll||0) > 75000 && EX.windows.some(w=>!w.min)) pool.push('closeAll');   // rare
  const pick=pool[Math.floor(Math.random()*pool.length)];
  beep('bad');
  if(pick==='fake'){ bossFakeError(); if(Math.random()<0.4) setTimeout(()=>bossFakeError(),220); addContam(1.2); }
  else if(pick==='struggle'){ cd.struggle=now; bossDisconnectStruggle(); }
  else if(pick==='storm'){ cd.storm=now; bossErrorStorm(); }
  else if(pick==='teleport'){ cd.teleport=now; bossWarnThen({
    title:'⚠️ Alerte sécurité', warn:'CORRUPTUS va te <b>déplacer</b> dans un autre dossier dans',
    act:bossActTeleport }); }
  else if(pick==='closeAll'){ cd.closeAll=now; bossWarnThen({
    title:'⚠️ Alerte sécurité', warn:'CORRUPTUS va <b>fermer toutes tes fenêtres</b> dans',
    act:bossActCloseAll }); }
}

    +'<div class="cmd-prompt"><span class="ps">C:\\&gt;</span><span>tape&nbsp;:</span>'
    +'<span class="cmd-cmdname" id="cmdName"></span>'
    +'<input class="cmd-input" id="cmdInput" autocomplete="off" spellcheck="false" placeholder="ta commande puis Entrée"></div>'
    +'</div></div>';
  screen.appendChild(ov);
  const fillEl=ov.querySelector('#discFill'), lblEl=ov.querySelector('#discLbl'), barEl=ov.querySelector('#discBar'),
        nameEl=ov.querySelector('#cmdName'), progEl=ov.querySelector('#cmdProg'), inp=ov.querySelector('#cmdInput');
  const norm=s=>(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  function refresh(){ nameEl.textContent=queue[idx].toUpperCase(); progEl.textContent='Commandes réussies : '+idx+' / '+N+' ✅'; }
  function paint(){ fillEl.style.width=Math.min(100,prog)+'%'; lblEl.textContent=Math.round(Math.min(100,prog))+' %'; barEl.classList.toggle('crit',prog>=70); }
  // Bloque tous les clics sur l'overlay pour maintenir le focus sur l'input
  ov.addEventListener('pointerdown', e=>{ e.stopPropagation(); e.preventDefault(); try{inp.focus();}catch(ex){} }, true);
  ov.addEventListener('mousedown', e=>{ e.stopPropagation(); e.preventDefault(); try{inp.focus();}catch(ex){} }, true);
  inp.addEventListener('blur', ()=>{ setTimeout(()=>{ try{inp.focus();}catch(ex){} }, 30); });
  refresh(); paint(); setTimeout(()=>{ try{inp.focus();}catch(e){} },60);
  function finish(win){
    clearInterval(iv); try{ov.remove();}catch(e){}
    EX.boss.busy=false; EX.boss.saboLock=false; EX.boss.last=0;
    if(win){ beep('win'); updateContamUI(); toast('✅ Connexion rétablie !'); }
  }
  const step=10000/fillMs;   // % ajouté toutes les 100 ms
  const iv=setInterval(()=>{
    if(!EX.boss||!EX.boss.running){ clearInterval(iv); return; }
    prog+=step;
    if(prog>=100){ prog=0; addContam(EX.boss.diff.discPen); updateContamUI(); beep('bad'); pulseScreen();
      if(EX.boss.contam>=100){ finish(false); return bossGameOver(); } }
    paint();
  }, 100);
  (EX.boss.timers=EX.boss.timers||[]).push(iv);
  inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key!=='Enter') return;
    e.preventDefault();
    if(norm(inp.value)===norm(queue[idx])){
      inp.value=''; prog=0; paint(); idx++; beep('good');
      if(idx>=N){ finish(true); return; }
      refresh();
    } else { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); beep('bad');
      toast('Commande incorrecte. Tape bien : '+queue[idx].toUpperCase()); }
  });
}

/* ---- enchaînement des phases ---- */
function goPhase(i){
  if(!EX.boss||!EX.boss.running) return;
  EX.boss.phaseIdx=i; EX.boss.busy=false;
  const def=BOSS_PHASES[i];
  showPhaseBriefing(def, ()=>{ EX.boss.skills.add(def.skill); def.start(); updatePhaseLbl(); });
}
function showPhaseBriefing(def, start){
  EX.boss.busy=true;
  modal.className='modal boss-modal';
  modal.innerHTML='<span class="m-emoji">'+def.emoji+'</span>'
    +'<div class="kicker" style="color:var(--red-d)">Phase '+(EX.boss.phaseIdx+1)+'/'+EX.boss.phasesTotal+'</div>'
    +'<h2>'+def.title+'</h2>'
    +'<div class="howto boss"><p>'+def.how+'</p></div>'
    +'<div class="btuto" id="btuto"></div>';
  modal.dataset.ttsText = def.title + '. ' + def.how;
  openOverlay();
  const launch=()=>{ closeOverlay(); EX.boss.busy=false; start(); };
  const builder=BOSS_TUTOS[def.tuto];
  if(builder){ builder(document.getElementById('btuto'), launch); }
  else { const a=document.createElement('div'); a.className='m-actions';

    modal.appendChild(a); document.getElementById('phGo').onclick=launch; }
}

function tutoClean(host, start){
  const items=[{ic:'🦠',red:true},{ic:'📄',red:false},{ic:'🦠',red:true}];
  let selIdx=null; let kbListener=null;
  function cleanup(){ if(kbListener){ document.removeEventListener('keydown',kbListener,true); kbListener=null; } }
  function win(){ cleanup(); closeCtx(); btutoWin(host,start); }
  function armKeyboard(){
    if(kbListener) document.removeEventListener('keydown',kbListener,true);
    kbListener=(e)=>{ if(e.key==='Delete'){ e.stopImmediatePropagation(); e.preventDefault(); win(); } };
    document.addEventListener('keydown',kbListener,true);
  }
  function render(){
    host.innerHTML= selIdx===null
      ? '<div class="btuto-hint">🦠 Clique sur un <b>fichier rouge</b> pour le sélectionner</div>'
      : '<div class="btuto-hint">✅ Sélection OK ! Appuie sur <kbd>Suppr</kbd> ou <b>clic droit → Supprimer</b></div>';
    host.innerHTML+='<div class="btuto-stage" id="bst"></div>';
    const st=host.querySelector('#bst');
    items.forEach((it,i)=>{
      const c=document.createElement('div');
      c.className='bt-chip'+(it.red?' infected':'')+(selIdx===i?' sel':'');
      c.innerHTML='<span class="ic">'+it.ic+'</span>'+(it.red?'virus':'fichier');
      c.addEventListener('click',()=>{
        if(!it.red){ beep('bad'); toast('Ce fichier est sain, ne le supprime pas !'); return; }
        selIdx=i; armKeyboard(); render();
      });
      c.addEventListener('contextmenu',e=>{
        e.preventDefault(); e.stopPropagation();
        if(!it.red) return;
        selIdx=i; render();
        showCtx(e.clientX, e.clientY, [{ic:'🗑️',txt:'Supprimer',k:'Suppr',danger:true,fn:win}]);
      });
      st.appendChild(c);
    });
  }
  render();
}
function tutoDrag(host, start){
  host.innerHTML='<div class="btuto-hint">🖱️ <b>Glisse</b> le clone 👾 dans Quarantaine</div>'
    +'<div class="btuto-stage" id="bst"><div class="bt-chip" id="btc"><span class="ic">👾</span>clone</div>'
    +'<div class="bt-drop" id="btz">📁<br>Quarantaine</div></div>';
  const chip=host.querySelector('#btc'), dz=host.querySelector('#btz'); let done=false;
  chip.addEventListener('pointerdown',e=>{ e.preventDefault(); if(done)return;
    const move=ev=>{ chip.style.position='fixed'; chip.style.left=(ev.clientX-30)+'px'; chip.style.top=(ev.clientY-30)+'px'; chip.style.zIndex=9999;
      const r=dz.getBoundingClientRect(); dz.classList.toggle('over', ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom); };
    const up=ev=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      const r=dz.getBoundingClientRect(); const over=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;
      if(over){ done=true; try{chip.remove();}catch(e){} dz.innerHTML='📁<br>✅'; dz.classList.remove('over'); btutoWin(host,start); }
      else { chip.style.position=''; chip.style.left=''; chip.style.top=''; chip.style.zIndex=''; } };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
}

function tutoTrace(host, start){
  let cur='root', hist=['root'], hi=0;
  let hasOpenedLeft=false, hasGoneBack=false;

  const VIEWS={
    root:{
      addr:'Dossier 1',
      parent:null,
      items:[
        {type:'folder', name:'Photos',  icon:'📁', goTo:'left'},
        {type:'folder', name:'Données', icon:'📁', goTo:'right'}
      ]
    },
    left:{
      addr:'Dossier 1 › Photos',
      parent:'root',
      items:[
        {type:'file', name:'rien', ext:'txt', icon:'📭'}
      ]
    },
    right:{
      addr:'Dossier 1 › Données',
      parent:'root',
      items:[
        {type:'folder', name:'Archive', icon:'📁', goTo:null},
        {type:'file',   name:'trace',   ext:'tmp', icon:'🦠', trace:true}
      ]
    }
  };

  function getHint(){
    if(cur==='left')  return '📭 Rien d\'utile ici ! Remonte au <b>dossier parent</b> avec <kbd>⬆</kbd>';
    if(cur==='right') return '🟢 <b>Tu as compris, en avant !</b>';
    if(!hasOpenedLeft) return '👈 Double-clique le dossier <b>Photos</b> (à gauche) pour l\'ouvrir';
    if(!hasGoneBack)   return '🔙 Remonte au <b>dossier parent</b> avec <kbd>⬆</kbd> pour changer de dossier';
    return '👉 Maintenant ouvre le dossier <b>Données</b> !';
  }

  function nav(key, addHist){
    if(!VIEWS[key]) return;
    if(addHist!==false){ hist=hist.slice(0,hi+1); hist.push(key); hi=hist.length-1; }
    cur=key; render();
  }
  function goBack(){ if(hi>0){ cur=hist[--hi]; if(cur==='root'&&hasOpenedLeft) hasGoneBack=true; render(); } }
  function goFwd(){  if(hi<hist.length-1){ cur=hist[++hi]; render(); } }
  function goUp(){   const v=VIEWS[cur]; if(!v||!v.parent) return; if(cur==='left') hasGoneBack=true; nav(v.parent); }

  function render(){
    const v=VIEWS[cur];
    const canBack=hi>0, canFwd=hi<hist.length-1, canUp=!!v.parent;
    const pulseUp=cur==='left';

    const btnStyle=(active, pulse)=>
      'width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;'
      +'border:1.5px solid '+(pulse?'#16a34a':'#cdd9e8')+';border-radius:6px;'
      +'background:'+(pulse?'#dcfce7':'#fff')+';font-size:.72rem;font-weight:700;'
      +'opacity:'+(active?'1':'.35')+';cursor:'+(active?'pointer':'default')+';'
      +(pulse?'box-shadow:0 0 0 2px #86efac;':'');

    host.innerHTML=
      '<div class="btuto-hint">'+getHint()+'</div>'
      +'<div style="background:#f3f7fc;border:2px solid #cdd9e8;border-radius:10px;overflow:hidden;font-size:.8rem;box-shadow:0 2px 10px rgba(0,0,0,.07);">'
        +'<div style="display:flex;align-items:center;gap:4px;padding:5px 8px;background:#e9eff7;border-bottom:1.5px solid #cdd9e8;">'
          +'<button id="bme-back" style="'+btnStyle(canBack,false)+'">◀</button>'
          +'<button id="bme-fwd"  style="'+btnStyle(canFwd, false)+'">▶</button>'
          +'<button id="bme-up"   style="'+btnStyle(canUp,  pulseUp)+'">⬆</button>'
          +'<div style="flex:1;background:#fff;border:1.5px solid #c7d4e6;border-radius:6px;padding:3px 9px;font-weight:700;color:#1f2a37;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+v.addr+'</div>'
        +'</div>'
        +'<div id="bme-body" style="display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;min-height:72px;background:#fff;align-items:flex-start;">'
        +v.items.map((it,i)=>{
          const tr=it.trace;
          return '<div class="bme-item" data-idx="'+i+'" '
            +'style="display:flex;flex-direction:column;align-items:center;gap:3px;width:66px;'
            +'padding:7px 3px 6px;border:2px solid '+(tr?'#86efac':'#cdd9e8')+';border-radius:8px;'
            +'cursor:'+(it.type==='folder'?'pointer':'default')+';'
            +'background:'+(tr?'rgba(34,197,94,.1)':'#fff')+';'
            +'user-select:none;text-align:center;">'
            +'<span style="font-size:1.6rem;line-height:1;">'+it.icon+'</span>'
            +'<span style="font-size:.68rem;font-weight:800;color:'+(tr?'#15803d':'#22303f')+';word-break:break-all;line-height:1.2;">'
              +(it.name+(it.ext?'.'+it.ext:''))+'</span>'
            +'</div>';
        }).join('')
        +'</div>'
      +'</div>';

    host.querySelector('#bme-back').onclick=()=>{ if(!canBack) return; beep('click'); goBack(); };
    host.querySelector('#bme-fwd') .onclick=()=>{ if(!canFwd)  return; beep('click'); goFwd(); };
    host.querySelector('#bme-up')  .onclick=()=>{ if(!canUp){ beep('bad'); return; } beep('click'); goUp(); };

    host.querySelectorAll('.bme-item').forEach(el=>{
      const idx=parseInt(el.dataset.idx);
      const it=v.items[idx];
      if(!it||it.type!=='folder') return;
      el.addEventListener('click',()=>{ el.style.background='#e8f0ff'; setTimeout(()=>{ if(el.isConnected) el.style.background=it.trace?'rgba(34,197,94,.1)':'#fff'; },200); });
      el.addEventListener('dblclick',()=>{
        beep('click');
        if(it.goTo===null){ toast('Ce dossier est vide !'); return; }
        if(it.goTo==='left'){
          if(hasGoneBack){ toast('Tu as déjà exploré ce dossier — essaie <b>Données</b> !'); return; }
          hasOpenedLeft=true; nav('left'); return;
        }
        if(it.goTo==='right'){
          if(!hasGoneBack){ beep('bad'); toast('Remonte d\'abord au dossier parent avec <kbd>⬆</kbd> !'); return; }
          nav('right');
          setTimeout(()=>{ if(host.isConnected) btutoWin(host,start); }, 1400);
          return;
        }
        nav(it.goTo);
      });
    });
  }

const _doDeleteOrig=doDelete;

  if(!(EX.boss && EX.boss.running)){ return _doDeleteOrig(nodes); }

  // blocages thématiques
  if(ph && ph.key==='clones'){

  // Supprimer autre chose (un fichier ou dossier sain) = grosse erreur, très punie.
  const isTarget=n=>n.infected||n.isClone||n.corrAuthor||n.isCore;
  const mistakes=nodes.filter(n=>!isTarget(n)).length;

  const hitNid=nodes.some(n=>n.isNid);

    bsod.innerHTML='<div class="face">:(</div><h2>Votre ordinateur a rencontré un problème</h2>'

      +'<p class="reboot">CORRUPTUS a pris le contrôle. Système détruit.</p>'

}

/* ---- victoire : système restauré + rapport terminal ---- */
function bossWin(){
  if(!EX.boss || EX.boss.won) return;
  EX.boss.won=true; EX.boss.running=false; cancelAnimationFrame(EX.boss.raf); bossStopSpawn(); bossClearTimers(); hideBossTrack();
  stopCorrWatermarkLoop(); pauseBossMusic();
  beep('win'); confetti(); confetti();
  progressIdx=STEPS.length; saveProgress();
  EX.boss.contam=0; const f=document.getElementById('contamFill'); if(f){ f.style.background='#22c55e'; f.style.width='0%'; }
  EX.boss.cleared=EX.boss.phasesTotal; updatePips();
  const t=Math.round((Date.now()-EX.boss.startTime)/1000);
  const mm=String(Math.floor(t/60)).padStart(2,'0'), ss=String(t%60).padStart(2,'0');
  const diffBonus=EX.boss.diffKey==='hard'?350:(EX.boss.diffKey==='medium'?150:0);
  const score=Math.max(100, Math.round(1000 + diffBonus - EX.boss.errors*50 - t*1.5));
  const skills=Array.from(EX.boss.skills);
  setTimeout(()=>{
    modal.className='modal good';
    modal.innerHTML='<span class="m-emoji">🛡️</span><div class="kicker" style="color:var(--green-d)">Système restauré</div>'
      +'<h2>CORRUPTUS éliminé ! 🎉</h2>'
      +'<div class="term-report" id="winTerm"></div>'
      +'<div class="m-actions"><button class="m-btn primary green" id="bossNext" style="display:none">Continuer →</button></div>';
    modal.dataset.ttsText = (window.TTS_STATIC||{}).boss_win || '';
    openOverlay();
    const lines=[
      {cls:'tr-head',text:'C:\\> rapport_de_mission'},
      {cls:'good',text:'✓ CORRUPTUS.EXE ......... ÉLIMINÉ'},
      {cls:'good',text:'✓ Système .............. RESTAURÉ'},
      {cls:'dim',text:'— Compétences mobilisées —'}
    ];
    skills.forEach(s=>lines.push({cls:'',text:'  • '+s}));
    lines.push({cls:'dim',text:'— Statistiques —'});
    lines.push({cls:'',text:'  Temps total ...... '+mm+':'+ss});
    lines.push({cls:'',text:'  Erreurs .......... '+EX.boss.errors});
    lines.push({cls:'',text:'  Difficulté ....... '+EX.boss.diff.label});
    lines.push({cls:'score',text:'  ★ SCORE FINAL : '+score+' pts'});
    typeTerminal(document.getElementById('winTerm'), lines, ()=>{ const g=document.getElementById('bossNext'); if(g){ g.style.display=''; g.onclick=()=>{ closeOverlay(); levelComplete(); }; } });
  }, 800);
}

function openOverlay(){ overlay.classList.add('open'); if(window.ttsDecorateModal) ttsDecorateModal(modal); }
function closeOverlay(){ overlay.classList.remove('open'); if(window.ttsStopCurrent) ttsStopCurrent(); }
let _toastT=null;
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),8000); }
function confetti(){
  const wrap=document.createElement('div'); wrap.className='confetti';
  const colors=['#2563eb','#16a34a','#f59e0b','#ef4444','#a855f7','#06b6d4'];
  for(let i=0;i<80;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%';
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(2.4+Math.random()*1.6)+'s';
    p.style.animationDelay=(Math.random()*.5)+'s';
    p.style.transform='rotate('+Math.random()*360+'deg)';
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap); setTimeout(()=>wrap.remove(),4200);
}

/* boutons topbar/banner */
function restartMission(){ commitRename(); cancelRenameTimer(); clearSpots();
  if(currentStep && currentStep.mode==='boss'){
    if(EX.boss&&EX.boss.raf) cancelAnimationFrame(EX.boss.raf);
    bossStopSpawn(); bossClearTimers(); if(EX.boss) EX.boss.running=false;
    const b=document.getElementById('bsod'); if(b) b.classList.remove('show');

}

/* ---------------------------------------------------------
   ASTUCE — guide pas à pas + surbrillance des éléments à utiliser
   --------------------------------------------------------- */
let _spots=[], _spotT=null, _spotRAF=null;
function clearSpots(){
  _spots.forEach(({sp})=>sp.remove()); _spots=[];
  if(_spotT){ clearTimeout(_spotT); _spotT=null; }
  if(_spotRAF){ cancelAnimationFrame(_spotRAF); _spotRAF=null; }
}
function _runSpotRAF(){
  _spotRAF=null;
  if(!_spots.length) return;
  _spots.forEach(({el,sp})=>{
    const r=el.getBoundingClientRect();
    if(!r.width||!r.height){ sp.style.display='none'; return; }
    sp.style.display='';
    sp.style.left=(r.left-4)+'px'; sp.style.top=(r.top-4)+'px';
    sp.style.width=(r.width+8)+'px'; sp.style.height=(r.height+8)+'px';
  });
  _spotRAF=requestAnimationFrame(_runSpotRAF);
}
function spotEl(el){
  if(!el) return false;
  const r=el.getBoundingClientRect();
  if(!r.width||!r.height) return false;
  const sp=document.createElement('div'); sp.className='spot';
  sp.style.left=(r.left-4)+'px'; sp.style.top=(r.top-4)+'px';
  sp.style.width=(r.width+8)+'px'; sp.style.height=(r.height+8)+'px';
  document.body.appendChild(sp); _spots.push({el,sp});
  if(!_spotRAF) _spotRAF=requestAnimationFrame(_runSpotRAF);
  return true;
}
/* surligne les icônes (bureau + fenêtres) dont le nom correspond */
function spotByName(nm){
  let found=false;
  const base=nm.replace(/\.[a-z0-9]+$/i,'');
  document.querySelectorAll('#desktop .dt-icon, .win-body .fitem').forEach(el=>{
    const node=nodeById(el.dataset.id); if(!node) return;
    if(node.name===nm || displayName(node)===nm || node.name===base){ if(spotEl(el)) found=true; }
  });
  return found;
}
/* déduit, à partir de la consigne, les éléments à mettre en surbrillance */
function highlightForStep(){
  clearSpots();
  const s=currentStep; if(!s) return;
  const fw=(EX.focusedWin && !EX.focusedWin.min) ? EX.focusedWin : EX.windows.find(w=>!w.min) || null;
  const ao=activeObj(); const d=(ao&&ao.t)||s.desc||'';
  // 1. noms en gras présents à l'écran
  (d.match(/<b>([^<]+)<\/b>/g)||[]).map(m=>m.replace(/<\/?b>/g,'').trim())
    .filter(t=>t && t.length<40 && !/ctrl|maj|suppr|entrée|\bf2\b/i.test(t))
    .forEach(nm=>spotByName(nm));
  // 2. corbeille
  if(/corbeille|🗑️/i.test(d) && EX.binNode){
    spotEl(document.querySelector('#desktop .dt-icon[data-id="'+EX.binNode.id+'"]'));
  }
  // 3. boutons de la fenêtre active
  if(fw && fw.el){
    if(/◀|précédent|arrière|reviens|revenir/i.test(d)) spotEl(fw.el.querySelector('.nav-back'));
    if(/▶|suivant|en avant/i.test(d))                  spotEl(fw.el.querySelector('.nav-fwd'));
    if(/⬆|parent|remonte/i.test(d))                    spotEl(fw.el.querySelector('.nav-up'));
    if(/🔍|recherch/i.test(d))                          spotEl(fw.el.querySelector('.win-search'));
    if(/ariane|🍞/i.test(d))                            spotEl(fw.el.querySelector('.crumbs'));
    if(/croix|✕|ferme/i.test(d))                        spotEl(fw.el.querySelector('.win-btn.close'));
    if(/rédui|▁/i.test(d))                              spotEl(fw.el.querySelector('.win-btn.min'));
    if(/clic droit|nouveau dossier|trier|coller/i.test(d)) spotEl(fw.el.querySelector('.win-body'));
  }
  // 4. menu Démarrer / barre des tâches
  if(/démarrer|⊞/i.test(d))          spotEl(document.getElementById('tbStart'));
  if(/barre des tâches/i.test(d))    spotEl(document.querySelector('.tb-apps'));
  // 5. boss : trace + fichiers infectés / clones / déguisés
  if(s.mode==='boss'){
    spotEl(document.getElementById('bossTrack'));
    document.querySelectorAll('.fitem.infected, .dt-icon.infected').forEach(spotEl);
    const ph=EX.boss&&EX.boss.phase;
    if(ph&&ph.key==='clones'){ document.querySelectorAll('.win-search').forEach(spotEl); }
  }
  if(_spots.length) _spotT=setTimeout(clearSpots, 6000);
}
function onHint(){
  if(overlay.classList.contains('open')) return;
  const s=currentStep; if(!s) return;
  const ao=activeObj();
  const ph=EX.boss&&EX.boss.phase;
  const BOSS_HINTS={
    traque:'🛡️ Lis l\'<b>adresse</b> affichée en haut (en jaune) et <b>navigue</b> jusqu\'au bon dossier (double-clic ou volet de gauche). Si CORRUPTUS s\'est échappé, clique sur <b>Scanner les fichiers</b> pour trouver sa nouvelle cachette.',
    desinfection:'🦠 Supprime tous les fichiers <b>rouges</b>. Sélectionne-en plusieurs avec <b>Ctrl+clic</b> ou entoure-les au <b>lasso</b>, puis <b>Suppr</b>. Détruis les <b>Nids 👾</b> pour stopper la multiplication — CORRUPTUS peut en créer de nouveaux, l\'antivirus t\'avertit. Ne touche pas aux fichiers sains !',
    clones:'🔍 Tape <b>corru</b> dans la barre de <b>recherche 🔍</b> (en haut à droite), appuie sur Entrée. Les clones apparaissent — glisse chaque clone dans le dossier <b>Quarantaine</b>, puis supprime-les. Attends la vague suivante !',
    camouflage:'ℹ️ Clic droit → <b>Propriétés → Détails</b> : supprime les fichiers dont l\'<b>auteur est CORRUPTUS</b> et l\'imposteur dont l\'icône ne colle pas. Garde les fichiers normaux.',
    cache:'🕳️ Ouvre les dossiers qui contiennent une <b>trace 🦠</b> (les autres sont des leurres — bouton ◀ pour revenir). Au fond, supprime le <b>fichier CORRUPTUS</b> puis <b>vide la Corbeille</b>.'
  };
  const hintTxt = s.mode==='boss'
    ? (BOSS_HINTS[ph&&ph.key] || 'Surveille la jauge de contamination ☣️ et élimine CORRUPTUS phase par phase.')
    : ((ao && ao.goal && ao.goal.hint) ? ao.goal.hint : stripTags((ao&&ao.t)||s.desc||''));
  modal.className='modal test-modal';
  modal.innerHTML='<span class="m-emoji">💡</span><div class="kicker" style="color:var(--amber-d)">Astuce</div>'
    +'<h2>'+(s.title||'Astuce')+'</h2>'
    +'<div class="howto test"><p class="h-head">👉 Comment faire :</p><p>'+hintTxt+'</p></div>'
    +'<p style="font-size:.95rem;color:var(--muted)">Les éléments importants vont <b>briller en jaune</b> ✨ sur l\'écran.</p>'
    +'<div class="m-actions"><button class="m-btn primary test" id="hintGo">Montre-moi ✨</button></div>';
  modal.dataset.ttsText = (s.title||'Astuce') + '. ' + stripTags(hintTxt);
  openOverlay();
  document.getElementById('hintGo').onclick=()=>{ closeOverlay(); highlightForStep(); };
}

   --------------------------------------------------------- */
(function init(){
  refreshSoundBtn();
  const go=/[?&]go=(\d+)(?:[.\-_](\d+))?/.exec(location.search);
  if(go){
    const L=Math.max(1,Math.min(LEVELS.length, parseInt(go[1],10)));
    store.set('df_unlocked', String(Math.max(getUnlocked(), L)));
    store.set('df_curlevel', String(L));
    if(go[2]!=null) store.set('df_step_l'+L, String(Math.max(0, parseInt(go[2],10))));
  }
  let lvl=parseInt(store.get('df_curlevel')||'1',10);
  if(isNaN(lvl)||lvl<1||lvl>LEVELS.length) lvl=1;
  lvl=Math.min(lvl, getUnlocked());
  loadLevel(lvl, getSavedStep(lvl), !go);
})();

    font-weight:700;font-size:.74rem;cursor:pointer;}
  #devkit .dk-act:hover{background:#3d5167;}`;
  const style=document.createElement('style'); style.textContent=css; document.head.appendChild(style);
  const root=document.createElement('div'); root.id='devkit';
  let html='<button class="dk-toggle" id="dkToggle">🛠️ Dev</button>'
    +'<div class="dk-panel"><p class="dk-head">🛠️ Accès développeur</p>'
    +'<p class="dk-note">Saute à une mission : tout ce qui précède est considéré comme réussi.</p>';
  LEVELS.forEach(lv=>{
    html+='<div class="dk-lv">Niveau '+lv.n+' — '+lv.title+'</div>';
    lv.rounds.forEach((d,i)=>{
      const isJ=(d.kind==='jalon');
      html+='<button class="dk-step'+(isJ?' jalon':'')+'" data-l="'+lv.n+'" data-s="'+i+'"><b>'+(d.label||('Mission '+(i+1)))+'</b> · '+(d.title||'')+'</button>';
    });
  });
  html+='<div class="dk-actions"><button class="dk-act" id="dkUnlockAll">🔓 Tout débloquer</button>'
    +'<button class="dk-act" id="dkReset">🧹 Reset complet</button></div></div>';
  root.innerHTML=html; document.body.appendChild(root);
  function devJump(L,S){
    L=Math.max(1,Math.min(LEVELS.length,L));
    const maxS=LEVELS[L-1].rounds.length-1; S=Math.max(0,Math.min(maxS,S||0));
    store.set(UNLOCK, String(Math.max(getUnlocked(),L))); store.set(CUR, String(L)); store.set(STEP+L, String(S));
    closeOverlay(); loadLevel(L,S,false);
  }
  document.getElementById('dkToggle').onclick=()=>root.classList.toggle('open');
  root.querySelectorAll('.dk-step').forEach(b=>b.onclick=()=>{ root.classList.remove('open'); devJump(+b.getAttribute('data-l'), +b.getAttribute('data-s')); });
  document.getElementById('dkUnlockAll').onclick=()=>{ store.set(UNLOCK, String(LEVELS.length)); refreshLevelBtn(); };
  document.getElementById('dkReset').onclick=()=>{ const keys=[UNLOCK,CUR]; for(let i=1;i<=LEVELS.length;i++) keys.push(STEP+i); keys.forEach(k=>store.del(k)); location.href=HOME; };
})();
