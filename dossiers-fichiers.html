    maxInfect:0.55, gameover:false
  };
  // place le cœur du virus dans un dossier au hasard (pas Système)
  const host=folders[Math.floor(Math.random()*folders.length)];
  const core=buildNode(file('virus','virus',{icon:'🦠',infected:true,isCore:true}), host); core.seeded=false;
  host.kids.push(core); EX.boss.core=core;
  // infecte 1 ou 2 fichiers de départ
  infectRandom(2);
  renderAll(); updateBossMeter();
  beep('alarm');
  EX.boss.raf=requestAnimationFrame(bossTick);
}
function infectRandom(k){
  const clean=EX.boss.files.filter(f=>!f.infected && inTree(EX.desktopRoot,f));
  for(let i=0;i<k && clean.length;i++){
    const idx=Math.floor(Math.random()*clean.length);
    clean[idx].infected=true; clean.splice(idx,1);
  }
}
function infectionRate(){
  const files=allFiles();
  const inf=files.filter(f=>f.infected).length + (EX.boss.core && inTree(EX.desktopRoot,EX.boss.core)?1:0);
  const total=files.length + (EX.boss.core && inTree(EX.desktopRoot,EX.boss.core)?1:0);
  return total? inf/Math.max(total,1) : 0;
}
function updateBossMeter(){
  const r=infectionRate();
  const el=document.getElementById('bossMeter'), lbl=document.getElementById('bossMeterLbl');
  if(el){ el.style.width=Math.min(100, Math.round(r/EX.boss.maxInfect*100))+'%'; }
  if(lbl){ lbl.textContent=Math.round(r*100)+'% infecté'; }
  const core=document.getElementById('bossCore');
  if(core){ core.textContent = EX.boss.coreKilled ? '🦠 Cœur : détruit ✓' : (EX.boss.core && inTree(EX.desktopRoot,EX.boss.core) ? '🦠 Cœur : actif' : '🦠 Cœur : ?'); }
}
let _bossLast=0;
function bossTick(ts){
  if(!EX.boss || !EX.boss.running) return;
  if(!_bossLast) _bossLast=ts;
  const dt=ts-_bossLast;
  if(!EX.boss.coreKilled){
    EX.boss.lastSpread+=dt;
    if(EX.boss.lastSpread>=EX.boss.spreadEvery){
      EX.boss.lastSpread=0;
      // le virus se propage ET le cœur peut se déplacer
      infectRandom(1);
      if(Math.random()<0.5) moveCore();
      renderAll(); updateBossMeter(); pulseInfected();
      beep('bad');
    }
  }
  _bossLast=ts;
  // condition de défaite
  if(!EX.boss.gameover && infectionRate()>=EX.boss.maxInfect){ return bossGameOver(); }
  // condition de victoire : cœur détruit ET plus aucun fichier infecté
  if(EX.boss.coreKilled && allFiles().every(f=>!f.infected) && !(EX.boss.core&&inTree(EX.desktopRoot,EX.boss.core))){
    return bossWin();
  }
  EX.boss.raf=requestAnimationFrame(bossTick);
}
function moveCore(){
  const core=EX.boss.core; if(!core || !inTree(EX.desktopRoot,core)) return;
  const folders=allFolders().filter(f=>f!==core.parent);
  if(!folders.length) return;
  const dest=folders[Math.floor(Math.random()*folders.length)];
  if(core.parent) core.parent.kids=core.parent.kids.filter(x=>x!==core);
  core.parent=dest; dest.kids.push(core);
}
function pulseInfected(){ const s=document.getElementById('screen'); if(s){ s.classList.add('shake'); setTimeout(()=>s.classList.remove('shake'),420); } }

function bossScan(){
  if(!EX.boss || EX.boss.scanCooldown>0) return;
  const core=EX.boss.core;
  if(EX.boss.coreKilled || !inTree(EX.desktopRoot,core)){ toast('🛰️ Plus de cœur viral détecté !'); return; }
  const loc=pathOf(core.parent).map(p=>p.name).join(' ▸ ');
  toast('🛰️ Virus localisé dans : '+loc+' — fonce le supprimer !');
  beep('ding');
  // ping radar si le dossier est ouvert
  const w=EX.windows.find(x=>!x.min && x.cur===core.parent);
  if(w&&w.el){ const r=w.el.getBoundingClientRect(), sc=document.getElementById('screen').getBoundingClientRect();
    const ping=document.createElement('div'); ping.className='radar-ping';
    ping.style.left=(r.left-sc.left)+'px'; ping.style.top=(r.top-sc.top)+'px'; ping.style.width=r.width+'px'; ping.style.height=r.height+'px';
    document.getElementById('screen').appendChild(ping); setTimeout(()=>ping.remove(),2500);
  }
  EX.boss.scanCooldown=1;
  const btn=document.getElementById('scanBtn'); if(btn){ btn.disabled=true; let t=4; btn.textContent='🛰️ '+t+'s';
    const iv=setInterval(()=>{ t--; if(t<=0){ clearInterval(iv); EX.boss.scanCooldown=0; if(btn){btn.disabled=false; btn.textContent='🛰️ Scanner';} } else if(btn) btn.textContent='🛰️ '+t+'s'; },1000);
  }
}

/* surcharge des opérations pendant le boss : détecter la suppression du cœur / fichiers infectés */
const _doDelete=doDelete;
doDelete=function(nodes){
  const hadCore = EX.boss && !EX.boss.coreKilled && nodes.indexOf(EX.boss.core)>=0;
  const infectedKilled = EX.boss ? nodes.filter(n=>n.infected && !n.isCore).length : 0;
  _doDelete(nodes);
  if(EX.boss && EX.boss.running){
    if(hadCore){ EX.boss.coreKilled=true; beep('win'); toast('🦠💥 Cœur du virus détruit ! La propagation s\'arrête.'); confetti(); }
    else if(infectedKilled){ beep('good'); }
    // vider la corbeille n'est pas obligatoire : la suppression suffit
    updateBossMeter();
    if(!EX.boss.raf && !EX.boss.gameover){ _bossLast=0; EX.boss.raf=requestAnimationFrame(bossTick); }
  }
};

   --------------------------------------------------------- */
let _spots=[], _spotT=null, _spotRAF=null;
function clearSpots(){
  _spots.forEach(({sp})=>sp.remove()); _spots=[];
  if(_spotT){ clearTimeout(_spotT); _spotT=null; }
  if(_spotRAF){ cancelAnimationFrame(_spotRAF); _spotRAF=null; }
}
function _runSpotRAF(){
  _spotRAF=null;
  if(!_spots.length) return;
  _spots.forEach(({el,sp})=>{
    const r=el.getBoundingClientRect();
    if(!r.width||!r.height){ sp.style.display='none'; return; }
    sp.style.display='';
    sp.style.left=(r.left-4)+'px'; sp.style.top=(r.top-4)+'px';
    sp.style.width=(r.width+8)+'px'; sp.style.height=(r.height+8)+'px';
  });
  _spotRAF=requestAnimationFrame(_runSpotRAF);
}
function spotEl(el){
  if(!el) return false;
  const r=el.getBoundingClientRect();
  if(!r.width||!r.height) return false;
  const sp=document.createElement('div'); sp.className='spot';
  sp.style.left=(r.left-4)+'px'; sp.style.top=(r.top-4)+'px';
  sp.style.width=(r.width+8)+'px'; sp.style.height=(r.height+8)+'px';
  document.body.appendChild(sp); _spots.push({el,sp});
  if(!_spotRAF) _spotRAF=requestAnimationFrame(_runSpotRAF);
  return true;
}
/* surligne les icônes (bureau + fenêtres) dont le nom correspond */
function spotByName(nm){
  let found=false;
  const base=nm.replace(/\.[a-z0-9]+$/i,'');
  document.querySelectorAll('#desktop .dt-icon, .win-body .fitem').forEach(el=>{
    const node=nodeById(el.dataset.id); if(!node) return;
    if(node.name===nm || displayName(node)===nm || node.name===base){ if(spotEl(el)) found=true; }
  });
  return found;
}
/* déduit, à partir de la consigne, les éléments à mettre en surbrillance */
function highlightForStep(){
  clearSpots();
  const s=currentStep; if(!s) return;
  const fw=(EX.focusedWin && !EX.focusedWin.min) ? EX.focusedWin : EX.windows.find(w=>!w.min) || null;
  const ao=activeObj(); const d=(ao&&ao.t)||s.desc||'';
  // 1. noms en gras présents à l'écran
  (d.match(/<b>([^<]+)<\/b>/g)||[]).map(m=>m.replace(/<\/?b>/g,'').trim())
    .filter(t=>t && t.length<40 && !/ctrl|maj|suppr|entrée|\bf2\b/i.test(t))
    .forEach(nm=>spotByName(nm));
  // 2. corbeille
  if(/corbeille|🗑️/i.test(d) && EX.binNode){
    spotEl(document.querySelector('#desktop .dt-icon[data-id="'+EX.binNode.id+'"]'));
  }
  // 3. boutons de la fenêtre active
  if(fw && fw.el){
    if(/◀|précédent|arrière|reviens|revenir/i.test(d)) spotEl(fw.el.querySelector('.nav-back'));
    if(/▶|suivant|en avant/i.test(d))                  spotEl(fw.el.querySelector('.nav-fwd'));
    if(/⬆|parent|remonte/i.test(d))                    spotEl(fw.el.querySelector('.nav-up'));
    if(/🔍|recherch/i.test(d))                          spotEl(fw.el.querySelector('.win-search'));
    if(/ariane|🍞/i.test(d))                            spotEl(fw.el.querySelector('.crumbs'));
    if(/croix|✕|ferme/i.test(d))                        spotEl(fw.el.querySelector('.win-btn.close'));
    if(/rédui|▁/i.test(d))                              spotEl(fw.el.querySelector('.win-btn.min'));
    if(/clic droit|nouveau dossier|trier|coller/i.test(d)) spotEl(fw.el.querySelector('.win-body'));
  }
  // 4. menu Démarrer / barre des tâches
  if(/démarrer|⊞/i.test(d))          spotEl(document.getElementById('tbStart'));
  if(/barre des tâches/i.test(d))    spotEl(document.querySelector('.tb-apps'));
  // 5. boss : bouton scanner
  if(s.mode==='boss'){ spotEl(document.getElementById('scanBtn')); document.querySelectorAll('.fitem.infected, .dt-icon.infected').forEach(spotEl); }
  if(_spots.length) _spotT=setTimeout(clearSpots, 6000);
}

    background:#1e2733;color:#e7eef6;border-radius:14px;padding:12px 12px 14px;box-shadow:0 16px 40px rgba(0,0,0,.42);}

  const style=document.createElement('style'); style.textContent=css; document.head.appendChild(style);
  const root=document.createElement('div'); root.id='devkit';
  let html='<button class="dk-toggle" id="dkToggle">🛠️ Dev</button>'
    +'<div class="dk-panel"><p class="dk-head">🛠️ Accès développeur</p>'
    +'<p class="dk-note">Saute à une mission : tout ce qui précède est considéré comme réussi.</p>';
  LEVELS.forEach(lv=>{
    html+='<div class="dk-lv">Niveau '+lv.n+' — '+lv.title+'</div>';
    lv.rounds.forEach((d,i)=>{
      const isJ=(d.kind==='jalon');
      html+='<button class="dk-step'+(isJ?' jalon':'')+'" data-l="'+lv.n+'" data-s="'+i+'"><b>'+(d.label||('Mission '+(i+1)))+'</b> · '+(d.title||'')+'</button>';
    });
  });
  html+='<div class="dk-actions"><button class="dk-act" id="dkUnlockAll">🔓 Tout débloquer</button>'
    +'<button class="dk-act" id="dkReset">🧹 Reset complet</button></div></div>';
  root.innerHTML=html; document.body.appendChild(root);
  function devJump(L,S){
    L=Math.max(1,Math.min(LEVELS.length,L));
    const maxS=LEVELS[L-1].rounds.length-1; S=Math.max(0,Math.min(maxS,S||0));
    store.set(UNLOCK, String(Math.max(getUnlocked(),L))); store.set(CUR, String(L)); store.set(STEP+L, String(S));
    closeOverlay(); loadLevel(L,S,false);
  }
  document.getElementById('dkToggle').onclick=()=>root.classList.toggle('open');
  root.querySelectorAll('.dk-step').forEach(b=>b.onclick=()=>{ root.classList.remove('open'); devJump(+b.getAttribute('data-l'), +b.getAttribute('data-s')); });
  document.getElementById('dkUnlockAll').onclick=()=>{ store.set(UNLOCK, String(LEVELS.length)); refreshLevelBtn(); };
  document.getElementById('dkReset').onclick=()=>{ const keys=[UNLOCK,CUR]; for(let i=1;i<=LEVELS.length;i++) keys.push(STEP+i); keys.forEach(k=>store.del(k)); location.href=HOME; };
})();
</script>
<script>
/* Bouton bascule OpenDyslexic — préférence partagée entre toutes les pages */
(function(){
  var KEY='a11y_dys', root=document.documentElement;
  var btn=document.createElement('button');
  btn.type='button'; btn.className='dys-toggle';
  btn.innerHTML='<span class="dys-ic" aria-hidden="true">🔤</span><span class="dys-label">Mode Dyslexique</span><span class="dys-switch"><span class="dys-knob"></span></span>';
  function apply(on){ root.classList.toggle('dys',on); btn.setAttribute('aria-pressed',on?'true':'false');
    btn.title=on?'Mode Dyslexique activé — clique pour revenir à la police normale':'Activer le Mode Dyslexique (police OpenDyslexic)'; }
  btn.addEventListener('click',function(){ var want=!root.classList.contains('dys'); try{localStorage.setItem(KEY,want?'1':'0');}catch(e){} apply(want); });
  document.body.appendChild(btn);
  var on=false; try{on=localStorage.getItem(KEY)==='1';}catch(e){} apply(on);
})();
</script>
