<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossiers et fichiers — Atelier informatique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Police d'emojis unifiée sur tous les systèmes (cf. assets/fonts/README.md) */
  @font-face{
    font-family:"Fluent Emoji";
    src:url("assets/fonts/fluent-emoji.woff2") format("woff2");
    font-display:swap;
  }
  :root{
    --ink:#22303f; --muted:#5a6b7b;
    --blue:#2563eb; --blue-d:#1d4ed8;
    --amber:#f59e0b; --amber-d:#b45309;
    --green:#16a34a; --green-d:#15803d;
    --red:#ef4444; --red-d:#b91c1c;
    --paper:#ffffff; --line:#d7e0ea; --line-2:#e7eef6;
    --shell:#e9eff7; --canvas:#dde6f1; --sky:#eaf3ff;
    /* explorateur */
    --win-bar:#f3f7fc; --win-line:#cdd9e8; --sel:#cfe2ff; --sel-line:#7aa7ec;
    --task:#1f2a37; --task-2:#28344400;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Nunito",system-ui,"Fluent Emoji",sans-serif;color:var(--ink);
    background:var(--shell);min-height:100vh;display:flex;flex-direction:column;
  }
  button{font-family:inherit;cursor:pointer;}
  .display{font-family:"Fredoka","Fluent Emoji",sans-serif;}
  kbd{
    display:inline-flex;align-items:center;justify-content:center;min-width:22px;
    font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:.84em;line-height:1;
    padding:3px 7px;border-radius:7px;background:#fff;border:2px solid #c7d4e6;
    border-bottom-width:3px;color:var(--ink);box-shadow:0 1px 0 #e7eef6;margin:0 1px;white-space:nowrap;}

  /* ---------- Top bar ---------- */
  .topbar{background:#fff;border-bottom:2px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;}
  .back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--blue-d);
    font-weight:800;font-size:.98rem;padding:8px 12px;border-radius:10px;}
  .back:hover{background:#eef4ff;}
  .topbar h1{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.15rem;margin:0;flex:1;}
  .topbar h1 .dot{color:var(--blue);}
  .reset-btn{border:2px solid var(--line);background:#fff;color:var(--muted);font-weight:700;
    border-radius:10px;padding:7px 11px;font-size:.85rem;}
  .reset-btn:hover{border-color:var(--blue);color:var(--blue-d);}
  .reset-btn.danger:hover{border-color:var(--red);color:var(--red-d);}

  /* ---------- Progress ---------- */
  .progress-wrap{background:#fff;padding:8px 18px 14px;border-bottom:2px solid var(--line);}
  .track{display:flex;gap:6px;align-items:center;max-width:1000px;margin:0 auto;}
  .seg{position:relative;flex:1;height:14px;border-radius:8px;background:var(--line-2);}
  .seg.done{background:var(--green);}
  .seg.current{background:var(--blue);box-shadow:0 0 0 3px #bcd2ff;}
  .seg.milestone{height:20px;display:flex;align-items:center;justify-content:center;font-size:1rem;background:#fdebc4;}
  .seg.milestone.done{background:#facc15;}
  .seg.milestone.current{background:var(--amber);box-shadow:0 0 0 3px #fde2a8;}
  .seg.clickable{cursor:pointer;transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;}
  .seg.clickable:hover{filter:brightness(1.07);transform:translateY(-2px);}
  .seg.clickable.done:hover{box-shadow:0 0 0 3px #b9eccd;}

  /* ---------- Mission banner ---------- */
  .banner{max-width:1000px;margin:12px auto 0;width:calc(100% - 36px);
    background:#fff;border:2px solid var(--line);border-left:7px solid var(--blue);
    border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .banner.test{border-left-color:var(--amber);}
  .banner.review{border-left-color:var(--green);}
  .banner.boss{border-left-color:var(--red);}
  .banner .b-emoji{font-size:1.8rem;line-height:1;}
  .banner .b-txt{flex:1;min-width:200px;}
  .banner .b-title{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:600;font-size:1.08rem;}
  .banner .b-sub{color:#3a4a59;font-weight:700;font-size:1rem;margin-top:4px;line-height:1.45;}
  .banner .b-goal-label{font-weight:800;color:var(--blue-d);margin-right:3px;}
  .banner.test .b-goal-label{color:var(--amber-d);}
  .banner .b-btn{border:2px solid var(--line);background:#f5f9ff;color:var(--blue-d);font-weight:800;
    border-radius:10px;padding:8px 13px;font-size:.9rem;white-space:nowrap;}
  .banner .b-btn:hover{border-color:var(--blue);}
  /* liste d'objectifs (checklist) dans le bandeau */
  .obj-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .obj-item{display:flex;align-items:flex-start;gap:9px;font-weight:700;font-size:.98rem;color:#3a4a59;line-height:1.4;}
  .obj-ck{flex:none;width:22px;height:22px;border-radius:50%;background:#e7eef6;color:#7a8b9d;
    display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;margin-top:1px;
    transition:background .3s ease, color .3s ease, transform .3s ease;}
  .obj-item.done .obj-ck{background:var(--green);color:#fff;transform:scale(1.08);}
  .banner.test .obj-item:not(.done) .obj-ck{background:#fdebc4;color:var(--amber-d);}
  .obj-item.done .obj-tx{color:var(--green-d);text-decoration:line-through;text-decoration-color:#9fd9b4;}
  /* objectifs défis (jalon) : style animé un par un */
  .jalon-head{margin:0 0 4px;}
  .jalon-wrap{overflow:hidden;}
  .jalon-obj{display:flex;align-items:center;gap:11px;background:#fff;border:2px solid #f6d68a;
    border-left:6px solid var(--amber);border-radius:12px;padding:10px 14px;font-weight:700;font-size:1rem;
    color:var(--ink);line-height:1.35;
    transition:transform .45s cubic-bezier(.2,.7,.3,1), opacity .45s ease, background .3s, border-color .3s;}
  .jalon-obj .jo-check{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;background:var(--amber);color:#fff;font-weight:800;font-size:1rem;}
  .jalon-obj .jo-text b{color:var(--amber-d);}
  .jalon-obj.done{background:#eafaf0;border-color:#86efac;border-left-color:var(--green);color:var(--green-d);}
  .jalon-obj.done .jo-check{background:var(--green);}
  .jalon-obj.done .jo-text b{color:var(--green-d);}
  /* variante bleue : objectifs des missions normales (un par un, même animation) */
  .jalon-obj.blue{border-color:#bcd2ff;border-left-color:var(--blue);}
  .jalon-obj.blue .jo-check{background:var(--blue);}
  .jalon-obj.blue .jo-text b{color:var(--blue-d);}
  .jalon-obj.blue.done{background:#eafaf0;border-color:#86efac;border-left-color:var(--green);color:var(--green-d);}
  .jalon-obj.blue.done .jo-check{background:var(--green);}
  .jalon-obj.blue.done .jo-text b{color:var(--green-d);}
  .jalon-obj.entering{transform:translateY(120%);opacity:0;}
  .jalon-obj.slideup{transform:translateY(-160%);opacity:0;}
  @media(prefers-reduced-motion:reduce){.jalon-obj{transition:opacity .2s ease;}.jalon-obj.entering,.jalon-obj.slideup{transform:none;}}

  /* ---------- Stage (l'écran de l'ordinateur) ---------- */
  .stage-wrap{max-width:1000px;margin:12px auto;width:calc(100% - 36px);}
  .screen{position:relative;height:clamp(440px,66vh,660px);border-radius:16px;overflow:hidden;
    border:3px solid #cdd9e8;box-shadow:0 18px 40px -24px rgba(34,48,63,.55);
    background:
      radial-gradient(1200px 600px at 70% -10%, #5b8def 0%, transparent 60%),
      radial-gradient(900px 600px at -10% 120%, #7c5cd6 0%, transparent 55%),
      linear-gradient(140deg,#2e64c4,#3f7fd6 55%,#5aa0e6);
    user-select:none;-webkit-user-select:none;}
  .screen.crt{animation:crtOff .9s ease forwards;}
  @keyframes crtOff{60%{filter:brightness(1)}100%{filter:brightness(.2) blur(2px)}}

  /* Bureau + icônes */
  .desktop{position:absolute;inset:0 0 46px 0;display:flex;flex-direction:column;flex-wrap:wrap;
    align-content:flex-start;padding:12px 8px;gap:2px;}
  .desktop.dragover{outline:3px dashed rgba(255,255,255,.55);outline-offset:-8px;}
  .lasso-rect{position:absolute;border:2px solid #60a5fa;background:rgba(96,165,250,.16);border-radius:3px;pointer-events:none;z-index:20;}
  .dt-icon{width:92px;min-height:84px;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 4px 6px;border-radius:10px;cursor:default;text-align:center;border:2px solid transparent;}
  .dt-icon .ic{font-size:2.5rem;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));pointer-events:none;}
  .dt-icon .nm{font-size:.82rem;font-weight:700;color:#fff;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.7);
    word-break:break-word;pointer-events:none;max-width:88px;}
  .dt-icon.sel{background:rgba(120,170,240,.4);border-color:rgba(190,215,255,.85);}
  .dt-icon.infected .ic{animation:virusPulse 1s ease-in-out infinite;}
  .dt-icon.drop-ok{background:rgba(120,170,240,.45);border-color:#bfe;}

  /* ---------- Fenêtres ---------- */
  .win-layer{position:absolute;inset:0 0 46px 0;pointer-events:none;}
  .win{position:absolute;pointer-events:auto;background:#fff;border:1px solid var(--win-line);
    border-radius:11px;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 18px 50px -12px rgba(10,20,40,.55);min-width:300px;min-height:200px;}
  .win.focused{box-shadow:0 22px 60px -10px rgba(10,20,40,.65);}
  .win.min{display:none;}
  .win-bar{height:40px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;cursor:default;
    background:var(--win-bar);border-bottom:1px solid var(--win-line);}
  .win-bar .wt-ic{font-size:1.1rem;}
  .win-bar .wt-name{font-weight:800;font-size:.92rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .win-btn{position:relative;z-index:40;width:30px;height:26px;border:none;background:transparent;border-radius:7px;font-size:.95rem;
    display:flex;align-items:center;justify-content:center;color:#43576b;}
  .win-btn:hover{background:#e4ecf6;}
  .win-btn.close:hover{background:var(--red);color:#fff;}
  .win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;}
  .win.max .rz{display:none;}
  .win-toolbar{display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--win-line);
    background:#fbfdff;flex-wrap:nowrap;}
  .nav-btn{width:30px;height:28px;border:1px solid transparent;background:transparent;border-radius:8px;cursor:default;
    font-size:1rem;color:#3a4a5c;display:flex;align-items:center;justify-content:center;flex:none;}
  .nav-btn:hover:not(:disabled){background:#e9f0fa;border-color:#d2dded;}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .crumbs{flex:1;display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--win-line);
    border-radius:8px;padding:4px 8px;font-weight:700;font-size:.86rem;overflow:hidden;white-space:nowrap;min-width:0;}
  .crumbs{cursor:default;}
  .crumbs .cr{padding:2px 6px;border-radius:6px;cursor:default;color:#33485e;white-space:nowrap;}
  .crumbs .cr:hover{background:#eaf1fb;color:var(--blue-d);}
  .crumbs .sep{color:#9fb1c5;flex:none;}
  .win-search{flex:none;width:130px;display:flex;align-items:center;gap:4px;background:#fff;
    border:1px solid var(--win-line);border-radius:8px;padding:3px 8px;}
  .win-search input{border:none;outline:none;width:100%;font-family:inherit;font-weight:700;font-size:.82rem;background:transparent;color:var(--ink);}
  .win-search .si{font-size:.85rem;color:#90a2b6;}
  .win-body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:row;flex-wrap:wrap;
    align-content:flex-start;align-items:flex-start;gap:4px;position:relative;background:#fff;}
  .win-body.dragover{outline:3px dashed var(--sel-line);outline-offset:-6px;border-radius:8px;}
  .win-body.empty-note::after{content:'Ce dossier est vide';position:absolute;top:46%;left:0;right:0;
    text-align:center;color:#9aabbd;font-weight:800;font-size:.95rem;pointer-events:none;}
  /* ----- volet gauche (arbre de navigation, façon Windows) ----- */
  .win-content{flex:1;display:flex;min-height:0;}
  .win-nav{width:152px;flex:none;overflow:auto;background:#f7fafd;border-right:none;padding:6px 3px;}
  .win-splitter{width:6px;flex:none;cursor:col-resize;background:transparent;position:relative;border-right:1px solid var(--win-line);}
  .win-splitter::after{content:'';position:absolute;top:0;bottom:0;left:1px;width:3px;border-radius:2px;}
  .win-splitter:hover::after,.win-splitter.dragging::after{background:#5aa0e6;}
  .win-splitter.dragging{background:rgba(90,160,230,.12);}
  .win-nav .nav-row{display:flex;align-items:center;border-radius:7px;margin:1px 2px;}
  .win-nav .nav-row.active{background:var(--sel);box-shadow:inset 0 0 0 2px var(--sel-line);}
  .win-nav .nav-row.drop-ok{background:#d7ebff;box-shadow:inset 0 0 0 2px #5aa0e6;}
  .win-nav .nav-chev{flex:none;width:18px;height:24px;border:none;background:none;cursor:default;color:#8294a6;
    font-size:.68rem;padding:0;border-radius:5px;display:flex;align-items:center;justify-content:center;}
  .win-nav .nav-chev:hover{background:#e4ecf6;color:var(--ink);}
  .win-nav .nav-chev.leaf{visibility:hidden;}
  .win-nav .nav-label{flex:1;display:flex;align-items:center;gap:6px;min-width:0;border:none;background:none;
    font-family:inherit;font-weight:700;font-size:.8rem;color:var(--ink);text-align:left;padding:5px 4px;
    border-radius:6px;cursor:default;}
  .win-nav .nav-label:hover{background:#e9f0fa;color:var(--blue-d);}
  .win-nav .nav-row.active .nav-label{color:var(--blue-d);}
  .win-nav .nav-label .nic{flex:none;font-size:.95rem;line-height:1;}
  .win-nav .nav-label .nlb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  @media (max-width:560px){ .win-nav{width:112px;} }
  .fitem{width:96px;min-height:90px;display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:9px 5px 6px;border-radius:9px;cursor:default;text-align:center;border:2px solid transparent;}
  .fitem .ic{font-size:2.3rem;line-height:1;pointer-events:none;}
  .fitem .nm{font-size:.8rem;font-weight:700;color:var(--ink);line-height:1.18;word-break:break-word;max-width:90px;pointer-events:none;}
  .fitem:hover{background:#f1f6fd;}
  .fitem.sel{background:var(--sel);border-color:var(--sel-line);}
  .fitem.cut{opacity:.45;}
  .fitem.infected .ic{animation:virusPulse 1s ease-in-out infinite;}
  .fitem.infected{background:rgba(239,68,68,.07);}
  .fitem.neutralized{background:rgba(100,116,139,.08);opacity:.65;filter:grayscale(.7);}
  .fitem.neutralized .ic{filter:grayscale(1) brightness(.7);}
  .fitem.neutralized .nm{color:#64748b;text-decoration:line-through;}
  .fitem.trace-inert{pointer-events:none;opacity:.6;background:rgba(100,116,139,.04);}
  .fitem.trace-inert .ic{animation:none!important;filter:grayscale(.4);}
  .fitem.trace-inert .nm{color:#64748b;}
  .fitem.drop-ok{background:#d7ebff;border-color:#5aa0e6;}
  .fitem .rn,.dt-icon .rn{font-size:.8rem;font-weight:700;width:84px;max-width:84px;text-align:center;color:var(--ink);
    background:#fff;border:2px solid var(--blue);border-radius:6px;padding:2px 3px;font-family:inherit;outline:none;
    white-space:pre-wrap;word-break:break-all;resize:none;overflow:hidden;line-height:1.3;}
  @keyframes virusPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(239,68,68,0));transform:scale(1)}
    50%{filter:drop-shadow(0 0 7px rgba(239,68,68,.95));transform:scale(1.08)}}
  .win-status{height:24px;border-top:1px solid var(--win-line);background:#f7fafd;
    display:flex;align-items:center;gap:10px;padding:0 12px;font-size:.76rem;font-weight:700;color:#6c7d8f;}
  /* poignées de redimensionnement : 4 côtés + 4 coins */
  .rz{position:absolute;z-index:30;}
  .rz-n{top:0;left:10px;right:10px;height:6px;cursor:ns-resize;}
  .rz-s{bottom:0;left:10px;right:10px;height:6px;cursor:ns-resize;}
  .rz-e{right:0;top:10px;bottom:10px;width:6px;cursor:ew-resize;}
  .rz-w{left:0;top:10px;bottom:10px;width:6px;cursor:ew-resize;}
  .rz-ne{top:0;right:0;width:12px;height:12px;cursor:nesw-resize;}
  .rz-nw{top:0;left:0;width:12px;height:12px;cursor:nwse-resize;}
  .rz-se{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;}
  .rz-sw{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize;}
  /* aperçu document (texte rigolo) facon feuille de papier */
  .doc-paper{text-align:left;background:#fffdf5;border:2px solid #ece3c8;border-radius:10px;padding:16px 18px;
    font-size:1rem;color:#3a4a59;max-height:240px;overflow:auto;line-height:1.55;
    box-shadow:0 2px 0 #ece3c8;white-space:normal;}
  /* mini-lecteur de musique */
  .music-player{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 4px;}
  .mp-disc{font-size:3.4rem;line-height:1;animation:mpSpin 3s linear infinite;}
  @keyframes mpSpin{to{transform:rotate(360deg);}}
  .mp-bars{display:flex;align-items:flex-end;gap:5px;height:40px;}
  .mp-bars i{width:7px;height:12px;border-radius:4px;background:linear-gradient(var(--green),var(--blue));animation:mpEq .9s ease-in-out infinite;}
  .mp-bars i:nth-child(2){animation-delay:.15s;} .mp-bars i:nth-child(3){animation-delay:.3s;}
  .mp-bars i:nth-child(4){animation-delay:.45s;} .mp-bars i:nth-child(5){animation-delay:.6s;}
  @keyframes mpEq{0%,100%{height:10px;}50%{height:38px;}}
  .mp-now{font-weight:800;color:var(--blue-d);}
  /* calculatrice */
  .calc{max-width:280px;margin:6px auto 0;}
  .calc-disp{background:#1f2a37;color:#fff;font-family:"Fredoka","Fluent Emoji",sans-serif;font-size:1.9rem;
    text-align:right;padding:14px 16px;border-radius:12px;margin-bottom:10px;min-height:56px;overflow:hidden;white-space:nowrap;}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .calc-grid button{padding:15px 0;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:1.15rem;color:var(--ink);}
  .calc-grid button:hover{background:#eef4ff;}
  .calc-grid button.op{background:#eaf1fb;color:var(--blue-d);border-color:#cfe0f7;}
  .calc-grid button.eq{background:var(--green);color:#fff;border-color:var(--green);}
  .calc-grid button.clear{background:#fdecec;color:var(--red-d);border-color:#f6c9c9;}
  .calc-grid button.span4{grid-column:span 4;}
  /* paramètres farfelus */
  .settings{text-align:left;}
  .set-head{font-weight:800;color:var(--blue-d);margin:6px 0 8px;font-size:.98rem;}
  .set-head.danger{color:var(--red-d);margin-top:16px;}
  .set-row{display:flex;align-items:center;gap:12px;padding:10px 13px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;background:#f9fbfe;}
  .set-row .se-ic{font-size:1.45rem;flex:none;}
  .set-row .se-tx{flex:1;min-width:0;}
  .set-row .se-tx b{display:block;font-size:.98rem;}
  .set-row .se-tx small{color:var(--muted);font-weight:700;font-size:.84rem;}
  .set-sw{width:46px;height:26px;border-radius:999px;background:#cdd7e3;position:relative;flex:none;cursor:pointer;transition:background .2s;}
  .set-sw .kn{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .set-sw.on{background:var(--green);} .set-sw.on .kn{left:23px;}
  .set-danger{border-color:#f6c9c9;background:#fdf2f2;}
  .set-danger .se-tx small{color:var(--red-d);}
  .set-btn{border:2px solid #f0b8b8;background:#fff;color:var(--red-d);font-weight:800;border-radius:10px;padding:8px 12px;font-size:.86rem;flex:none;}
  .set-btn:hover{background:#fdecec;}

  /* recherche : résultats */
  .res-loc{font-size:.66rem;color:#8294a6;font-weight:700;margin-top:-2px;}

  /* ---------- Barre des tâches ---------- */
  .taskbar{position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(24,33,46,.92);
    backdrop-filter:blur(6px);display:flex;align-items:center;gap:6px;padding:0 10px;z-index:40;}
  .tb-start{height:34px;padding:0 16px;border:none;border-radius:9px;background:#2c3a4d;color:#fff;cursor:default;
    font-size:.86rem;font-weight:800;white-space:nowrap;display:flex;align-items:center;justify-content:center;}
  .tb-start:hover,.tb-start.on{background:var(--blue);}
  .tb-apps{display:flex;gap:5px;flex:1;min-width:0;overflow:hidden;}
  .tb-btn{display:flex;align-items:center;gap:6px;max-width:170px;height:34px;padding:0 11px;border:none;cursor:default;
    border-radius:8px;background:#2c3a4d;color:#dfe8f2;font-weight:700;font-size:.82rem;
    border-bottom:3px solid transparent;}
  .tb-btn .ic{font-size:1rem;}
  .tb-btn .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tb-btn:hover{background:#37485e;}
  .tb-btn.active{background:#3a4d66;border-bottom-color:var(--blue);}
  .tb-btn.min{opacity:.7;}
  .tb-clock{color:#dfe8f2;font-weight:800;font-size:.8rem;text-align:right;line-height:1.05;padding:0 6px;flex:none;}
  .tb-clock small{display:block;font-weight:700;font-size:.7rem;color:#9fb0c4;}

  /* ---------- Menu Démarrer ---------- */
  .startmenu{position:absolute;left:10px;bottom:52px;width:300px;background:#243140;border-radius:14px;z-index:900;
    box-shadow:0 20px 50px rgba(0,0,0,.5);padding:14px;display:none;animation:popUp .14s ease;}
  .startmenu.open{display:block;}
  .sm-head{color:#9fb0c4;font-weight:800;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;margin:2px 0 8px;}
  .sm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .sm-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border:none;border-radius:10px;cursor:default;
    background:#2d3c4e;color:#e7eef6;font-weight:700;font-size:.72rem;}
  .sm-item .ic{font-size:1.6rem;}
  .sm-item:hover{background:#3a4d63;}
  .sm-power{margin-top:10px;display:flex;justify-content:flex-end;}
  .sm-power button{background:#2d3c4e;color:#e7eef6;border:none;border-radius:9px;padding:8px 12px;font-weight:700;font-size:.78rem;}
  .sm-power button:hover{background:var(--red);}
  @keyframes popUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- Menu contextuel (clic droit) ---------- */
  .ctxmenu{position:absolute;z-index:1000;min-width:212px;background:#fff;border:1px solid #cdd9e8;
    border-radius:10px;box-shadow:0 16px 40px rgba(10,20,40,.32);padding:5px;font-size:.86rem;display:none;}
  .ctxmenu.open{display:block;animation:popUp .1s ease;}
  .cm-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;text-align:left;
    padding:8px 11px;border-radius:7px;font-weight:700;color:var(--ink);font-family:inherit;font-size:.86rem;}
  .cm-item .cm-ic{width:20px;text-align:center;font-size:1rem;flex:none;}
  .cm-item .cm-k{margin-left:auto;color:#9aabbd;font-size:.74rem;font-weight:700;}
  .cm-item:hover:not(:disabled){background:#eaf1fb;color:var(--blue-d);}
  .cm-item:disabled{opacity:.38;cursor:default;}
  .cm-item.danger:hover{background:#fdecec;color:var(--red-d);}
  .cm-sep{height:1px;background:#e7eef6;margin:5px 6px;}
  .cm-sub-label{padding:8px 11px;font-weight:800;color:#7a8b9d;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;}

  /* spotlight (astuce qui montre où agir) */
  .spot{position:fixed;border-radius:12px;border:3px solid #ffd54a;box-shadow:0 0 0 4px rgba(255,213,74,.35),0 0 22px rgba(255,213,74,.7);
    z-index:500;pointer-events:none;animation:spotPulse 1.1s ease-in-out infinite;}
  @keyframes spotPulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---------- Barre d'actions (en bas) ---------- */
  .stage-actions{position:relative;max-width:1000px;margin:0 auto 22px;width:calc(100% - 36px);
    display:flex;align-items:center;justify-content:center;min-height:52px;gap:12px;}
  .sa-btn{border:2px solid var(--line);background:#fff;font-weight:800;border-radius:13px;
    padding:12px 20px;font-size:1rem;display:inline-flex;align-items:center;gap:8px;}
  .sa-btn:active{transform:translateY(1px);}
  .sa-hint{position:absolute;left:0;color:var(--amber-d);border-color:var(--amber);}
  .sa-hint:hover{background:#fff8ec;}
  .sa-restart{color:var(--muted);}
  .sa-restart:hover{border-color:var(--red);color:var(--red-d);}
  @media (max-width:560px){
    .stage-actions{flex-direction:column;}
    .sa-hint{position:static;}
  }

  /* drag ghost */
  .drag-ghost{position:fixed;z-index:9999;pointer-events:none;display:flex;flex-direction:column;align-items:center;
    opacity:.9;transform:translate(-50%,-50%) scale(.92);filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));}
  .drag-ghost .ic{font-size:2.2rem;}
  .drag-ghost .badge{position:absolute;top:-6px;right:-10px;background:var(--blue);color:#fff;font-weight:800;
    font-size:.72rem;border-radius:999px;padding:1px 7px;}

  /* ---------- Boss : barre antivirus ---------- */
  .boss-hud{position:absolute;left:0;right:0;top:0;height:42px;z-index:50;display:flex;align-items:center;gap:12px;
    padding:0 12px;background:linear-gradient(#0d1726ee,#16243aee);color:#fff;border-bottom:2px solid #2a3d57;}
  .boss-hud .bh-ttl{font-weight:800;font-size:.86rem;display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .boss-hud .meter{flex:1;height:16px;border-radius:9px;background:#24344a;overflow:hidden;position:relative;min-width:80px;}
  .boss-hud .meter > i{display:block;height:100%;width:0;border-radius:9px;
    background:linear-gradient(90deg,#22c55e,#eab308 55%,#ef4444);transition:width .3s ease;}
  .boss-hud .meter .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:.7rem;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .boss-hud .bh-stat{font-weight:800;font-size:.82rem;white-space:nowrap;}
  .boss-hud .scan-btn{border:none;background:#2563eb;color:#fff;font-weight:800;border-radius:9px;padding:7px 11px;font-size:.8rem;}
  .boss-hud .scan-btn:hover{background:#1d4ed8;}
  .boss-hud .scan-btn:disabled{opacity:.45;}
  .screen.shake{animation:screenShake .4s;}
  @keyframes screenShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .radar-ping{position:absolute;border-radius:14px;border:3px solid #38bdf8;z-index:65;pointer-events:none;
    animation:radarPing 1.2s ease-out 2;}
  @keyframes radarPing{0%{box-shadow:0 0 0 0 rgba(56,189,248,.6);opacity:1}100%{box-shadow:0 0 0 26px rgba(56,189,248,0);opacity:.2}}
  .bsod{position:absolute;inset:0;z-index:200;background:#1a4ed8;color:#fff;display:none;flex-direction:column;
    justify-content:center;padding:8% 10%;font-family:"Fredoka","Fluent Emoji",sans-serif;}
  .bsod.show{display:flex;animation:popUp .2s ease;}
  .bsod .face{font-size:3.2rem;font-weight:600;}
  .bsod h2{font-size:1.7rem;margin:14px 0 8px;font-weight:600;}
  .bsod p{font-size:1rem;font-weight:400;line-height:1.5;max-width:560px;}
  .bsod .pct{font-size:.86rem;margin-top:16px;opacity:.85;}
  .bsod.show{display:flex;}
  .bsod .reboot{font-size:.8rem;margin-top:22px;opacity:.7;}
  .bsod .bsod-help{background:rgba(255,255,255,.13);border-radius:10px;padding:12px 18px;max-width:540px;margin-top:22px;}
  .bsod .bsod-help p{font-size:.92rem;margin:0;opacity:1;line-height:1.55;}
  .bsod .bsod-retry{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.18);border:2.5px solid rgba(255,255,255,.55);color:#fff;
    font-weight:800;font-size:1rem;padding:11px 32px;border-radius:13px;cursor:pointer;
    font-family:inherit;white-space:nowrap;letter-spacing:.01em;}
  .bsod .bsod-retry:hover{background:rgba(255,255,255,.30);}

  /* ---------- Boss CORRUPTUS : HUD enrichi ---------- */
  .boss-hud{flex-wrap:wrap;min-height:42px;height:auto;padding:5px 12px;gap:10px;}
  .bh-avatar{font-size:1.55rem;line-height:1;flex:none;filter:drop-shadow(0 0 6px #a855f7);animation:corrFloat 2.4s ease-in-out infinite;}
  .bh-avatar.sabotage{animation:corrGlitch .45s steps(2) 3;}
  @keyframes corrFloat{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-3px) rotate(3deg);}}
  @keyframes corrGlitch{0%{transform:translate(0,0);filter:drop-shadow(2px 0 #ef4444) drop-shadow(-2px 0 #38bdf8);}
    50%{transform:translate(-3px,1px) skewX(8deg);}100%{transform:translate(2px,-1px);}}
  .bh-info{flex:none;min-width:96px;display:flex;flex-direction:column;line-height:1.1;}
  .bh-name{font-weight:800;font-size:.84rem;letter-spacing:.02em;}
  .bh-phase{display:block;font-weight:700;font-size:.68rem;color:#c4b5fd;}
  .boss-hud .meter{min-width:120px;}
  .boss-hud .meter > i{transition:width .35s ease;}
  .boss-hud .meter.crit{animation:contamPulse .7s ease-in-out infinite;}
  @keyframes contamPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.0);}50%{box-shadow:0 0 0 4px rgba(239,68,68,.45);}}
  .bh-contam-tag{font-size:1rem;flex:none;}
  .bh-pips{display:flex;gap:4px;flex:none;align-items:center;}
  .bh-pips i{width:15px;height:15px;border-radius:50%;background:#3a1d2a;box-shadow:inset 0 0 0 2px #7f1d1d;transition:.3s;}
  .bh-pips i.alive{background:radial-gradient(circle at 35% 30%,#e9d5ff,#a855f7 70%);box-shadow:0 0 9px #a855f7,inset 0 0 0 2px #d8b4fe;}
  .bh-pips i.dying{animation:pipPop .5s ease;}
  @keyframes pipPop{0%{transform:scale(1.5);filter:brightness(2);}100%{transform:scale(1);}}
  .bh-corr-name{font-family:"Fredoka","Fluent Emoji",sans-serif;}

  /* trace / cible de navigation (phases 1 & 5) */
  .boss-track{position:absolute;left:50%;top:48px;transform:translateX(-50%);z-index:48;max-width:88%;
    background:linear-gradient(#1e1033ee,#2a1a44ee);border:2px solid #7c3aed;border-radius:11px;
    padding:7px 14px;color:#ede9fe;font-weight:700;font-size:.84rem;text-align:center;box-shadow:0 8px 24px rgba(124,58,237,.4);
    display:flex;align-items:center;gap:9px;animation:popUp .2s ease;}
  .boss-track b{color:#fcd34d;}
  .boss-track .bt-path{font-family:"Fredoka","Fluent Emoji",sans-serif;background:#0d0820;border-radius:7px;padding:3px 9px;color:#a5b4fc;}
  /* variante antivirus (phase traque) */
  .boss-track.av-track{background:linear-gradient(#2d2000ee,#3d3000ee);border-color:#eab308;
    box-shadow:0 8px 28px rgba(234,179,8,.38);flex-direction:column;align-items:center;gap:4px;padding:9px 20px;}
  .boss-track.av-track .av-label{font-size:.75rem;font-weight:700;color:#fde68a;letter-spacing:.05em;text-transform:uppercase;opacity:.9;}
  .boss-track.av-track .av-path{font-size:1.22rem;font-weight:800;color:#fff;line-height:1.3;text-align:center;}
  /* variante alerte nid (phase 2) */
  @keyframes nidFlash{0%,100%{background:linear-gradient(#3b0000ee,#5a0000ee);border-color:#ef4444;box-shadow:0 6px 24px rgba(239,68,68,.35);}
    50%{background:linear-gradient(#6b0000ee,#8b0000ee);border-color:#fca5a5;box-shadow:0 0 0 6px rgba(239,68,68,.45);}}
  .boss-track.nid-alert{animation:nidFlash .5s ease-in-out infinite;flex-direction:column;align-items:center;gap:3px;padding:8px 18px;}
  .boss-track.nid-alert .na-label{font-size:.75rem;font-weight:800;color:#fca5a5;letter-spacing:.06em;text-transform:uppercase;}
  .boss-track.nid-alert .na-path{font-size:1rem;font-weight:800;color:#fff;line-height:1.3;text-align:center;}

  /* fausse erreur Windows (sabotage) */
  .fake-err{position:absolute;width:min(310px,84%);background:#f4f6f9;border:1px solid #8a9bb0;border-radius:8px;
    box-shadow:0 16px 44px rgba(0,0,0,.5);z-index:160;overflow:hidden;animation:errPop .18s ease;}
  @keyframes errPop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
  .fake-err.glitch{animation:errShake .3s steps(2) infinite;}
  @keyframes errShake{0%{transform:translate(0,0);}50%{transform:translate(2px,-1px);}100%{transform:translate(-1px,1px);}}
  .fake-err .fe-bar{background:linear-gradient(#c0392b,#a33025);color:#fff;font-weight:800;font-size:.8rem;
    padding:6px 10px;display:flex;align-items:center;justify-content:space-between;}
  .fake-err .fe-bar button{border:none;background:rgba(255,255,255,.18);color:#fff;width:20px;height:20px;border-radius:4px;font-weight:800;}
  .fake-err .fe-body{padding:13px 14px;display:flex;gap:11px;align-items:flex-start;font-size:.85rem;font-weight:700;color:#2a2a2a;}
  .fake-err .fe-ic{font-size:1.7rem;line-height:1;flex:none;}
  .fake-err .fe-actions{padding:0 14px 13px;text-align:right;}
  .fake-err .fe-actions button{border:1px solid #9aa7b8;background:#e7ecf3;color:#1f2a37;font-weight:800;
    border-radius:7px;padding:6px 16px;font-size:.84rem;}
  .fake-err .fe-actions button:hover{background:#dbe3ee;}

  /* sélecteur de difficulté */
  .diff-grid{display:flex;flex-direction:column;gap:9px;margin:14px 0 4px;}
  .diff-btn{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
    border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 15px;transition:.15s;}
  .diff-btn:hover{border-color:var(--red);transform:translateY(-1px);box-shadow:0 7px 16px -8px rgba(239,68,68,.5);}
  .diff-btn .db-ic{font-size:1.9rem;line-height:1;flex:none;}
  .diff-btn .db-tx{flex:1;display:flex;flex-direction:column;line-height:1.2;}
  .diff-btn .db-name{font-family:"Fredoka","Fluent Emoji",sans-serif;font-weight:700;font-size:1.08rem;color:var(--ink);}
  .diff-btn .db-sub{font-size:.84rem;font-weight:700;color:var(--muted);}
  .diff-btn .db-tag{margin-left:auto;font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 11px;white-space:nowrap;}
  .diff-btn.easy{border-color:#bbf7d0;} .diff-btn.easy .db-tag{background:#86efac;color:#14532d;}
  .diff-btn.medium .db-tag{background:#fde68a;color:#713f12;}
  .diff-btn.hard{border-color:#fca5a5;} .diff-btn.hard .db-tag{background:#fca5a5;color:#7f1d1d;}

  /* rapport terminal (victoire) */
  .term-report{background:#070b12;border:2px solid #1f6feb;border-radius:12px;padding:16px 18px;margin:12px 0 4px;
    font-family:"Fredoka",monospace;color:#5ce08a;text-align:left;font-size:.92rem;line-height:1.65;
    box-shadow:inset 0 0 30px rgba(31,111,235,.25);min-height:210px;}
  .term-report .tr-head{color:#7cc5ff;font-weight:700;margin-bottom:6px;}
  .term-report .tr-line{white-space:pre-wrap;}
  .term-report .tr-line.good{color:#5ce08a;} .term-report .tr-line.dim{color:#6b89a8;}
  .term-report .tr-line.score{color:#fcd34d;font-size:1.15rem;font-weight:700;margin-top:6px;}
  .term-report .tr-cur{display:inline-block;width:9px;background:#5ce08a;animation:curBlink 1s steps(1) infinite;}
  @keyframes curBlink{50%{opacity:0;}}

  /* dossier verrouillé par CORRUPTUS */
  .fitem.corr-locked .ic, .dt-icon.corr-locked .ic{filter:drop-shadow(0 0 5px #a855f7);}
  .fitem.corr-locked::after{content:'🔒';position:absolute;font-size:.9rem;margin:-4px 0 0 26px;}
  .win.boss-shut{animation:winShut .3s ease forwards;}
  @keyframes winShut{to{transform:scale(.6);opacity:0;}}

  /* grosse popup d'avertissement / résultat (style erreur, plus grande) */
  .fake-err.warn-big{width:min(400px,90%);border-color:#c0392b;}
  .fake-err.warn-big .fe-body{font-size:1rem;line-height:1.5;}
  .fake-err.warn-big .fe-ic{font-size:2.2rem;}
  .fake-err .fe-count{color:#c0392b;font-size:1.15rem;}

  /* terminal de lutte anti-déconnexion */
  .cmd-term{position:absolute;inset:0;z-index:185;background:rgba(2,6,12,.93);display:flex;align-items:center;justify-content:center;padding:18px;animation:popUp .18s ease;}
  .cmd-win{width:min(580px,95%);background:#06090f;border:2px solid #1f6feb;border-radius:10px;overflow:hidden;
    box-shadow:0 0 44px rgba(31,111,235,.55);font-family:"Fredoka",monospace;}
  .cmd-bar2{background:#0d1320;color:#9fc3ff;font-weight:700;font-size:.82rem;padding:7px 12px;border-bottom:1px solid #1f3350;}
  .cmd-body{padding:15px 18px 18px;color:#5ce08a;font-size:.96rem;line-height:1.6;}
  .cmd-body .cl{white-space:pre-wrap;margin-bottom:3px;}
  .cmd-body .cl.warn{color:#ff7676;font-weight:800;font-size:1.05rem;}
  .cmd-discwrap{margin:13px 0 4px;color:#cfe3ff;font-weight:700;}
  .cmd-discbar{margin-top:6px;height:24px;border:2px solid #b91c1c;border-radius:5px;background:#170a0a;position:relative;overflow:hidden;}
  .cmd-discbar > i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#ef4444 0,#ef4444 9px,#b91c1c 9px,#b91c1c 18px);transition:width .1s linear;}
  .cmd-discbar .dl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;}
  .cmd-discbar.crit{animation:contamPulse .5s ease-in-out infinite;}
  .cmd-prog{color:#9fc3ff;font-weight:700;margin:12px 0 2px;}
  .cmd-prompt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .cmd-prompt .ps{color:#5ce08a;font-weight:800;}
  .cmd-prompt .cmd-cmdname{color:#fcd34d;font-weight:800;letter-spacing:.06em;background:#1a1405;padding:2px 9px;border-radius:5px;}
  .cmd-input{flex:1;min-width:120px;background:#02040a;border:2px solid #1f6feb;border-radius:6px;color:#5ce08a;
    font-family:"Fredoka",monospace;font-size:1rem;font-weight:700;padding:8px 11px;outline:none;}
  .cmd-input:focus{border-color:#5ce08a;}
  .cmd-input.shake{animation:screenShake .35s;}

  /* mini-tuto de phase (dans la modale) */
  .btuto{margin:8px 0 2px;}
  .btuto-hint{font-weight:800;color:var(--red-d);font-size:1rem;margin-bottom:10px;text-align:center;line-height:1.35;}
  .btuto-stage{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;
    background:#fdeeee;border:2px dashed #f6c9c9;border-radius:14px;padding:16px;min-height:96px;}
  .btuto-stage.done{background:#eafaf0;border-color:#86efac;}
  .bt-chip{display:flex;flex-direction:column;align-items:center;gap:3px;width:86px;padding:10px 6px;border:2px solid var(--line);
    border-radius:11px;background:#fff;cursor:pointer;font-weight:700;font-size:.78rem;user-select:none;transition:.12s;}
  .bt-chip:hover{border-color:var(--blue);}
  .bt-chip .ic{font-size:2rem;line-height:1;}
  .bt-chip.infected{background:rgba(239,68,68,.08);border-color:#f3b4b4;}
  .bt-chip.infected .ic{animation:virusPulse 1s ease-in-out infinite;}
  .bt-chip.sel{background:var(--sel);border-color:var(--sel-line);}
  .bt-drop{width:104px;height:84px;border:3px dashed #7aa7ec;border-radius:13px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:var(--blue-d);font-weight:800;font-size:.82rem;background:#eaf3ff;text-align:center;}
  .bt-drop.over{background:#d7ebff;border-color:#2563eb;}
  .bt-btn{border:2px solid var(--line);background:#fff;font-weight:800;border-radius:11px;padding:10px 16px;font-size:.96rem;cursor:pointer;}
  .bt-btn:hover{border-color:var(--blue);}
  .bt-btn.trash{border-color:#f0b8b8;color:var(--red-d);}
  .bt-btn.trash:hover{background:#fdecec;}
  .bt-author{font-weight:800;color:var(--muted);font-size:.92rem;}

  /* filigrane Corruptus */
  @keyframes corrWatermark{0%{opacity:0;transform:translate(-50%,-50%) scale(.7);}20%{opacity:.42;transform:translate(-50%,-50%) scale(1.05);}80%{opacity:.42;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(.9);}}
  .corr-watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:170;pointer-events:none;
    font-size:clamp(8rem,28vw,22rem);line-height:1;animation:corrWatermark 2.4s ease forwards;
    filter:drop-shadow(0 0 40px rgba(168,85,247,.6)) drop-shadow(0 0 80px rgba(220,38,38,.5));
    user-select:none;}

  @media (prefers-reduced-motion: reduce){

<script>
/* =========================================================
   DOSSIERS ET FICHIERS — explorateur Windows simulé & gamifié
   Aucun framework. Tout est piloté par LEVELS[].rounds[].
   ========================================================= */

/* ---------------------------------------------------------
   0. OUTILS GÉNÉRAUX
   --------------------------------------------------------- */
function kbd(s){ return '<kbd>'+s+'</kbd>'; }
const ICON={
  drive:'💽', folder:'📁', folderOpen:'📂', bin:'🗑️', binFull:'🗑️',
  txt:'📄', doc:'📝', pdf:'📕', jpg:'🖼️', png:'🖼️', gif:'🎞️', photo:'📷',
  mp3:'🎵', mp4:'🎬', zip:'🗜️', exe:'⚙️', xls:'📊', ppt:'📽️', html:'🌐',
  app:'🧩', virus:'🦠', generic:'📄'
};
function iconFor(node){
  if(node.icon) return node.icon;
  if(node.type==='folder') return node===EX.binNode ? (BIN.kids.length?ICON.binFull:ICON.bin) : ICON.folder;
  return ICON[node.ext] || ICON.generic;
}
function formatSize(kb){
  if(kb>=1024) return (kb/1024).toFixed(1).replace('.',',')+' Mo';
  return kb+' Ko';
}
function sizeKbByExt(ext){
  const map={txt:12,doc:48,pdf:320,jpg:1400,png:820,gif:2100,photo:2800,mp3:4200,mp4:24000,zip:6700,exe:1100,xls:30,ppt:2400,html:8,virus:0};
  return map[ext]||10;
}
function nodeSizeKb(node){
  if(node.type==='file') return node.sizeKb||sizeKbByExt(node.ext);
  return (node.kids||[]).reduce((s,k)=>s+nodeSizeKb(k), 0);
}
function fakeSize(node){
  if(node.type==='folder'){ return countAll(node)+' élément'+(countAll(node)>1?'s':''); }
  return node.sizeKb ? formatSize(node.sizeKb) : formatSize(sizeKbByExt(node.ext));
}
function typeLabel(node){
  if(node.type==='folder') return 'Dossier';
  const map={txt:'Document texte',doc:'Document Word',pdf:'Document PDF',jpg:'Image JPEG',png:'Image PNG',
    gif:'Image GIF',photo:'Photo',mp3:'Fichier audio',mp4:'Vidéo',zip:'Dossier compressé',exe:'Application',
    xls:'Feuille de calcul',ppt:'Présentation',html:'Page web',virus:'⚠ Fichier infecté'};
  return map[node.ext]||'Fichier';
}
function displayName(node){
  if(node.type==='folder') return node.name;
  if(node.noext || !node.ext) return node.name;
  return node.name+'.'+node.ext;
}
function countAll(node){ let n=0; (node.kids||[]).forEach(k=>{ n++; if(k.type==='folder') n+=countAll(k); }); return n; }

/* construction de l'arbre à partir d'une graine déclarative */
function file(name, ext, opts){ return Object.assign({type:'file', name:name, ext:ext}, opts||{}); }
function folder(name, kids, opts){ return Object.assign({type:'folder', name:name, kids:kids||[]}, opts||{}); }
let _uid=1;
function buildNode(spec, parent){
  const n=Object.assign({}, spec);
  n.id='n'+(_uid++);
  n.parent=parent||null;
  n.seeded=true;
  if(n.type==='folder'){
    const kids=(spec.kids||[]).map(k=>buildNode(k, n));
    n.kids=kids;
  }
  return n;
}
function cloneSubtree(node, parent){
  const n=Object.assign({}, node);
  n.id='n'+(_uid++);
  n.parent=parent||null;
  n.seeded=false;
  if(n.type==='folder') n.kids=(node.kids||[]).map(k=>cloneSubtree(k, n));
  return n;
}
function walk(node, fn){ fn(node); if(node.type==='folder') (node.kids||[]).forEach(k=>walk(k, fn)); }
function findFolderByName(root, name){ let f=null; walk(root, n=>{ if(!f && n.type==='folder' && n.name===name) f=n; }); return f; }
function findAnyByName(root, name){ const a=[]; walk(root, n=>{ if(n!==root && (n.name===name || displayName(n)===name)) a.push(n); }); return a; }
function pathOf(node){ const p=[]; let c=node; while(c){ p.unshift(c); c=c.parent; } return p; }

/* ---------------------------------------------------------
   1. ÉTAT GLOBAL + STOCKAGE
   --------------------------------------------------------- */
const store={
  get(k){ try{return localStorage.getItem(k);}catch(e){return this._m&&this._m[k];} },
  set(k,v){ try{localStorage.setItem(k,v);}catch(e){ (this._m=this._m||{})[k]=v; } },
  del(k){ try{localStorage.removeItem(k);}catch(e){ if(this._m) delete this._m[k]; } },
  _m:{}
};
let currentLevel=1, STEPS=[], progressIdx=0, playIdx=0, currentStep=null;
const stage=document.getElementById('stage');
const overlay=document.getElementById('overlay');
const modal=document.getElementById('modal');

let BUREAU=null, BIN=null;           // racines de l'arbre
const EX={
  windows:[], focusedWin:null, winSeq:0,
  desktopRoot:null, binNode:null,
  sel:new Set(),                      // sélection (ids) dans le conteneur actif
  selBox:null,                        // conteneur où porte la sélection ('desktop' ou winId)
  clip:null,                          // {mode:'cut'|'copy', ids:[...]}
  opened:new Set(),                   // noms de fichiers ouverts
  evt:{},                             // drapeaux d'évènements pour la mission en cours
  boss:null
};
let soundOn=(store.get('df_sound')||'1')==='1';

function getUnlocked(){ let u=parseInt(store.get('df_unlocked')||'1',10); if(isNaN(u)||u<1)u=1; return Math.min(u,LEVELS.length); }
function getSavedStep(n){ let s=parseInt(store.get('df_step_l'+n)||'0',10); return (isNaN(s)||s<0)?0:s; }
function saveProgress(){ store.set('df_step_l'+currentLevel, String(progressIdx)); }

/* ---------------------------------------------------------
   2. SON (WebAudio, sans fichier externe)
   --------------------------------------------------------- */
let actx=null, bossMusic=null;
function audioCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function pauseBossMusic(){ if(bossMusic){ try{ bossMusic.pause(); }catch(e){} } }
function resumeBossMusic(){ if(bossMusic && soundOn){ try{ const p=bossMusic.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} } }
function beep(kind){
  if(!soundOn) return; const a=audioCtx(); if(!a) return; const now=a.currentTime;
  function tone(freq,dur,type,vol,delay){
    const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(a.destination); const t=now+(delay||0);
    g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur);
  }
  if(kind==='click'){ tone(420,.03,'square',.05); }
  else if(kind==='open'){ tone(540,.06,'sine',.09); tone(760,.07,'sine',.07,.04); }
  else if(kind==='good'){ tone(740,.09,'sine',.12); tone(1180,.09,'sine',.08,.02); }
  else if(kind==='bad'){ tone(150,.16,'square',.12); }
  else if(kind==='delete'){ tone(300,.08,'sawtooth',.08); tone(180,.12,'sawtooth',.07,.05); }
  else if(kind==='ding'){ tone(880,.12,'sine',.12); tone(1320,.16,'sine',.1,.08); }
  else if(kind==='win'){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.09)); }
  else if(kind==='alarm'){ tone(360,.18,'square',.10); tone(300,.18,'square',.10,.18); }
  else if(kind==='crash'){ [400,300,200,120,80].forEach((f,i)=>tone(f,.22,'sawtooth',.12,i*.12)); }
}

document.getElementById('soundBtn').onclick=()=>{ soundOn=!soundOn; store.set('df_sound', soundOn?'1':'0'); refreshSoundBtn(); if(soundOn){ audioCtx(); beep('good'); resumeBossMusic(); } else { pauseBossMusic(); } };

function renderTaskbar(){

/* ----- fenêtres ----- */

function closeWindow(w){

function toggleMax(w){

}
function updateMaxBtn(w){

}
function focusWin(w){

  EX.windows.forEach(x=>{ if(x.el) x.el.classList.toggle('focused', x===w); });

function navTo(w, node, pushHist){
  w.cur=node; w.search=''; w.searchResults=null;
  if(w.el) w.el.querySelector('.win-search input').value='';
  if(pushHist!==false){ w.hist=w.hist.slice(0, w.hidx+1); w.hist.push(node); w.hidx=w.hist.length-1; }
  renderWinBody(w); renderTaskbar();
}
function navBack(w){ if(w.hidx>0){ w.hidx--; w.cur=w.hist[w.hidx]; w.search=''; w.searchResults=null; if(w.el) w.el.querySelector('.win-search input').value=''; EX.evt.usedBack=true; renderWinBody(w); renderTaskbar(); beep('click'); checkMission(); } }
function navFwd(w){ if(w.hidx<w.hist.length-1){ w.hidx++; w.cur=w.hist[w.hidx]; w.search=''; w.searchResults=null; if(w.el) w.el.querySelector('.win-search input').value=''; EX.evt.usedFwd=true; renderWinBody(w); renderTaskbar(); beep('click'); checkMission(); } }
function navUp(w){ const p=w.cur.parent; if(p){ EX.evt.usedUp=true; navTo(w, p); beep('click'); checkMission(); } }

function renderWinBody(w){
  if(!w.el) return;
  focusedClass(w);
  w.el.querySelector('.wt-ic').textContent=iconFor(w.cur);
  w.el.querySelector('.wt-name').textContent=w.cur.name;
  // fil d'Ariane
  const cr=w.el.querySelector('.crumbs'); cr.innerHTML='';
  const path=pathOf(w.cur);
  path.forEach((nd,i)=>{
    if(i>0){ const s=document.createElement('span'); s.className='sep'; s.textContent='▸'; cr.appendChild(s); }
    const c=document.createElement('span'); c.className='cr'; c.textContent=(i===0?'🖥️ ':'')+nd.name;
    c.onclick=()=>{ EX.evt.usedCrumb=true; navTo(w, nd); beep('click'); checkMission(); };
    cr.appendChild(c);
  });
  // boutons nav
  w.el.querySelector('.nav-back').disabled=(w.hidx<=0);
  w.el.querySelector('.nav-fwd').disabled=(w.hidx>=w.hist.length-1);
  w.el.querySelector('.nav-up').disabled=!w.cur.parent;
  // volet gauche (arbre)
  renderNavPane(w);
  // corps
  const body=w.el.querySelector('.win-body');
  const activeLasso=body.querySelector('.lasso-rect');
  body.innerHTML='';
  body.classList.toggle('dragover', false);
  if(w.searchResults){
    renderSearchResults(w, body); if(activeLasso) body.appendChild(activeLasso); return;
  }
  // les dossiers « volet uniquement » ne s'affichent pas dans la liste principale
  // pendant la phase clones, les copies CORRUPTUS sont invisibles en navigation normale (search seulement)
  const _clonesPhase=EX.boss&&EX.boss.running&&EX.boss.phase&&EX.boss.phase.key==='clones';
  const _cachePhase=EX.boss&&EX.boss.running&&EX.boss.phase&&EX.boss.phase.key==='cache';
  const _q=_clonesPhase&&bossQuarantaine?bossQuarantaine():null;
  const _cloneVisible=!_clonesPhase || w.cur===_q || w.cur===EX.binNode;
  let kids=(w.cur.kids||[]).filter(k=>!k.panelOnly && (!_clonesPhase || !k.isClone || _cloneVisible));
  if(w.sortBy) kids=sortKids(kids, w.sortBy);
  const term=(w.search||'').trim().toLowerCase();
  const visible=kids.filter(k=>!term || displayName(k).toLowerCase().includes(term));
  body.classList.toggle('empty-note', visible.length===0);
  visible.forEach(node=>{
    const el=document.createElement('div');
    const _neutralized=_clonesPhase && node.isClone && _q && node.parent===_q;
    const _traceInert=_cachePhase && node.isTrace;
    el.className='fitem'+(EX.sel.has(node.id)&&EX.selBox===w.id?' sel':'')
      +(EX.clip&&EX.clip.mode==='cut'&&EX.clip.ids.indexOf(node.id)>=0?' cut':'')
      +(_neutralized?' neutralized':(_traceInert?' trace-inert':(node.infected?' infected':'')));
    el.dataset.id=node.id;
    el.innerHTML='<span class="ic">'+iconFor(node)+'</span><span class="nm">'+displayName(node)+'</span>';
    el.addEventListener('mousedown', e=>onItemMouseDown(e, node, w.id));
    el.addEventListener('dblclick', e=>{ e.stopPropagation(); cancelRenameTimer();
      if(node.type==='folder' && currentStep && currentStep.lockMainNav){ toast('🔒 Utilise le <b>volet de gauche</b> pour naviguer dans cette mission.'); return; }
      openNode(node, w); });
    el.addEventListener('contextmenu', e=>onItemContext(e, node, w.id));
    body.appendChild(el);
  });
  if(activeLasso) body.appendChild(activeLasso);
  // barre d'état
  const st=w.el.querySelector('.win-status');
  const selCount=(EX.selBox===w.id)?EX.sel.size:0;
  const mainCount=(w.cur.kids||[]).filter(k=>!k.panelOnly).length;
  st.textContent=mainCount+' élément'+(mainCount>1?'s':'')
    +(selCount?'  ·  '+selCount+' sélectionné'+(selCount>1?'s':''):'');
}
/* ----- volet gauche : arbre de dossiers déroulant (façon Windows) ----- */
function folderChildren(node){ return (node.kids||[]).filter(k=>k.type==='folder'); }
function renderNavPane(w){
  if(!w.el) return;
  const pane=w.el.querySelector('.win-nav'); if(!pane) return;
  if(!w.navOpen) w.navOpen=new Set();
  // déplie automatiquement le chemin du dossier courant, sauf ceux explicitement refermés
  pathOf(w.cur).forEach(n=>{ if(n.type==='folder' && !(w.navClosed&&w.navClosed.has(n.id))) w.navOpen.add(n.id); });
  pane.innerHTML='';
  navRows(pane, EX.desktopRoot, 0, w);
  pane.scrollTop=w.navScroll||0;
  pane.onscroll=()=>{ w.navScroll=pane.scrollTop; };
}
function navRows(pane, node, depth, w){
  const kids=folderChildren(node);
  const open=w.navOpen.has(node.id);
  const row=document.createElement('div');
  row.className='nav-row'+(node===w.cur?' active':'');
  row.dataset.id=node.id;
  row.style.paddingLeft=(depth*13)+'px';
  const chev=document.createElement('button');
  chev.className='nav-chev'+(kids.length?'':' leaf');
  chev.textContent=open?'▾':'▸';
  chev.title=open?'Réduire':'Développer';
  chev.onclick=(e)=>{ e.stopPropagation(); if(!kids.length) return;
    if(open){ w.navOpen.delete(node.id); (w.navClosed=w.navClosed||new Set()).add(node.id); }
    else { w.navOpen.add(node.id); EX.evt.navExpanded=true; if(w.navClosed) w.navClosed.delete(node.id); }
    beep('click'); renderNavPane(w); checkMission(); };
  const lab=document.createElement('button'); lab.className='nav-label';
  lab.innerHTML='<span class="nic">'+(node===EX.desktopRoot?'🖥️':iconFor(node))+'</span><span class="nlb">'+node.name+'</span>';
  lab.onclick=(e)=>{ e.stopPropagation(); EX.evt.usedNavPane=true;
    if(node!==w.cur){ navTo(w, node); } beep('click'); checkMission(); };
  row.appendChild(chev); row.appendChild(lab); pane.appendChild(row);
  if(open) kids.forEach(k=>navRows(pane, k, depth+1, w));
}
function focusedClass(w){ w.el.classList.toggle('focused', w===EX.focusedWin); }
function sortKids(kids, by){
  const arr=kids.slice();
  if(by==='name') arr.sort((a,b)=>displayName(a).localeCompare(displayName(b),'fr',{numeric:true}));
  else if(by==='type') arr.sort((a,b)=> (a.type===b.type? (a.type==='folder'?0:(a.ext||'').localeCompare(b.ext||'')) : (a.type==='folder'?-1:1)) || displayName(a).localeCompare(displayName(b),'fr'));
  else if(by==='date') arr.sort((a,b)=>(b.date||0)-(a.date||0));
  // dossiers d'abord (sauf tri par date)
  if(by!=='date') arr.sort((a,b)=> (a.type==='folder'?0:1)-(b.type==='folder'?0:1) );
  return arr;
}

/* recherche récursive */
function runSearch(w, term){
  term=(term||'').trim();
  if(term.length<2){ w.searchResults=null; renderWinBody(w); return; }
  const res=[]; walk(w.cur, n=>{ if(n!==w.cur && displayName(n).toLowerCase().includes(term.toLowerCase())) res.push(n); });
  w.searchResults={term, res}; EX.evt.searched=term;
  renderWinBody(w); checkMission();
}
function renderSearchResults(w, body){
  const {term,res}=w.searchResults;
  if(!res.length){ body.classList.add('empty-note'); body.innerHTML='<div style="width:100%;text-align:center;color:#9aabbd;font-weight:800;padding:40px 10px;">Aucun résultat pour « '+term+' »</div>'; return; }
  const _clonesPhase=EX.boss&&EX.boss.running&&EX.boss.phase&&EX.boss.phase.key==='clones';
  const _cachePhaseS=EX.boss&&EX.boss.running&&EX.boss.phase&&EX.boss.phase.key==='cache';
  const _q=_clonesPhase&&bossQuarantaine?bossQuarantaine():null;
  res.forEach(node=>{
    const fullPath=pathOf(node.parent||EX.desktopRoot); const curIdx=fullPath.indexOf(w.cur); const loc=fullPath.slice(curIdx>=0?curIdx:0).map(p=>p.name).join(' ▸ ');
    const el=document.createElement('div');
    const _neutralized=_clonesPhase && node.isClone && _q && node.parent===_q;
    const _traceInertS=_cachePhaseS && node.isTrace;
    el.className='fitem'+(_neutralized?' neutralized':(_traceInertS?' trace-inert':(node.infected?' infected':'')));
    el.dataset.id=node.id;
    el.innerHTML='<span class="ic">'+iconFor(node)+'</span><span class="nm">'+displayName(node)+'</span><span class="res-loc">'+loc+'</span>';
    el.addEventListener('dblclick', e=>{ e.stopPropagation();
      EX.evt.searchOpened=(EX.evt.searchOpened||new Set()); EX.evt.searchOpened.add(node.name);
      if(node.type==='folder'){ navTo(w, node); }
      else { const pf=node.parent; if(pf){ navTo(w, pf); } selectOnly(node, w.id); EX.opened.add(node.name); openFilePreview(node); }
      checkMission();
    });
    el.addEventListener('mousedown', e=>onItemMouseDown(e, node, w.id));
    el.addEventListener('contextmenu', e=>onItemContext(e, node, w.id));
    body.appendChild(el);
  });
}

/* ----- déplacement / redimension fenêtre ----- */
let winDrag=null;
function startWinDrag(e, w){
  if(w.max) return;
  winDrag={w, dx:e.clientX-w.x, dy:e.clientY-w.y};
  window.addEventListener('mousemove', onWinDragMove);
  window.addEventListener('mouseup', onWinDragUp);
}
function onWinDragMove(e){
  if(!winDrag) return; const {w}=winDrag;
  const screen=document.getElementById('screen').getBoundingClientRect();
  let nx=e.clientX-winDrag.dx, ny=e.clientY-winDrag.dy;
  nx=Math.max(-w.wdt+80, Math.min(screen.width-60, nx));
  ny=Math.max(0, Math.min(screen.height-80, ny));
  w.x=nx; w.y=ny; w.el.style.left=nx+'px'; w.el.style.top=ny+'px';
}
function onWinDragUp(){ winDrag=null; document.body.style.cursor=''; window.removeEventListener('mousemove', onWinDragMove); window.removeEventListener('mouseup', onWinDragUp); }
let winRz=null;
function startWinResize(e, w, dir){
  if(w.max) return;
  e.stopPropagation(); e.preventDefault(); focusWin(w);
  winRz={w, dir:dir||'se', sx:e.clientX, sy:e.clientY, sw:w.wdt, sh:w.hgt, sl:w.x, st:w.y};
  document.body.style.cursor=getComputedStyle(e.currentTarget).cursor;
  window.addEventListener('mousemove', onWinResizeMove); window.addEventListener('mouseup', onWinResizeUp);
}
function onWinResizeMove(e){
  if(!winRz) return; const {w,dir}=winRz; const MINW=300, MINH=200;
  const dx=e.clientX-winRz.sx, dy=e.clientY-winRz.sy;
  let nw=winRz.sw, nh=winRz.sh, nx=winRz.sl, ny=winRz.st;
  if(dir.indexOf('e')>=0) nw=winRz.sw+dx;
  if(dir.indexOf('s')>=0) nh=winRz.sh+dy;
  if(dir.indexOf('w')>=0){ nw=winRz.sw-dx; nx=winRz.sl+dx; }
  if(dir.indexOf('n')>=0){ nh=winRz.sh-dy; ny=winRz.st+dy; }
  if(nw<MINW){ if(dir.indexOf('w')>=0) nx=winRz.sl+(winRz.sw-MINW); nw=MINW; }
  if(nh<MINH){ if(dir.indexOf('n')>=0) ny=winRz.st+(winRz.sh-MINH); nh=MINH; }
  if(ny<0){ nh+=ny; ny=0; }
  w.wdt=nw; w.hgt=nh; w.x=nx; w.y=ny;
  w.el.style.width=nw+'px'; w.el.style.height=nh+'px'; w.el.style.left=nx+'px'; w.el.style.top=ny+'px';
  // évite que le volet gauche devienne plus large que la fenêtre elle-même
  const maxNav=Math.max(80, nw-220);
  if((w.navWidth||152)>maxNav){ w.navWidth=maxNav; const nav=w.el.querySelector('.win-nav'); if(nav) nav.style.width=maxNav+'px'; }
}
function onWinResizeUp(){ winRz=null; document.body.style.cursor=''; window.removeEventListener('mousemove', onWinResizeMove); window.removeEventListener('mouseup', onWinResizeUp); }

/* ----- redimensionnement du volet gauche (arbre de dossiers) ----- */
let navRz=null;
function startNavResize(e, w){
  e.stopPropagation(); e.preventDefault(); focusWin(w);

  navRz={w, sx:e.clientX, sw:w.navWidth||152, splitter};
  splitter.classList.add('dragging');
  document.body.style.cursor='col-resize';
  window.addEventListener('mousemove', onNavResizeMove);
  window.addEventListener('mouseup', onNavResizeUp);
}
function onNavResizeMove(e){
  if(!navRz) return; const {w}=navRz;
  const dx=e.clientX-navRz.sx;
  const MINW=80, MAXW=Math.max(MINW, (w.wdt||500)-220);
  let nw=Math.max(MINW, Math.min(MAXW, navRz.sw+dx));
  w.navWidth=nw;
  const nav=w.el.querySelector('.win-nav'); if(nav) nav.style.width=nw+'px';
}

/* ---------------------------------------------------------
   4. SÉLECTION + GLISSER-DÉPOSER (pointer-based)
   --------------------------------------------------------- */
function selectOnly(node, box){ EX.sel=new Set([node.id]); EX.selBox=box; refreshSel(); }
/* Met à jour UNIQUEMENT les classes de sélection (sans reconstruire le DOM,
   sinon un double-clic réel détruit l'élément cliqué entre les deux clics). */
function refreshSel(){
  document.querySelectorAll('#desktop .dt-icon').forEach(el=>{
    el.classList.toggle('sel', EX.selBox==='desktop' && EX.sel.has(el.dataset.id));
  });
  EX.windows.forEach(w=>{
    if(!w.el) return;
    w.el.querySelectorAll('.win-body .fitem').forEach(el=>{
      el.classList.toggle('sel', EX.selBox===w.id && EX.sel.has(el.dataset.id));
      el.classList.toggle('cut', !!(EX.clip && EX.clip.mode==='cut' && EX.clip.ids.indexOf(el.dataset.id)>=0));
    });
    const st=w.el.querySelector('.win-status');
    if(st){ const selCount=(EX.selBox===w.id)?EX.sel.size:0;
      st.textContent=(w.cur.kids||[]).length+' élément'+((w.cur.kids||[]).length>1?'s':'')
        +(selCount?'  ·  '+selCount+' sélectionné'+(selCount>1?'s':''):''); }
  });
}
function nodeById(id){ let r=null; walk(EX.desktopRoot, n=>{ if(n.id===id) r=n; }); if(r) return r; walk(BIN, n=>{ if(n.id===id) r=n; }); return r; }

let pendDrag=null, dragging=null;
let _renameTimer=null;
function cancelRenameTimer(){ if(_renameTimer){ clearTimeout(_renameTimer); _renameTimer=null; } }
function onItemMouseDown(e, node, box){
  if(e.button!==0) return;
  e.stopPropagation(); closeStart(); closeCtx();
  commitRename(); cancelRenameTimer();
  if(box!=='desktop'){ const w=EX.windows.find(x=>x.id===box); if(w) focusWin(w); }
  // l'objet était-il déjà le seul sélectionné ? (→ second clic = renommer, comme Windows)
  const wasSelected = !e.ctrlKey && !e.metaKey && EX.selBox===box && EX.sel.size===1 && EX.sel.has(node.id);
  // sélection
  if(e.ctrlKey || e.metaKey){
    if(EX.selBox!==box){ EX.sel=new Set(); EX.selBox=box; }
    if(EX.sel.has(node.id)) EX.sel.delete(node.id); else EX.sel.add(node.id);
  } else if(!EX.sel.has(node.id) || EX.selBox!==box){
    EX.sel=new Set([node.id]); EX.selBox=box;
  }
  refreshSel(); beep('click');
  pendDrag={node, box, sx:e.clientX, sy:e.clientY, wasSelected};
  window.addEventListener('mousemove', onPendMove);
  window.addEventListener('mouseup', onPendUp);
}
function onPendMove(e){
  if(!pendDrag) return;
  if(Math.abs(e.clientX-pendDrag.sx)>5 || Math.abs(e.clientY-pendDrag.sy)>5){
    if(currentStep && currentStep.noDrag){
      window.removeEventListener('mousemove', onPendMove); window.removeEventListener('mouseup', onPendUp); pendDrag=null;
      toast('🚫 Glisser-déposer désactivé — utilise Couper/Copier + Coller !');
      return;
    }
    beginDrag(e);
  }
}
function onPendUp(){
  window.removeEventListener('mousemove', onPendMove); window.removeEventListener('mouseup', onPendUp);
  const pd=pendDrag; pendDrag=null;
  // clic simple sur un objet déjà sélectionné → renommer (sauf double-clic, qui annulera le minuteur)
  if(pd && pd.wasSelected && pd.node && !pd.node.locked){
    cancelRenameTimer();
    _renameTimer=setTimeout(()=>{ _renameTimer=null; if(EX.sel.size===1 && EX.sel.has(pd.node.id) && EX.selBox===pd.box) startRename(pd.node, pd.box); }, 550);
  }
}
function beginDrag(e){
  const ids=(EX.selBox===pendDrag.box && EX.sel.size>1 && EX.sel.has(pendDrag.node.id)) ? Array.from(EX.sel) : [pendDrag.node.id];
  const nodes=ids.map(nodeById).filter(Boolean).filter(n=>!n.locked);
  if(!nodes.length){ onPendUp(); return; }
  dragging={nodes, fromBox:pendDrag.box};
  const g=document.createElement('div'); g.className='drag-ghost'; g.id='dragGhost';
  g.innerHTML='<span class="ic">'+iconFor(nodes[0])+'</span>'+(nodes.length>1?'<span class="badge">'+nodes.length+'</span>':'');
  document.body.appendChild(g);
  moveGhost(e);
  window.removeEventListener('mousemove', onPendMove); window.removeEventListener('mouseup', onPendUp); pendDrag=null;
  window.addEventListener('mousemove', onDragMove);
  window.addEventListener('mouseup', onDragUp);
}
function moveGhost(e){ const g=document.getElementById('dragGhost'); if(g){ g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px'; } }
function onDragMove(e){
  moveGhost(e);
  clearDropHints();
  const t=dropTargetAt(e);
  if(t && t.el) t.el.classList.add(t.kind==='body'||t.kind==='desktop'?'dragover':'drop-ok');
}
function clearDropHints(){
  document.querySelectorAll('.drop-ok').forEach(el=>el.classList.remove('drop-ok'));
  document.querySelectorAll('.win-body.dragover, .desktop.dragover').forEach(el=>el.classList.remove('dragover'));
}
function dropTargetAt(e){
  const els=document.elementsFromPoint(e.clientX, e.clientY);
  for(const el of els){
    const fi=el.closest && el.closest('.fitem');
    if(fi){ const node=nodeById(fi.dataset.id); if(node && node.type==='folder' && dragging.nodes.indexOf(node)<0) return {kind:'folder', node, el:fi}; if(node && node.type!=='folder') continue; }
    const dti=el.closest && el.closest('.dt-icon');
    if(dti){ const node=nodeById(dti.dataset.id); if(node===EX.binNode) return {kind:'bin', node, el:dti}; if(node && node.type==='folder' && dragging.nodes.indexOf(node)<0) return {kind:'folder', node, el:dti}; }
    const nr=el.closest && el.closest('.nav-row');
    if(nr){ const node=nodeById(nr.dataset.id); if(node && node.type==='folder' && dragging.nodes.every(n=>n!==node && n.parent!==node)) return {kind:'folder', node, el:nr}; }
    if(el.classList && el.classList.contains('win-body')){ const w=EX.windows.find(x=>x.el&&x.el.querySelector('.win-body')===el); if(w) return {kind:'body', node:w.cur, el, w}; }
    if(el.id==='desktop') return {kind:'desktop', node:EX.desktopRoot, el};
  }
  return null;
}
function onDragUp(e){
  const t=dropTargetAt(e);
  clearDropHints();
  const g=document.getElementById('dragGhost'); if(g) g.remove();
  window.removeEventListener('mousemove', onDragMove); window.removeEventListener('mouseup', onDragUp);
  if(t){
    if(t.kind==='bin'){ doDelete(dragging.nodes); }
    else { const dest=t.node; if(dest && dest.type==='folder' && dragging.nodes.every(n=>n.parent!==dest)) doMove(dragging.nodes, dest); else { dragging=null; return; } }
  }
  dragging=null;
}

function openNode(node, w){
  if(node===EX.binNode){ openWindow(BIN); return; }
  if(node.type==='folder'){
    if(w){ navTo(w, node); beep('open'); } else { openWindow(node); }
    checkMission();
  } else {
    if(node.noext || !node.ext){ beep('bad'); openNoExtDialog(node); checkMission(); return; }
    const VALID_EXTS=new Set(['txt','doc','pdf','jpg','jpeg','png','gif','mp3','mp4','zip','exe','xls','ppt','html','app','virus']);
    if(currentStep && currentStep.editExt && !VALID_EXTS.has(node.ext)){ beep('bad'); openBadExtDialog(node); checkMission(); return; }
    EX.opened.add(node.name); beep('open');
    openFilePreview(node); checkMission();
  }
}

function doMove(nodes, dest){
  let moved=0;
  nodes.forEach(n=>{
    if(n.locked) return;
    if(n===dest || isAncestor(n, dest)) return;
    const _dn=displayName(n), _bn=n.name, _seeded=!!n.seeded;
    if(n.parent){ n.parent.kids=n.parent.kids.filter(x=>x!==n); }
    else if(EX.desktopRoot.kids.indexOf(n)>=0){ EX.desktopRoot.kids=EX.desktopRoot.kids.filter(x=>x!==n); }
    // si on déplaçait depuis la corbeille
    BIN.kids=BIN.kids.filter(x=>x!==n);
    n.name=uniqueName(dest, n);
    n.parent=dest; dest.kids.push(n); moved++;
    (EX.evt.movs=EX.evt.movs||[]).push({name:_bn, display:_dn, dest:dest.name, seeded:_seeded});
  });
  if(moved){ EX.sel=new Set(); beep('open'); toast('Déplacé ✔'); renderAll(); checkMission(); }
}
function isAncestor(a, b){ let c=b; while(c){ if(c===a) return true; c=c.parent; } return false; }
function uniqueName(dest, node){
  const base=node.name; let name=base, i=2;
  const exists=nm=> (dest.kids||[]).some(k=>k!==node && k.name===nm && (k.type==='folder')===(node.type==='folder'));
  while(exists(name)){ name=base+' ('+i+')'; i++; }
  return name;
}
function doCopy(nodes, dest){
  let n2=null;
  nodes.forEach(n=>{ const c=cloneSubtree(n, dest); c.name=uniqueName(dest, c); dest.kids.push(c); n2=c; });
  beep('open'); toast('Copié ✔'); renderAll(); checkMission();
}
function doDelete(nodes){
  let del=0;
  nodes.forEach(n=>{
    if(n.locked){ toast('🔒 Ce fichier système ne peut pas être supprimé'); return; }
    (EX.evt.dels=EX.evt.dels||[]).push({name:n.name, display:displayName(n), seeded:!!n.seeded});
    if(n.parent){ n.parent.kids=n.parent.kids.filter(x=>x!==n); }
    EX.desktopRoot.kids=EX.desktopRoot.kids.filter(x=>x!==n);
    n.binOrigin=n.parent || EX.desktopRoot;
    n.parent=BIN; BIN.kids.push(n); del++;
    EX.evt.everDeleted=true;
  });
  if(del){ EX.sel=new Set(); beep('delete'); toast(del>1?del+' éléments mis à la corbeille 🗑️':'Mis à la corbeille 🗑️'); renderAll(); checkMission(); }
}
function doRestore(nodes){
  let r=0;
  nodes.forEach(n=>{
    BIN.kids=BIN.kids.filter(x=>x!==n);
    let dest=n.binOrigin; if(!dest || (dest!==EX.desktopRoot && !inTree(EX.desktopRoot, dest))) dest=EX.desktopRoot;
    n.parent=(dest===EX.desktopRoot)?EX.desktopRoot:dest;
    if(dest===EX.desktopRoot) EX.desktopRoot.kids.push(n); else dest.kids.push(n);
    n.name=uniqueName(dest, n); r++;
  });
  if(r){ EX.sel=new Set(); beep('open'); toast('Restauré ✔'); renderAll(); checkMission(); }
}
function inTree(root, node){ let f=false; walk(root, n=>{ if(n===node) f=true; }); return f; }
function emptyBin(){
  if(!BIN.kids.length){ toast('La corbeille est déjà vide'); return; }
  BIN.kids.forEach(n=>(EX.evt.permaDels=EX.evt.permaDels||[]).push({name:n.name, display:displayName(n)}));
  EX.evt.binEmptied=true; BIN.kids=[]; beep('delete'); toast('Corbeille vidée 🧹'); renderAll(); checkMission();
}
function newFolder(dest){
  const base='Nouveau dossier'; let name=base, i=2;
  while((dest.kids||[]).some(k=>k.type==='folder'&&k.name===name)){ name=base+' ('+i+')'; i++; }
  const nf=buildNode(folder(name, []), dest); nf.seeded=false; nf.fresh=true;
  dest.kids.push(nf); EX.evt.createdFolder=true;
  beep('open'); renderAll(); checkMission();
  // renommage immédiat
  const w=EX.windows.find(x=>x.cur===dest);
  if(w){ startRename(nf, w.id); }
  return nf;
}
function doPaste(dest){
  if(!EX.clip) return;
  const nodes=EX.clip.ids.map(nodeById).filter(Boolean);
  if(EX.clip.mode==='copy'){ doCopy(nodes, dest); }
  else { doMove(nodes, dest); EX.clip=null; }
}
let _activeRename=null;
/* Valide (enregistre) le renommage en cours s'il y en a un — appelé avant
   tout clic ailleurs, exactement comme l'explorateur Windows. */
function commitRename(){ if(_activeRename) _activeRename.commit(); }
function startRename(node, box){
  if(node.locked){ toast('🔒 Ce fichier système ne peut pas être renommé'); return; }
  commitRename();                 // valide un éventuel renommage précédent
  cancelRenameTimer();
  let el=null;
  if(box==='desktop'){ el=document.querySelector('#desktop .dt-icon[data-id="'+node.id+'"] .nm'); }
  else { const w=EX.windows.find(x=>x.id===box); if(w&&w.el) el=w.el.querySelector('.fitem[data-id="'+node.id+'"] .nm'); }
  if(!el) return;
  // Dans les missions « extensions », on édite le nom AVEC son extension
  // (ex. « photo.jpg »). Sinon, on n'édite que le nom : l'extension est protégée.
  const editExt=!!(currentStep && currentStep.editExt) && node.type==='file';
  const cur=editExt ? displayName(node) : node.name;
  const inp=document.createElement('textarea'); inp.className='rn'; inp.value=cur; inp.rows=1;
  function autoResize(){ inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px'; }
  el.replaceWith(inp); autoResize(); inp.focus();
  // sélectionne le nom sans l'extension (comme Windows) quand on édite l'extension
  if(editExt){ const dot=cur.lastIndexOf('.'); inp.setSelectionRange(0, dot>0?dot:cur.length); } else inp.select();
  inp.addEventListener('input', autoResize);
  let done=false;
  function commit(){
    if(done) return; done=true; _activeRename=null;
    const v=inp.value.trim().replace(/\n/g,'');
    if(v && v!==cur){
      if(editExt){
        const m=/^(.*?)\.([A-Za-z0-9]+)$/.exec(v);
        if(m){ node.name=m[1]; node.ext=m[2].toLowerCase(); node.noext=false; delete node.icon; }
        else { node.name=v; node.ext=''; node.noext=true; }   // pas d'extension tapée
      } else {
        node.name=v;
      }
      node.renamed=true; EX.evt.renamedAny=true;
      (EX.evt.rens=EX.evt.rens||[]).push({from:cur, to:v, seeded:!!node.seeded}); beep('good');
    }
    renderAll(); checkMission();
  }
  function cancel(){ if(done) return; done=true; _activeRename=null; renderAll(); checkMission(); }
  _activeRename={commit, cancel, inp};
  inp.addEventListener('mousedown', e=>e.stopPropagation());
  inp.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Enter'){ e.preventDefault(); commit(); } else if(e.key==='Escape'){ e.preventDefault(); cancel(); } });
  inp.addEventListener('blur', commit);
}

function fileText(node){
  const n=(node.name||'').toLowerCase();
  if(/pub/.test(n)) return JUNK.pub;
  if(/spam/.test(n)) return JUNK.spam;
  if(/(vieux|archive|brouillon)/.test(n)) return JUNK.dusty;
  if(/copie/.test(n)) return JUNK.copy;
  for(const k in FILE_TEXTS){ if(n.indexOf(k)>=0) return FILE_TEXTS[k]; }
  return GENERIC_TEXTS[strHash(n)%GENERIC_TEXTS.length];
}

const NOTE={C:261.63,D:293.66,E:329.63,F:349.23,G:392.0,A:440.0,B:493.88,C2:523.25,D2:587.33,E2:659.25,r:0};
const TUNES={
  twinkle:[['C',1],['C',1],['G',1],['G',1],['A',1],['A',1],['G',2],['F',1],['F',1],['E',1],['E',1],['D',1],['D',1],['C',2]],
  auclair:[['C',1],['C',1],['C',1],['D',1],['E',2],['D',2],['C',1],['E',1],['D',1],['D',1],['C',2]],
  frere:[['C',1],['D',1],['E',1],['C',1],['C',1],['D',1],['E',1],['C',1],['E',1],['F',1],['G',2],['E',1],['F',1],['G',2]],
  rock:[['E',1],['E',1],['G',1],['E',1],['A',1],['G',1],['E',2],['r',1],['E',1],['G',1],['A',1],['B',2]],
  podcast:[['G',1],['E',1],['C',1],['E',1],['G',2]]
};
function pickTune(node){
  const n=(node.name||'').toLowerCase();
  if(/douce/.test(n)) return TUNES.auclair;
  if(/rock/.test(n)) return TUNES.rock;
  if(/podcast/.test(n)) return TUNES.podcast;
  if(/chanson2/.test(n)) return TUNES.frere;
  if(/chanson/.test(n)) return TUNES.twinkle;
  const all=[TUNES.twinkle,TUNES.auclair,TUNES.frere,TUNES.podcast];
  return all[strHash(n)%all.length];
}
let musicNodes=[];
function stopTune(){ musicNodes.forEach(o=>{ try{o.stop();}catch(e){} }); musicNodes=[]; }
function playTune(node){
  if(!soundOn) return; const a=audioCtx(); if(!a) return;
  stopTune();
  const tune=pickTune(node); let t=a.currentTime+0.06; const beat=0.34;
  tune.forEach(step=>{
    const f=NOTE[step[0]], dur=step[1]*beat;
    if(f>0){
      const o=a.createOscillator(), g=a.createGain();
      o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.13,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.92);
      o.start(t); o.stop(t+dur); musicNodes.push(o);
    }
    t+=dur;
  });
}

function startLasso(e, container, box, onStart, onEnd){
  if(e.button!==0) return;
  onStart();
  const rect=container.getBoundingClientRect();
  // coordonnées en espace-contenu (viewport + scroll) pour que le lasso reste calé même après scroll
  const x0=e.clientX-rect.left+container.scrollLeft;
  const y0=e.clientY-rect.top+container.scrollTop;
  const lassoEl=document.createElement('div'); lassoEl.className='lasso-rect';
  lassoEl.style.left=x0+'px'; lassoEl.style.top=y0+'px';
  container.appendChild(lassoEl);
  function move(ev){
    const x=ev.clientX-rect.left+container.scrollLeft;
    const y=ev.clientY-rect.top+container.scrollTop;
    const L=Math.min(x0,x), T=Math.min(y0,y), W=Math.abs(x-x0), H=Math.abs(y-y0);
    lassoEl.style.left=L+'px'; lassoEl.style.top=T+'px';
    lassoEl.style.width=W+'px'; lassoEl.style.height=H+'px';
    const ids=[];
    container.querySelectorAll('[data-id]').forEach(el=>{
      const r=el.getBoundingClientRect();
      const cx=r.left+r.width/2-rect.left+container.scrollLeft;
      const cy=r.top+r.height/2-rect.top+container.scrollTop;
      if(cx>=L&&cx<=L+W&&cy>=T&&cy<=T+H) ids.push(el.dataset.id);
    });
    EX.sel=new Set(ids); EX.selBox=box; refreshSel();
  }
  function up(){
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    try{ lassoEl.remove(); }catch(err){}
    const ids=Array.from(EX.sel);
    onEnd(ids);
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

function openCalculator(){
  EX.evt.calcOpened=true; checkMission();
  const layout=[['7','8','9','÷'],['4','5','6','×'],['1','2','3','−'],['0','.','=','+'],['C']];
  let grid='';
  layout.forEach(row=>row.forEach(v=>{
    let cls=''; if('÷×−+'.indexOf(v)>=0) cls='op'; else if(v==='=') cls='eq'; else if(v==='C') cls='clear span4';
    grid+='<button data-v="'+v+'" class="'+cls+'">'+v+'</button>';
  }));
  modal.className='modal';
  modal.innerHTML='<span class="m-emoji">🧮</span><h2>Calculatrice</h2>'
    +'<div class="calc"><div class="calc-disp" id="calcDisp">0</div><div class="calc-grid" id="calcGrid">'+grid+'</div></div>'
    +'<div class="m-actions"><button class="m-btn primary" id="calcClose">Fermer ✕</button></div>';
  openOverlay();
  let cur='0', acc=null, op=null, fresh=true;
  const disp=document.getElementById('calcDisp');
  function show(){ disp.textContent=(cur.length>12)?(+cur).toPrecision(8):cur; }
  function digit(d){ if(fresh||cur==='0'){ cur=(d==='.')?'0.':d; fresh=false; } else { if(d==='.'&&cur.indexOf('.')>=0) return; cur+=d; } show(); }
  function compute(){ if(op==null||acc==null) return; const b=parseFloat(cur); let r;
    if(op==='+') r=acc+b; else if(op==='−') r=acc-b; else if(op==='×') r=acc*b; else r=(b===0?null:acc/b);
    cur=(r==null)?'🤯 oups':String(Math.round(r*1e8)/1e8); acc=null; op=null; fresh=true; show(); }
  function setop(o){ if(op!=null && !fresh) compute(); acc=parseFloat(cur)||0; op=o; fresh=true; }
  document.getElementById('calcGrid').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return; const v=b.dataset.v; beep('click');
    if(/^[0-9.]$/.test(v)) digit(v);
    else if(v==='C'){ cur='0'; acc=null; op=null; fresh=true; show(); }
    else if(v==='=') compute();
    else setop(v);
  });
  document.getElementById('calcClose').onclick=()=>closeOverlay();
}

document.addEventListener('keydown', e=>{
  if(overlay.classList.contains('open')) return;
  if(e.target.tagName==='INPUT') return;
  const sel=Array.from(EX.sel).map(nodeById).filter(Boolean);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c'){ if(sel.length){ EX.clip={mode:'copy',ids:Array.from(EX.sel)}; EX.evt.copied=true; toast('Copié 📋'); } }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='x'){ if(sel.length){ EX.clip={mode:'cut',ids:Array.from(EX.sel)}; EX.evt.cut=true; refreshSel(); toast('Coupé ✂️'); } }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='v'){ const w=EX.focusedWin; if(w&&EX.clip){ doPaste(w.cur); } }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a'){ const w=EX.focusedWin; if(w){ e.preventDefault(); EX.sel=new Set((w.cur.kids||[]).map(k=>k.id)); EX.selBox=w.id; refreshSel(); } }
  else if(e.key==='F2'){ if(sel.length===1){ e.preventDefault(); startRename(sel[0], EX.selBox); } }
  else if(e.key==='Delete'){ if(sel.length){ doDelete(sel); } }
  else if(e.key==='Escape'){ closeStart(); closeCtx(); }
});

function buildCtx(){
  const winsOpen=EX.windows.filter(w=>!w.min);
  const fwin=(EX.focusedWin&&!EX.focusedWin.min)?EX.focusedWin:(winsOpen[winsOpen.length-1]||null);
  return {
    win:fwin, windows:EX.windows, winsOpen,
    bin:BIN.kids, evt:EX.evt, opened:EX.opened, root:EX.desktopRoot,
    find:name=>findAnyByName(EX.desktopRoot, name),
    folder:name=>findFolderByName(EX.desktopRoot, name),
    inFolder:(folderName,itemName)=>{ const f=findFolderByName(EX.desktopRoot,folderName); return f && (f.kids||[]).some(k=>k.name===itemName||displayName(k)===itemName); },
    countNamed:name=>findAnyByName(EX.desktopRoot,name).length
  };
}
